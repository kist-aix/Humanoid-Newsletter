간과 총사업비, 기관별 분담은 밝혀지지 않았다.", "body": "노타가 산업통상자원부와 한국산업기술기획평가원의 K-온디바이스 AI반도체 기술개발 사업에서 비전언어행동모델을 국산 NPU와 실제 로봇 환경에 맞춰 구동하는 최적화를 맡는다고 밝힘, LG전자가 사업 전체를 총괄하며 휴머노이드 시스템을 개발하고 모빌린트가 국산 NPU 를 대며, 노타는 토큰 압축·양자화·프루닝·지식증류로 모델 크기와 연산량·메모리 사용량을 줄인다는 계획이 제시됨, 사업기간과 총사업비, 기관별 분담은 밝혀지지 않음, 노타 뉴스룸(blog.nota.ai/newsroom)을 9월 9일 직접 열어 최신 게시물이 9월 1일자이고 이 항목이 없음을 확인해 2차 자료에 근거하고 등급을 S3 으로 둠", "src": "AI타임스 9.8", "pd": "2026-09-08", "url": "https://www.aitimes.com/news/articleView.html?idxno=214972"}, {"sec": 3, "t": "샤오펑, 휴머노이드 로봇 생산라인 가동 공식화", "k": "시제품 제작에서 제조로 넘어갔지만 실제 출하 대수는 밝히지 않았다.", "ez": "중국 전기차 기업 샤오펑이 휴머노이드 로봇 'IRON'을 만드는 생산라인을 가동했다고 9월 8일 발표했다. 1호기가 라인에서 걸어 나오는 장면도 함께 공개했다. 회사는 핵심 공정의 자동화율이 80%를 넘고 완성차 수준의 품질 관리를 적용했다는 점을 들어, 시제품을 손으로 만들던 단계에서 생산라인 제조로 넘어갔다고 설명했다. 양산 목표는 2026년 말이고 외부 고객 인도는 2027년 소매·서비스업부터다. 다만 라인이 어디에 있고 한 해 몇 대를 만들 수 있는지, 로봇의 키와 무게가 얼마인지는 발표문에 없다. '스스로 걸어 나왔다'는 표현도 자율 동작인지 원격 조작인지 밝히지 않았다. 라인을 돌린다는 것과 실제로 몇 대를 출하했는지는 다른 이야기여서, 이 발표만으로 중국 기업의 현장 배치가 늘었다고 해석하면 과장이 된다.", "body": "샤오펑이 휴머노이드 로봇 제조설비 가동을 공식화하고 IRON 1호기가 라인에서 걸어 나왔다고 발표함, 발표문은 핵심 공정 자동화율 80% 이상과 완성차 등급 품질체계 적용을 근거로 연구개발 시제품 제작에서 생산라인 제조로 넘어간 단계라고 설명함, 다만 생산라인 위치와 연간 생산능력, 기체의 신장·중량은 발표문에 없음, '자율적으로 라인에서 걸어 나왔다'는 표현의 기술적 근거(자율 여부·원격조작 여부·시행 횟수)도 제시되지 않아 성능 근거로 쓰지 않음, 양산 목표는 2026년 말이고 외부 고객 인도는 2027년 소매·서비스업부터로 제시됨, 생산라인 가동은 생산능력에 관한 사실이고 실제 출하·가동 대수와는 층위가 달라 이 발표만으로 中 기업의 현장 배치 실적이 늘었다고 읽으면 과대포장이 됨, 같은 날 해외 매체들은 이 발표를 테슬라 옵티머스의 양산 지연과 대비해 다뤘으나 테슬라 측 발표를 직접 확인하지 못해 비교 수치는 쓰지 않음", "src": "샤오펑 발표 9.8", "pd": "2026-09-08", "url": "https://www.xpeng.com/news/01a080371029a057bc8e8a02a2c6012b"}, {"sec": 3, "t": "두산로보틱스, 2028년 산업용 휴머노이드 시험 착수 예고", "k": "형태를 먼저 정하지 않고 작업지능을 완성한 뒤 몸을 붙이는 순서다.", "ez": "두산로보틱스 대표가 2028년에 산업용 휴머노이드의 개념검증에 들어가겠다는 계획을 내놓았다. 눈여겨볼 것은 순서다. 먼저 사람과 함께 일하는 협동로봇으로 현장 데이터를 모아 '작업지능'을 완성하고, 그다음에 그 지능에 맞는 몸을 만든다. 한 팔에서 양팔로, 다시 스스로 움직이는 형태로 넓혀 간다. 중간 단계의 대상으로는 표면처리와 용접처럼 숙련이 필요한 공정을 꼽았다. 형태를 먼저 정하고 시연을 만드는 방식과 반대다. 다만 최종 형태가 두 발로 걷는 것인지 바퀴로 움직이는 것인지, 투자 규모와 협력사, 검증할 공정과 장소는 밝혀지지 않았다.", "body": "김민표 두산로보틱스 대표가 협동로봇으로 현장 데이터를 모아 작업지능을 먼저 완성한 뒤 한팔에서 양팔, 이동형으로 몸을 넓혀 2028년 산업용 휴머노이드 개념검증에 들어가겠다는 순서를 제시한 것으로 보도됨, 휴머노이드로 갈지 말지가 아니라 어떤 순서로 갈지의 문제이며 작업지능을 먼저 정하고 그에 맞는 몸을 만들겠다는 발언이 함께 전해짐, 표면처리·용접처럼 숙련도가 필요한 공정을 중간 단계의 대상으로 꼽았고 최종 형태가 이족보행인지 차륜형인지, 투자 규모와 협력사, 개념검증의 대상 공정과 사이트는 밝혀지지 않음, 두산로보틱스 뉴스룸을 9월 9일 직접 열어 최신 보도자료가 6월 22일자이고 이 항목이 없음을 확인했으며, 발표 자리와 발제 제목(「두산로보틱스의 Physical AI 현재와 미래」)은 주최기관인 기계연의 9월 7일자 보도자료 원문에서 확인했으나 발언 내용 자체는 기계연 문서에 없어 2차 자료에 근거하고 등급을 S3 으로 둠, 형태를 목표로 두지 않고 작업에서 거꾸로 내려오는 접근이라는 점에서 시연 중심 개발과 구분해 읽을 값이 있음", "src": "기계연 발표 9.7 · 이데일리 9.7", "pd": "2026-09-07", "url": "https://www.kimm.re.kr/sub0504/view/id/21372", "url2": "https://view.asiae.co.kr/article/2026090809005349708"}, {"sec": 4, "t": "빅웨이브로보틱스, 모듈러 주택 단열재 시공에 휴머노이드", "k": "사람에게 해로운 유리섬유 작업부터 맡기지만 투입 규모는 미공개다.", "ez": "빅웨이브로보틱스가 목조 모듈러 주택 기업과 함께 생산·시공 현장에 휴머노이드를 단계적으로 넣기로 하고, 첫 공정으로 단열재 시공을 골랐다. 왜 하필 단열재인지가 이 발표의 핵심이다. 유리섬유는 호흡기와 피부에 해로워 사람이 다루기 꺼려지는 자재이고, 물렁해서 모양이 일정하지 않다. 정해진 동작만 되풀이하는 기존 산업용 로봇으로는 이런 비정형 대상을 다루기 어려웠다. 다만 몇 대를 넣는지, 어떤 기체인지, 로봇이 스스로 움직이는지 사람이 조종하는지, 언제부터 얼마 동안인지는 공개되지 않았다. 발표한 쪽도 도입하는 회사가 아니라 로봇을 공급하는 회사다.", "body": "빅웨이브로보틱스가 목조 모듈러 주택 기업 공간제작소와 함께 생산·시공 현장에 휴머노이드를 단계적으로 적용하며 첫 공정으로 단열재 시공을 잡았다고 밝힘, 유리섬유가 호흡기·피부에 해로운 고위험 자재이고 유연해 모양이 일정하지 않은 비정형 대상물이라 기존 산업용 로봇으로는 자동화가 어려웠다는 점이 선정 이유로 제시됨, 투입 대수와 기체 모델, 자율 동작인지 원격조작인지, 적용 시점과 기간은 공개되지 않아 실증 실적으로 읽을 단계가 아님, 발표한 쪽이 도입처가 아니라 공급사이고 공간제작소 명의의 발표는 확인되지 않았으며 빅웨이브로보틱스 공식 도메인도 연결되지 않아 2차 자료에 근거함", "src": "AI타임스 9.8", "pd": "2026-09-08", "url": "https://www.aitimes.com/news/articleView.html?idxno=214980"}, {"sec": 5, "t": "삼성SDS, 이종 로봇 통합 관제 사업 진출 선언", "k": "제조실행시스템 고객 430곳을 발판으로 2027년 플랫폼을 내놓겠다는 계획이다.", "ez": "삼성SDS가 로봇 사업 진출을 공식화하고 2027년에 여러 로봇을 한꺼번에 부리는 플랫폼을 내놓겠다고 밝혔다. 공장에는 조립·운반·포장을 맡는 로봇이 회사별로 섞여 있는데, 서로 규격이 달라 개별적으로 작동한다. 이번 플랫폼은 그 위에 얹는 관제 계층이다. 로봇들의 이동 경로를 서로 부딪히지 않게 조정하고, 한 대가 멈추면 다른 대로 작업을 돌린다. 회사는 반도체·이차전지·바이오·자동차 등 제조 관리 시스템 고객사 약 430곳과 자동화 구축 경험을 발판으로 들었고, 휴머노이드 기업 한 곳과 제휴를 맺었다. 적용 대상 생산라인 수는 매체마다 다르게 전해졌다.", "body": "삼성SDS가 기업 AI 전환 콘퍼런스 리얼 서밋 2026 에서 로봇전환 사업 진출을 공식화하고 2027년 로봇 오케스트레이션 플랫폼을 내놓겠다고 밝힘, 조립·운반·포장 등 서로 다른 회사가 만든 로봇을 하나의 소프트웨어로 움직여 이동경로를 조정하고 한 대가 멈추면 다른 대로 작업을 우회시키는 관제 계층으로 설명됨, 반도체·이차전지·바이오·자동차 등 제조실행시스템 고객사 약 430곳과 자동화 구축 경험을 기반으로 제시했고 휴머노이드 기업 월든 로보틱스와 제휴를 맺음, 적용 대상 생산라인 수는 매체마다 다르게 전해져 단일 수치로 쓰지 않으며, 삼성SDS 뉴스룸이 오류 페이지로 되돌려 원문을 확보하지 못해 등급을 S3 으로 둠", "src": "AI타임스 9.8", "pd": "2026-09-08", "url": "https://www.aitimes.com/news/articleView.html?idxno=214966"}, {"sec": 5, "t": "신한투자증권, 中 세계로봇대회가 전시에서 거래로 옮겨갔다고 진단", "k": "구매 전용 일정이 새로 생겼고 완제품 업체 참가가 한 해 만에 56% 늘었다.", "ez": "신한투자증권이 베이징에서 열린 세계로봇대회 참관기를 내고 행사의 성격이 전시에서 거래로 옮겨 갔다고 진단했다. 근거로 든 것은 두 가지다. 실제 구매와 조달을 목적으로 하는 전용 일정이 새로 생겼고, 물류·제조·검사 같은 수요처와 로봇 공급사를 직접 이어 주는 프로그램이 출범했다. 구경하는 자리에서 사고파는 자리로 바뀌었다는 것이다. 휴머노이드 완제품 업체 참가는 약 42곳으로 한 해 전보다 56% 늘었고, 양산과 수주 단계에 들어선 기업이 여럿 포함돼 옥석을 가리는 국면에 접어들었다고 봤다. 증권사 자료여서 애널리스트의 판단과 추정이 섞여 있다.", "body": "신한투자증권이 북경에서 열린 세계로봇대회 참관기를 내고 행사의 성격이 전시에서 거래로 옮겨 갔다고 진단한 것으로 보도됨, 실제 구매·조달을 목적으로 한 전용 일정인 조달의 날이 새로 생겼고 물류·제조·검사 등 응용처와 로봇 공급사를 직접 잇는 프로그램이 출범한 점을 근거로 듦, 휴머노이드 완제품 업체 참가가 약 42개사로 전년 대비 56% 늘었고 양산·수주 단계에 들어선 기업이 다수 포함돼 옥석가리기 국면에 들어섰다는 판단이 제시됨, 증권사 리포트이므로 애널리스트의 판단과 추정이 섞여 있어 등급을 S3 으로 묶고 주가·투자 판단에 관한 서술은 옮기지 않음, PDF 원문이 공개되지 않아 상세 페이지의 요약으로만 확인했으므로 참가 업체 수와 증가율은 주최 측 집계와 대조하기 전까지 단정하지 않음", "src": "신한투자증권 리포트 9.7", "pd": "2026-09-07", "url": "https://finance.naver.com/research/industry_read.naver?nid=45958"}, {"sec": 5, "t": "로보티즈, 부품 공급에서 휴머노이드 완성 솔루션으로 확장", "k": "대표 지분 매각 대금 887억 원을 재원으로 들었으나 배분은 미공개다.", "ez": "로보티즈 대표가 로봇 관절 부품을 공급하는 회사를 넘어 휴머노이드를 통째로 공급하는 회사로 가겠다고 밝혔다. 회사가 가진 것은 관절 구동부품을 직접 만드는 역량과 힘을 조절하며 움직이게 하는 제어 기술이다. 이를 묶어 휴머노이드를 만드는 데 필요한 기술을 한 묶음으로 공급하겠다는 구상이다. 생산능력과 가격 경쟁력은 우즈베키스탄 공장으로 확보한다. 함께 언급된 887억 원은 회사가 조달한 자금이 아니라 대표가 개인 지분을 팔아 마련하는 돈이다. 자율주행로봇 자회사 등에 일부를 투자한다는 계획만 나왔고 항목별 배분은 공개되지 않았다.", "body": "김병수 로보티즈 대표가 액추에이터를 넘어 휴머노이드 솔루션까지 제공하는 기업으로 가겠다고 밝힌 것으로 보도됨, 자체 액추에이터 개발 역량과 토크 기반 제어 기술을 묶어 휴머노이드 구현에 필요한 기술을 패키지로 공급하겠다는 구상이 제시됨, 재원으로 언급된 887억 원은 회사가 조달한 자금이 아니라 대표 개인이 보유 지분을 매각해 확보하는 대금이며 자율주행로봇 자회사 로보티즈AI 등에 일부를 투자한다는 계획만 제시돼 항목별 배분은 공개되지 않음, 우즈베키스탄 공장으로 생산능력과 가격·품질 경쟁력을 함께 확보한다는 방침이 함께 전해짐", "src": "서울경제 9.8", "pd": "2026-09-08", "url": "https://www.sedaily.com/article/20088280"}, {"sec": 5, "t": "한국피지컬AI협회, 피지컬 AI 전문 전시회 2027년 첫 개최", "k": "송도에서 사흘간 열리며 전시면적은 4,440제곱미터로 제시됐다.", "ez": "사단법인 한국피지컬AI협회가 전시 기획사 두 곳과 함께 피지컬 AI 전문 전시회를 2027년 9월 인천 송도에서 처음 연다고 밝혔다. 피지컬 AI는 인공지능이 화면 속에 머무르지 않고 로봇이나 이동수단, 제조 장비처럼 실제로 움직이는 물건과 결합하는 영역을 가리킨다. 이 분야만 따로 떼어 전시회를 여는 것이다. 일정은 사흘이고 전시면적은 4,440제곱미터로 제시됐다. 협회가 언제 세워졌는지, 회원사가 어디인지, 참가 목표 기업 수와 예산이 얼마인지는 공개되지 않았다.", "body": "사단법인 한국피지컬AI협회가 서울메쎄·인터프레스와 함께 피지컬 AI 전문 전시회 Physical AI EXPO 를 2027년 9월 인천 송도컨벤시아에서 처음 연다고 밝힘, 전시면적은 4,440㎡ 로 제시됐고 AI 가 로봇·모빌리티·제조 장비 등 물리적 시스템과 결합하는 영역을 대상으로 삼는다고 설명됨, 협회 설립 시점과 회원사 명단, 참가 목표 기업 수와 예산은 공개되지 않았고 협회 자체 게시물도 확보하지 못해 등급을 S3 으로 둠", "src": "인공지능신문 9.8", "pd": "2026-09-08", "url": "https://www.aitimes.kr/news/articleView.html?idxno=41802"}, {"sec": 7, "t": "[칼럼] 中 휴머노이드 저가 공세의 표적은 현장 데이터", "k": "가격이 아니라 데이터 선점 경쟁으로 보고 대응해야 한다는 주장이다.", "ez": "중국 휴머노이드 기업들이 완성도가 낮은 기체를 싸게 대량으로 공급하는 이유가 판매가 아니라 현장 데이터 선점에 있다는 진단이 나왔다. 로봇은 실제 현장에서 운용돼야 학습한다. 그래서 가격을 낮춰 많이 보급하면 그만큼 학습에 쓸 자료가 쌓인다. 필자는 이것이 가격 경쟁이 아니라 데이터 경쟁이므로 대응 방식도 달라야 한다고 봤다. 근거로 든 것은 유니트리의 8월 상하이 상장과 공모가 대비 최고 460% 상승, 조달액 약 61억 위안, 그리고 2026년 상반기 중국 제조사 점유율 97% 이상이다. 다만 점유율을 무엇으로 셌는지가 밝혀지지 않았다. 제언은 셋이다. 관련 특별법안 통과와 국무총리급 컨트롤타워, 대구 국가로봇테스트필드의 2028년 완공, 2030년까지 8대 핵심기술 국산화율 80% 달성이다.", "body": "박종성 필자가 완성도가 낮은 기체를 저가로 대량 공급해 현장 데이터를 먼저 확보하는 방식이 中 휴머노이드 전략의 핵심이라고 진단하고, 가격 경쟁이 아니라 데이터 선점에 대응해야 한다고 주장한 것으로 보도됨, 근거로 유니트리의 8월 상하이 상장과 공모가 대비 최고 460% 상승, 조달액 약 61억 위안, 2026년 상반기 中 제조사 점유율 97% 이상이 제시됐으나 점유율의 산정 기준(계약·생산능력·실제 출하)이 밝혀지지 않아 단일 수치로 인용하지 않음, 판단이 섞인 칼럼이므로 단정 근거로 쓰지 않음, 제언은 피지컬 인공지능 개발 촉진 및 지원에 관한 특별법안 통과와 국무총리급 컨트롤타워, 대구 국가로봇테스트필드의 2028년 완공, 2030년까지 8대 핵심기술 국산화율 80% 달성 셋으로 제시됨", "src": "아시아경제 칼럼 9.8", "pd": "2026-09-08", "url": "https://view.asiae.co.kr/article/2026090709082196971"}, {"sec": 7, "t": "[시론] 피지컬 AI 는 1강이 아니라 대체 불가로 가야", "k": "의료·돌봄처럼 남이 대신 못 하는 특화 영역을 잡자는 제안이다.", "ez": "피지컬 AI 전략을 두고, 모든 분야에서 세계 1위를 좇기보다 남이 대신할 수 없는 영역을 잡아야 한다는 주장이 나왔다. 필자는 피지컬 AI를 둘로 나눈다. 휴머노이드나 자율주행차 같은 제품을 새로 만드는 쪽과, 공장의 제조 방식 자체를 바꾸는 쪽이다. 첫 과제로는 추진 주체마다 다르게 쓰이는 피지컬 AI의 정의를 통일하는 일을 꼽았다. 말이 다르면 공감대가 서지 않기 때문이다. 제품 쪽에서는 의료·돌봄·교육처럼 쓰는 사람의 경험이 중요한 분야를, 제조 쪽에서는 자동차·반도체·배터리 공장의 데이터와 현장 노하우를 인공지능에 학습시키는 길을 제시했다. 대외적으로는 미국의 기술과 중국의 부품 생태계, 일본·유럽의 자동화 역량을 잇는 중심국 역할을 제안했다.", "body": "주영섭 필자가 피지컬 AI 를 제품 혁신과 제조시스템 혁신으로 나누고", "src": "한국경제 시론 9.8", "pd": "2026-09-08", "url": "https://www.hankyung.com/article/2026090820491"}]}, {"date": "2026-09-08", "items": [{"sec": 1, "t": "中 인민해방군, 휴머노이드의 전장 투입 연구 확대", "k": "군 조달공고와 논문 100여 건을 훑은 보도이며 원본 문서는 확보되지 않았다.", "ez": "중국 인민해방군이 휴머노이드를 전장에 투입하는 방안을 연구하고 있다는 보도가 나왔다. 로이터가 중국 군 조달공고와 학술논문, 특허, 정부기록 100여 건을 검토해 정리한 것이다. 인용된 한 연구는 휴머노이드와 네발 로봇, 무인차량으로 짜인 전투로봇 여섯 대를 두 조로 나눠, 적이 점거한 건물을 층별로 수색하는 도시전 상황을 모의했다. 연구는 로봇이 주변을 인식하고 물체를 다루는 능력과 학습용 데이터에 몰려 있고 2025~2026년에 속도가 붙었다고 전해진다. 다만 실제로 대량 배치하려면 기술이 더 나아가고 제조원가가 떨어지며 산업 규모의 양산이 먼저 이뤄져야 한다는 점도 함께 지적됐다.", "body": "로이터가 중국 군 조달공고·학술논문·특허·정부기록 100여 건을 검토해, 군 연구기관이 휴머노이드를 전장 요구조건에 맞춰 시험하고 병력과 함께 운용하는 방안을 연구하고 있다고 보도함, 인용된 한 연구는 휴머노이드·로봇개·무인차량으로 짜인 '전투로봇' 6대를 두 조로 나눠 적이 점거한 건물을 층별로 소탕하는 도시전 상황을 모의했다고 보도됨, 로봇의 인지·조작과 학습용 데이터에 연구가 몰려 있고 2025~2026년에 속도가 붙었다고 전해짐, 다만 대량 배치에는 기술 진전과 제조원가 하락, 산업 규모의 양산이 선행돼야 한다고 보도됨, 中 제조사가 2025년 세계 휴머노이드 출하의 약 95%를 차지한다는 수치가 함께 제시됐으나 출하 기준(계약·생산능력·실제 출하)의 구분은 밝혀지지 않음, 로이터 본지가 우리 접근을 차단해 제휴 게재본으로 본문을 확인했고 인용된 군 문서 원본은 확보하지 못해 등급을 S3 으로 묶음", "src": "로이터 9.7", "pd": "2026-09-07", "url": "https://english.aawsat.com/technology/5315505-dance-floor-war-china-readies-humanoid-robots-combat"}, {"sec": 2, "t": "엑스와이지, 자사 모델로 의류 접기 시간 절반으로", "k": "빠르게 돌릴수록 성공률이 떨어지는 교환 관계가 수치로 드러났다.", "ez": "국내 로봇기업 엑스와이지가 자사 인공지능 모델을 중국 갤럭시아의 양팔 로봇에 올려 옷 한 벌 개는 시간을 약 50초에서 약 25초로 줄였다고 밝혔다. 사람이 시범을 보인 동작을 로봇이 따라 배울 때는 손떨림 같은 잡음이 함께 섞여 들어간다. 회사는 시범 데이터를 듬성듬성 골라 쓰는 방식으로 그 영향을 줄이고, 빠르게 움직이는 구간에서 집게 끝의 흔들림을 제거하는 처리를 더했다. 눈여겨볼 대목은 속도를 두 배로 올렸을 때 성공률이 100%에서 96%로 내려갔다는 점이다. 빨리 할수록 덜 정확해진다는 맞바꿈이 수치로 드러났다. 다만 몇 번 시도했는지, 어떤 옷을 썼는지, 실제 로봇인지 모의실험인지는 공개되지 않았다.", "body": "엑스와이지가 자사 행동지능 모델 브레인엑스를 中 갤럭시아의 양팔 기체 R1 프로 라이트에 올려 의류 접기 작업시간을 1벌 약 50초에서 약 25초로 줄였다고 발표한 것으로 보도됨, 저샘플링으로 전문가 궤적의 노이즈 영향을 줄이고 스무딩 필터로 고속 구간의 엔드이펙터 떨림을 억제했다는 설명이 제시됨, 다만 시행 횟수와 의류 종류·크기, 실기(實機)와 시뮬레이션의 구분, 자율 동작 여부가 공개되지 않아 성공률 96%를 성능 근거로 쓰기 어려움, 2배속에서 성공률이 100%에서 96%로 내려간 사실 자체는 속도와 신뢰성의 교환 관계를 보인 실측치로 읽을 값이 있음", "src": "AI타임스 9.7 · 로봇신문 9.7", "pd": "2026-09-07", "url": "https://www.aitimes.com/news/articleView.html?idxno=214923", "url2": "https://www.irobotnews.com/news/articleView.html?idxno=48329"}, {"sec": 3, "t": "로보티즈, 이족보행 휴머노이드 11월 판매 개시", "k": "연구용 시장부터 여는 전략이며 초기 물량은 이미 예약이 끝났다.", "ez": "로보티즈가 두 발로 걷는 휴머노이드 'AI 사피엔스 K1'을 11월부터 판다고 밝혔다. 처음부터 넓게 팔지는 않는다. 공급 대상을 국내 대학과 연구기관의 연구개발 시장으로 한정하고, 부품 공급과 공개 소프트웨어로 연구자 수요를 먼저 확보한 뒤 만들 수 있는 만큼 넓혀 가겠다는 것이다. 초기 생산능력은 한 달 10대 안팎이고 그 물량은 이미 예약이 끝났다고 전해졌다. 다만 예약 대수와 가격은 공개되지 않았다. 여기서 나오는 숫자는 성격이 다르므로 구분해 읽어야 한다. 한 달 10대는 만들 수 있는 능력이고, 완판됐다는 것은 예약 기준이며, 실제로 몇 대가 나갔는지는 또 다른 수다. 회사의 주력인 관절 구동부품은 2025년 약 22만 대가 나갔고 2026년 상반기 남은 주문이 41만 대를 넘어, 연간 50만 대 출하를 목표로 제시된 것으로 보도됐다.", "body": "초기 생산능력은 월 10대 안팎이고 공급 가능한 초기 물량은 이미 예약이 끝났다고 전해졌으나 예약 대수와 가격은 공개되지 않음, 공급 대상을 국내 대학·연구기관의 연구개발 시장으로 한정하고 액추에이터 공급과 오픈소스 생태계로 연구용 수요를 먼저 확보한 뒤 생산능력에 맞춰 넓힌다는 전략이 제시됨, 대수는 계약·생산능력·실제 출하가 각각 다른 수이므로 월 10대는 생산능력이고 완판된 물량은 예약 기준임, 액추에이터는 2025년 약 22만 대를 출하했고 2026년 상반기 수주잔고가 41만 대를 넘어 연간 50만 대 출하를 목표로 제시된 것으로 보도됨", "src": "시사저널e 9.7", "pd": "2026-09-07", "url": "https://www.sisajournal-e.com/news/articleView.html?idxno=423548"}, {"sec": 5, "t": "中 통신 3사, 로봇 학습 데이터 사업에 잇따라 진입", "k": "망과 클라우드를 든 사업자가 공급자로 들어오는 구조가 확인됐다.", "ez": "중국 통신 3사가 데이터센터에 이어 로봇 학습 데이터로 사업을 넓히고 있다. 차이나모바일은 5월 항저우에 1,200제곱미터 규모 훈련장을 열어 여섯 개 회사의 기체로 100여 분야에서 100만 건 넘는 자료를 모았다. 차이나텔레콤은 8월 관련 기업에 수억 위안을 투자해 100만 시간 이상을 쌓았고, 차이나유니콤은 4월 시설을 세워 일곱 개 회사와 함께 80테라바이트, 100여 가지 동작을 확보했다. 눈여겨볼 것은 구조다. 통신망과 클라우드를 가진 사업자가 로봇 학습 데이터의 공급자로 들어오고 있다. 다만 그 데이터가 사람이 조종해 만든 것인지 실제 작업에서 나온 것인지, 남에게 공개하는지는 밝혀지지 않았다.", "body": "中 통신 3사가 데이터센터에 이어 로봇 학습 데이터로 사업을 넓히고 있다고 보도됨, 차이나모바일은 저장성 항저우에 1,200㎡ 규모 훈련장을 5월에 열어 유니트리·애지봇 등 6개사 기체로 100여 분야에서 100만 건 이상을 모았고, 차이나텔레콤은 8월 미펑테크놀로지에 수억 위안을 투자해 100만 시간 이상을 축적했으며, 차이나유니콤은 4월 시설을 세워 7개사와 80TB·100여 동작을 확보했다고 전해짐, 수치는 신화통신 등 중국 현지 매체를 인용한 재인용이고 각 사의 발표 원문은 확보하지 못했으며 데이터의 성격(원격조작 시연분·실제 작업분)과 공개 여부도 밝혀지지 않음, 통신사가 망·클라우드를 들고 학습 데이터 공급자로 들어온다는 구조 자체는 확인된 사실로 읽을 값이 있음", "src": "디지털타임스 기획 9.7", "pd": "2026-09-07", "url": "https://www.dt.co.kr/article/12082561"}, {"sec": 5, "t": "애질리티 로보틱스, 상장 서류에 2025년 실적 공개", "k": "매출 180만 달러에 영업손실은 1억 4,000만 달러로 전해졌다.", "ez": "미국 휴머노이드 기업 애질리티 로보틱스가 9월 4일 미국 증권당국에 낸 상장 심사 서류에 2025년 실적이 담긴 것으로 보도됐다. 매출은 180만 달러, 영업손실은 1억 4,000만 달러다. 벌어들인 돈의 약 78배를 손실로 냈다는 뜻이다. 휴머노이드 기업이 아직 제품을 팔아 운영되는 단계가 아니라 투자를 태워 개발하는 단계에 있음을 보여 주는 수치다. 상장 심사 서류는 회사가 규제기관에 제출하는 문서라 홍보자료보다 실적을 가리기 어렵다는 점에서 값이 있다. 다만 서류 본문은 열지 못해 수치는 보도에 근거한다. 함께 제시된 연도별 대수는 회사가 앞으로 만들 수 있다고 본 전망치이지 실제 실적이 아니다.", "body": "애질리티 로보틱스가 9월 4일 제출한 상장 심사서류(S-4)에 2025년 매출 180만 달러와 영업손실 1억 4,000만 달러가 담긴 것으로 보도됨, 서류 본문은 열지 못해 수치는 보도에 근거하고 함께 제시된 연도별 대수는 회사의 생산능력 전망이므로 실적이 아님", "src": "SEC S-4 제출 9.4 · 더로봇리포트 9.7", "pd": "2026-09-04", "url": "https://www.sec.gov/Archives/edgar/data/2074973/000121390026097764/0001213900-26-097764-index.htm", "url2": "https://www.therobotreport.com/agility-robotics-reports-18m-revenue-ahead-of-humanoid-spac/"}, {"sec": 5, "t": "디파이언스, 中 로봇 부품주 담은 상장지수펀드 상장", "k": "시장이 경쟁력을 완성 기체가 아니라 부품 쪽에서 읽고 있다는 신호다.", "ez": "미국 자산운용사 디파이언스가 중국 휴머노이드 공급망 기업만 담은 상장지수펀드를 나스닥에 올렸다. 이 분야를 겨냥한 미국 최초의 펀드다. 눈여겨볼 대목은 무엇을 담았느냐다. 로봇 완성품을 만드는 회사가 아니라 감속기, 구동기, 모션제어 장치, 배터리처럼 로봇 안에 들어가는 부품 기업이 중심이다. 시장이 중국의 경쟁력을 완성된 로봇이 아니라 그 로봇을 이루는 부품 쪽에서 읽고 있다는 뜻으로 해석된다. 상장일은 8월 18일이고 국내 보도는 9월 7일이어서 3주 차이가 있다. 국내에는 이번에 처음 알려진 것으로 판단된다.", "body": "디파이언스 ETFs 가 中 휴머노이드 공급망 기업만 담은 미국 최초의 상장지수펀드 CROB 을 나스닥에 상장한 것으로 확인됨, 편입 종목이 완성 기체 업체가 아니라 감속기·구동기·모션제어·배터리 등 부품 기업 중심이라는 점에서 시장이 中 휴머노이드의 경쟁력을 부품 공급망에서 읽고 있음을 보임, 상장일은 8월 18일이어서 국내 보도(9.7)와 3주가 벌어져 있고 국내에는 이번에 처음 도달한 것으로 판단됨", "src": "디파이언스 발표 8.18 · 로봇신문 9.7", "pd": "2026-08-18", "url": "https://www.globenewswire.com/news-release/2026/08/18/3346956/0/en/defiance-etfs-launches-crob-the-first-us-listed-etf-dedicated-to-china-s-humanoid-robotics-ecosystem.html", "url2": "https://www.irobotnews.com/news/articleView.html?idxno=48337"}, {"sec": 5, "t": "서방 임원·투자자, 유료 견학으로 中 생산현장 방문", "k": "중국을 만들어 주는 곳이 아니라 배우러 가는 곳으로 보는 흐름이다.", "ez": "서방 기업의 임원과 창업자, 투자자가 수천 달러에서 1만 5,000달러를 내고 중국의 로봇·전기차·인공지능 기업 생산현장을 둘러보는 유료 견학이 늘고 있다는 보도가 나왔다. 보러 가는 것은 두 가지다. 휴머노이드가 실제 생산라인에서 일하는 모습, 그리고 부품 공급망이 어떻게 짜여 있는지다. 중국을 물건을 싸게 만들어 주는 곳이 아니라 학습 대상으로 보는 흐름이 생겼다는 것이다. 다만 같은 보도에 중국 밖 기업이 여전히 시장 점유와 지식재산, 수익에서 앞선다는 반론이 함께 실려 있어 한쪽으로만 읽을 일은 아니다. 견학에 몇 명이 참여했고 어느 기업이 갔는지는 확인되지 않았다.", "body": "서방 기업 임원과 창업자·투자자가 수천 달러에서 1만 5,000달러를 내고 中 로봇·전기차·AI 기업의 생산현장을 둘러보는 유료 견학이 늘고 있다고 로이터가 9월 4일 보도한 내용을 AI타임스가 9월 7일 옮긴 것으로 확인됨, 휴머노이드가 생산라인에서 작업하는 모습과 부품 공급망 확보가 방문 목적으로 제시됨, 로이터 원문을 열지 못해 재인용이며 견학 참가 인원과 기업 명단은 확인되지 않음, 다만 중국을 생산기지가 아니라 학습 대상으로 보는 흐름이 형성됐다는 서술은 中 외 기업이 여전히 시장점유·지식재산·수익에서 앞선다는 반론과 함께 제시돼 있어 한쪽으로 읽지 않아야 함", "src": "AI타임스 9.7", "pd": "2026-09-04", "url": "https://www.aitimes.com/news/articleView.html?idxno=214955"}, {"sec": 6, "t": "에임인텔리전스, 피지컬 AI 보안 컨소시엄 출범", "k": "언어모델에서 드러난 빈틈이 로봇으로 옮겨 간다는 문제의식에서 나왔다.", "ez": "국내 인공지능 보안기업 에임인텔리전스가 국내외 20여 기관과 함께 피지컬 AI 보안 협의체를 출범했다. 문제의식은 이렇다. 챗봇 같은 언어모델 단계에서 이미 드러난 보안 빈틈이, 인공지능이 로봇과 자율주행차로 옮겨 가면 그대로 따라간다는 것이다. 화면 안에서 잘못된 답이 나오는 것과 실제로 움직이는 기계가 잘못 움직이는 것은 결과가 다르다. 준비 중인 것으로는 서비스 로봇에 붙이는 전용 안전장치와, 공격하는 인공지능을 스스로 막아 내는지 시험하는 환경이 제시됐다. 다만 참여 기관 명단과 시험 항목, 무엇을 통과로 볼지는 공개되지 않았다.", "body": "에임인텔리전스가 국내외 20여 기관과 피지컬 AI 시큐리티 컨소시엄을 출범했다고 밝힌 것으로 보도됨, 박하언 최고기술책임자는 언어모델 단계에서 확인된 보안 공백이 다음 단계로 로봇·자율주행에 옮겨 간다고 진단하고 LG전자 서비스 로봇 클로이 전용 가드레일과 공격 에이전트를 스스로 무력화하는 벤치마크 환경을 준비 중이라고 밝힌 것으로 전해짐, 다만 컨소시엄 참여기관 명단과 로봇 대상 시험의 항목·통과 기준은 공개되지 않아 성과로 읽을 단계가 아님", "src": "AI타임스 9.7", "pd": "2026-09-07", "url": "https://www.aitimes.com/news/articleView.html?idxno=214964"}, {"sec": 7, "t": "한국기계연구원, 휴머노이드 카이로스 새 판 공개", "k": "다음 단계에 30억 원이 더 필요하다며 정부와 국회에 지원을 요청했다.", "ez": "한국기계연구원이 창립 50주년 포럼에서 한국형 휴머노이드 '카이로스'의 새 판을 공개하고 걷기와 국민체조, 탈춤 같은 전신 동작을 선보였다. 함께 나온 이야기가 더 무겁다. 연구책임자는 여기서 더 나아가는 데 필요한 직접비를 약 30억 원으로 제시하고 정부와 국회의 추가 지원을 요청했다. 기관장은 2027년 신체 완성, 2030년 산업현장과 가정 투입 실증 완료를 목표로 밝혔다. 학습 데이터 규모의 차이도 함께 제시됐다. 기계연이 데이터 수집 시설에 놓을 로봇이 25대인 데 비해 중국 업체는 수천 대 규모로 사람 동작을 따라 배우게 하고 있다. 다만 시연에서 로봇이 스스로 움직인 것인지, 몇 번 만에 성공한 것인지, 영상을 편집하거나 빠르게 돌린 것인지는 밝혀지지 않았다.", "body": "한국기계연구원이 창립 50주년 기념 포럼에서 한국형 AI 휴머노이드 카이로스 V0.7 을 공개하고 보행·국민체조·탈춤 응용 전신 동작을 시연함, 시연에서 자율 동작 여부와 시도 횟수, 영상 편집·배속 여부는 밝혀지지 않아 성능 근거로 쓰지 않음, 박찬훈 글로벌TOP전략연구단장은 현 단계에서 더 나아가는 데 필요한 직접비를 약 30억 원으로 제시하고 정부·국회의 추가 지원을 요청한 것으로 보도됐으며, 기계연 데이터팩토리에 설치할 로봇이 25대인 데 비해 中 업체는 수천 대 규모로 학습 데이터를 모으고 있다는 대비가 함께 제시됨, 류석현 원장은 2027년 신체 완성, 2030년 산업현장·가정 투입 실증 완료를 목표로 밝힘", "src": "기계연 발표 9.7 · 이데일리 9.7", "pd": "2026-09-07", "url": "https://www.kimm.re.kr/sub0504/view/id/21372", "url2": "https://www.edaily.co.kr/News/Read?newsId=03883526645577824"}, {"sec": 7, "t": "[칼럼] 카이로스의 다섯 달과 학습 데이터 격차", "k": "따라잡지 못한 이유를 기술이 아니라 모으는 규모에서 찾았다.", "ez": "국내 휴머노이드 '카이로스'가 다섯 달 만에 악수에서 탈춤까지 왔지만 중국 기체 수준에는 못 미친다는 평가가 나왔다. 필자가 원인으로 지목한 것은 기술이 아니라 학습 데이터를 모으는 규모다. 로봇은 사람 동작을 대량으로 따라 하며 배우는데, 기계연이 데이터 수집 시설에 놓을 로봇이 25대인 데 비해 중국 업체는 수천 대 규모로 돌리고 있다. 같은 기술을 가져도 학습에 쓸 자료가 백 배 차이 나면 결과가 벌어진다는 것이다. 칼럼이므로 필자의 판단이 섞여 있다.", "body": "백종민 아시아경제 테크 스페셜리스트가 카이로스가 5개월 만에 악수에서 탈춤까지 왔으나 中 기체 수준에는 못 미친다고 평가하고, 원인을 기술이 아니라 학습 데이터 수집 규모에서 찾은 것으로 보도됨, 기계연 데이터팩토리 설치 계획이 25대인 데 비해 中 업체는 수천 대로 사람 동작을 따라 하는 학습을 돌리고 있다는 점을 근거로 듦, 판단이 섞인 칼럼이므로 단정 근거로 쓰지 않으며 기사 제목에 제시된 총액 수치는 본문에서 근거가 확인되지 않아 인용하지 않음", "src": "아시아경제 칼럼 9.7", "pd": "2026-09-07", "url": "https://view.asiae.co.kr/article/2026090716483703493"}, {"sec": 7, "t": "[기고] 피지컬 AI 는 계통으로 이어질 때 작동한다", "k": "작업마다 따로 만드는 방식으로는 넓히기 어렵다는 지적이다.", "ez": "피지컬 AI는 모델과 데이터, 반도체, 통신, 기기가 하나의 계통으로 이어질 때 작동한다는 지적이 나왔다. 필자가 문제로 짚은 것은 작업마다 인공지능을 따로 만드는 방식이다. 그렇게 하면 작업이 하나 늘 때마다 처음부터 다시 만들어야 해서 넓히는 데 한계가 있다. 대안으로는 영상과 센서 값, 동작, 공간 정보를 공통 규격으로 쌓아 쓸수록 성능이 좋아지는 선순환을 만들자는 것이다. 여기에 현장에서 즉시 연산하는 기반이 함께 가야 한다고 덧붙였다. 필자가 통신기업 임원이어서 그 회사의 사업 방향이 반영돼 있다.", "body": "박상원 KT AX사업부문장이 피지컬 AI 는 모델·데이터·반도체·통신·디바이스가 하나의 계통으로 이어질 때 작동한다며 작업별로 개별 AI 를 만드는 방식은 확장에 한계가 있다고 지적한 것으로 보도됨, 영상·센서·동작·공간정보를 공통 규격으로 쌓아 성능 향상의 선순환을 만들어야 하고 AI-RAN·에지 데이터센터 같은 현장 실시간 연산 인프라가 함께 가야 한다는 제언이 제시됨, 기고이므로 필자 소속 기업의 사업 방향이 반영돼 있음을 감안해 읽어야 함", "src": "한국경제 기고 9.7", "pd": "2026-09-07", "url": "https://www.hankyung.com/article/2026090795461"}]}, {"date": "2026-09-07", "items": [{"sec": 1, "t": "美 국립과학재단, 인간-로봇 공동적응 연구센터 신설", "k": "기체 성능이 아니라 사람과 오래 맞춰 사는 과정을 연구 대상으로 잡았다.", "ez": "미국 국립과학재단이 5년간 9,000만 달러(약 1,240억 원)를 들여 과학기술센터 세 곳을 새로 열었다. 그중 하나가 텍사스대 오스틴이 주관하는 인간-로봇 공동적응센터다. 연구 주제가 특이하다. 로봇을 얼마나 잘 움직이게 할 것인가가 아니라, 로봇이 실험실을 나와 가정과 병원, 요양시설에서 사람과 오래 함께 지낼 때 서로가 서로에게서 배우고 행동을 맞춰 가는 과정을 학문으로 세우겠다는 것이다. 센터당 3,000만 달러(약 414억 원)가 배정되고 MIT와 예일대 등 여섯 대학에서 39명이 참여한다. 5년 뒤 최대 5년을 더 신청할 수 있다. 배정액과 참여 인원은 재단 발표문이 아니라 주관대학이 8월 27일 낸 발표에서 확인한 값이다.", "body": "국립과학재단이 과학기술센터(STC) 3곳을 새로 열며 5년간 총 9,000만 달러(약 1,240억 원)를 대고 5년 뒤 최대 5년을 더 신청할 수 있음, 센터당 배정액 3,000만 달러(약 414억 원)와 참여 인원 39명은 국립과학재단 발표문이 아니라 주관대학인 텍사스대 오스틴의 8.27 발표에서 확인한 값임, 로봇 분야는 텍사스대 오스틴이 주관하는 인간-로봇 공동적응센터가 맡고 MIT·예일대·인디애나대 블루밍턴·유타대·터프츠대와 함께 6개 대학 39명이 참여하며 조이딥 비스와스 부교수가 센터장임, 과제는 보조 로봇이 실험실을 나와 가정·병원·요양시설에서 사람과 오래 함께 지낼 때 사람과 로봇이 서로에게서 배우고 행동을 맞춰 가는 과정을 학문으로 세우는 것이어서 기체 성능이 아니라 장기 상호적응을 연구 대상으로 잡은 점이 다름, 나머지 둘은 미시간주립대 TEMPEST 와 노스웨스턴대 GENIE 로 로봇 분야가 아님", "src": "美 국립과학재단 발표 8.26 · 로봇신문 9.6", "pd": "2026-08-26", "url": "https://www.nsf.gov/news/nsf-launches-three-new-science-technology-centers-90m", "url2": "https://www.irobotnews.com/news/articleView.html?idxno=48315"}, {"sec": 2, "t": "美 로보커브, 상용 AI 3종에 로봇팔 맡겨 성능 실측", "k": "거친 동작에서는 세대 차가 벌어졌지만 정밀 작업에서는 나란히 막혔다.", "ez": "독립 평가기관 로보커브가 시중에 나와 있는 인공지능 모델 세 가지에 실제 로봇팔 제어를 맡기고 과제마다 스무 번씩 돌린 결과를 공개했다. 모의실험이 아니라 진짜 장비를 쓴 시험이다. 결과가 갈렸다. 그릇에 블록을 넣는 것처럼 정밀도가 덜 요구되는 동작에서는 최신 모델이 스무 번 중 열아홉 번 성공해 다른 모델을 크게 앞섰다. 그런데 홈에 퍼즐 조각을 정확히 맞춰 끼우는, 밀리미터도 안 되는 오차를 다투는 작업에서는 최신 모델과 그 앞 세대가 똑같이 스무 번 중 두 번에 그쳤다. 모델이 나아진 만큼 정밀 조작까지 나아지지는 않는다는 뜻이다. 다만 평가기관은 시험이 다른 날 따로 진행됐고 장비가 바뀌었으며 채점자가 어느 모델인지 알고 있었다는 한계를 스스로 밝혀 두었다.", "body": "독립 평가기관 로보커브가 상용 AI 모델 3종에 실제 로봇팔 제어를 맡겨 과제당 20회씩 돌린 결과를 공개했고 시뮬레이션이 아니라 실기이며 장비는 양팔 I2RT YAM(팔당 6자유도·평행 그리퍼), 모델은 매 턴 카메라 3개 화면과 관절 상태를 받아 양팔의 절대 말단 자세를 되돌려 주는 방식임, 그릇에 블록 넣기 같은 거친 조작에서는 GPT-6 아스트라가 20회 중 19회로 클로드 페이블 5.1(8회)과 페이블 5(1회)를 크게 앞섰으나 홈에 맞춰 퍼즐 조각을 끼우는 밀리미터 이하 정밀 과제에서는 아스트라와 페이블 5.1 이 똑같이 20회 중 2회에 그쳐 세대 교체가 정밀 접촉 영역에서는 일어나지 않았음, 평가기관 스스로 아스트라 시행이 이틀 뒤에 따로 진행됐고 그릇 과제는 장비가 바뀌었으며 채점자가 모델을 알고 있었다는 점을 한계로 밝혀 두었으므로 순위 자체를 단정 근거로 쓸 수 없음, 이 결과는 촉각 되먹임과 접촉 적응이 필요한 작업이 남은 병목이라는 뜻이어서 조립·검사 공정 투입을 전제로 한 국내 제조 현장 실증에서도 시연 영상의 성공률이 아니라 정밀 과제의 시행 횟수를 함께 요구해야 하고, 거친 조작의 성적을 기체 전체 성능으로 옮겨 적는 과대포장을 걸러낼 근거가 됨", "src": "美 로보커브 공개 9.4", "pd": "2026-09-04", "url": "https://openai.robocurve.org/gpt-6-astra/"}, {"sec": 3, "t": "LG전자, 빅테크와 로봇 관절부품 수주 협의 중", "k": "완성 기체 경쟁에 뛰어들지 않고 부품으로 들어가는 길을 골랐다.", "ez": "LG전자가 여러 빅테크 기업과 로봇 관절 부품 공급을 두고 협의하고 있으며 10월에 특정 기업과 생산 준비 상황을 점검하는 자리를 갖는다고 밝혔다. 회사가 내세운 근거는 60년 쌓은 모터 기술로 경쟁사보다 30% 이상 가벼운 모터를 만든다는 것과, 창원 공장에 전자동 생산라인을 갖췄다는 것이다. 제품군은 아홉 가지이고 1~2년 안에 압축기 수준의 외부 판매 매출을 목표로 제시했다. 눈여겨볼 것은 방향이다. 완성된 로봇을 만들어 경쟁하는 대신 그 안에 들어가는 부품으로 들어간다. 관절 부품은 로봇 제조 재료비의 60%를 차지한다. 다만 상대 기업과 물량, 금액은 밝히지 않았고 수주가 확정된 것도 아니다.", "body": "백승태 LG전자 홈어플라이언스솔루션사업본부장(부사장)이 현지시간 9월 5일 독일 베를린 IFA 2026 현장에서 연 기자간담회에서(국내 보도는 9.5 밤~9.6) 여러 빅테크와 로봇 관절 부품인 액추에이터 수주 활동을 진행 중이며 10월에 특정 기업과 생산 준비 상황·기술 검증을 위한 미팅을 갖는다고 밝혔음, 다만 상대 기업명과 물량·금액은 밝히지 않았고 수주가 확정된 것도 아니어서 현 단계는 협의로만 읽어야 함, 회사가 든 근거는 60년 축적한 모터 기술로 경쟁사 대비 30% 이상 가벼운 모터를 만든다는 것과 창원 사업장의 전자동 액추에이터 생산라인이고 제품군은 9종이며 1~2년 안에 컴프레서 수준의 외부 판매 매출을 목표로 제시했음, 액추에이터가 로봇 제조 재료비의 60%를 차지한다는 점에서 완성 기체 경쟁에 뛰어들지 않고 부품으로 들어가는 경로를 택한 것이고 이는 中 기체가 가격으로 앞서는 국면에서 국내 기업이 잡을 수 있는 자리가 어디인가에 대한 답이기도 함", "src": "파이낸셜뉴스 9.5 · 머니투데이 9.6", "pd": "2026-09-05", "url": "https://www.fnnews.com/news/202609052313208929", "url2": "https://www.mt.co.kr/industry/2026/09/06/2026090608272061582"}, {"sec": 3, "t": "현대모비스, 아틀라스용 관절부품 시제품 납품 준비", "k": "관절만 사업화 단계이고 손·센서·배터리는 아직 연구개발에 머문다.", "ez": "현대모비스가 보스턴다이내믹스의 차세대 휴머노이드에 들어갈 관절 부품 공급을 확보하고 올 하반기 시제품 납품을 준비 중인 것으로 전해졌다. 2026년 1월 맺은 협력의 후속이다. 회사가 함께 밝힌 내용에 온도 차가 있다. 관절 부품은 사업화 단계이지만 로봇 손과 집게, 센서, 제어기, 배터리팩은 아직 연구개발 단계로 양산 시점이 정해지지 않았다. 즉 부품 하나가 확보된 것이지 로봇 부품 전반이 아니다. 7~8월에 로봇 손 설계와 소프트웨어·모터 인력을 뽑은 사실이 후속 개발의 정황으로 함께 제시됐다.", "body": "현대모비스가 보스턴다이내믹스 차세대 아틀라스의 액추에이터 수주를 확보하고 올 하반기 시제품 납품을 준비 중이며 양산 시점 공급을 목표로 개발하고 있다고 보도됨, 2026년 1월 CES 에서 맺은 협력 체계의 후속이고 액추에이터는 사업화 단계이나 로봇 핸드·그리퍼·센서·제어기·배터리팩은 아직 연구개발 단계로 구체적 양산 목표 시점이 정해지지 않았다는 점을 회사가 함께 밝힘, 7~8월에 로봇 핸즈 시스템 설계와 핸드 소프트웨어·모터·전장기구 설계 인력을 채용한 사실이 후속 부품 개발의 근거로 제시됐으나 채용 공고는 개발 착수의 정황이지 결과가 아님, 회사는 글로벌 로봇 시장이 현재 약 75조 원에서 2040년 약 800조 원으로 연평균 17% 성장한다고 전망했는데 이는 자체 전망치이므로 근거로 쓰지 않음", "src": "메트로신문 9.6", "pd": "2026-09-06", "url": "https://www.metroseoul.co.kr/article/20260906500234"}, {"sec": 4, "t": "中 가전 3사, 유럽 전시회에서 가사 로봇 잇따라 시연", "k": "출시 시점을 밝힌 곳은 한 곳뿐이고 나머지는 개념 시연에 그쳤다.", "ez": "중국 가전 3사가 유럽 최대 가전 전시회에서 집안일을 하는 로봇을 잇따라 선보였다. 하이얼은 바닥의 빨래를 집어 세탁기에 넣는 로봇을, 드리미는 자체 기체를, 메이디는 팝콘을 만드는 휴머노이드를 냈다. 다른 한 곳은 파충류 사육장의 온습도와 조명을 관리하는 기기를 선보였다. 그런데 유럽에 언제 내놓을지 밝힌 곳은 한 곳(2027년 1분기)뿐이고 나머지는 개념이나 기술을 보이는 단계다. 가격과 안전, 작업 정확도가 과제로 남았다. 샤오미는 방향을 갈랐다. 가정용이 아니라 산업용으로 잡고 자사 휴머노이드를 베이징 공장 조립 공정에 넣어 검증하고 있다고 밝혔다. 시연이 스스로 한 것인지 사람이 조종한 것인지, 몇 번 만에 된 것인지는 어느 기업도 밝히지 않았다.", "body": "IFA 현장 취재 보도에 따르면 하이얼은 바닥의 세탁물을 집어 세탁기에 넣는 가사 로봇 '팀'을, 드리미는 '에코'를, 메이디는 팝콘을 만드는 휴머노이드 '샤오메이'를, 모바는 파충류 사육장의 온습도·조명을 관리하는 기기를 냈고 이 가운데 유럽 출시 시점을 밝힌 것은 모바(2027년 1분기)뿐이며 나머지는 개념 또는 기술 시연 단계로 가격·안전·작업 정확도가 과제로 남았다고 보도됨, 샤오미는 가정용이 아니라 산업용으로 방향을 갈라 휴머노이드 '사이버원'을 베이징 공장 조립 공정에 넣어 검증 중이라고 밝혔음, 시연 항목은 자율 동작인지 원격조작인지, 몇 회 중 몇 회 성공인지가 어느 기업에서도 제시되지 않아 성능 근거로 쓸 수 없고 각 기업의 공식 발표문을 찾지 못해 2차 자료에 근거함", "src": "디지털데일리 9.5", "pd": "2026-09-05", "url": "https://www.ddaily.co.kr/page/view/2026090516180459954"}, {"sec": 5, "t": "獨 베를린 전시회, 휴머노이드 런웨이 열고 역대 최다 전시", "k": "성능을 보이는 자리가 아니라 유럽 시장에 얼굴을 알리는 자리로 읽힌다.", "ez": "독일 베를린에서 열린 유럽 최대 가전 전시회가 9월 5일 보도자료를 내고 이번 행사에 역대 어느 해보다 많은 휴머노이드가 나왔다고 밝혔다. 개막 이튿날에는 로봇이 무대를 걷는 '런웨이' 행사도 열렸다. 로봇 세션에 선 기업은 열한 곳이고, 두 발로 걷는 기체를 낸 곳은 상당수가 중국 업체다. 다만 주최 측 보도자료는 참가 기업의 국적이나 중국 기업 수를 밝히지 않았다. 국내 보도에 나온 '중국 기업 900여 곳'은 전시회 전체 기준이므로 로봇 부문 수치로 옮겨 쓰면 안 된다. 런웨이에서 보인 것은 걷기와 춤, 공중제비 같은 동작이다. 스스로 한 것인지 사람이 조종한 것인지, 영상을 편집했는지가 밝혀지지 않아 성능 근거로는 쓸 수 없다. 유럽 시장에 얼굴을 알리는 자리로 보는 것이 타당하다.", "body": "IFA 베를린이 9월 5일 낸 보도자료에서 이번 전시(9.4~9.8)에 역대 어느 해보다 많은 휴머노이드가 나왔다고 밝혔고 로봇 세션에 선 기업은 프라임봇·엔진AI·코지오로보틱스·도봇·딥로보틱스·애지봇·유니트리·ZBy·올로봇·아스트랄다이내믹스·아이모가 11곳으로 이 가운데 이족보행 기체를 낸 곳 다수가 中 업체임, 다만 IFA 보도자료 자체는 참가 기업의 국적이나 中 기업 수를 밝히지 않았고 국내 보도가 든 「中 기업 900여 곳」은 전시 전체 기준 수치이므로 로봇 세션 수치로 옮겨 쓰면 안 됨, 런웨이 행사는 걷기·춤·백플립 같은 동작 시연이어서 자율 여부와 원격조작 여부, 편집·배속 여부가 밝혀지지 않았으므로 성능 근거로 쓸 수 없고 유럽 시장 접근을 위한 노출 행위로 읽는 것이 맞음", "src": "獨 IFA 베를린 발표 9.5", "pd": "2026-09-05", "url": "https://www.ifa-berlin.com/press-releases/ifa2026-humanoid-robots"}, {"sec": 5, "t": "현대차그룹 회장, 美 생산 철강을 아틀라스에 쓰겠다", "k": "양산 논의가 부품을 넘어 소재 조달까지 내려왔음을 보여 준다.", "ez": "현대차그룹 회장이 미국 루이지애나에 짓는 제철소 기공식에서, 이 공장이 만들 철강을 보스턴다이내믹스 휴머노이드에 쓰겠느냐는 물음에 당연히 그래야 한다고 답했다. 앞으로 로켓 기업에도 공급할 수 있으면 좋겠다는 말도 덧붙였다. 눈여겨볼 대목은 논의의 층위다. 휴머노이드 양산 이야기가 관절이나 감속기 같은 부품을 넘어 소재 조달까지 내려왔다. 미국에서 만든 소재를 미국에서 만드는 로봇에 쓰는 구성은 관세와 원산지 규정과도 맞물린다. 다만 몇 대에 언제 어느 부위에 쓸지는 제시되지 않았고, 회사의 공식 발표가 아니라 기공식 현장에서 나온 답변이다.", "body": "정의선 현대차그룹 회장이 현지시간 9월 4일 미국 루이지애나주 도널슨빌에서 열린 현대제철·포스코 전기로 제철소(HPLS) 기공식에서 이 제철소가 생산할 철강을 보스턴다이내믹스 휴머노이드 아틀라스에 적용하겠느냐는 물음에 당연히 적용해야 한다고 답했고 앞으로 스페이스X 같은 로켓 기업에도 공급할 수 있으면 좋겠다고 말했다고 보도됨, 적용 대수·시점·부위는 제시되지 않아 구상 표명 이상으로 읽을 수 없고 회사의 공식 발표문이 아니라 기공식 현장 발언임, 그럼에도 휴머노이드 양산 논의가 관절·감속기 같은 구동 부품을 넘어 소재 조달까지 내려왔다는 점과, 미국 내 생산 소재를 미국 내 로봇 생산에 쓰는 구성이 관세·원산지 규정과 맞물린다는 점에서 공급망 사안임", "src": "전자신문 9.6", "pd": "2026-09-04", "url": "https://www.etnews.com/20260906000085"}, {"sec": 6, "t": "국제전기기술위, 가정용 로봇 성능평가 표준 제2판 발행", "k": "두 발로 걷는 기체는 적용 범위 밖이어서 안전 기준으로 읽으면 안 된다.", "ez": "가정용 로봇의 성능을 재는 국제 표준의 두 번째 판이 나왔다. 국내에는 '중국 주도로 제정된 국제 표준이 최근 발표됐다'는 취지로 알려졌으나, 표준 정보를 직접 열어 보니 사실관계가 조금 달랐다. 발행일은 2025년 11월 24일이고 초안이 아니라 확정된 국제 표준이다. 유럽이 받아들인 판도 2026년 1월에 이미 나왔다. 중국 연구기관이 제정을 주도한 것은 맞지만 '최근 발표'라는 시점 표현은 원문과 어긋난다. 더 중요한 것은 적용 범위다. 이 표준이 다루는 것은 바닥을 다니는 바퀴형·궤도형 기체이고 높이 1.75미터, 폭 700밀리미터, 속도 초당 1.5미터 이하로 한정돼 있다. 두 발로 걷는 휴머노이드는 사정권 밖이다. 이 표준을 휴머노이드의 안전·성능 기준으로 읽으면 안 된다.", "body": "로봇신문이 9월 6일 「'가정용 로봇 성능 측정' 국제 표준 발표…中 주도로 제정」으로 옮긴 사안의 원문을 IEC 표준정보에서 직접 열어 확인한 결과 해당 표준은 IEC 62849 제2판이며 발행일은 2025년 11월 24일이고 단계는 초안이 아니라 국제표준(IS), 담당 기술위원회는 로봇 전담이 아닌 TC 59(가정용 전기기기 성능)임, 中 매체가 인용한 중국가용전기연구원(中国家用电器研究院)의 주도 사실은 확인되나 「최근 발표」라는 시점 표현은 원문과 어긋나며 유럽 채택판 EN IEC 62849 도 2026년 1월에 이미 나왔음, 적용 대상은 바닥을 다니는 바퀴·궤도형 기체로 높이 1.75m·폭 700mm·속도 1.5m/s 이하로 한정돼 있어 이족보행 휴머노이드는 이 표준의 사정권 밖이고 따라서 「가정용 로봇 국제표준」을 휴머노이드 안전·성능 기준으로 읽으면 안 됨, 제1판(2016) 대비 장애물 회피·경사로 주행·조명 영향·단차 통과·문턱 통과·에너지 소비 6개 평가 항목이 새로 들어갔고 시험 방법을 이동성·항법·에너지 사용·환경 영향·기타 5개 범주로 재편함", "src": "IEC 표준정보 직접 확인 9.7 · 로봇신문 9.6", "pd": "2025-11-24", "url": "https://webstore.iec.ch/en/publication/68511"}, {"sec": 6, "t": "[기고] 로봇 특허 조사, 제품 분해가 검색보다 먼저다", "k": "개별 기술이 알려져 있어도 그것을 잇는 방식에 권리가 걸릴 수 있다.", "ez": "로봇기업이 남의 특허에 걸리지 않고 제품을 팔 수 있는지 따지는 조사를, 특허 검색부터 돌리는 관행이 문제라는 지적이 나왔다. 기고자는 제품을 기술 단위로 분해해 구조와 핵심 기술을 먼저 파악해야 무엇을 찾아야 할지가 정해진다고 봤다. 두 번째 논지가 더 무겁다. 개별 기술이 이미 다 알려져 있어도 그것들을 결합하는 방식에 권리가 걸릴 수 있으므로, 부품 목록이 아니라 기술 사이의 연결관계를 봐야 한다는 것이다. 휴머노이드는 구동과 감속, 촉각 감지, 제어 소프트웨어가 층층이 얽혀 있어 이 지적이 특히 아프게 걸리는 영역이다. 기술특례상장 심사에서도 이 보고서가 기술 자립도를 입증하는 자료로 쓰인다. 찾아낸 건수가 아니라 제품을 얼마나 이해했는지로 평가돼야 한다는 것이 결론이다.", "body": "기고자는 로봇기업의 통상실시 가능성(FTO) 분석에서 특허 검색을 먼저 돌리는 관행을 문제로 짚고 제품을 기술 단위로 분해해 구조와 핵심기술을 파악하는 일이 앞서야 조사 범위가 제대로 정해진다고 주장함, 개별 기술이 이미 알려져 있어도 그것을 결합하는 방식에 특허가 걸릴 수 있으므로 구성요소 목록이 아니라 기술 간 연결관계를 봐야 한다는 것이 두 번째 논지이고, 기술특례상장 심사에서 FTO 보고서가 기술 자립도와 사업 지속성을 입증하는 자료로 쓰이므로 찾아낸 특허 건수가 아니라 제품 이해도와 리스크 설명의 설득력으로 평가돼야 한다고 맺음, 휴머노이드는 구동·감속·촉각센서·제어 소프트웨어가 층층이 얽혀 있어 이 지적이 특히 걸리는 영역이며 국내 부품·완성 기업이 해외 양산에 나설 때 결합 방식 특허를 실사에서 놓치면 진입 단계가 아니라 납품 단계에서 막히게 됨, 기고문이므로 필자 개인 견해이고 소속 기관의 입장이 아님", "src": "로봇신문 기고 9.7", "pd": "2026-09-07", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48327"}, {"sec": 7, "t": "[리포트] 국산 로봇 보급 확대와 업종별 데이터 시설 필요", "k": "걸림돌이 성능이나 예산이 아니라 제도라는 진단이 함께 나왔다.", "ez": "국산 로봇 보급을 늘려 실제로 쓰이는 기반을 넓혀야 한다는 진단이 나왔다. 중국이 로봇을 대규모로 깔며 시장을 키우고 있다는 것이 배경이다. 함께 나온 구상은 현장에서 데이터를 모으는 시설이다. 내년에 지역마다 업종별로 열 곳가량 만들어 넓히는 방향을 고민 중이라고 밝혔다. 다만 검토 단계여서 소관 사업과 예산, 착수 시점은 제시되지 않았다. 더 무거운 것은 걸림돌 진단이다. 국내 실증을 막는 것으로 안전 기준, 사고가 났을 때 책임 소재, 개인정보 보호, 기업 제조데이터 공유 제약 넷이 꼽혔다. 기체 성능이나 예산이 아니라 제도가 병목이라는 뜻이어서 지원을 늘리는 것만으로는 풀리지 않는다.", "body": "한국산업기술기획평가원(KEIT) 로봇 프로그램디렉터가 中이 로봇을 대규모로 보급하며 시장을 키우는 만큼 국산 로봇 공급을 확대해 실제 활용 기반을 넓혀야 한다고 밝히고 현장에서 데이터를 모으는 일이 중요하다며 내년 지역에 업종별 데이터 팩토리를 10개가량 만들어 확산하는 방향을 고민 중이라고 말했다고 보도됨, 다만 데이터 팩토리는 검토 단계로 소관 사업·예산·착수 시점이 제시되지 않아 계획으로 읽을 수 없고 전담기관 공식 발표문도 확인하지 못했음, 국내 실증의 걸림돌로는 안전 기준·사고 책임 소재·개인정보보호·기업 제조데이터 공유 제약 넷이 지목됐는데 이는 기체 성능이나 예산이 아니라 제도가 병목이라는 진단이어서 지원 확대만으로는 풀리지 않음, 비교 근거로 든 베이징 2026 세계로봇대회는 300여 개 기업이 2,000점 넘는 로봇·관련 제품을 냈다는 것이고 中의 우위를 데이터 축적 속도로 설명함, 이 진단은 CJ대한통운 상용 배치의 가동률·고장률이 기록으로 남지 않는다는 창간호 지적과 같은 곳을 가리키며 실증 데이터를 쌓을 제도적 자리가 국내에 없다는 문제로 모임", "src": "이데일리 9.6", "pd": "2026-09-06", "url": "https://www.edaily.co.kr/News/Read?newsId=01981126645577496"}]}, {"date": "2026-09-04", "items": [{"sec": 4, "t": "CJ대한통운, 물류 운영 현장에 휴머노이드 첫 투입", "k": "검증 단계를 지나 실제 고객 화물을 다루는 자리로 넘어왔다.", "ez": "CJ대한통운이 물류센터의 실제 운영 공정에 사람 모양 로봇 두 대를 넣었다. 맡은 일은 포장 라인에서 상자 안에 완충재를 채우는 한 가지 공정이다. 이번 발표의 핵심은 대수나 기능이 아니라 적용 단계다. 지난해 하반기에는 '쓸 수 있는지'를 확인하는 검증이었고, 이번에는 실제 고객 화물을 처리하는 운영 현장이다. 하드웨어는 로보티즈, 로봇 손은 에이딘로보틱스, 로봇을 움직이는 인공지능 모델은 리얼월드가 맡았다. 회사는 앞으로 집기·분류·검수·포장으로 범위를 넓혀 로봇 한 대가 여러 공정을 이어서 하는 단계로 키우겠다고 밝혔으나 확대 시점과 대수는 밝히지 않았다. 로봇이 스스로 판단한 비중이 얼마인지, 사람이 얼마나 개입하는지, 시간당 몇 개를 처리하는지도 공개되지 않아 성능 근거로는 쓸 수 없다.", "body": "보도자료 원문을 열어 확인한 결과 투입 대수는 2대이고 담당 작업은 포장 라인에서 박스 내부에 완충재를 투입하는 단일 공정이며 하드웨어는 로보티즈·로봇핸드는 에이딘로보틱스·로봇 파운데이션 모델(RFM)은 리얼월드가 맡았다고 밝힘, 회사는 로봇이 시각과 센서로 주변 환경을 인식하고 상황에 맞는 행동을 판단·수행한다고 설명했으나 자율 동작의 비중·원격 개입 여부·처리량·정확도·가동시간은 보도자료와 뉴스룸 어디에도 제시되지 않아 성능 근거로 쓸 수 없음, 2025년 하반기 군포 풀필먼트센터의 적용 가능성 검증에서 실제 고객 물류를 처리하는 운영 현장으로 넘어온 점이 이번 발표의 핵심이며 향후 피킹·분류·검수·포장으로 범위를 넓혀 하나의 기체가 여러 공정을 연속 수행하는 범용 물류 휴머노이드로 발전시키겠다는 목표를 제시했으나 확대 시점과 대수는 미공개", "src": "CJ대한통운 발표 9.3", "pd": "2026-09-03", "url": "https://www.cjlogistics.com/ko/newsroom/news/NR_00001386"}, {"sec": 1, "t": "美 ARM Institute, 국방 제조시설 현대화 과제 배정", "k": "폭발물 생산 안전과 병목 해소에 로봇을 넣는 2년짜리 사업이다.", "ez": "미국의 로봇 제조혁신 기관이 군 제조기반을 현대화하는 과제를 배정했다. 대상은 미 전역 열두 곳의 군 제조시설이고, 회원 조직 열다섯 곳이 컨소시엄으로 참여하며 수행 기간은 2년이다. 적용 범위로 네 가지가 제시됐다. 폭발물을 만드는 공정의 안전을 높이는 일, 인공지능을 써서 제조 품질을 개선하는 일, 무인기로 임무 준비 시간을 줄이는 일, 그리고 로봇으로 생산 병목을 없애는 일이다. 공식 문서에 '로보틱스와 피지컬 AI 해법'이라는 표현이 그대로 적혀 있다. 다만 사람 모양 로봇은 문서에 언급되지 않는다. 과제별로 얼마씩 배분됐는지와 어느 기관이 무엇을 맡는지도 공개되지 않았다.", "body": "공식 게시물을 직접 열어 확인한 결과 대상은 미 전역 12개 군 제조시설이고 15개 회원 조직이 컨소시엄으로 참여하며 수행 기간은 2년, 적용 범위로 폭발물 생산의 안전성 향상·AI 를 쓴 제조품질 개선·드론을 이용한 임무준비태세 단축·로보틱스를 통한 병목 제거를 제시했고 문서에 로보틱스와 피지컬 AI 해법이라는 표현이 명시됨, 다만 휴머노이드는 언급되지 않았고 과제별 배분액과 수행기관 명단은 공개되지 않아 O12 로 올림", "src": "ARM Institute 발표 9.3", "pd": "2026-09-03", "url": "https://arminstitute.org/news/oib-2026/"}, {"sec": 7, "t": "라온피플, 무인공장 기반모델 사업 수행기관 선정", "k": "총 702억 원 규모이나 기관별 분담과 기간은 공개되지 않았다.", "ez": "국내 인공지능 기업 라온피플이 과기정통부의 무인공장용 인공지능 기반모델 개발 사업에 수행기관으로 뽑힌 것으로 보도됐다. 공장을 사람 없이 돌리려면 로봇이 상황을 보고 스스로 판단해야 한다. 그 판단의 바탕이 되는 큰 인공지능 모델을 만드는 과제이고, 라온피플은 모델 개발과 상용화에 참여해 자동차 부품과 로봇 기업의 공장에 넣어 검증하는 역할을 맡는다. 총 사업비는 702억 원으로 전해졌다. 그 밖의 것은 알려지지 않았다. 사업 기간도, 함께 참여하는 기관도, 기관별로 얼마씩 나눠 받는지도, 정부 지원분과 민간 부담이 어떻게 갈리는지도 어느 보도에도 없다. 회사 공식 창구에도 이 항목이 올라와 있지 않아 회사 발표를 옮긴 보도에 근거한 내용이다.", "body": "공장을 무인으로 운용하기 위한 피지컬 AI 파운데이션 모델을 개발하는 과제로 라온피플은 AI 모델 개발과 상용화에 참여해 자동차 부품·로보틱스 기업 공장에 적용·검증하는 역할을 맡는다고 보도됐고 총 사업비 702억 원 외에 사업기간·컨소시엄 참여기관·기관별 분담과 정부지원분·민간부담 구분은 어느 보도에도 없음, 라온피플 공식 뉴스룸을 9월 4일 직접 열어 확인한 결과 최신 게시물이 7월 27일자이고 이번 선정 항목이 없어 원문을 확보하지 못했으므로 등급을 S3 으로 두고 O13 으로 올림, 이상은 회사 발표를 옮긴 보도에 근거한 내용으로 보도됨", "src": "AI타임스 9.3 (라온피플 발표)", "pd": "2026-09-03", "url": "https://www.aitimes.com/news/articleView.html?idxno=214820"}, {"sec": 6, "t": "유진로봇, 안전보건 경영 국제표준 인증 취득", "k": "사업장 관리 체계를 보는 표준이지 제품 안전규격이 아니다.", "ez": "유진로봇이 안전보건 경영에 관한 국제표준 인증을 받았다. 회사는 2021년 이동로봇 안전표준을 업계에서 처음 취득한 데 이은 것이라고 설명했다. 다만 두 인증은 성격이 다르다. 이번에 받은 것은 사업장에서 일하는 사람의 안전과 보건을 어떻게 관리하는지를 보는 경영체계 표준이다. 로봇이라는 제품 자체가 안전한지를 보는 규격이 아니다. 인증기관과 취득일, 어느 사업장이 대상인지는 보도에 나오지 않았고 회사 공식 발표문도 확인되지 않았다.", "body": "회사는 2021년 모바일 로봇 안전표준 ISO 13482 를 업계 최초로 취득한 데 이어 이번 인증을 받았다고 설명한다고 보도됨, 다만 ISO 45001 은 사업장의 안전보건 경영체계를 보는 이미 제정된 표준(IS)이지 로봇 제품 자체의 안전규격(ISO 10218 계열·ISO 13482)이 아니므로 두 층위를 섞어 읽지 않아야 하고 인증기관·취득일·대상 사업장은 보도에 제시되지 않아 원문을 확보하지 못함", "src": "로봇신문 9.3 (유진로봇 발표)", "pd": "2026-09-03", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48268"}, {"sec": 8, "t": "도쿄대, 로봇 조작 정책이 작동하는 최소 크기 제시", "k": "100만 개 아래로 줄이면 무너진다는 하한선을 실측으로 그었다.", "ez": "도쿄대 연구팀이 로봇에게 물건을 다루게 하는 인공지능이 얼마나 작아도 되는지를 실측으로 따졌다. 결과가 뜻밖이다. 조절 손잡이 54만 개짜리 작은 모델이 표준 시험에서 평균 95.1%를 성공했는데, 이는 손잡이가 7,700배 많은 기존 모델보다 2.4포인트 낮을 뿐이다. 게다가 이 작은 모델은 그래픽카드 없이도 돌아가고 판단에 5~9밀리초밖에 걸리지 않아 기존보다 1,400배 빠르다. 연구팀이 내세운 결론은 '하한선'이다. 100만 개 부근에서 성능이 더 오르지 않고, 그 아래로 내려가면 무너진다는 것이다. 다만 방해 요소를 넣은 조건에서는 성공률이 46~56%로 떨어진다는 점도 함께 밝혔다. 시험 성적을 현장 성능으로 읽으면 안 된다. 동료심사를 거치지 않은 논문이다.", "body": "PDF 를 열어 확인한 결과 제1저자는 도쿄대 대학원 공학계연구과 마쓰오·이와사와 연구실 소속이고, 평가는 시뮬레이션(LIBERO 표준 4개 스위트)이며 시행 횟수는 2,000 롤아웃으로 명시됨, 54만 파라미터 정책이 평균 성공률 95.1% 를 냈고 이는 파라미터가 7,700배 많은 기존 모델보다 2.4포인트 낮은 수준이며 제어 스텝마다 재계획하는 데 5~9밀리초가 걸리고 GPU 없이 동작해 기존 대비 1,400배 빠르다고 제시됨, 성공률이 100만 파라미터 부근에서 포화하고 그 아래에서는 무너진다는 '용량 하한'을 이 논문의 결론으로 내세웠으나 교란을 준 LIBERO-Plus 조건에서는 성공률이 46~56% 로 떨어진다고 함께 밝혀 벤치마크 성능을 현장 성능으로 읽으면 안 됨, 미동료심사 프리프린트이므로 등급은 S3 을 넘기지 않으며 실기 로봇 평가는 논문에 없고 전부 시뮬레이션으로 확인됨", "src": "도쿄대 arXiv 9.3", "pd": "2026-09-03", "url": "https://arxiv.org/abs/2609.03715"}]}, {"date": "2026-09-03", "items": [{"sec": 1, "t": "호주, 제조기업 자동화 도입 돕는 전국 플랫폼 개설", "k": "실제 사업 600여 건의 자료로 타당성과 견적까지 짚어 준다.", "ez": "호주의 로봇 산업 단체가 제조기업이 자동화를 들일 때 무엇부터 봐야 할지 안내하는 전용 사이트를 열었다. 국가 단위로 이런 플랫폼을 두는 것은 처음이라고 밝혔다. 기업이 자기 생산 현장과 겪는 문제를 적어 넣으면, 전 세계에서 실제로 진행된 자동화 사업 600건 이상의 자료를 바탕으로 자동화가 가능한지 분석해 준다. 그다음에는 요구사항을 정리하고 타당성을 따지고 견적을 받아 공급업체를 비교해 고르는 단계까지 이어진다. 호주 기업 약 500곳을 대상으로 삼는다. 사이트는 호주 로봇 단체가 운영하고 기술은 다른 회사의 것을 빌려 쓰는 구조다.", "body": "9월 1일 발표된 것으로 보도됐고 호주 제조기업이 자동화 투자 대상을 발굴해 사업 타당성과 비용을 검증하고 공급업체까지 고르는 과정을 AI 기반으로 지원하는 전용 사이트 AutomationFinder.com.au 를 로보틱스 오스트레일리아 그룹이 운영하며 하우투로봇의 기술을 쓰는 구조이고 이 플랫폼이 국가 단위 라이선스 방식으로 구축되는 첫 사례라고 밝힘, 사용자가 생산 현장과 문제점을 설명하면 전 세계 600건 이상의 실제 자동화 프로젝트 데이터로 자동화 가능성을 분석하고 요구사항 전환·타당성 검증·견적 확보·공급업체 비교·최종 선정까지 단계적으로 진행하며 호주 기업 약 500곳을 포함해 전 세계 2만 곳 이상의 검증된 공급업체가 참여하고 특정 제조사에 종속되지 않는 벤더 중립 방식으로 운영된다고 함, 폴 메이슨 로보틱스 오스트레일리아 그룹 CEO 는 기업들이 자동화 필요성은 알지만 도입 방법의 불확실성 때문에 투자를 주저해 왔다고 밝힘, 양측 원문 발표는 확보하지 못해 국내 보도를 출처로 적음", "src": "로봇신문 9.2 (양측 발표 9.1)", "pd": "2026-09-01", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48249"}, {"sec": 2, "t": "서울대 연구팀, 제조 특화 기반모델 9년 과제 선정", "k": "설비마다 제각각인 신호를 한 모델이 다루게 하는 것이 목표다.", "ez": "서울대 기계공학부 연구팀이 공장 일에 특화된 대형 인공지능 모델을 만드는 과제에 뽑혔다. 2026년 6월부터 9년간 수행한다. 문제는 이렇다. 공장에서 나오는 자료는 진동과 전류 같은 신호, 공정 이력, 카메라 영상이 뒤섞여 있는데 설비마다 센서마다 표현 방식이 제각각이다. 게다가 글이나 말과 달리 그 안에 뜻이 드러나 있지 않아 인공지능이 그대로 학습하기 어렵다. 연구팀은 먼저 공장 자료를 공정 단계, 작업 사건, 설비 상태, 센서 역할, 업무 목적 다섯 기준으로 다시 정의하는 데서 출발한다. 최종 목표는 자료를 모으는 일부터 판단하고 실제로 기계를 움직이는 일까지를 하나로 잇는 것이다.", "body": "「풀스택 AI 팩토리를 위한 제조 업무(x) 특화형 파운데이션 모델」 과제가 2026년도 리더연구 유형A에 선정돼 2026년 6월부터 9년간 수행되며 데이터 수집부터 추론·의사결정, 물리적 실행까지를 잇는 제조 자율화 체계를 목표로 함, 문제 설정은 고주파 진동·전류 신호와 공정 이력, 비전 데이터가 섞인 제조 도메인에 이를 아우르는 범용 파운데이션 모델이 없고 제조 데이터는 공정·설비·센서별로 표현이 이질적이며 자연어처럼 명시적 의미 구조가 없어 학습에 그대로 쓰기 어렵다는 것이고, 1단계에서 제조 데이터를 공정 단계·작업 이벤트·설비 상태·센서 역할·업무 목적 다섯 기준으로 재정의한 뒤 계층적 메타데이터 구조와 설비·센서 편차 보정 체계를 갖춰 별도 전처리 없이 학습 가능한 'AI-Ready 제조 데이터' 체계를 세우고 고주파 신호 특성을 반영한 데이터 생성 모델과 물리 정합성 검증으로 희소한 이상·고장 사례를 보완한다고 밝힘, 여러 데이터를 한 모델에 통합할수록 판단 근거를 설명하기 어려워지는 문제를 짚고 설명성을 모델에 내재화하겠다고 한 점이 특징임", "src": "서울대 공대 연구성과 · 로봇신문 9.2", "pd": "2026-09-02", "url": "https://eng.snu.ac.kr/research/research-achievements?md=v&bbsidx=8342", "url2": "https://www.irobotnews.com/news/articleView.html?idxno=48264"}, {"sec": 3, "t": "TPC로보틱스, 휴머노이드용 관절부품 7종 출시", "k": "부위별로 나눠 국내외 제조사에 대는 공급 경로를 노린다.", "ez": "TPC로보틱스가 사람 모양 로봇에 들어가는 관절부품 일곱 가지를 자체 상표로 내놓고 국내외 제조사에 공급하겠다고 밝혔다. 구성은 부위별로 나뉜다. 목과 팔꿈치, 엉덩이처럼 돌아가는 관절에 쓰는 회전형 세 가지, 종아리와 허벅지처럼 무거운 하중을 버텨야 하는 곳에 쓰는 직선형 세 가지, 그리고 손가락의 정밀한 움직임을 맡는 모듈 하나다. 회사는 기존 자동화 영업망과 협력사를 발판으로 삼겠다고 했다. 앞서 5월에는 중국 휴머노이드 기업과 부품 기술이전 및 공동개발 계약을 맺고 사내에 관련 연구소를 세웠다. 별도로 하반기에 약 50억 원 규모의 직선형 모터 공급도 추진하고 있다.", "body": "9월 2일 밝힌 것으로 구성은 목·팔꿈치·엉덩이 관절에 쓰이는 로터리(회전형) 액추에이터 3종, 고하중을 지탱하는 종아리·허벅지·팔꿈치용 리니어(선형) 액추에이터 3종, 손가락 정밀 움직임을 구현하는 핑거용 관절 모듈 1종으로 부위별로 나뉘며 기존 자동화 영업망과 파트너사를 기반으로 국내외 휴머노이드 제조사와 장비업체를 공략하겠다고 밝힘, 앞서 5월 중국 저장허촨휴머노이드로봇(HCBOT)과 액추에이터·핵심부품 기술이전 및 공동개발·생산 협력계약을 맺고 사내에 AI 자율제조 연구소를 세운 데 이은 것이며 별도로 글로벌 자동화 기업과 하반기 약 50억 원 규모 리니어 모터 공급을 추진해 8월 약 6억 원 초기 물량을 수주했다고 함, 다만 가반하중·정격토크·연속가동시간 같은 사양표 수치와 양산 시점·단가는 보도에 없고 회사 사양표를 확보하지 못해 성능을 단정할 수 없음", "src": "아시아경제 9.2 외 2건", "pd": "2026-09-02", "url": "https://www.asiae.co.kr/article/2026090209250245273"}, {"sec": 3, "t": "[분석] 中 이좡 로봇단지, 부품 48시간 납품 체계", "k": "고장 나면 두 시간 안에 응대하는 구조가 속도의 바탕으로 꼽힌다.", "ez": "중국 베이징 이좡 지역의 로봇 산업 생태계를 다룬 중국 매체 특집이 국내에 소개됐다. 눈길을 끄는 것은 부품 대응 속도다. 문제가 생기면 두 시간 안에 응대하고 48시간 안에 부품을 납품하는 체계를 갖췄다고 한다. 로봇을 만드는 회사와 부품을 공급하는 회사가 한 지역에 모여 있어 가능한 구조다. 학습 시설도 함께 제시됐다. 5,000제곱미터 규모의 훈련기지에 실제 작업환경 30여 개를 꾸며 두고 120가지가 넘는 상황을 상정해 자료를 모으며, 공개 자료집은 1,000만 건을 넘는다. 다만 이는 현장 취재가 아니라 중국 매체를 옮긴 것이고, 부품을 얼마나 자국에서 만드는지, 기업이 몇 곳인지, 정부가 얼마를 댔는지는 제시되지 않았다.", "body": "중국전자보(中国电子报) 8월 14일 특집호를 인용한 보도로 훈련기지 5,000㎡·실제 작업환경 30여 개·응용 시나리오 120개 이상과 RoboMIND 데이터셋 1,000만 건 이상, 부품 2시간 대응·48시간 납품 체계가 제시된 것으로 보도됐으나 현장 취재가 아닌 2차 인용이고 부품 국산화율·기업 수·정부 지원 규모는 제시되지 않음", "src": "中国电子报 8.14 · 로봇신문 9.1", "pd": "2026-09-01", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48196", "url2": "https://www.irobotnews.com/news/articleView.html?idxno=48196"}, {"sec": 3, "t": "원익로보틱스, 다섯 손가락 로봇핸드 새 모델 출시", "k": "쥐는 장치에서 접촉 자료를 모으는 장치로 성격을 바꿨다.", "ez": "원익로보틱스가 손가락이 다섯 개이고 관절이 스무 개로 움직이는 로봇 손을 내놓았다. 네 손가락 중심이던 기존 제품에서 넓힌 것이고 전체 크기는 20% 이상 줄였다. 바뀐 것은 손가락 수만이 아니다. 손끝과 손가락 관절, 손바닥의 주요 접촉 부위에 압력을 재는 센서를 넣어, 무엇을 언제 어느 세기로 만졌는지가 자료로 남는다. 회사는 이를 두고 로봇 손을 '움직이는 장치'에서 '접촉 자료를 얻는 장치'로 넓히는 것이라고 설명했다. 쌓인 자료는 무엇을 쥐다 놓쳤는지 분석하고 조작 방식을 개발하는 데, 그리고 인공지능 학습과 평가에 쓴다. 손끝이 무언가에 닿으면 빛으로 알려 주는 기능도 넣었다.", "body": "기존 4지 중심 라인업을 5지·20자유도로 확장하고 전작 대비 전체 크기를 20% 이상 줄였으며 손끝·손가락 관절·손바닥 주요 접촉 영역에 압력센서를 배치해 파지·조작 과정의 접촉 위치와 시점, 압력 변화를 확인할 수 있게 한 것으로 보도됨, 회사는 이를 로봇핸드를 「움직이는 장치」에서 「접촉 데이터를 취득하는 플랫폼」으로 확장하는 것으로 설명했고 확보한 데이터를 파지 성공·실패 분석과 조작 알고리즘 개발, AI 학습·평가 데이터 구축에 쓴다고 밝혔으며 손끝에 접촉 여부를 빛으로 표시하는 시각 피드백도 넣음, 앞서 확정된 3,500억 원 규모 지분투자(국민성장펀드 첨단전략산업기금 1,500억 원·민간 2,000억 원)로 전북 완주에 로봇핸드 생산공장과 AX센터를 구축해 양산 역량과 핵심부품 내재화, 데이터 팩토리 인프라를 갖춘다는 계획과 맞물린 출시임, 다만 가반하중·연속가동시간·반복정밀도 같은 사양표 수치와 양산 시점·단가는 보도에 없고 회사 사양표를 확보하지 못해 성능을 단정할 수 없음", "src": "AI타임스 9.2 외 4건", "pd": "2026-09-02", "url": "https://www.aitimes.com/news/articleView.html?idxno=214758"}, {"sec": 4, "t": "日 오사카메트로, 지하철역 안내에 휴머노이드 실증", "k": "제복을 입히고 여러 나라 말로 길을 알려 주는 자리에 세웠다.", "ez": "일본 오사카의 지하철 운영사가 통신사·로봇기업과 함께 역 구내에 사람 모양 로봇을 세워 안내를 맡기는 실증을 했다. 8월 31일부터 9월 15일까지 두 역에서 매일 열한 시부터 여덟 시까지 진행했다. 로봇은 지하철 제복을 입고 역 안 길과 환승 경로, 주변 관광 정보를 알려 준다. 영어와 중국어 등 여러 나라 말에 대응하고, 손에 달린 화면의 정사각형 무늬를 승객이 휴대폰으로 읽으면 자세한 노선도를 가져갈 수 있다. 기체는 사람을 닮은 로봇 연구로 알려진 오사카대 교수가 만든 것이다.", "body": "3사 공동 보도자료 원문을 열어 확인한 결과 실증은 8월 31일부터 9월 6일까지 Metro Opus 우메다점(미도스지선 우메다역 북개찰 앞), 9월 9일부터 15일까지 Metro Opus 다니마치9초메 east(다니마치선·센니치마에선 동개찰 동측)에서 매일 11시~20시(8월 31일만 13시~20시) 진행되며, 오사카메트로 제복을 입은 휴머노이드가 역 구내·환승 경로 안내와 주변 관광정보를 제공하고 영어·중국어 등 다국어에 대응하며 손 디스플레이의 QR 코드를 승객 휴대폰으로 읽으면 상세 노선도를 가져갈 수 있음, 기체는 이시구로 히로시 오사카대 교수(AVITA 대표, 2025년 오사카·간사이 만박 「생명의 미래」 파빌리온 프로듀서)가 디자인한 휴머노이드의 기능을 쇄신한 것으로 구글 제미나이를 탑재해 목소리의 톤·속도·억양과 감정의 뉘앙스를 실시간 감지하고 음성인식부터 응답까지 직렬처리로 초저지연 응답을 낸다고 밝힘, 역할은 오사카메트로가 접객 노하우 제공과 수요·수용성 검증, KDDI가 통신기술과 AI데이터센터 자산을 활용한 가동 인프라 구축 및 기획·운영, AVITA가 휴머노이드 개발과 대화시스템 구현으로 나뉨, 다만 보도자료는 대화가 전량 자율인지 원격조작이 섞이는지를 명시하지 않아 자율 수준은 확인되지 않으며(O03) 검증 항목도 수요·수용성·실운용 과제로만 적혀 성공 판정 기준이 없음", "src": "오사카메트로 · KDDI · AVITA 공동 보도자료 8.28 · 로봇신문 9.1", "pd": "2026-08-28", "url": "https://newsroom.kddi.com/news/detail/kddi_nr-1132_4683.html", "url2": "https://newsroom.kddi.com/news/detail/kddi_nr-1132_4683.html", "url4": "https://www.irobotnews.com/news/articleView.html?idxno=48232"}, {"sec": 4, "t": "中 갤봇, 홍콩 세 곳에 로봇 무인편의점 개설", "k": "주문받고 음료까지 만들지만 자율 수준은 공개되지 않았다.", "ez": "중국 로봇기업 갤봇이 홍콩 세 곳에 사람이 없는 편의점을 열고 바퀴로 움직이는 사람 모양 로봇을 세웠다. 로봇은 주문을 받고 물건을 건네며 음료를 만드는 일까지 맡는다. 로봇 안에는 회사가 만든 대형 인공지능 모델이 들어가 있다. 다만 매장마다 몇 대를 두었는지, 로봇이 어디까지 스스로 판단하고 어디부터 사람이 개입하는지는 공개되지 않았다. 회사는 12~18개월 안에 수지가 맞을 것으로 본다고 밝혔는데, 이는 회사 쪽 전망이다.", "body": "훙함·카이탁·완차이 3개 지점에 자체 로봇 파운데이션 모델 '아스트라브레인'을 실은 바퀴형 휴머노이드를 두고 주문 접수·상품 전달·음료 제조를 맡긴다고 보도됐으며 투입 대수와 자율 수준은 공개되지 않았고 12~18개월 내 손익분기 도달은 회사 측 전망으로 전해짐", "src": "로봇신문 9.1", "pd": "2026-09-01", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48235"}, {"sec": 5, "t": "中 대형 완성차 10곳, 모두 로봇 산업에 진입", "k": "자동차를 만들던 설비와 공급망이 그대로 옮겨 붙고 있다.", "ez": "중국에서 한 해 100만 대 넘게 파는 큰 완성차 그룹 열 곳이 모두 로봇 산업에 발을 들인 것으로 집계됐다. 이들이 중국 자동차 시장의 83.9%를 차지한다. 들어간 방식은 갈린다. 체리와 광저우자동차는 자체 로봇 완제품을 내놓았고 비야디는 직접 개발하겠다고 공식화했다. 창안과 지리, 제일자동차는 전담 자회사나 조직을 꾸렸고, 상하이자동차와 둥펑, 베이징자동차, 창청은 로봇 기업에 투자하거나 손잡는 방식으로 참여한다. 이미 현장에 들어간 사례도 있다. 상하이자동차는 로봇 기업과 함께 만든 기체를 자사 배터리 양산라인에 넣었다. 자동차를 만들던 설비와 부품 공급망이 그대로 로봇 쪽으로 옮겨 붙고 있다는 뜻이다.", "body": "중국자동차공업협회(CAAM) 기준 연간 판매 100만 대 이상 상위 완성차 그룹 10곳이 모두 로봇 산업에 진입했고 이들 매출이 중국 자동차 시장의 83.9%를 차지한다고 보도됐으며, 체리와 광저우자동차(GAC)는 자체 휴머노이드 완제품을 공개했고 비야디(BYD)는 자체 개발을 공식화했으며 창안·지리·제일자동차(FAW)는 전담 자회사나 조직을 꾸렸고 상하이자동차(SAIC)·둥펑·베이징자동차(BAIC)·창청은 로봇 기업 투자와 제휴로 참여하는 것으로 정리됨, SAIC 는 애지봇과 공동 개발한 로봇을 자동차 배터리 양산라인에 투입했고 지리는 로보테라에 투자했으며 FAW 는 이족 휴머노이드와 산업용 중량물 운반 로봇, 관절 모듈을 자체 개발한 것으로 보도됨, 인용된 원 출처는 랩스딥리포트의 2분기 중국 로봇 산업 분석 보고서인데 이번 순회에서 그 보고서 원문을 확보하지 못해 재인용임을 밝혀 둠", "src": "전자신문 9.2 (랩스딥리포트 2분기 보고서 인용)", "pd": "2026-09-02", "url": "https://www.etnews.com/20260902000231"}, {"sec": 5, "t": "[논평] 中 로봇의 실제 성장은 휴머노이드가 아니다", "k": "산업용 신규 설치가 세계의 54%를 차지한 것이 실체라고 봤다.", "ez": "영국 경제지의 논평이 중국 로봇 산업에서 실제로 일어나는 변화는 사람 모양 로봇이 아니라 특정 작업에 맞춘 산업용·서비스 로봇에서 나오고 있다고 진단했다. 근거로 든 것은 규모다. 2024년 중국에 새로 놓인 산업용 로봇은 약 29만 5,000대로 전 세계 신규 설치의 54%다. 2년 전에 이미 200만 대 넘게 돌리고 있어 2위인 일본의 약 4.5배다. 중국 정부 자료로는 지난해 로봇 산업 매출이 3,000억 위안(약 440억 달러)을 넘었다. 상장과 로봇 운동경기, 대형 전시회가 관심을 끌었지만 그것이 산업의 실체는 아니라는 것이 논지다. 논평이므로 필자의 판단이 섞여 있다.", "body": "「China's real robot revolution is not about humanoids」 오피니언으로 유니트리 상장과 세계로봇대회(WRC 2026)·휴머노이드 운동경기가 관심을 끌었지만 실제 변화는 목적형 로봇에서 일어나고 있다고 진단한 것으로 보도됨, 근거로 제시된 수치는 국제로봇연맹(IFR) 기준 2024년 중국 내 산업용 로봇 신규 설치 약 29만 5,000대로 전 세계 신규 설치의 54%이고 중국은 2년 전 이미 200만 대 넘는 산업용 로봇을 가동해 2위 일본의 약 4.5배이며 中 공업정보화부 자료로 지난해 로봇 산업 매출이 3,000억 위안(약 440억 달러)을 넘고 최근 5년 연평균 성장률이 20%를 웃돌았고 2025년 산업용 로봇 수출이 전년 대비 49% 늘어 중국이 처음으로 산업용 로봇 순수출국으로 전환했다는 것, 적용 사례로는 BYD 시안 공장의 로봇팔 수천 대와 상하이 양산항 자동화 터미널, 광둥성이 승인한 48개 「로봇+」 적용 시나리오가 꼽혔고 그럼에도 글로벌 자금이 휴머노이드로 가는 이유로는 인간 기준으로 설계된 환경에 그대로 쓸 수 있다는 환경 적합성과 물리세계를 이해하는 AI 모델의 발전 두 가지를 들었다고 함, 원문은 FT 유료 지면이라 확보하지 못하고 국내 보도를 출처로 적었으므로 인용 수치는 재확인 전까지 단정하지 않음", "src": "FT 오피니언(유료) · 로봇신문 9.2", "pd": "2026-09-02", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48258", "url2": "https://www.irobotnews.com/news/articleView.html?idxno=48258"}, {"sec": 7, "t": "[리포트] 2027년 로봇 예산, 정부가 첫 고객이 된다", "k": "지원이 연구개발에서 사서 쓰고 실증하는 쪽으로 옮겨 갔다.", "ez": "증권사가 2027년 정부 예산안을 분석해 로봇 지원의 무게중심이 옮겨 갔다고 진단했다. 연구개발을 대주던 방식에서 정부가 직접 사서 쓰고 현장에서 검증하는 쪽으로 넘어갔다는 것이다. 산업통상부 쪽을 보면 지능형 로봇 보급·확산이 807억 원으로 전년 567억 원보다 42.3% 늘었다. 자율제조 사업 1,193억 원 안에는 국산 휴머노이드 200대를 제조 현장에 넣는 공공 주도 실증 300억 원이 들어 있다. 여기서 헷갈리기 쉬운 대목이 있다. 이와 별개로 국산 휴머노이드 공공보급 300억 원이 새로 잡혀 있는데, 이쪽은 공과대학과 출연연구기관에 연구용 200대를 보급하는 돈이다. 같은 300억 원·200대가 제조 현장 실증과 연구용 보급이라는 서로 다른 항목에 나온다.", "body": "「2027년 로봇 예산, 정부가 첫 번째 고객이 된다」 보고서가 산업통상부·과기정통부가 공개한 2027년 예산안을 분석한 결과로 보도됨, 산업부 쪽은 지능형 로봇 보급·확산 807억 원(전년 567억 원 대비 240억 원·42.3% 증가)과 M.AX 자율제조 1,193억 원이며 후자에 국산 휴머노이드 200대를 제조 현장에 투입하는 공공주도 실증 300억 원이 포함되고, 이와 별개로 국산 휴머노이드 공공보급 300억 원(신규)은 공과대학·출연연에 연구용 휴머노이드 200대를 보급하는 데 쓰이는 것으로 제시돼 같은 300억 원·200대가 제조 현장 실증과 연구용 보급이라는 서로 다른 항목으로 두 번 나오므로 합산하면 안 되며, 그 밖에 K-로봇산업생태계 고도화 R&D 370억 원(신규)·국가 제조데이터 라이브러리 450억 원(신규, 10대 업종 50개 공정데이터셋)·국가로봇테스트필드 134억 원이 편성된 것으로 보도됨, 과기정통부 쪽은 전부 2027년 신규로 피지컬 AI 트레이닝센터 400억 원·핵심기술개발 R&D 550억 원(월드모델·범용 로봇 파운데이션 모델·개방형 휴머노이드 플랫폼·저전력 저지연)·우정사업본부 연계 물류 실증 260억 원·NEXT 휴머노이드 챌린지 선도기술개발 175억 원·AI휴머노이드 원천기술개발 77억 원으로 제시됨, 다만 이는 부처 발표가 아니라 증권사 보고서의 읽기이고 보고서 원문을 확보하지 못해 항목별 확정 여부와 국회 심의 전 수치라는 점을 함께 봐야 하며 워치리스트에 적어 둔 휴머노이드 6,000억·피지컬AI 3.1조·국산 AI로봇 2,000여 대(O07)와 층위가 맞는지도 확인되지 않음", "src": "유진투자증권 보고서 9.2 · 로봇신문 9.2", "pd": "2026-09-02", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48255", "url2": "https://www.irobotnews.com/news/articleView.html?idxno=48255"}, {"sec": 7, "t": "NC AI, LG전자와 휴머노이드 동작이식 기술 개발", "k": "사람 동작을 로봇 몸에 맞게 옮기는 자료를 게임 기술로 만든다.", "ez": "게임사 계열 인공지능 기업 NC AI가 LG전자와 컨소시엄을 꾸려 국산 반도체를 쓰는 휴머노이드 개발 사업에 참여한다고 9월 3일 밝혔다. 맡은 몫은 사람의 동작을 로봇에 옮겨 심는 일이다. 사람과 로봇은 관절이 움직이는 범위도, 팔다리 비율도, 균형을 잡는 조건도 다르다. 그래서 사람 동작을 그대로 복사하면 로봇은 넘어진다. 이 차이를 계산에 넣어 실제 환경에서 안정적으로 움직이게 바꿔 주는 것이 이 기술이다. 회사가 그동안 쌓은 동작 자료와 애니메이션 제작 역량을 로봇 학습용 자료로 바꿔 쓰고, 실제와 똑같이 만든 가상 환경에서 학습용 동작 자료를 대량으로 만들어 낸다.", "body": "9월 3일 회사가 밝힌 것으로 세 매체가 함께 보도했고 국산 온디바이스 AI반도체를 활용해 복잡한 일상 공간에서 인간 수준의 작업을 수행하는 자율형 휴머노이드 기술을 개발하는 사업이며, NC AI 가 맡는 몫은 사람의 동작을 로봇에 이식하는 「휴먼-로봇 리타게팅」 파이프라인 구축으로 휴머노이드의 관절 한계·신체 비율·균형 조건 같은 물리적 변수를 반영해 실제 환경에서 안정적으로 움직이도록 제어하는 기술이고 그동안 축적한 모션 데이터와 애니메이션 제작 역량으로 인간의 작업 동작을 휴머노이드 학습용 데이터로 바꾸며 디지털 트윈 환경에서 대량의 학습용 모션 데이터셋도 구축한다고 밝힘, 다만 총 사업비와 컨소시엄 내 역할 분담 비율·개발 기간·목표 성능 지표는 보도에 없고 산업통상부·KEIT 공고 원문을 이번 순회에서 확보하지 못해 확인되지 않음", "src": "디지털데일리 · 조선비즈 · 파이낸셜뉴스 9.3", "pd": "2026-09-03", "url": "https://www.ddaily.co.kr/page/view/2026090311425866057", "url2": "https://biz.chosun.com/it-science/ict/2026/09/03/ESE7WP3YGVC2NN7L3GFL54SAEQ/"}, {"sec": 7, "t": "하이젠알앤엠, 고중량 작업용 휴머노이드 과제 주관", "k": "41개월간 81억 원을 들여 거제 조선소에서 검증한다.", "ez": "하이젠알앤엠이 무거운 것을 다루는 작업용 휴머노이드를 개발하는 국가 과제의 주관기관으로 뽑혔다. 2026년 8월부터 2029년 12월까지 41개월간이고 규모는 81억 원이다. 목표 기체는 키 170센티미터에 40킬로그램 이상을 들 수 있어야 한다. 관절을 움직이는 구동 모듈 네 종류도 함께 개발한다. 검증 장소가 눈에 띈다. 시연장이 아니라 삼성중공업 거제조선소다. 한국로봇융합연구원과 삼성중공업 연구조직, 로봇기업 한 곳이 함께 참여한다. 다만 81억 원이 전체 사업비인지 정부가 부담하는 몫인지는 보도에 구분돼 있지 않다.", "body": "2026년 8월부터 2029년 12월까지 41개월간 81억 원 규모로 높이 170cm·가반하중 40kg 이상 기체와 QDD 구동모듈 4종을 개발해 삼성중공업 거제조선소에서 실증한다고 밝혔고 한국로봇융합연구원·삼성중공업 RX센터·오픈패스로보틱스가 참여하며 81억 원이 총사업비인지 정부지원분인지는 보도에 구분되어 있지 않음", "src": "로봇신문 9.1", "pd": "2026-09-01", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48222"}, {"sec": 7, "t": "전북대, 로봇 분야 특성화대학원에 선정", "k": "비수도권 22곳이 신청해 이 분야에서는 두 곳이 뽑혔다.", "ez": "전북대가 산업통상부의 첨단산업 특성화대학원 지원사업에서 로봇 분야에 뽑혔다. 공모에는 수도권 밖 대학원 22곳이 신청해 네 개 첨단산업 분야에서 여섯 곳이 선정됐고, 로봇 분야에서는 전북대와 경북대가 이름을 올렸다. 일반대학원 차세대로봇융합학과를 중심으로 운영하며 교육과정은 세 갈래다. 로봇이 주변을 인식하고 기기 안에서 인공지능을 돌리는 쪽, 로봇을 제어하고 시스템을 통합하는 쪽, 그리고 농업·생명 분야의 현장 로봇을 다루는 쪽이다. 로봇팔과 양팔 이동로봇, 사람 모양·네발 로봇, 촉각 집게, 고성능 연산장비 같은 실습 설비를 단계적으로 갖춘다. 전자공학부와 생물산업기계공학과 교수 13명이 참여한다.", "body": "산업통상부가 8월 31일 전북대 로봇특성화대학원을 국가첨단전략산업 특성화대학원으로 지정·고시한 데 따른 것으로 보도됐고 공모에는 비수도권 대학원 22곳이 신청해 4개 첨단산업 분야에서 6개 대학원이 선정됐으며 로봇 분야에는 전북대와 경북대가 이름을 올림, 일반대학원 차세대로봇융합학과를 중심으로 운영되며 교육과정은 로봇인지 및 엣지 AI·로봇제어 및 시스템통합·지능형 농생명 및 필드로봇 세 트랙이고 로봇팔·이동형 양팔로봇·휴머노이드 및 사족보행 로봇·촉각 그리퍼·고성능 AI 연산장비 등 실험실습 인프라를 단계적으로 구축하며 전자공학부와 생물산업기계공학과 교수 13명이 참여해 2026년 입학생부터 매년 45명을 뽑아 사업 기간 석·박사 120명 배출을 목표로 함, 다만 이 건은 부처 지정·고시가 발단이므로 게재 근거는 수행기관인 전북대의 이행 계획이며 전북대 자체 보도자료 원문은 확보하지 못해 보도를 출처로 적음", "src": "전북대 발표 · 로봇신문 9.2", "pd": "2026-09-02", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48265", "url2": "https://www.irobotnews.com/news/articleView.html?idxno=48265"}, {"sec": 8, "t": "中 베이징대, 학습에 없던 로봇 몸체로 옮길 때를 분석", "k": "몸이 바뀌면 성능이 어떻게 무너지는지 단계별로 갈라 봤다.", "ez": "중국 베이징대 연구팀이, 학습할 때 써 보지 않은 로봇 몸체에 인공지능을 그대로 옮겼을 때 얼마나 통하는지를 따진 논문을 냈다. 이것이 문제가 되는 이유는 이렇다. 로봇 하드웨어는 계속 바뀌는데 새 몸체마다 자료를 다시 모아 학습시키려면 비용이 크다. 그래서 추가 학습 없이 옮겨 쓸 수 있는지가 중요한데, 이를 체계적으로 살핀 연구가 드물었다. 연구팀은 몸체의 변화를 단계별로 나눠 비교했다. 겉모습만 바뀐 경우와 물건을 쥐는 집게가 바뀐 경우를 갈라 놓고, 모델마다 6,300번씩 돌려 성능이 어디서 무너지는지를 봤다. 동료심사를 거치지 않은 논문이다.", "body": "9월 2일 arXiv 프리프린트로 PDF 를 열어 제1기관이 베이징대임을 확인했고, 문제 설정은 로봇 하드웨어가 계속 바뀌고 과제별 데이터 수집 비용이 큰 상황에서 학습에 없던 몸체로의 무학습 일반화가 중요한데 이를 체계적으로 이해한 연구가 드물다는 것이며, 외형만 바뀐 경우와 그리퍼가 바뀐 경우 등 몸체 변화를 단계별로 나눠 통제 비교함, 실험 조건은 시뮬레이션 비교마다 모델당 6,300 롤아웃으로 평가하고 이를 보완하는 실험을 덧붙여 인용 요건을 본문에서 충족함, 다만 동료심사 전이라 등급은 S3 상한임", "src": "베이징대 등 arXiv 9.2 (미동료심사)", "pd": "2026-09-02", "url": "https://arxiv.org/abs/2609.02546"}, {"sec": 8, "t": "한양대 연구팀, 사람 동작을 로봇으로 옮기는 기법 제시", "k": "체형과 관절 범위가 달라 생기는 어긋남을 한꺼번에 푼다.", "ez": "한양대 연구팀이 사람의 움직임을 사람 모양 로봇의 동작으로 바꿔 주는 기법을 냈다. 휴머노이드를 학습시키려면 방대한 사람 동작 자료가 필요한데, 그 자료를 로봇이 따라 할 수 있는 궤적으로 바꾸는 일이 만만치 않다. 사람과 로봇은 몸의 비율도, 관절 수도, 관절이 꺾이는 범위도 크게 다르기 때문이다. 연구팀은 몸 표면을 점의 모음으로 보고 사람의 어느 점이 로봇의 어느 점에 대응하는지를 학습시켜 이 문제를 한꺼번에 풀었다. 표준 동작 자료집에서 항목마다 4,096번씩 계산해 검증했고 실제 로봇에 올린 결과도 함께 실었다. 동료심사를 거치지 않은 논문이다.", "body": "9월 2일 arXiv 프리프린트로 PDF 를 열어 제1기관이 한양대임을 확인했고, 문제 설정은 휴머노이드 학습이 방대한 사람 동작 데이터를 로봇 기준 궤적으로 바꾸는 데 의존하는데 체형·자유도·관절 가동범위가 크게 달라 리타게팅이 어렵다는 것이며 점군 대응을 학습해 이를 통합적으로 푸는 방식을 제안함, 실험 조건은 LAFAN1 데이터셋에서 각 항목을 4,096 시행으로 계산했고 정책이 동작을 끝까지 따라가면 성공으로 세었으며 실기 배치 결과도 함께 제시해 인용 요건을 본문에서 충족함, 다만 동료심사 전이라 등급은 S3 상한이고 저널 게재는 확인되지 않음", "src": "한양대 arXiv 9.2 (미동료심사)", "pd": "2026-09-02", "url": "https://arxiv.org/abs/2609.02134"}, {"sec": 8, "t": "中 베이징우전대, 디딤돌·계단 보행 정책 실기 검증", "k": "한 번 잘못 디디면 회복이 어려운 지형을 겨냥했다.", "ez": "중국 베이징우전대 연구팀이 발 디딜 곳이 드문드문 끊긴 지형에서도 사람 모양 로봇이 걷게 하는 방법을 내고 실제 기체에 올려 확인했다. 겨냥한 문제는 분명하다. 디딤돌이나 좁은 계단, 벌어진 틈처럼 발 놓을 자리가 제한된 곳에서는 한 번 잘못 디디면 다시 균형을 잡을 여지가 거의 없다. 평지에서 잘 걷는 방법이 여기서는 통하지 않는다. 연구팀은 로봇이 앞으로 벌어질 일을 머릿속에 그려 보게 하는 모델을 보행 정책에 덧붙였다. 깊이를 재는 카메라 하나만 쓰고, 방법과 지형·난이도 조합마다 최소 50번씩 돌려 평균 93.3%의 성공률을 보고했다. 동료심사를 거치지 않은 논문이다.", "body": "9월 2일 arXiv 에 올라온 프리프린트로 PDF 를 열어 제1기관이 베이징우전대(Beijing University of Posts and Telecommunications)임을 확인했고, 발판이 드문드문 끊기거나 기하학적으로 제한된 지형 — 디딤돌·틈·좁은 계단면 — 에서는 한 번 잘못 디디면 회복할 여지가 거의 없다는 문제 설정 아래 월드모델을 덧붙인 시각보행 정책 WM-LOCO 를 제시함, 실험 조건은 실기 배치로 유니트리 G1 휴머노이드에 올렸고 단일 깊이 스트림만 쓰며 방법·지형·난이도 조합마다 최소 50 에피소드를 수집해 평균 성공률 93.3% 를 보고했으므로 이 지면의 인용 요건(실기·시뮬 구분, 시행 횟수, 데이터 규모)을 본문에서 충족함, 다만 동료심사 전 프리프린트여서 등급은 S3 상한이고 저널 게재는 확인되지 않음", "src": "베이징우전대 등 arXiv 9.2 (미동료심사)", "pd": "2026-09-02", "url": "https://arxiv.org/abs/2609.02542"}, {"sec": 8, "t": "中 우한대, 발 접촉을 신뢰도로 다루는 위치추정 제안", "k": "닿았다·안 닿았다로 나누던 판정을 정도의 문제로 바꿨다.", "ez": "중국 우한대 연구팀이 사람 모양 로봇이 자기 위치를 스스로 가늠하는 방법을 개선한 논문을 냈다. 로봇은 발이 땅에 닿았는지를 기준으로 자기가 얼마나 움직였는지를 계산한다. 기존 방식은 이를 닿았다·안 닿았다 둘로만 나눠, 그 판정에 맞춰 발의 측정값을 쓸지 말지를 정했다. 문제는 빠르게 걸을 때다. 애매하게 닿은 순간이 잦아 판정이 틀리면 오차가 쌓인다. 연구팀은 이를 둘로 가르는 대신 '얼마나 믿을 만한가'라는 정도로 다루게 했다. 스무 번에 걸친 모의 보행에서 오차와 누적 편차를 함께 보고했다. 다만 제시된 것은 모의실험 비교이고 실제 로봇 결과의 범위는 더 확인이 필요하다. 동료심사를 거치지 않은 논문이다.", "body": "9월 2일 arXiv 프리프린트로 PDF 를 열어 제1기관이 우한대임을 확인했고, 기존 접촉 기반 추정기가 발 전체의 순기구학 측정을 쓸지 말지를 이진으로 결정하는 데 견줘 발 관측 신뢰도를 도입해 동적 보행에서 생기는 오차를 줄이는 방식을 제안함, 실험 조건은 20 에피소드에 걸친 시뮬레이션 보행 비교표를 제시하고 오차를 미터 단위로 보고했으며 표류율도 함께 실어 인용 요건을 본문에서 충족함, 다만 표에 제시된 것은 시뮬레이션 비교이고 실기 결과의 범위는 본문에서 더 확인이 필요하며 동료심사 전이라 등급은 S3 상한임", "src": "우한대 arXiv 9.2 (미동료심사)", "pd": "2026-09-02", "url": "https://arxiv.org/abs/2609.02222"}]}];

(function (A) {

  /* 공유용은 두 탭뿐이다 — 오늘 호와 아카이브. 링크 이동 없이 한 파일에서 전환한다. */
  var TABS = [

  /* bundle.py 가 배포본을 구울 때 이 자리에 발행일을 박는다. 주소창에 ?d= 를 붙일 수
     없는 파일 한 장짜리 판을 위한 것이다 — 비어 있으면 가장 최근 호가 선다. */

  var BYKEY = {};

    }).join('') + '</nav>';

    h += '<div class="pane" id="p-now"></div>';
    h += '<div class="pane" id="p-arch" hidden></div>';
    /* 기사 상세. 목록과 같은 파일 안에서 갈아 끼운다 — 배포본이 파일 한 장이라
       따로 만든 면으로 보내면 더블클릭으로 받은 사람에게는 링크가 깨진다. */
    h += '<div class="pane" id="p-detail" hidden></div>';
    root.innerHTML = h;

    A.$$('nav.tabs button', root).forEach(function (b) {
      b.addEventListener('click', function () {
        A.$$('nav.tabs button', root).forEach(function (o) { o.removeAttribute('aria-current'); });
        b.setAttribute('aria-current', 'page');
        curTab = b.dataset.tab;
        A.$('#p-now').hidden = curTab !== 'now';
        A.$('#p-arch').hidden = curTab !== 'arch';
      });
    });

    renderNow(A.$('#p-now'));
    renderArch(A.$('#p-arch'));

    A.installDetail({
      mount: A.$('#p-detail'),
      panes: [{ el: A.$('#p-now'),  on: function () { return curTab === 'now'; } },
              { el: A.$('#p-arch'), on: function () { return curTab === 'arch'; } }],
      chrome: [A.$('nav.tabs', root)],
      lookup: function (k) { return BYKEY[k] || null; }
    });
  });

  /* ── 탭 1. 뉴스레터 — 오늘 호를 섹션별로.
     호 이동은 주소 질의문(?d=)이 아니라 화면 안 상태로 한다. 파일 하나로 배포했을 때
     file:// + 질의문이 뷰어에 따라 안 열리는 일이 있어서다. */
  var pick = null;
  function renderNow(root) {
    var d = pick || A.qs('d') || PIN;
    var i = d ? Math.max(0, eds.map(function (e) { return e.date; }).indexOf(d)) : 0;
    var ed = eds[i], prev = eds[i + 1], next = eds[i - 1];

    var h = '<div class="toolbar">'
      + '<span class="count"><b>' + A.fmtDate(ed.date) + '</b> 조간</span>'
      + (next ? '<button class="act ghost" type="button" data-go="' + A.esc(next.date) + '">← 다음 호</button>' : '')
      + (prev ? '<button class="act ghost" type="button" data-go="' + A.esc(prev.date) + '">이전 호 →</button>' : '')
      + (ed.text ? '<button class="act" id="copyBtn" type="button">전문 복사</button>' : '')
      + '<span class="src" id="copyMsg"></span></div>';

    /* 머리에는 날짜와 호 이동만 둔다 — 항목 건수도, 그날 요약도 두지 않는다
       (2026-09-03 재지시). 한 줄로 함축하려면 그날의 축을 우리가 정해야 하고,
       그것이 곧 해석이다. 지면은 사실만 세우고 판단은 내부 화면이 진다. */

    /* 제목을 누르면 상세가 선다 (2026-09-09 지시) — AI 상세요약과 하단 원문 링크.
       keyOf 를 주지 않으면 제목이 눌리지 않는다. 상세면을 설치한 화면에서만 준다. */
    h += A.sectionsHTML(ed.items, '', {
      keyOf: function (x, i) { return A.itemKey(ed.date, i); }
    });   // 없는 섹션은 내보내지 않는다

    /* picked.world 집계와 수집 창은 우리 작업 기록이다. 공유용에는 싣지 않는다.
       둘 다 내부 후보풀 화면이 패널로 계속 보여 준다.
       (이 파일에는 내부 경로를 문자열로도 적지 않는다 — check.py 가 잡는다) */

    /* 카톡 전문은 사내 원본에서만 보인다. 배포본(bundle.py)은 이 텍스트를
       아예 담지 않으므로 칸도 만들지 않는다. */
    if (ed.text) {
      h += '<details class="raw"><summary>발송 전문 보기</summary>'
        + '<pre id="rawText">' + A.esc(ed.text) + '</pre></details>';
    }

    root.innerHTML = h;
    A.$$('button[data-go]', root).forEach(function (g) {
      g.addEventListener('click', function () { pick = g.dataset.go; renderNow(root); });
    });
    var b = document.getElementById('copyBtn');
    if (b) b.addEventListener('click', function () {
      A.copy(document.getElementById('rawText'), document.getElementById('copyMsg'));
    });
  }

  /* ── 탭 2. 아카이브 — 전체 항목을 검색 */
  function renderArch(root) {
    var items = [];
    eds.forEach(function (e) {
      (e.items || []).forEach(function (x, i) {
        items.push({ date: e.date, sec: x.sec, t: x.t, k: x.k || '', body: x.body || '',
                     src: x.src || '', pd: x.pd || '', url: x.url || '',
                     url2: x.url2 || '', url3: x.url3 || '', url4: x.url4 || '',
                     key: A.itemKey(e.date, i) });
      });
    });

    var h = '<div class="filters">'
      + '<input type="search" id="q" placeholder="검색어" size="22">'
      + '<select id="sec"><option value="0">전체 섹션</option>'
      + A.SECTIONS.map(function (s, i) {
          return '<option value="' + (i + 1) + '">' + A.esc(s) + '</option>';
        }).join('') + '</select>'
      + '<input type="text" id="from" placeholder="부터 YYYY-MM-DD" size="14">'
      + '<input type="text" id="to" placeholder="까지 YYYY-MM-DD" size="14">'
      + '</div>'
      + '<p class="dek">발행 ' + eds.length + '호 · 항목 <b id="cnt">' + items.length + '</b>건</p>'
      + '<div id="list"></div>';
    root.innerHTML = h;

    ['q', 'sec', 'from', 'to'].forEach(function (id) {
      var el = document.getElementById(id);
      el.addEventListener(id === 'sec' ? 'change' : 'input', draw);
    });
    draw();

    function draw() {
      var q = document.getElementById('q').value.trim();
      var sec = +document.getElementById('sec').value;
      var f = document.getElementById('from').value.trim();
      var t2 = document.getElementById('to').value.trim();
      var lq = q.toLowerCase();
      var out = items.filter(function (x) {
        if (sec && x.sec !== sec) return false;
        if (f && x.date < f) return false;
        if (t2 && x.date > t2) return false;
        if (lq && (x.t + ' ' + x.k + ' ' + x.body + ' ' + x.src).toLowerCase().indexOf(lq) < 0) return false;
        return true;
      });
      out.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : a.sec - b.sec; });
      document.getElementById('cnt').textContent = out.length;

      if (!out.length) {
        document.getElementById('list').innerHTML =
          '<div class="note"><span class="lbl">결과 없음</span>검색어를 줄이거나 기간을 넓혀 보세요.</div>';
        return;
      }
      var cur = -1, h2 = '';
      out.forEach(function (x) {
        if (x.sec !== cur) {
          if (cur !== -1) h2 += '</div>';
          cur = x.sec;
          h2 += '<div class="secblk" data-sec="' + x.sec + '"><h3>'
            + A.esc(A.SECTIONS[x.sec - 1] || '') + '</h3>';
        }
        h2 += A.factHTML(x, q, { key: x.key });
      });
      document.getElementById('list').innerHTML = h2 + '</div>';
    }
  }
})(window.HMD);
</script>
</body>
</html>
