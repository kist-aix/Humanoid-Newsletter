"}, {"sec": 7, "t": "KAIST 로봇인공지능연구실, 휴머노이드 로봇팔 라이팔 공개", "k": "한 팔로 20kg 을 들고 최고 속도는 초속 20.6m 로 제시됐다", "ez": "로봇팔에는 오래된 딜레마가 있음. 출력을 높이려면 모터와 감속기를 대형화해야 하는데 그러면 팔이 무거워져 속도가 낮아지고, 고속화를 위해 경량화하면 고하중을 인양하지 못함. KAIST 황보제민 교수 연구실이 공개한 로봇팔 라이팔은 사람 팔의 구조를 차용했음. 사람도 윗팔은 출력에, 아래팔은 고속으로 구동하는 쪽에 맞춰져 있음. 연구팀은 성격이 다른 두 종류의 구동 장치를 분리 배치해 윗팔은 힘을, 아래팔은 가속을 담당하게 했음. 공개된 수치는 한 팔로 20kg 을 인양한다는 것과 최고 속도가 초속 20.6m 라는 것이고, 후자는 사람 평균의 1.3배 수준임. 다만 이 공개는 논문이나 사양표가 아니라 연구실이 공개한 영상으로 이뤄졌음. 어느 자세에서 20kg 을 인양했는지, 속도를 어느 지점에서 측정했는지, 두 값을 동시에 구현할 수 있는지는 밝혀지지 않았음.", "body": "KAIST 기계공학과 황보제민 교수가 이끄는 로봇인공지능연구실(RaiLab)이 휴머노이드 로봇팔 「라이팔(RAIPAL)」 을 공개한 것으로 9월 16일 보도됨, 연구실이 「RAIPAL: A Powerful and Agile Humanoid Arm for Human Tasks」 라는 제목의 영상을 올리는 방식으로 공개한 것으로 전해짐, 로봇팔은 힘을 키우면 무거워져 느려지고 가볍게 하면 힘이 약해지는 상충을 다루는데, 연구팀은 사람 팔의 원리를 적용해 상완은 근력과 토크 발생에, 전완은 고속 가속에 맞춘 두 가지 모듈형 구동기를 결합했다고 설명한 것으로 전해짐, 제시된 수치는 한 팔로 20kg 을 들어 올리는 하중 능력과 초속 20.6m 의 최고 속도이며 후자는 사람 평균의 약 130% 수준으로 적혔음, 다만 20kg 하중이 어느 자세·어느 팔 길이에서 측정된 값인지, 초속 20.6m 가 손끝 기준인지 관절 기준인지, 두 값을 동시에 낼 수 있는지가 밝혀지지 않았고 자유도·중량·연속 가동시간·시행 횟수도 공개되지 않아 성능 근거로 쓰지 않음, KAIST 뉴스센터와 연구실 공식 사이트의 로봇·프로젝트 목록을 직접 열었으나 라이팔 항목이 없어 사양표를 확인하지 못했고 등급을 S3 으로 둠, 공개 경로가 영상이므로 편집·배속 여부도 확인되지 않았음, 이 건은 오늘 지면의 균형 축에 해당함 — 「20kg 을 들면서 사람보다 빠르다」 는 서술이 영상 한 편에만 근거하고 사양표·논문·제3자 시험이 모두 없으므로 공개된 수치를 성능으로 읽지 않을 자리임", "src": "로봇신문 9.16", "pd": "2026-09-16", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48531"}, {"sec": 7, "t": "한국로봇융합연구원, 제2회 휴머노이드 오픈랩 투어 개최 결과 공개", "k": "청년 창업가 등 약 30명이 로봇관에서 AI 로봇 M.AX 플랫폼을 참관했다", "ez": "한국로봇융합연구원이 연구원의 로봇 설비를 외부에 개방하는 행사를 두 번째로 개최했다고 9월 16일 공지했음. 행사는 8월 27일 연구원 로봇관에서 개최됐고 청년 창업가를 중심으로 약 30명이 참가했음. 연구원의 로봇 연구실과 AI·소프트웨어 연구실이 함께 준비했고, 참가자들은 연구원이 개발한 AI 로봇 M.AX 플랫폼과 그에 부속된 기술을 직접 참관했음. 출연연이 보유한 고가의 로봇 장비는 개별 창업 기업이 자체 확보하기 어려우므로, 이러한 자리는 장비를 임차하거나 공동연구로 이어지는 통로가 됨. 다만 이번 공지에는 어떤 설비를 공개했는지, 참가한 기업이 어떤 분야였는지, 행사 뒤 실제로 장비를 활용하거나 공동연구로 이어지는 절차가 마련돼 있는지가 기재되지 않았음. 다음 회차의 일정과 신청 방법도 공개되지 않았음.", "body": "한국로봇융합연구원(KIRO)이 제2회 휴머노이드 오픈랩 투어를 열었다고 9월 16일 공지했음, 행사는 8월 27일 연구원 로봇관에서 열렸고 청년 창업가 등 약 30명이 참가한 것으로 적혔음, 연구원의 로봇·AI·소프트웨어 연구실이 함께 주관했고 참가자들이 AI 로봇 M.AX 플랫폼과 관련 기술을 살펴본 것으로 밝혀짐, 다만 공개한 설비와 기체의 목록, 참가 기업의 구성, 후속 협력이나 장비 활용으로 이어지는 절차, 다음 회차의 일정과 신청 방법은 공지에 담기지 않았음, 행사일이 8월 27일이고 공지가 9월 16일이므로 결과 공지에 해당하며 개최 예고가 아님을 밝혀 적음", "src": "한국로봇융합연구원 공지 9.16", "pd": "2026-09-16", "url": "https://www.kiro.re.kr/enjoy/news.asp?page=1&bidx=5725&SFIELD=&GTXT=&gbn=R05&bcat=&bgbn=R"}, {"sec": 8, "t": "UNIST, 위치 추적과 오차 보정을 나눈 공간인식 모델 발표", "k": "거리 추정 오차를 최대 45.9% 축소하고 처리 시간은 0.197초로 단축됐다", "ez": "로봇이나 자율주행차는 카메라로 관측한 장면만으로 「현재 자기 위치와 주변이 어떤 구조인가」 를 동시에 파악해야 함. 이를 슬램이라 함. 문제는 정확도와 속도가 상충한다는 점임. 두 장면만 비교하면 계산이 빠르지만 오차가 누적되어 결국 실제와 다른 위치로 추정하게 됨. 반대로 여러 장면을 동시에 비교하면 정확해지지만 연산 시간이 길어 이동 중인 로봇에는 적용하기 어려움. UNIST 주경돈 교수팀은 둘 중 하나를 선택하는 대신 역할을 분담했음. 현재 위치를 추적하는 일에는 두 장면 비교를 적용하고, 누적된 오차를 보정하는 일에만 여러 장면 분석을 적용함. 그 결과 거리 추정 오차가 기존 최고 기술보다 최대 45.9% 축소됐고, 한 번 처리에 걸리는 시간은 3.41초에서 0.197초로 단축됐음. 연구는 9월 초 스웨덴에서 열린 유럽 컴퓨터 비전 학술대회에서 발표됐음. 다만 성능을 측정한 대상은 실제 로봇이 아니라 TUM RGB-D 와 7-Scenes 라는 두 공개 데이터셋임. 실제 로봇에 탑재해 검증한 결과는 논문에 없음.", "body": "UNIST 인공지능대학원 주경돈 교수팀이 정확도와 속도를 함께 높인 슬램(SLAM) 모델 「유니심 슬램(UniSim-SLAM)」 을 개발했다고 9월 16일 밝힌 것으로 보도됨, 슬램은 카메라를 실은 로봇이나 차량이 자기 위치와 주변 환경을 동시에 파악하는 기술이고, 최근에는 AI 가 영상만 보고 카메라의 움직임과 공간을 추정하는 방식이 쓰이고 있음, 이 방식은 어느 시점의 화면들을 함께 분석하느냐에 따라 결과가 달라져 같은 장소의 크기와 위치가 조금씩 다르게 계산되고, 그 차이가 긴 이동에서 쌓이면 추정 위치가 실제 경로에서 벗어나는 드리프트가 생김, 종전에는 두 시점만 비교해 빠르게 계산하거나 여러 시점을 함께 분석해 정확하게 계산하는 쪽 가운데 하나를 택했는데 전자는 오차가 쌓이고 후자는 계산 시간이 길어졌음, 연구팀은 위치 추적에는 두 시점 비교를, 누적 오차 보정에는 여러 시점 분석을 적용해 두 일을 분담시켰다고 설명했음, 제시된 수치는 기존 최고 수준 기술 대비 거리 추정 오차 최대 45.9% 감소와, 기존 기술 VGGT-SLAM 의 3.41초에서 0.197초로 줄어든 처리 시간임, 논문 제목은 「UniSim-SLAM: Feed-Forward SLAM with Unified Sim(3) Optimization」 이고 저자는 이인하·정동재·이준희·주경돈이며 9월 8~12일 스웨덴 말뫼에서 열린 유럽 컴퓨터 비전 학술대회(ECCV) 2026 에서 발표됐음, 논문을 찾아 확인한 바로는 앞단이 두 시점 키프레임 추적을 가볍게 돌리고 뒷단이 주기적으로 여러 시점의 부분지도를 다듬는 구조이며, 좌표계와 배율이 제각각인 예측들을 하나로 묶기 위해 Sim(3) 위에 다층 요인그래프를 세워 전역 키프레임 자세와 부분지도 자세를 함께 최적화한다고 적혀 있음, 평가는 TUM RGB-D 와 7-Scenes 두 공개 데이터셋에서 이뤄졌고 실제 로봇에 실어 검증한 결과는 논문에 제시되지 않았으므로 실환경 성능으로 읽지 않음, 연구는 정보통신기획평가원(IITP) 지원과 UNIST 인공지능대학원 프로그램으로 수행된 것으로 적혔음, 시행 횟수의 분포는 초록에 담기지 않음, 논문은 ECCV 2026 에 채택된 것으로 적혀 있으나 우리가 열람한 판은 arXiv 사전공개본이고 동료심사를 거친 학회 게재본과 대조하지 못했으므로 미동료심사 판에 근거한 것으로 보아 등급을 S3 으로 둠", "src": "European Conference on Computer Vision · 로봇신문 9.16", "pd": "2026-09-16", "url": "https://arxiv.org/abs/2608.01706", "url2": "https://www.irobotnews.com/news/articleView.html?idxno=48532"}]}, {"date": "2026-09-16", "items": [{"sec": 2, "t": "日 아비타, 사람이 원격으로 개입하는 휴먼인더루프 피지컬 AI 서비스 개시", "k": "완전 자율을 기다리지 않고 현업에 투입한다는 설계를 전면에 세웠다", "ez": "일본 기업 아비타가 9월 15일 새 로봇 서비스를 시작했음. 로봇이 평소에는 AI 판단으로 스스로 일하다가, AI 가 감당하기 어려운 상황이 오면 멀리 떨어진 곳의 사람이 화면을 보며 대신 조작해 주는 방식임. 사람이 고리 안에 들어가 있다는 뜻에서 「휴먼인더루프」 라고 부름. 회사가 내세운 취지는 분명함. 로봇이 완전히 스스로 할 수 있게 될 때까지 기다리지 말고, 사람이 보조하면서 지금 바로 현장에 투입하자는 것임. 적용할 업무로는 물건 집기·포장·분류·재고 조사·자재 운반·손님 안내를 들었고, 공장과 물류창고, 소매점을 대상으로 삼았음. 다만 조작자 한 사람이 로봇 몇 대를 맡는지, 로봇이 스스로 수행하는 비율이 얼마인지는 밝히지 않았음. 어떤 회사의 어떤 기종에 적용하는지, 가격이 얼마인지도 공개되지 않았음.", "body": "일본 아비타(AVITA)가 9월 15일 AI 의 자율제어와 사람의 원격조작을 결합한 「휴먼인더루프(Human-in-the-Loop)형 피지컬 AI」 의 제공을 개시했다고 발표했음, 로봇이 AI 의 인식·판단·제어로 업무를 수행하다가 AI 만으로 대응하기 어려운 국면에서 원격지의 조작자가 조작이나 판단을 지원하는 구조임, 회사는 완전 자율을 기다리지 않고 로봇을 실제 업무에 투입할 수 있게 하는 것이 이 방식의 취지라고 밝힘, 적용 업무로 피킹·포장·키팅·분류·순환 재고조사·자재 반송·접객 안내를 들었고 대상 업종으로 공장·물류·소매점을 들었음, 앞으로는 조작자 한 사람이 여러 대로 이뤄진 「로봇 플릿」 을 지원·관리하는 운용을 목표로 한다고 적었으나 현재 한 사람이 몇 대를 감독하는지는 밝히지 않음, 적용 기종의 제조사와 모델명, 가격, 도입처, 자율 동작의 비율과 개입 빈도도 보도자료에 담기지 않음, 같은 회사는 CG 아바타 사업에서 축적한 원격 운용 경험을 로봇으로 확장한 것이라고 설명했음, 발표일은 아비타가 KDDI·오사카메트로와 함께 수행한 휴머노이드 역무원 실증의 종료일과 같은 날임", "src": "아비타 보도자료 9.15 · 로보스타 9.15", "pd": "2026-09-15", "url": "https://avita.co.jp/news/GEVWJovB", "url2": "https://robotstart.info/article/2026/09/15/382419.html"}, {"sec": 2, "t": "코윈로보틱스, 현장 데이터를 가상환경과 맞추는 로봇 시뮬레이션 기술 확보", "k": "해외 현장을 구축하기 전에 운영 흐름을 미리 검증하는 단계를 들여놨다", "ez": "로봇 기업 코윈로보틱스가 AI 기반 로봇 시뮬레이션 기술 개발을 마쳤다고 보도됐음. 시뮬레이션은 실제 공장이나 물류창고를 그대로 본뜬 가상 공간을 만들어, 로봇과 설비를 실제로 설치하기 전에 컴퓨터 안에서 먼저 작동시켜 보는 것을 말함. 이 회사 기술의 특징은 현장에서 나오는 데이터를 가상 공간과 계속 맞춰 준다는 점임. 그래야 가상에서 얻은 결과가 실제와 어긋나지 않음. 회사는 로봇 본체와 여러 설비를 한꺼번에 제어하는 시스템에 이어 시뮬레이션까지 직접 갖추게 됐다고 설명했음. 이미 미국에 납품하는 에너지저장장치 자동화 사업에 적용했다고 전해짐. 다만 이 기술로 실제로 기간이나 비용을 얼마나 줄였는지는 수치로 공개되지 않았음.", "body": "지능형 로봇 기업 코윈로보틱스가 AI 기반 로봇 시뮬레이션 기술 개발을 완료한 것으로 9월 15일 보도됨, 실제 생산·물류 현장의 데이터를 가상환경과 동기화해 로봇과 자동화 설비의 운영 흐름을 사전에 분석하고 검증하는 방식으로 전해짐, 회사는 로봇 하드웨어와 통합 제어시스템(RCS)에 이어 시뮬레이션까지 내재화해 전 계층 역량을 갖추게 됐다고 설명한 것으로 보도됨, 미국향 에너지저장장치 로봇 자동화 사업에 이미 적용됐고 해외 현장 구축의 시간과 비용을 줄이는 효과가 기대되는 것으로 전해짐, 동기화의 주기와 정밀도, 검증으로 줄인 기간이나 비용의 실측값은 보도에 담기지 않아 효과를 단정하지 않음, 회사 공식 발표 문서를 확인하지 못해 보도를 출처로 삼고 등급을 S3 으로 둠", "src": "로봇신문 9.15", "pd": "2026-09-15", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48499"}, {"sec": 3, "t": "애질리티 로보틱스, 사람 쪽으로 넘어지지 않게 설계한 디짓 5 공개", "k": "충전 9분에 90분 가동해 하루 가동시간이 20시간을 상회하는 사양으로 제시됐다", "ez": "애질리티 로보틱스가 9월 15일 새 휴머노이드 디짓 5를 공개했음. 22.7kg 까지 들어 2.2m 높이에 올릴 수 있고, 9분 충전하면 90분 일해 하루 20시간 넘게 가동함. 가장 크게 바뀐 곳은 다리와 안전 설계임. 종전에는 무릎이 타조처럼 뒤로 꺾였으나 이번에는 사람과 같은 방향으로 바꿨음. 안전 쪽은 360도로 주변 사람을 살피다가 가까이 오면 스스로 피하거나 멈추고, 필요하면 바닥에 앉아 버림. 사람 쪽으로 쓰러지는 일이 구조적으로 생기지 않게 만들었다는 설명임. 회사는 미국 산업안전보건청 기준으로 현장 평가를 마쳤고 국제 안전표준 논의에도 참여한다고 밝혔음. 다만 그 국제표준(ISO 25785-1)은 아직 위원회 초안 단계로 제정 전임. 초기 공급은 2027년 상반기, 일반 판매는 2027년 말로 제시됐음. 받아 둔 다년 주문은 3억 달러가 넘으나 2025년 실제 순매출은 180만 달러로 둘의 차이가 큼.", "body": "애질리티 로보틱스가 9월 15일 휴머노이드 디짓 5를 공개했음, 최대 가반하중 22.7kg(50파운드), 최대 도달높이 2.2m, 중량 129kg, 신장 1.81m 로 제시됨, 배터리는 90분 가동에 9분 충전으로 가동과 충전의 비가 종전 2대 1에서 10대 1로 바뀌었고 하루 20시간 넘게 가동할 수 있다고 밝힘, 다리 구조를 종전의 역방향 무릎에서 사람과 같은 방향으로 바꾸고 자체 사이클로이드 감속기를 적용했으며 무릎에 완충재를 더해 쪼그려 앉는 자세가 가능하도록 했음, 안전 설계로는 360도 범위에서 사람을 감지해 자율적으로 회피하거나 정지하거나 앉은 자세를 취하도록 해 사람 쪽으로 넘어지는 것이 구조적으로 성립하지 않게 했다고 설명했고, 별도의 독립 안전 제어기를 두었으며 안전 구역을 미리 정하지 않고 동적으로 위험을 평가한다고 밝힘, 미국 산업안전보건청(OSHA) 기준으로 현장 평가를 마쳤다고 밝혔고 ANSI/A3 TR R15.108 기술보고서 개발과 ISO 25785-1 국제표준 논의에 참여하고 있다고 적었음, 다만 ISO 25785-1 은 2026년 5월 위원회 초안(CD) 조회가 시작된 단계로 제정된 표준이 아니므로 「국제표준을 충족한다」로 읽을 수 없음, 초기 공급은 2027년 상반기, 일반 판매는 2027년 말로 제시됐고 도입처로 GXO·셰플러·아마존·도요타자동차 캐나다가 거명됨, 다년 주문은 2026년 5월 기준 3억 달러(약 4,100억 원) 이상이나 특정 계약 조건 충족을 전제로 한 값임, 같은 날 기업인수목적회사 처칠캐피털XI 가 미국 증권거래위원회에 제출한 Form 425 공시에 이 보도자료 전문이 실려 가반하중 22.7kg·90분 가동·9분 충전·가동 대 충전 10대 1과 다년 주문 3억 달러 이상이 공시 문서에서 확인됨, 한편 더로봇리포트는 같은 회사의 2025년 순매출을 180만 달러(약 25억 원)로, 영업손실을 1억 4,000만 달러로 적었고 기업가치 25억 달러 규모의 기업인수목적회사 합병을 통한 상장이 예정돼 있다고 전했음 — 이 매체는 독자의 브라우저에서 열리지 않는 것으로 등록돼 있어 재료로만 쓰고 출처 링크로는 걸지 않았으며, 순매출 수치의 1차 근거인 S-4 본문은 아직 확보하지 못했음(O18), 주문 잔고와 실현된 매출은 층위가 다르므로 두 수치를 같은 선에서 읽지 않음, IEEE 스펙트럼은 불안정한 이족보행 로봇이 사람이나 반려동물 위로 넘어질 때 무슨 일이 일어나는지에 쉬운 답이 없다는 점을 이 분야의 근본 과제로 들면서 디짓 5가 사람 노동의 손쉬운 대체물이 되리라는 전제에는 의문을 표했음, 안전 성능은 제조사 설명과 사양표에 근거한 값이고 제3자 시험 결과가 공개되지 않았으므로 확인된 사실로 쓰지 않음, 이 건은 오늘 지면의 균형 축에 해당함 — 「사람에게 넘어지지 않는다」는 서술은 제조사 설명이고 제3자 시험이 없으며, 주문 잔고 3억 달러와 2025년 순매출 180만 달러의 격차는 아직 양산 이전 단계임을 보여 주므로 공개 사양과 수주 규모를 실적으로 읽지 않을 자리임", "src": "애질리티 로보틱스 발표 9.15 · IEEE 스펙트럼 9.15 · 미국 증권거래위원회 공시 9.15", "pd": "2026-09-15", "url": "https://www.agilityrobotics.com/content/agility-unveils-digit-5-humanoid-robot-built-for-cooperatively-safe-work-at-scale", "url2": "https://spectrum.ieee.org/humanoid-robot-safety", "url3": "https://www.sec.gov/Archives/edgar/data/2074973/000121390026100159/ea0305579-425_churchill.htm"}, {"sec": 3, "t": "현대모비스, 로봇 생산기술 인력까지 채용 확대… 액추에이터 양산 준비", "k": "2028년 현장 적용에 맞춰 미국에 연 35만 개 생산능력을 갖춘다", "ez": "현대모비스가 올해 하반기 로봇 사업 부문의 채용을 늘리고 있는 것으로 보도됐음. 눈에 띄는 대목은 모집 직무의 구성임. 모터 설계, 회로 설계, 제어 소프트웨어처럼 개발에 해당하는 자리뿐 아니라 「로보틱스 생산기술」 인력을 함께 모으고 있음. 생산기술은 시제품을 공장에서 대량으로 만들 수 있게 공정을 설계하는 일이어서, 이 직무를 뽑는다는 것은 연구 단계를 넘어 양산 준비 단계에 진입했다는 신호로 읽힘. 회사가 만드는 것은 액추에이터임. 제어 신호를 실제 관절 움직임으로 바꾸는 부품으로, 휴머노이드 부품 원가의 약 60%를 차지함. 2028년 현장 적용을 목표로 미국에 연간 35만 개 이상을 만들 수 있는 능력을 갖추는 것이 목표로 제시됐음. 다만 채용 규모와 부품 사양은 공개되지 않았음.", "body": "현대모비스가 하반기 로보틱스 사업 부문에 채용을 집중하고 있는 것으로 보도됨, 모집 직무로 모터 설계·회로 설계·제어 소프트웨어·액추에이터 기구 설계와 함께 로봇 핸드 기구 설계, 로보틱스 평가, 시작개발이 제시됐고 「로보틱스 생산기술」 인력이 포함된 것으로 전해짐, 설계와 시험·평가에 이어 제조 단계까지 아우르는 인력을 모으는 것이어서 양산 체계 구축 단계에 진입한 것으로 읽히나 채용 규모는 보도에 담기지 않음, 같은 보도는 2028년 현장 적용을 목표로 미국에서 연간 35만 개 이상의 생산능력을 확보하는 것을 목표로 제시했음, 회사는 2026년 1월 CES 에서 보스턴다이내믹스와 전략적 협력체계를 구축했고 차세대 휴머노이드 아틀라스의 양산 시점에 액추에이터를 공급하기로 한 것으로 전해졌으나 그 시점은 밝혀지지 않음, 액추에이터는 제어 신호를 실제 움직임으로 바꾸는 부품으로 휴머노이드 부품 원가의 약 60%를 차지하는 것으로 보도됨, 9월 10일 용인 기술연구소에서 열린 2026 R&D 테크데이에서 개발 중인 로봇 액추에이터 2종을 처음 공개했으나 정격 토크·감속비·자유도·중량 등 사양은 공개되지 않았음(O24), 현대모비스 공식 뉴스룸의 보도자료 경로가 우리 요청에 열리지 않아 원문을 확보하지 못했으므로 등급을 S3 으로 두고 단정하지 않음, 원문이 없어서가 아니라 확인하지 못한 것임", "src": "뉴데일리 9.15", "pd": "2026-09-15", "url": "https://biz.newdaily.co.kr/site/data/html/2026/09/15/2026091500117.html"}, {"sec": 3, "t": "유니버설 로봇, 힘·토크 감지 기본 탑재한 7세대 협동로봇 플랫폼 공개", "k": "배선을 줄인 새 공구 접합부가 카메라 같은 고대역폭 센서를 직접 받는다", "ez": "덴마크의 협동로봇 기업 유니버설 로봇이 7세대 플랫폼 「젠 7」 을 공개했음. 협동로봇은 안전 울타리 없이 사람 옆에서 함께 일하도록 만든 로봇 팔을 말함. 이번에 바뀐 핵심은 로봇 팔 끝에 공구를 끼우는 접합부임. 종전에는 카메라 같은 장비를 달려면 전선을 따로 끌어와야 했으나, 새 접합부는 데이터와 전원과 안전 신호를 한 자리에서 함께 전달해 배선이 크게 줄었음. 또 힘과 토크를 감지하는 기능을 기본으로 넣어, 부품을 끼워 맞추듯 힘 조절이 필요한 작업에 대응할 수 있게 했음. 젠 7 을 적용한 신형 3종이 함께 공개됐음. 다만 각 기종이 얼마나 무거운 물건을 얼마나 멀리까지 다룰 수 있는지, 가격과 국내 출시 시점이 언제인지는 공개되지 않았음.", "body": "덴마크 유니버설 로봇이 9월 14일 7세대 로봇 플랫폼 젠 7(Gen 7)을 공개했고 미국 시카고에서 열린 국제제조기술전시회(IMTS)에서 선보인 것으로 전해짐, 폴리스코프 X 로봇 운영체제를 기반으로 제어 박스·티치 펜던트·공구 접합부를 전면 재설계한 것이 골자임, 새 공구 접합부는 데이터·전원·안전 신호를 직접 전달해 카메라 등 고대역폭 센서를 연결할 때 필요한 배선을 단순화했고, 힘·토크 감지와 임피던스 제어를 기본 탑재해 정밀 조립처럼 접촉이 필요한 작업에 대응한다고 밝힘, 젠 7 기반 협동로봇 g시리즈로 UR10g-1750·UR17g-1300·UR18g-950 세 종이 제시됐으나 가반하중과 도달거리의 개별 사양, 가격, 국내 출시 시점은 확인되지 않음, 휴머노이드가 아닌 협동로봇이나 접촉 제어와 센서 연결 방식이 피지컬 AI 의 현장 적용 조건과 맞닿아 있어 이 지면에 포함함, 원문 발표일이 9월 14일로 이 호의 게재 창보다 하루 앞서나 국내에는 9월 15일에 처음 도달한 것으로 판단해 국내 첫 도달 예외로 싣고 신규성을 낮춤", "src": "유니버설 로봇 발표 9.14 · 로봇신문 9.15", "pd": "2026-09-14", "url": "https://www.universal-robots.com/news-and-media/news-center/universal-robots-unveils-gen-7-new-platform-industrial-automation-physical-ai/", "url2": "https://www.irobotnews.com/news/articleView.html?idxno=48500"}, {"sec": 4, "t": "오사카 지하철 역무원 로봇 실증 종료… 자율 여부도 결과도 공개되지 않아", "k": "8월 31일부터 두 역에서 열엿새간 이어진 뒤 검증 항목의 답이 나오지 않았다", "ez": "일본 오사카 지하철에서 휴머노이드 로봇이 역무원 업무를 수행하는 실증이 9월 15일로 종료됐음. 8월 31일 우메다역에서 시작해 9월 9일부터는 다니마치9초메역으로 자리를 옮겨, 두 곳에서 열엿새 동안 오전 11시부터 저녁 8시까지 이용객을 응대했음. 로봇은 지하철 제복을 착용했고 구글의 생성형 AI 제미나이를 탑재해 여러 나라 말로 길을 안내했음. 운영사는 이용자가 로봇을 어느 정도 수용하는지, 안내 품질이 적절한지를 확인하겠다고 밝혔음. 그런데 종료 이튿날인 9월 16일까지 세 회사 어느 곳에서도 결과가 공개되지 않았음. 오사카메트로와 아비타의 보도자료 목록을 직접 열어 확인한 결과임. 특히 이 로봇이 스스로 판단해 응대한 것인지, 원격지의 사람이 조작한 것인지는 실증 개시 시점부터 종료 시점까지 공개되지 않았음.", "body": "KDDI·아비타·오사카메트로 세 곳이 8월 31일부터 수행한 휴머노이드 역무원 실증이 9월 15일로 종료됐음, 우메다역 매장에서 9월 6일까지, 다니마치9초메역 매장에서 9월 9일부터 15일까지 각각 운영됐고 운영시간은 11시부터 20시까지였음, 기체는 오사카메트로 제복을 착용하고 구글의 생성형 AI 모델 제미나이를 탑재해 다국어 대화와 노선 안내를 담당했음, 오사카메트로는 실증의 목적으로 이용자가 휴머노이드를 어느 정도 수용하는지와 안내 품질이 적절한지를 확인하는 것을 제시했음, 종료 이튿날인 9월 16일 현재 세 곳 가운데 어디에서도 결과 발표가 확인되지 않음 — 오사카메트로 뉴스릴리스 목록의 최신 게시물은 9월 4일자이고, 아비타 뉴스 목록의 최신 게시물은 9월 15일자 별건 보도자료로 실증 결과 항목은 없음, KDDI 뉴스룸은 개별 보도자료는 열리나 목록 페이지가 우리 요청에 403 을 주어 목록 차원의 확인에는 이르지 못했음, 따라서 오사카메트로와 아비타에 대해서는 열어서 확인한 부재이고 KDDI 에 대해서는 확인하지 못한 것이므로 둘을 구분해 적음, 이 지면은 9월 3일 호에서 이 실증의 개시를 다뤘고 이번 건은 종료와 결과 부재라는 새 사실임, 이 실증은 기체가 자율로 응대했는지 사람이 원격으로 조작했는지가 공개되지 않은 채 진행됐고 그 구분은 종료 시점까지도 밝혀지지 않았음(O03), 같은 날 아비타가 사람이 원격으로 개입하는 휴먼인더루프 피지컬 AI 서비스를 별도로 개시한 사실과 함께 읽을 자리임", "src": "오사카메트로 보도자료 8.28 · KDDI 보도자료 8.28", "pd": "2026-09-15", "url": "https://subway.osakametro.co.jp/news/news_release/20260828_humanoid_jikken.php", "url2": "https://newsroom.kddi.com/news/detail/kddi_nr-1132_4683.html"}, {"sec": 4, "t": "엑스와이지 로봇 바리스타, 부산 전시에서 나흘간 음료 1,005잔 제조", "k": "20시간 운영에 하루 평균 335잔으로 주문이 몰리는 시간대를 견뎠다", "ez": "로봇 기업 엑스와이지가 부산 벡스코에서 열린 2026 월드스마트시티엑스포에서 로봇 바리스타를 운영해 나흘 동안 1,005잔을 만들었다고 보도됐음. 누적 운영시간은 20시간이고, 하루에 344잔·348잔·313잔을 만들어 평균 335잔을 기록했음. 다룬 메뉴는 커피와 커피가 아닌 음료를 합쳐 7종임. 회사 측은 주문이 몰리는 시간에도 끊기지 않고 동시에 들어온 주문을 처리했다는 점을 성과로 들었음. 다만 이 수치를 그대로 매장 성능으로 읽기는 어려움. 전시장은 나흘간 한시적으로 운영되는 환경이어서 매일 같은 시간 문을 여는 상시 매장과 조건이 다름. 고장이 몇 번 발생했는지, 사람이 몇 번 개입했는지, 다시 만든 음료가 있었는지는 공개되지 않았음.", "body": "엑스와이지가 부산 벡스코에서 열린 2026 월드스마트시티엑스포에서 로봇 바리스타 「바리스브루」 를 운영해 나흘간 1,005잔을 제조한 것으로 9월 15일 보도됨, 누적 운영시간은 20시간이고 일별 제조량은 344잔·348잔·313잔으로 하루 평균 335잔으로 전해짐, 커피와 논커피를 포함한 7종 메뉴를 다뤘고 주문이 계속 몰리는 시간대에도 끊김 없이 동시 주문을 처리한 것으로 보도됨, 회사 관계자는 정확한 조리법을 유지하면서 안정적으로 서비스를 지속하는 것이 중요하다고 언급한 것으로 전해짐, 휴머노이드가 아닌 협동로봇 기반 서비스 설비이나 실환경에서 연속 운영한 처리량이 수치로 제시된 사례여서 이 지면에 포함함, 전시장 운영 실적이므로 상시 매장의 가동 조건과 같지 않고 고장·재작업·사람 개입 여부는 밝혀지지 않아 가동 신뢰성의 근거로 쓰지 않음, 회사 공식 발표 문서를 확인하지 못해 보도를 출처로 삼고 등급을 S3 으로 둠", "src": "로봇신문 9.15", "pd": "2026-09-15", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48501"}, {"sec": 5, "t": "브릴스 대표, 미시간 주지사와 면담… 북미 투자 확대와 주정부 지원 협의", "k": "지난 4월 개소한 약 2,000평 법인을 발판으로 추가 투자가 논의됐다", "ez": "로봇 자동화 기업 브릴스의 전진 대표가 9월 14일 서울에서 그레천 휘트머 미시간 주지사를 만났음. 미시간주는 미국 자동차 산업의 중심지로, 공장 자동화 수요가 큰 지역임. 이 자리에서 브릴스의 사업 확장 계획과 북미 투자 확대 방안, 주정부가 운영하는 지원 제도를 어떻게 활용할지가 논의된 것으로 보도됐음. 브릴스는 이미 지난 4월 미시간에 약 2,000평 규모의 현지 법인을 열었고, 주정부는 그 점에 사의를 표했다고 전해짐. 다만 이번 면담에서 투자 규모가 얼마인지, 어떤 시설을 언제 짓는지, 주정부가 무엇을 지원하는지는 공개되지 않았음. 따라서 확정된 약속이 아니라 협의가 시작된 단계로 읽는 것이 타당함.", "body": "로봇 자동화 기업 브릴스의 전진 대표가 9월 14일 서울 그랜드 인터컨티넨탈 호텔에서 그레천 휘트머 미시간 주지사와 면담한 것으로 9월 15일 보도됨, 주지사 비서실장 등 주요 관계자가 배석했고 브릴스의 향후 사업 확장 계획, 북미 지역 투자 확대 방안, 주정부 지원 프로그램 활용 방안이 논의된 것으로 전해짐, 미시간주는 브릴스가 2026년 4월 개소한 약 2,000평 규모 현지 법인에 대해 사의를 표한 것으로 보도됨, 구체적 투자 규모와 시설 계획, 시점, 주정부 지원의 내용은 보도에 담기지 않아 협의 단계를 넘어선 약정으로 읽지 않음, 브릴스의 공식 발표 문서와 미시간 주지사실의 공개 발표에서 해당 면담 항목을 확인하지 못해 보도를 출처로 삼고 등급을 S3 으로 둠, 면담일이 9월 14일로 이 호의 게재 창보다 앞서나 사실의 공개는 9월 15일 보도가 처음이므로 발표일을 보도일로 둠", "src": "로봇신문 9.15", "pd": "2026-09-15", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48497"}, {"sec": 6, "t": "한국로봇산업협회, 국가로봇테스트필드 기술교류 세미나 29일 개최", "k": "평가와 안전성 검증이 휴머노이드 실환경 적용 사례와 나란히 의제로 올랐다", "ez": "한국로봇산업협회가 9월 29일 국가로봇테스트필드 기술교류 세미나를 연다고 9월 15일 공지했음. 국가로봇테스트필드는 로봇을 실험실이 아니라 실제 환경에서 시험하도록 국가가 마련하는 시설과 사업을 말함. 이번 세미나에서 눈여겨볼 대목은 발표 주제의 구성임. 첫 주제가 평가와 안전성 검증이고, 그다음에 피지컬 AI 기술 동향과 물류·휴머노이드·서비스·생활 로봇의 실제 적용 사례가 이어짐. 로봇을 얼마나 많이 도입했는가보다 제대로 작동하는지를 어떻게 확인할 것인가가 앞자리에 놓인 것임. 장소는 서울 용산이고 시간은 오후 1시 30분부터 5시까지임. 참석 대상은 이 사업에 참여하는 관계자와 로봇 활용에 관심 있는 사람임. 신청 마감일은 따로 정해지지 않았으나 자리가 차면 조기 마감될 수 있다고 안내됐음.", "body": "한국로봇산업협회(현 명칭 한국AI·로봇산업협회)가 9월 15일 2026 국가로봇테스트필드 기술교류 세미나 개최와 참석 신청을 공지했음, 일시는 9월 29일 13시 30분부터 17시까지이고 장소는 나인트리 로카우스 호텔 용산 5층 하모니홀임, 협회는 로봇 서비스의 실환경 적용을 위한 주요 기술과 응용 사례를 공유하고 산·학·연·관 관계자 사이의 기술 교류와 협력 네트워크를 확대하는 것을 취지로 제시했음, 발표 주제로 평가·안전성 검증, 피지컬 AI 기술 동향, 물류·휴머노이드·서비스·생활 로봇의 실환경 적용 사례가 제시됨, 참석 대상은 국가로봇테스트필드 과제 관계자와 로봇 응용에 관심 있는 관계자이고 신청은 포스터의 QR 코드 또는 구글 설문 링크로 받되 신청 마감일은 명시되지 않았으며 수용 인원 제한으로 조기 마감 가능성이 안내됨, 국가로봇테스트필드 사업 자체의 진행 상황은 공지에 담기지 않음, 주최가 부처가 아니라 협회이고 사업 수행 관계자를 대상으로 하는 자리여서 국가사업의 이행 상황을 볼 통로에 해당함", "src": "한국로봇산업협회 공지 9.15", "pd": "2026-09-15", "url": "http://www.korearobot.or.kr/information/notice_view.htm?idx=30887"}, {"sec": 8, "t": "경희대, 배포 뒤 스스로 학습하는 휴머노이드의 안전·평가 쟁점 정리", "k": "현장에 나간 뒤 거동이 바뀌는 기체를 무엇으로 재인증할지가 공백으로 지목됐다", "ez": "경희대학교 연구진이 휴머노이드의 「배포 후 자기개선」 을 정리한 논문을 공개했음. 배포 후 자기개선이란 로봇이 공장이나 매장에 투입된 뒤에도 현장에서 겪은 일을 재료로 스스로 더 학습해 거동을 바꾸는 것을 말함. 편리해 보이지만 곤란한 문제가 따라옴. 출고할 때 시험을 통과한 로봇과 여섯 달 뒤 현장에서 움직이는 로봇이 같은 로봇이 아니게 되기 때문임. 그러면 처음 받은 안전 인증이 지금의 거동을 보증한다고 말하기 어려워짐. 논문은 이런 자기개선이 어떤 방식으로 이뤄지는지, 무엇이 위험한지, 어떻게 평가해야 하는지를 30쪽에 걸쳐 정리했음. 다만 이 논문은 새 실험을 수행한 연구가 아니라 기존 연구를 종합해 정리한 총설임. 학술지 심사도 아직 거치지 않았음.", "body": "경희대학교 컴퓨터공학과 연구진이 휴머노이드의 배포 후 자기개선(post-deployment self-improvement)을 다룬 총설 논문을 공개했음, 제1기관은 경희대학교이고 공동 저자에 싱가포르 난양공과대학 연구자가 포함됨, arXiv 제출은 9월 2일이고 공고는 9월 15일이며 30쪽·그림 9개·표 5개 구성임, 이 논문은 새 실험을 수행한 연구가 아니라 기존 연구를 정리한 총설이므로 자체 실기 시행 횟수나 성능 수치를 지지 않으며 본문의 수치는 인용된 선행 연구의 값임, 다루는 문제는 현장에 배포된 휴머노이드가 작업과 환경과 기체 상태가 바뀌는 조건에서 스스로 학습해 거동을 바꾸는 경우의 기제와 안전, 평가임, 학술지 게재나 학회 채택 표시는 없고 출판 검토 중으로만 적혀 있어 동료심사를 거치지 않았으므로 등급을 S3 으로 두고 단정하지 않음, 발표일은 이 지면의 학술 칸 기준에 따라 제출일이 아니라 공고일로 적음", "src": "경희대학교 9.15", "pd": "2026-09-15", "url": "https://arxiv.org/abs/2609.13236"}, {"sec": 8, "t": "中 통지대·푸단대, 기체가 달라도 함께 학습하는 전신제어 모델 발표", "k": "시뮬레이션 9종과 실기 4종에서 공동 학습으로 동작 추종 정확도가 개선됐다", "ez": "중국 통지대학교와 푸단대학교 연구진이 휴머노이드의 몸 전체를 움직이는 새 학습 방법을 공개했음. 지금까지는 로봇 한 종류마다 제어 프로그램을 따로 학습시켜 왔음. 그래서 A 로봇에게 가르친 동작 경험이 B 로봇에게는 쓸모가 없었음. 연구진은 이 경험을 두 층으로 분리했음. 사람의 동작이 어떤 순서로 이어지는가 하는 부분은 기체가 달라도 같으므로 하나의 공용 모듈이 담당하고, 그 동작을 실제 관절로 옮기는 부분만 로봇마다 따로 작은 모듈을 두는 방식임. 검증은 가상 환경의 9개 기체와 실제 로봇 4종에서 이뤄졌음. 여러 로봇의 기록을 함께 학습시키자 동작을 따라 하는 정확도가 높아졌고, 학습에 쓰지 않은 동작에서도 성능이 유지됐음. 다만 학습 데이터의 분량과 실기 시험 횟수는 공개되지 않았음.", "body": "중국 통지대학교와 푸단대학교 데이터과학원, 상하이혁신연구원 공동 연구진이 9월 14일 이기종 휴머노이드 전신제어 파운데이션 모델 X-WBC 를 공개했음, 제1저자는 통지대학교 소속이고 교신저자는 푸단대학교 소속임, 지금까지는 로봇 한 대마다 정책을 따로 학습시켜 기체 사이에 동작 경험이 단절돼 있었다는 것이 연구진의 문제 제기임, X-WBC 는 여러 기체에 공통인 사람 동작의 의미와 기체마다 다른 물리적 실행을 분리해, 공유 모듈이 사람 동작의 시간 구조를 학습하고 경량의 기체별 모듈이 그 표현을 각 로봇의 고유감각과 행동 공간으로 대응시키는 구조임, 사람의 전체 동작과 로봇 참조 동작, 가상현실 장비의 희소한 관측을 사람 중심 명령 토큰으로 정렬하고 인과 트랜스포머가 여러 로봇의 혼합 주행 기록에서 재사용 가능한 시간 구조를 학습함, 검증은 시뮬레이션 9종 기체와 실제 로봇 4종에서 수행됐고 공동 학습이 동작 추종 성능을 개선했으며 학습 자료 범위를 벗어난 동작에서도 성능이 유지됐다고 제시됨, 학습 데이터의 규모와 실기 시행 횟수는 공개본에 담기지 않았고 가중치와 코드의 공개 여부도 확인되지 않음, 제10회 로봇학습학회(CoRL 2026) 채택본으로 표시돼 있으나 현재 공개된 판본은 사전공개본뿐이고 학회 논문집이 아직 출간되지 않아 미동료심사 상한에 따라 등급을 S3 으로 둠, 발표일이 이 호의 게재 창보다 하루 앞서나 국내 도달이 확인되지 않아 국내 첫 도달 예외로 싣고 신규성을 낮춤", "src": "CoRL 2026", "pd": "2026-09-14", "url": "https://arxiv.org/abs/2609.15213"}, {"sec": 8, "t": "스위스 취리히연방공대, 휴머노이드가 철봉 구조물 건너는 기술 공개", "k": "실기 15회 가운데 14회가 도약과 이동과 착지를 끝까지 마쳤다", "ez": "스위스 취리히연방공대 연구진이 휴머노이드가 구름사다리를 건너는 기술을 공개했음. 놀이터의 구름사다리처럼 가로대가 띄엄띄엄 떨어져 있고 발 디딜 곳이 없는 구조물이 대상임. 로봇은 먼저 구조물로 뛰어올라 매달린 뒤, 팔을 번갈아 옮겨 잡으며 앞으로 나아가고, 마지막에 안전하게 내려와야 함. 세 동작을 끊김 없이 이어야 하는 점이 어려운 대목임. 연구진은 로봇 머리에 붙인 라이다로 주변 모양을 측정하고, 그 측정값을 가공 없이 곧바로 제어에 쓰도록 했음. 얇은 가로대는 미리 만든 지도에 잘 잡히지 않기 때문임. 실제 로봇으로 15번 시도해 14번 성공했고, 팔을 옮겨 이동하는 속도는 초속 0.5m 까지 나왔음. 다만 학술지 심사를 거치지 않은 사전공개본임.", "body": "스위스 취리히연방공대 로보틱시스템랩과 컴퓨터비전·기하학연구단이 얇고 띄엄띄엄 놓인 3차원 구조물을 휴머노이드가 건너는 제어 기법을 공개했음, 제1저자는 에페 온간이고 교신저자는 마르코 후터 교수임, 과제는 이른바 구름사다리 횡단으로, 로봇이 구조물로 도약해 올라가 가로대를 하나씩 옮겨 잡으며 이동한 뒤 안전하게 내려오는 동작을 하나로 잇는 것임, 머리에 장착한 고정형 라이다의 원시 측정값을 주의집중 부호기와 순환 기억을 통해 정책이 직접 소비하도록 설계했고, 도약·팔이동·착지 각각의 특권적 전문가 정책을 단계별 교사-학생 방식으로 통합했음, 실기 검증은 중국 엔진AI 의 PM-01 기체로 수행됐고 15회 시도 가운데 14회가 도약부터 착지까지 전 과정을 완수했으며 팔이동 속도는 최대 초속 0.5m 로 제시됨, 사전공개본은 8월 30일에 게시됐고 개정본은 없으며 학술지 게재 기록이 표시돼 있지 않아 동료심사를 거치지 않았으므로 등급을 S3 으로 두고 단정하지 않음, 발표일이 이 호의 게재 창 밖이나 국내에는 9월 15일 로봇신문 보도로 처음 도달한 것으로 판단해 국내 첫 도달 예외로 싣고 신규성을 낮춤", "src": "취리히연방공대 8.30 · 로봇신문 9.15", "pd": "2026-08-30", "url": "https://arxiv.org/abs/2608.29769", "url2": "https://www.irobotnews.com/news/articleView.html?idxno=48502"}]}, {"date": "2026-09-15", "items": [{"sec": 2, "t": "제로모션, 휴머노이드 학습데이터 수집·검증 통합 플랫폼 10월 출시", "k": "모션캡처부터 로봇 배포까지 흩어져 있던 다섯 단계를 한 도구로 묶는다", "ez": "국내 모션캡처 기업 제로모션이 휴머노이드 로봇을 가르칠 데이터를 모으는 통합 도구 「XERO Humanoid」 를 10월 초에 공개한다고 밝혔음. 로봇에게 동작을 가르치려면 사람의 움직임을 촬영해 기록하고, 그 움직임을 로봇의 관절 구조에 맞게 바꾸고, 가상 환경에서 잘 되는지 확인한 뒤 실제 로봇에 넣어야 함. 지금까지는 이 과정이 서로 다른 프로그램으로 흩어져 있었는데, 이 도구는 다섯 단계를 하나로 묶었음. 데이터를 모으는 방법은 세 가지임. 카메라로 사람의 전신 움직임과 1인칭 영상을 함께 기록하는 방법, 가상현실 장비로 움직여 가상 공간에서 바로 확인하는 방법, 사람이 원격으로 실제 로봇을 조종하면서 기록하는 방법임. 엔비디아의 로봇 시뮬레이션 환경과 바로 연결되도록 만들었음. 다만 아직 출시 전이어서 성능과 가격은 공개되지 않았음.", "body": "광학식 모션캡처 기업 제로모션이 휴머노이드 학습용 통합 데이터 플랫폼 「XERO Humanoid」 를 10월 초 출시한다고 밝힌 것으로 보도됨, 사람의 동작을 모션캡처로 수집해 로봇 관절 구조에 맞게 변환하는 리타겟팅, AI 학습, 시뮬레이션 검증, 로봇 배포까지 다섯 단계를 하나의 도구에서 처리하도록 설계된 소프트웨어임, 자사 광학 장비와 Xsens MVN·VIVE Ultimate Tracker 등 서로 다른 추적 장비의 데이터를 융합하는 센서 퓨전 기능을 핵심으로 들었고 로봇 관절 구조를 표준 형식(URDF)으로 기술한 모델을 근거로 리타겟팅을 지원하는 것으로 전해짐, 데이터 수집 방식은 셋이며 모션캡처와 1인칭 영상을 1ms 이내로 동기화해 전신 3차원 관절 궤적과 영상을 함께 기록하는 방식, 가상현실 장비로 수집한 동작을 엔비디아 아이작 심에서 즉시 구동하며 조명·질감·물리 조건을 자동으로 바꾸는 도메인 랜덤화로 합성데이터를 만드는 방식, 모션캡처 출력을 엔비디아 텔레옵 API 로 로봇 관절 명령으로 바꿔 실물 로봇을 원격 제어하면서 조작자 동작과 로봇 실행 궤적을 함께 기록하는 방식으로 제시됨, 엔비디아 아이작 심·아이작 랩·그루트-미믹·텔레옵 API 를 기본 지원하고 저장은 HDF5 를 기준 형식으로 삼아 로보미믹 표준 및 그루트-미믹 시드 데이터 항목과 호환되는 자체 변환 모듈을 갖춘 것으로 전해짐, 출시 전 발표이므로 실제 성능과 가격·공급 대상은 제시되지 않았고 원문 주소가 막혀 전재본으로 본문을 읽었으므로 등급을 S3 으로 둠(O36)", "src": "전자신문 9.14", "pd": "2026-09-14", "url": "https://n.news.naver.com/mnews/article/030/0003466523"}, {"sec": 2, "t": "KAIST·LG전자, 피지컬 AI 승부처로 숙련 데이터·액추에이터 표준 제시", "k": "중국은 개발 과정에서 수백 대를 파손하지만 국내에서는 실패에 질책이 따른다", "ez": "9월 14일 서울에서 열린 피지컬 AI 포럼에서 로봇을 학습시킬 데이터를 어떻게 모을지가 쟁점이 됐음. 피지컬 AI 는 화면 안에서 답만 하는 인공지능이 아니라 로봇처럼 실제 물체를 다루는 인공지능을 말함. 참석자들은 데이터 양으로는 중국을 따라가기 어렵다고 보고, 대신 국내 공장에 쌓인 숙련 기술자의 작업 방식을 데이터로 전환하는 쪽을 제안했음. KAIST 김정 교수는 로봇 관절을 움직이는 부품인 액추에이터가 로봇 가격의 절반을 차지한다며 규격을 통일해야 한다고 설명했음. 그는 중국에서는 개발 과정에서 로봇 수백 대를 넘어뜨려 보며 시험하지만 국내에서는 그런 실패가 문책으로 이어진다고 지적했음. LG전자는 올해 로봇 학습용 데이터를 모으는 시설을 세우기 시작했다고 밝혔고, 한국지능정보사회진흥원은 기업이 자기 데이터를 넘기지 않고도 함께 학습할 수 있는 방식을 대안으로 제시했음.", "body": "디지털타임스가 9월 14일 서울 은행회관에서 연 「피지컬 AI, 대한민국 새 성장엔진」 포럼의 토론에서 학습 데이터 확보 방안이 쟁점으로 다뤄졌음, 좌장을 맡은 박영선 재정경제부 전략경제자문단 위원장은 로봇이 얇은 수건을 접는 수준에서 피지컬 AI 의 승부가 갈릴 것이라며 고정밀 부품과 촉각 기술을 승부처로 지목했음, 김정 KAIST 기계공학과 교수는 액추에이터가 로봇 원가의 절반을 차지한다며 규격 표준화와 고성능 부품 기업 육성을 제안했고, 50~60대 숙련공의 작업 노하우를 데이터로 전환하는 것이 국내의 강점이라고 설명했음, 같은 자리에서 그는 중국은 개발 과정에서 수백 대를 넘어뜨려 보지만 국내에서는 그런 실패에 문책이 따른다고 언급해 개발 관행의 차이를 지적했음, 전혜정 LG전자 인공지능연구소 연구위원은 올해 데이터 팩토리 구축을 시작했다고 밝히며 중소기업도 활용할 수 있는 통합 플랫폼이 필요하다고 설명했음, 김형철 한국지능정보사회진흥원 원장은 데이터 스페이스와 연합학습으로 영업비밀을 보호하면서 공유할 수 있다고 제시한 것으로 보도됨, 포럼 발언이어서 기관 발표 문서가 없으므로 지정 매체 보도를 출처로 삼고 등급을 S3 으로 둠", "src": "디지털타임스 기획 9.14", "pd": "2026-09-14", "url": "https://www.dt.co.kr/article/12083904"}, {"sec": 3, "t": "中 유비테크, 류저우 공장 가동… 10분당 완성품 1대 양산", "k": "하모닉 감속기 단가가 3,000~5,000위안에서 1,500~2,000위안으로 내려간 상태", "ez": "중국 로봇기업 유비테크가 광시좡족자치구 류저우에 세운 휴머노이드 공장을 정식 가동했음. 10분에 한 대씩 완성품이 나오고, 연간 1만 대 이상을 만들 수 있는 규모임. 다만 이 수치는 만들 수 있는 능력이지 실제로 판 대수가 아님. 더 눈여겨볼 대목은 부품임. 중국산 휴머노이드의 핵심 부품 국산화율이 75%를 넘었고, 모터와 제어기는 85%를 넘었음. 로봇 관절의 힘을 조절하는 하모닉 감속기 값은 3,000~5,000위안에서 1,500~2,000위안으로 내려갔음. 부품값이 내려가자 기체값도 함께 내려가, 유니트리 제품은 2023년 59만 위안대에서 2025년 16만 위안대(약 3,342만 원)로 72% 낮아졌음. 올해 상반기 세계 휴머노이드 출하량은 약 1만 9,100대로 지난해 같은 기간의 3배이고, 이 가운데 97% 이상이 중국 업체 물량임.", "body": "중국 유비테크가 광시좡족자치구 류저우에 연간 1만 대 이상을 생산할 수 있는 산업용 휴머노이드 공장을 정식 가동했고 완성품이 10분마다 한 대씩 나오는 것으로 보도됨, 여기서 1만 대는 생산능력이고 실제 출하 대수가 아니므로 층위를 구분해 읽어야 함, 같은 기사는 중국 휴머노이드의 핵심 부품 국산화율이 75%를 넘고 모터와 제어기는 85%를 넘는 것으로 전했음, 부품 단가는 하모닉 감속기가 3,000~5,000위안에서 1,500~2,000위안으로, 유성 롤러 스크루가 80% 이상 하락한 것으로 제시됨, 기체 가격도 유니트리 제품이 2023년 59만 3,400위안에서 2025년 16만 6,400위안(약 3,342만 원)으로 72% 인하됐고 소비자용 R1 은 2만 9,900위안, 쑹옌동력 샤오부미는 1만 위안 아래로 전해짐, 2026년 상반기 세계 휴머노이드 출하량은 약 1만 9,100대로 전년 동기의 3배이며 중국 업체 비중이 97%를 넘는 것으로 보도됨, 유비테크 공식 뉴스룸을 직접 열었으나 목록이 자바스크립트로 그려져 해당 발표를 확인하지 못했으므로 「없어서」가 아니라 「못 읽어서」이며 등급을 S3 으로 둠", "src": "한국경제 기획 9.14", "pd": "2026-09-14", "url": "https://www.hankyung.com/article/202609143508i"}, {"sec": 4, "t": "CJ대한통운, 올리브영 물류센터 포장 공정에 휴머노이드 2대 투입", "k": "택배상자에 완충재를 넣는 공정을 맡았고 피킹·분류·검수로 확대가 예정됐다", "ez": "CJ대한통운이 사람 모양의 양팔 로봇 두 대를 경기 용인 양지에 있는 올리브영 물류센터에 들여놓고 포장 공정에 투입했음. 로봇이 맡은 일은 택배 상자 안에 완충재를 채워 넣는 작업임. 지난해 군포에서 시험 운영을 한 데 이어, 실제 주문 물량을 처리하는 현장에 휴머노이드를 넣은 것은 이번이 처음임. 회사는 앞으로 물건을 집어 담고 분류하고 검수하는 작업까지 맡길 계획임. 다만 로봇이 하루에 몇 시간 일하는지, 몇 건을 처리하는지, 얼마나 자주 멈추는지는 공개되지 않았음. 같은 업계에서 한진은 7월부터 5톤 화물차 자율주행을 군산항에서 대전까지 118킬로미터 구간에서 주 3회 운행하고 있고, 터미널 20여 곳에 설치한 AI 영상 관제로 위험한 행동이 약 60% 줄었다고 밝혔음.", "body": "CJ대한통운이 이달 초 휴머노이드 양팔로봇 2대를 경기 용인시 양지면 올리브영 물류센터에 배치해 상품포장 공정에 투입한 것으로 보도됨, 맡은 작업은 택배상자 안에 완충재를 넣는 공정이며 앞으로 피킹과 분류·검수로 범위를 넓힐 계획인 것으로 전해짐, 지난해 군포 풀필먼트센터에서 실증한 데 이어 실제 고객 물량을 처리하는 운영현장에 휴머노이드를 적용한 첫 사례로 보도됨, 대수는 실제 투입 2대이며 도입 계약 대수나 생산능력과 구분되고 가동 시간·처리 건수·고장률은 제시되지 않았음, 같은 기사에서 한진은 AI 세이프티 가디언을 수도권과 충청·강원 외곽의 20여 개 터미널에 구축해 위험행동이 도입 전보다 약 60% 줄었다고 밝혔고, 7월부터 5t 간선트럭 자율주행을 전북 군산항에서 전주택배터미널을 거쳐 대전 메가허브에 이르는 118km 구간에서 주 3회 운행 중인 것으로 전해짐, CJ대한통운은 AI 영상관제를 7월 기준 22개 사업장에 설치하고 안전관제 사업장을 57곳으로 넓혔으며 배차 플랫폼 「더운반」의 자동배차 성공률이 초기 50% 미만에서 최근 80% 이상으로 올랐다고 전해짐, 회사 뉴스룸을 직접 열어 이번 배치에 관한 새 발표가 없음을 확인했으므로 현장 취재 보도를 출처로 삼고 등급을 S3 으로 둠", "src": "머니투데이 9.15", "pd": "2026-09-15", "url": "https://www.mt.co.kr/industry/2026/09/15/2026091419381051909"}, {"sec": 4, "t": "日 GMO, 휴머노이드 전용 보수차량 도입… 일본 첫 사례", "k": "고장 기체를 현장에서 수리하거나 예비기로 교체해 가동 중단 시간을 줄이는 방식", "ez": "일본 GMO인터넷그룹의 로봇 계열사가 휴머노이드 로봇만 전담하는 수리 출동 차량을 9월부터 운영한다고 발표했음. 회사는 휴머노이드 보수 전용 차량이 일본에서 처음이라고 설명했음. 차량에는 진단 장비와 주요 부품, 그리고 교체용 로봇 한 대가 실려 있고, 평소 로봇을 조정하는 기술자가 함께 탑승함. 로봇이 현장에서 멈추면 출동해 그 자리에서 고치고, 고치기 어려우면 싣고 온 예비 로봇으로 바꾼 뒤 고장 난 기체를 정비 거점으로 옮김. 회사는 로봇이 사회에 자리 잡으려면 멈췄을 때 달려가는 체계가 먼저 있어야 한다고 밝혔음. 다만 차량을 몇 대 운영하는지, 이용 요금이 얼마인지, 자사가 공급하지 않은 기종도 받는지는 공개되지 않았음.", "body": "일본 GMO인터넷그룹 계열사 GMO AI&로보틱스상사(GMO AIR)가 휴머노이드 전용 보수차량 「GMO 휴머노이드 구급차」를 9월 중 운영한다고 발표했으며, 휴머노이드 보수에 특화된 차량은 일본에서 처음이라고 밝힘, 차량에는 교체용 기체와 주요 부품·소모품·진단 기기·수리 공구가 실리고 평소 기체 조정을 맡는 휴머노이드 엔지니어가 동승함, 현장에서 수리가 끝나면 가동 중단 시간을 줄이고, 현장 수리가 어려우면 예비기로 교체한 뒤 고장 기체를 수리 거점으로 이송하는 방식임, 회사는 휴머노이드 도입 이후의 운용을 지원하는 서비스를 순차적으로 확충할 계획이라고 밝혔으나 차량 대수·요금·대상 기종의 범위는 제시하지 않았음, 보도자료 전문을 배포 채널에서 열어 확인했으나 회사 자체 도메인(gmo-air.co.jp)이 응답하지 않아 원문 직접 확인으로 보지 않고 등급을 S3 으로 두며, 가동 실적은 아직 제시되지 않은 것으로 전해짐", "src": "GMO AI&로보틱스상사 발표 9.8 · 로봇신문 9.14", "pd": "2026-09-08", "url": "https://prtimes.jp/main/html/rd/p/000005524.000000136.html", "url2": "https://www.irobotnews.com/news/articleView.html?idxno=48481"}, {"sec": 5, "t": "골드만삭스, 휴머노이드 판매 전망 대폭 상향… 자동차 산업이 양산 주체", "k": "한국 공급망이 2035년 세계 생산의 30%에 관여할 것으로 제시됐다", "ez": "투자은행 골드만삭스가 휴머노이드 로봇이 얼마나 팔릴지에 대한 전망을 크게 올렸음. 2035년 판매량을 기존 138만 대에서 648만 대로, 시장 규모는 380억 달러에서 1,380억 달러로 다시 잡았음. 로봇이 시제품 단계를 지나 실제로 대량 생산되는 단계로 넘어가고 있다는 판단임. 보고서는 이 시장을 자동차 회사가 이끌 것으로 봤음. 자동차 업체는 복잡한 제품을 많이 만들어 본 경험이 있어 로봇을 사는 쪽이자 만드는 쪽이 될 수 있다는 것임. 전기차로 바뀌면서 남아도는 엔진 부품 기술을 로봇 관절 부품에 돌려 쓸 수 있다는 점도 들었음. 2035년 로봇 한 대 평균 가격은 약 2만 1,000달러로 내다봤음. 한국과 관련해서는 지난 6월 보고서에서 2035년 세계 휴머노이드 생산의 약 30%에 한국 기업이 직접 또는 간접으로 관여할 수 있다고 봤고, 그 규모를 2035년 약 41만 2,000대로 추산했음.", "body": "골드만삭스가 최근 발간한 「휴머노이드와 자동차 — 함께 구축하는 피지컬 AI」 보고서에서 2035년 세계 휴머노이드 판매량 전망을 종전 138만 대에서 648만 대로 약 4.7배 올린 것으로 보도됨, 같은 기간 시장 규모 전망도 약 380억 달러(약 52조 원)에서 1,380억 달러(약 190조 원)로 약 3.6배 상향된 것으로 전해짐, 상향 근거로는 피지컬 AI 기술 발전과 생산 규모 확대가 제시됐고 주요 기업이 소규모 시제품 제작에서 대규모 프로토타입과 상업 생산으로 옮겨가고 있다는 판단이 실린 것으로 보도됨, 보고서는 자동차 산업을 시장 확대의 주도 산업으로 지목했으며 완성차 업체가 복잡한 제품을 대량 생산하는 역량과 공급망을 갖춰 초기 수요처인 동시에 양산 주체가 될 가능성이 높다고 본 것으로 전해짐, 전기차 전환으로 내연기관 부품 수요가 줄어드는 가운데 자동차 부품사의 모터·가공 기술을 액추에이터와 감속기에 전용할 수 있다는 분석과 함께 도요타·JTEKT·하모닉드라이브·르네사스가 관련 기업으로 제시된 것으로 보도됨, 2035년 휴머노이드 평균판매가격은 약 2만 1,000달러(약 2,900만 원) 수준으로 전망돼 산업 현장에서 투자비 회수가 가능한 구간에 든다고 본 것으로 전해짐", "src": "전자신문 9.14 · 24/7 Wall St. 9.14", "pd": "2026-09-14", "url": "https://n.news.naver.com/mnews/article/030/0003466461", "url2": "https://247wallst.com/investing/2026/09/14/goldman-sachs-just-supercharged-its-humanoid-robot-prediction-5x-to-6-5-million-by-2035/"}, {"sec": 5, "t": "현대차그룹 임원, 보스턴다이내믹스 2027년 상장은 어렵다고 밝혀", "k": "아틀라스의 대량 배치가 늦어져 상장 예상 시점이 2029~2030년으로 제시됐다", "ez": "현대차그룹이 인수한 미국 로봇기업 보스턴다이내믹스의 주식시장 상장이 2027년에는 어려울 것이라고, 현대차그룹 고위 임원이 로이터에 밝혔음. 이 회사의 대표 로봇인 아틀라스가 아직 공장에 대규모로 투입되지 못했고 회사도 적자를 이어가고 있다는 것이 이유임. 보도에 따르면 보스턴다이내믹스는 2025년 한 해에만 5,284억 원의 손실을 냈고, 2021년부터 5년간 누적 손실은 1조 7,558억 원에 이름. 증권가에서는 상장 시점을 2029년에서 2030년 사이로 보고 있음. 현대차그룹은 2028년까지 연간 3만 대를 만들 수 있는 공장을 짓겠다는 계획을 밝힌 상태임. 기술을 앞서 확보한 기업도 실제로 공장에 로봇을 들여놓는 단계에서 시간이 더 걸린다는 뜻으로 읽힘.", "body": "로이터가 9월 14일 현대차그룹 고위 임원을 인용해 보스턴다이내믹스의 2027년 기업공개가 어렵다고 보도함, 해당 임원은 내년 상장 가능성을 묻는 질문에 쉽지 않을 것이라고 답했고, 주력 기체 아틀라스를 아직 대규모로 배치하지 못했으며 회사가 적자 상태라는 점이 이유로 제시됐다고 전해짐, 현대글로비스 공시를 인용한 보도에 따르면 보스턴다이내믹스의 2025년 당기순손실은 5,284억 원이고 2021년부터 2025년까지 5년 누적 당기순손실은 1조 7,558억 원임, 현대차그룹은 2028년까지 연 3만 대 규모 생산 공장을 준공하고 미국 조지아주 공장에 휴머노이드를 배치할 계획인 것으로 함께 전해짐, 임원은 사안의 기밀성을 이유로 익명을 요청했고 「여건과 상황을 지켜봐야 한다」고 덧붙인 것으로 전해짐, 올해 1월 아틀라스 양산형 공개 직후 두 배 이상 올랐던 현대차 주가는 상승분을 반납해 연초 대비 25% 상승에 그쳐 같은 기간 코스피 상승률 60%를 밑도는 것으로 보도됨, 메리츠증권 김준성 연구원 등 애널리스트는 휴머노이드가 공장에 널리 배치되기 전까지는 상장이 어렵다며 2029~2030년을 예상 시점으로 제시한 것으로 보도됨, 로이터 자체 취재이므로 기관 발표 문서가 존재하지 않고 reuters.com 은 우리 접근이 막혀 있어 제휴 매체 전재본으로 본문을 확인했으며 등급을 S3 으로 둠, 이 건은 오늘 지면의 균형 축에 해당함 — 같은 날 지면의 전망 상향 항목과 나란히 읽으면 출하 전망은 다섯 배로 늘어나는데 선두 기업의 배치 실적은 상장을 미룰 만큼 더디다는 사실이 드러남", "src": "로이터 단독 9.14 · SBS Biz 9.15", "pd": "2026-09-14", "url": "https://www.thestar.com.my/tech/tech-news/2026/09/14/exclusive-ipo-for-humanoid-robot-maker-boston-dynamics-unlikely-in-2027-executive-says", "url2": "https://n.news.naver.com/mnews/article/374/0000532864"}, {"sec": 5, "t": "한화투자증권, 피지컬 AI 성장 중심축이 자율주행으로 옮겨간다는 전망 제시", "k": "2035년 시장에서 휴머노이드 비중은 15.8%에 머물 것으로 제시됐다", "ez": "증권사 한화투자증권이 피지컬 AI 산업의 성장 축이 휴머노이드 로봇에서 자율주행차와 무인택시 쪽으로 옮겨갈 것이라는 보고서를 냈음. 보고서는 세계 피지컬 AI 시장이 2025년 888억 달러에서 2035년 1조 5,000억 달러로 커진다고 보면서도, 그 가운데 자율주행이 차지하는 비중은 39%에서 69%로 올라가고 휴머노이드는 2035년에도 15.8%에 그칠 것으로 봤음. 무인택시 시장은 같은 기간 15억 달러에서 4,150억 달러로 커진다고 전망했음. 이유로는 자율주행 쪽이 제도 정비와 부품 공급망 구축에서 먼저 앞서 있다는 점을 들었음. 다만 이 수치는 모두 앞날을 예측한 값이고, 보고서 원문을 구하지 못해 어느 연구원이 어떤 기준으로 계산했는지는 확인되지 않았음.", "body": "한화투자증권이 9월 14일 산업 보고서 「피지컬 AI 모멘트, 자율주행과 로보택시」를 내고 피지컬 AI 의 성장 중심축이 휴머노이드에서 자율주행과 로보택시로 이동할 것으로 전망했다고 보도됨, 보고서는 세계 피지컬 AI 시장을 2025년 888억 달러에서 2035년 1조 5,000억 달러로 잡고, 그 안에서 자율주행 비중이 39%에서 69%로 올라가는 반면 휴머노이드 비중은 2035년 15.8%에 그칠 것으로 제시한 것으로 전해짐, 로보택시 시장은 2025년 15억 달러에서 2035년 4,150억 달러로 연평균 75.5% 성장하고, 자율주행에 필요한 X-by-Wire 시장은 2026년 59억 달러에서 2034년 496억 달러로 연평균 33% 성장할 것으로 전망된 것으로 보도됨, 근거로는 자율주행 상용화를 위한 제도 정비와 하드웨어 공급망·원가 경쟁력 확보가 제시된 것으로 전해짐, 리포트 원문을 공개 취합처에서 찾지 못해 작성 애널리스트를 확인하지 못했고 수치가 전부 전망치이므로 등급을 S4 로 두며 종목·투자 판단에 관한 서술은 옮기지 않음(O33)", "src": "로봇신문 9.14", "pd": "2026-09-14", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48478"}, {"sec": 6, "t": "IEC 의료로봇 국제표준회의, 제주 개막… 자율성 등급 기준 논의", "k": "수술·재활·공통 세 갈래 안전 표준이 2027년 발간을 목표로 개정되는 중", "ez": "의료용 로봇의 안전 기준을 정하는 국제회의가 9월 14일부터 18일까지 제주에서 열림. 국제전기기술위원회(IEC)와 국제표준화기구(ISO)의 전문가 약 100명이 모여 수술 로봇, 재활 로봇, 그리고 두 분야에 공통으로 적용할 안전 기준을 논의함. 눈여겨볼 항목은 의료기기가 스스로 판단하는 정도를 단계로 나누는 기준임. 로봇이 사람의 조작 없이 어디까지 움직여도 되는지를 단계로 나눠 두면, 제조사가 자율이라고 주장할 때 무엇을 증명해야 하는지가 분명해짐. 이 기준들은 아직 만들어지는 중이고 2027년 발간을 목표로 하고 있음. 즉 지금은 제정된 규격이 아니라 개정 작업이 진행되는 단계임. 국내에서는 식약처와 한국로봇산업진흥원 등이 회의 개최에 참여했음.", "body": "국제전기기술위원회(IEC) 의료기기 분야와 국제표준화기구(ISO) 로봇 분야가 함께 여는 의료로봇 국제표준회의가 9월 14일부터 18일까지 제주 그랜드하얏트호텔에서 열린다고 보도됨, 참가 전문가는 약 100여 명이며 IEC/TC62A/JWG9(의료로봇 공통)·IEC/TC62D/JWG35(수술로봇)·IEC/TC62D/JWG36(재활로봇) 세 작업반이 참여하는 것으로 전해짐, 다루는 표준은 의료기기 자율성 수준을 규정하는 IEC/TS 80601-4-1, 로봇 보조 수술장비의 IEC 80601-2-77, 재활·평가·보상·완화 의료로봇의 IEC 80601-2-78 이며 모두 2027년 발간을 목표로 개정 작업이 진행 중인 것으로 보도됨, 회의는 9월 14~15일 공통 작업반, 16~18일 수술·재활 작업반 순으로 잡힌 것으로 전해짐, 식품의약품안전처와 한국의료기기안전정보원·한국로봇산업진흥원·한국AI로봇산업협회가 주최·후원에 참여한 것으로 전해지나 주최 기관 공지 게시판을 직접 열어 확인한 결과 해당 공지가 올라와 있지 않아 보도를 출처로 삼고 등급을 S3 으로 둠, 개정 중인 문서이므로 제정과 혼동하지 않음", "src": "로봇신문 9.14", "pd": "2026-09-14", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48470"}, {"sec": 7, "t": "[칼럼] IITP 원장, 피지컬 AI 데이터의 국가 표준화 제언", "k": "중국은 데이터 공장 70곳을 운용하며 40곳을 추가로 증설하는 중", "ez": "정보통신기획평가원 홍진배 원장이 신문 칼럼에서 피지컬 AI 의 승부는 데이터에서 결정된다고 주장했음. 인터넷에 있는 영상은 사람이 옆에서 지켜본 장면이라, 로봇이 물건을 쥘 때 힘을 얼마나 줘야 하는지 같은 감각은 그 영상으로 배울 수 없다는 것임. 그래서 로봇이 직접 겪은 시점의 데이터를 확보해야 한다고 설명했음. 근거로 미국 피겨 AI 가 1년간 데이터와 컴퓨터에 1조 4,000억 원을 쓰기로 한 점, 중국이 데이터를 모으는 전용 공장 70곳을 운용하며 40곳을 더 건설하고 있는 점을 들었음. 제언은 네 가지임. 데이터의 형식과 품질 기준을 국가 차원에서 통일할 것, 기업과 대학이 함께 쓸 기반을 만들 것, 가상 환경에서 데이터를 불려 쓸 것, 현장에서 검증하고 다시 현장으로 돌아오는 순환을 만들 것임.", "body": "홍진배 정보통신기획평가원(IITP) 원장이 9월 15일 머니투데이 칼럼에서 피지컬 AI 의 승부처를 데이터 플라이휠로 규정하고 국가 차원의 수집·관리 체계 구축을 제언했음, 필자는 웹의 3인칭 관찰 영상만으로는 로봇이 물리 법칙과 미세한 힘 조절을 배울 수 없다며 시각 정보와 물리적 동작이 결합된 1인칭 데이터 확보를 과제로 제시했음, 근거로 피겨 AI 가 향후 1년간 데이터·컴퓨팅에 10억 달러(약 1조 4,000억 원)를 투입하기로 한 점, 중국이 데이터 공장 70곳을 운용하며 40곳을 추가 증설하는 점, 구글 딥마인드가 22종 로봇의 데이터를 함께 학습시켜 작업 성공률을 50% 높인 사례를 들었음, 제언은 데이터 스키마·포맷·품질 기준의 국가 표준화, 산학연 개방형 협업 기반 마련, 월드모델과 시뮬레이터를 이용한 합성데이터 생성, 현장 검증에서 가상 확장을 거쳐 현장 재검증으로 돌아오는 순환 구조 확립의 넷임, 필자는 국내 산업 현장의 경험을 숙련의 역사로 표현하며 이를 데이터로 전환하면 선도국 도약이 가능하다고 주장한 것으로 전해짐, 칼럼이므로 사실 보도와 필자의 판단이 섞여 있어 등급을 S3 으로 두고 제언 부분은 주장으로 다룸", "src": "머니투데이 칼럼 9.15", "pd": "2026-09-15", "url": "https://www.mt.co.kr/opinion/2026/09/15/2026091414010280168"}, {"sec": 7, "t": "모비루스 등 14개 기관, 국산 AI반도체 기반 무인 농작업 로봇 개발 착수", "k": "총사업비 431억 원으로 2030년까지 방제·수확·운반의 무인화를 목표로 세운다", "ez": "국내 기업 모비루스가 국산 인공지능 반도체를 넣은 무인 농업 로봇을 개발하는 국가 과제의 세부 주관기관으로 뽑혔음. 온디바이스 AI반도체란 인터넷 연결 없이 기기 안에서 곧바로 판단을 처리하는 칩을 말함. 이 과제는 2026년 7월부터 2030년 12월까지 4년 반 동안 진행되며, 총사업비는 약 431억 원이고 14개 기업·대학·연구기관이 함께 참여함. 목표는 농약을 뿌리고 작물을 거두고 옮기고 살피는 작업을 사람 없이 로봇이 하도록 만드는 것임. 모비루스가 맡은 3세부는 연구비 87억 8,000만 원 규모이고 이 가운데 66억 원이 정부 지원임. 대동로보틱스와 레인보우로보틱스가 로봇 본체를, 모빌린트가 반도체를, 서울대가 현장 실증을 나눠 맡음.", "body": "모비루스가 「국산 온디바이스 AI반도체 기반 무인 농작업 로봇 기술 개발」 과제의 3세부 주관기관으로 선정됐다고 보도됨, 과제는 산업통상부와 한국산업기술기획평가원(KEIT)의 K-온디바이스 AI반도체 기술개발 사업에 속하며 2026년 7월부터 2030년 12월까지 54개월간 총사업비 약 431억 원 규모로 14개 산학연 기관이 참여하는 것으로 전해짐, 3세부 연구개발비는 87억 8,000만 원이고 이 가운데 정부지원분은 66억 원이며 나머지의 부담 주체는 보도에 제시되지 않았음, 1세부는 대동로보틱스가 총괄하고 레인보우로보틱스·코라스로보틱스·한아에스에스·한국로봇융합연구원·한국농업기술진흥원·국립농업과학원이 참여하며, 2세부는 모빌린트와 한국전자기술연구원이, 3세부는 모비루스 주관으로 대동애그테크·슈어소프트테크·서울대학교가 참여하는 것으로 보도됨, 목표는 방제·수확·운반·예찰 등 주요 농작업의 무인화이며 모비루스가 AI 기반 무인 농작업 솔루션 개발을 총괄하고 슈어소프트테크가 AI 모델 검증을 맡는 것으로 전해짐, 부처 사업이지만 수행기업이 주체가 된 이행 사항이어서 게재 대상에 해당하고, 원문을 확보하지 못해 등급을 S3 으로 둠", "src": "로봇신문 9.14", "pd": "2026-09-14", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48475"}, {"sec": 7, "t": "출연연 기관장 15명, 전국을 피지컬 AI 실증 현장으로 전환하자고 제안", "k": "해양·화학·건설 등 도메인별 실증 기반을 각 기관이 담당하겠다고 밝혔다", "ez": "정부출연연구기관과 과학기술원의 기관장 15명이 9월 14일 서울에서 열린 피지컬 AI 포럼에 함께 참석해, 전국의 산업 현장을 로봇 실증 무대로 바꾸자고 제안했음. 한국기계연구원장은 로봇을 시험할 공간을 확대하고, 로봇 관절 부품과 센서가 실제로 얼마나 오래 견디는지를 평가하는 체계가 필요하다고 설명했음. 한국과학기술정보연구원장은 한국이 해외 기업도 탐내는 실증 무대라고 진단했음. 한국해양과학기술원은 바다 분야를, 한국화학연구원은 24시간 돌아가는 자율실험실을 각각 자기 기관이 맡을 영역으로 제시했음. 행사에는 500여 명이 참석했고, 내년 피지컬 AI 예산 3조 1,000억 원과 중국이 세계 휴머노이드 부품 공급망의 63%를 차지한다는 수치가 함께 언급됐음.", "body": "디지털타임스가 9월 14일 서울 은행회관에서 연 피지컬 AI 포럼에 출연연과 과기원 기관장 15명이 참석해 실증 기반 확충을 제안했다고 보도됨, 참석자는 류석현 한국기계연구원장·이식 한국과학기술정보연구원장·신석민 한국화학연구원장·이희승 한국해양과학기술원장·오상록 한국과학기술연구원장·김형철 한국지능정보사회진흥원장·정희권 연구개발특구진흥재단 이사장·김영식 국가과학기술연구회 이사장 등으로 전해짐, 류석현 원장은 테스트베드 확대와 액추에이터·센서 신뢰성 평가가 필요하다며 반도체·자동차·조선·배터리의 제조 기반을 데이터로 전환하는 것이 경쟁력이라고 설명했음, 이식 원장은 한국이 글로벌 기업이 탐내는 피지컬 AI 테스트베드라고 진단했고, 이희승 원장은 해양 분야를, 신석민 원장은 자율실험실을 각각 자기 기관의 실증 기반으로 제시했음, 오상록 원장은 에너지·반도체·AI데이터센터·AI모델·응용의 다섯 요소를 필수 조건으로 들었음, 행사에는 500여 명이 참석했고 내년 피지컬 AI 예산 3조 1,000억 원과 2040년까지 최소 1조 달러(약 1,344조 원) 가치 전망, 중국의 세계 휴머노이드 부품 공급망 점유율 63%가 함께 제시된 것으로 보도됨, 포럼 발언이어서 기관 발표 문서가 없으므로 보도를 출처로 삼고 등급을 S3 으로 둠, 정부 부처 발표는 이 항목에서 다루지 않음", "src": "디지털타임스 기획 9.14", "pd": "2026-09-14", "url": "https://www.dt.co.kr/article/12083898"}, {"sec": 8, "t": "베이징 인형로봇혁신센터, 합성데이터 생성용 월드모델 시뮬레이터 공개", "k": "생성 궤적 500개를 시연 50개에 더하자 작업 성공률이 70%에서 93%로 상승", "ez": "중국 베이징의 국책 로봇 연구기관이 로봇 학습용 가상 환경 「Pelican-Sim 1.0」 을 논문으로 공개했음. 이 프로그램은 로봇이 어떤 동작을 하면 눈앞 장면이 어떻게 바뀌는지를 영상으로 만들어 내는 방식임. 즉 실제 로봇을 움직이지 않고도 학습에 쓸 데이터를 늘릴 수 있음. 학습에는 실제 로봇과 가상 로봇에서 모은 약 100만 건의 작업 기록, 시간으로는 8,000시간 분량이 쓰였음. 성능은 한 벤치마크에서 확인됐음. 사람이 직접 보여 준 시연 50건만 쓸 때 작업 성공률이 70%였는데, 여기에 프로그램이 만들어 낸 500건을 더하자 93%로 올랐음. 다만 이 논문은 아직 동료 연구자의 심사를 거치지 않은 사전 공개본이고, 모델과 코드를 언제 공개할지는 밝히지 않았음.", "body": "중국 베이징 인형로봇혁신센터(X-Humanoid)가 체화 지능용 범용 월드모델 시뮬레이터 「Pelican-Sim 1.0」 을 논문으로 공개했으며 arXiv 제출일은 9월 10일, 공고일은 9월 14일임 — 이 지면은 논문의 게재 창을 공고일로 잡음, 모델은 혼합전문가(MoE) 구조이고 입력 이미지와 28차원 행동을 받아 이어질 관측 영상을 생성하는 방식임, 학습에는 실기와 시뮬레이션 로봇 데이터 약 100만 궤적·8,000시간이 쓰였고 AgiBotWorld·RoboMIND·RoboTwin 등 공개 데이터셋에서 수집한 것으로 본문에 적혀 있음, 논문이 제시한 활용은 넷이며 그 가운데 RoboTwin 벤치마크에서 작업마다 시연 50개에 생성 궤적 500개를 더했을 때 정책 성공률이 70%에서 93%로 올랐고, 정책 평가에서는 다섯 개 체크포인트에 대해 피어슨 상관 0.994 를 기록한 것으로 본문에 적혀 있음, 저자들은 모델 체크포인트와 추론 코드를 공개할 예정이라고 밝혔으나 공개 시점은 제시하지 않았음, 동료심사를 거치지 않은 프리프린트여서 등급은 S3 을 넘지 않음", "src": "베이징 인형로봇혁신센터(X-Humanoid) 논문 9.14", "pd": "2026-09-14", "url": "https://arxiv.org/abs/2609.12036"}, {"sec": 8, "t": "스위스 취리히연방공대, 대형 유압 굴착기로 제방 자율 시공 시연", "k": "11.5t 굴착기가 45분 동안 201회를 시행해 길이 42m 제방을 자율 축조", "ez": "스위스 취리히연방공대 연구진이 굴착기가 스스로 흙을 다뤄 제방을 쌓는 실험 결과를 논문으로 공개했음. 지금까지 자동화된 굴착기는 흙을 퍼서 옮겨 붓는 동작까지만 할 수 있었음. 흙을 밀고 눌러 원하는 모양을 만드는 작업은 흙이 어떻게 흘러내릴지 예측해야 해서 어려웠음. 연구진은 흙 알갱이의 움직임을 계산하는 가상 환경에서 로봇을 학습시켰고, 흙의 모양과 단단한 정도를 함께 입력으로 받게 했음. 그 결과 11.5톤짜리 실제 유압 굴착기가 45분 동안 201번 동작해 길이 42미터, 높이 2.1미터의 제방을 사람 조작 없이 쌓았음. 같은 학습 결과를 무게 500그램짜리 탁상용 로봇에도 그대로 적용해 작동시켰음. 이 논문도 아직 동료 심사를 거치지 않은 사전 공개본임.", "body": "스위스 취리히연방공대 로보틱시스템랩이 흙을 다루는 작업을 강화학습으로 익힌 굴착기 제어 정책을 논문으로 공개했으며 arXiv 제출일은 9월 11일, 공고일은 9월 14일임 — 이 지면은 논문의 게재 창을 공고일로 잡음, 학습은 GPU 병렬 물질점법(MPM) 입자 시뮬레이션에서 이뤄졌고 정책은 흙의 형상과 다짐 정도 같은 물질 상태를 조건으로 받아 버킷의 여러 접촉면을 함께 쓰는 동작을 익힌 것으로 본문에 적혀 있음, 검증은 11.5t 유압 굴착기와 500g 탁상 로봇 두 기체에서 이뤄졌고, 같은 학습 가중치를 정규화된 말단 좌표계와 보정된 기계 인터페이스를 거쳐 양쪽에 그대로 적용한 것으로 제시됨, 실기 결과로는 11.5t 굴착기가 45분 동안 201회 동작을 수행해 길이 42m·높이 2.1m 제방을 자율로 축조한 것으로 본문에 적혀 있음, 기존 자율 시스템이 굴착과 하역 주기에 머물러 있던 것과 달리 되메우기·다지기처럼 흙을 밀고 눌러 형상을 만드는 작업을 포함한 점이 차이로 제시됨, 동료심사를 거치지 않은 프리프린트여서 등급은 S3 을 넘지 않음", "src": "취리히연방공대(ETH Zürich) 논문 9.14", "pd": "2026-09-14", "url": "https://arxiv.org/abs/2609.12677"}]}, {"date": "2026-09-14", "items": [{"sec": 2, "t": "中 유니트리, 자율 판단을 내세운 휴머노이드 격투 영상 공개", "k": "새 제어 모델을 적용했으나 시행 횟수와 편집 여부는 공개되지 않았다", "ez": "중국 로봇기업 유니트리가 휴머노이드 G1 에 새 제어 모델을 적용해 사람과 겨루는 격투 영상을 공개했음. 회사는 로봇이 상대의 움직임을 보고 다음 동작을 스스로 정하는 방식이며, 미리 만들어 둔 동작을 재생하거나 사람이 조종기로 조작한 것이 아니라고 설명했음. 영상 속 로봇은 주먹과 발차기를 내고 상대의 공격을 피한 뒤 반격하며 스스로 자리를 옮김. 다만 공개된 자료는 영상 한 편뿐임. 같은 시연을 몇 번 했는지, 몇 번 성공했는지, 영상을 편집하거나 빠르게 돌렸는지, 상대의 동작이 미리 정해진 것인지는 공개되지 않았음. 로봇이 넘어지거나 실패한 장면도 영상에 담기지 않았음.", "body": "중국 유니트리가 휴머노이드 G1 에 새 제어 모델 유니폴름 X2-1.0 을 적용해 사람과 겨루는 격투 영상을 공개했다고 보도됨, 회사는 인공지능이 주변 상황을 인식하고 이어질 상황을 실시간으로 예측해 다음 행동을 스스로 결정하는 방식이며 사전 프로그래밍된 동작이나 사람의 원격조종이 아니라고 설명했고 완전 자율 방식의 휴머노이드 격투는 세계 최초라고 주장한 것으로 전해짐, 영상에서 기체는 주먹과 발차기를 내고 상대 공격을 피한 뒤 반격하며 스스로 이동함, 다만 공개된 것은 영상 한 편이고 시행 횟수와 성공률, 편집·배속 여부, 상대의 동작이 사전에 정해진 것인지, 넘어짐이나 실패 장면이 포함됐는지가 제시되지 않아 자율성과 성능의 근거로 쓰지 않음, 회사 공식 뉴스센터를 직접 열어 최신 게시가 8월 5일이고 이번 격투 영상 발표가 올라와 있지 않음을 확인했으므로, 중국어 발표가 영문 뉴스센터에 오르지 않는 경우로 보고 중국 로봇 전문 포털의 보도를 출처로 삼음, 이 건은 오늘 지면의 균형 축에 해당함 — 같은 날 지면의 초도 물량 완판과 현장 투입 항목과 나란히 읽으면 기체와 판매는 앞서가는데 동작의 자율성을 검증할 공개 절차는 그대로 비어 있음이 드러남", "src": "전자신문 9.11 · 로봇신문 9.13", "pd": "2026-09-11", "url": "https://www.etnews.com/20260911000189", "url2": "https://www.irobotnews.com/news/articleView.html?idxno=48454"}, {"sec": 2, "t": "인티그리트, 피지컬 AI 플랫폼 공급처를 개발자 시장까지 확대", "k": "누적 공급 1,200대를 넘겼고 신형은 초당 100조 회 연산을 낸다", "ez": "국내 기업 인티그리트가 로봇용 소프트웨어 플랫폼 에어패스를 기업과 개발자에게 개방하고 판매 경로를 넓힌다고 밝혔음. 이 플랫폼은 제조사가 서로 다른 로봇들을 하나의 인공지능·데이터 체계로 묶어 움직이게 하는 역할을 함. 누적 공급 대수는 1,200대가 넘음. 연산 성능은 구형이 초당 최대 48조 회, 신형이 초당 최대 100조 회임. 함께 쓰이는 인공지능 모델은 눈으로 보고 말을 알아들어 동작으로 옮기는 방식이며, 기기에 바로 적용할 수 있도록 크기를 줄인 판임. 실제 적용된 곳으로는 반도체 공장에서 쓰이는 네발로봇과 인천국제공항의 셀프 체크인 서비스 로봇이 제시됐음. 다만 1,200대가 판매 기준인지 실제 가동 기준인지는 구분되지 않았음.", "body": "국내 기업 인티그리트가 피지컬 AI 플랫폼 에어패스를 기업과 개발자 시장에 개방하고 유통 채널을 넓힌다고 보도됨, 누적 공급 대수는 1,200대 이상으로 제시됐고 연산 성능은 V4 가 초당 최대 48조 회, V5 가 초당 최대 100조 회로 밝혀졌으며 함께 쓰이는 시나AI 는 50억·80억 개 변수 규모의 경량 시각언어행동 모델 기반으로 설명됨, 유통은 엘레파츠·디바이스마트·아이씨뱅큐 등 부품 유통 채널을 통해 넓히고, 적용 사례로는 반도체 생산 현장의 사족보행 로봇과 인천국제공항의 셀프 체크인 서비스 로봇이 제시됨, 허석영 상무는 여러 대의 서로 다른 기종을 공통의 인공지능·데이터·임무 체계로 연결하는 실행 플랫폼을 지향한다고 말한 것으로 전해짐, 다만 1,200대의 성격이 누적 판매인지 설치 가동인지 구분되지 않았고 사례별 도입 대수와 도입처의 평가 결과, 개방의 범위와 가격 정책이 제시되지 않아 실적으로 단정하지 않음, 회사 공식 사이트와 RSS 를 직접 열어 최신 게시가 9월 1일자 플랫폼 소개 글이고 이번 공급 확대 공지가 없음을 확인했으므로 회사가 따로 발표하지 않은 경우로 보고 보도를 출처로 삼음", "src": "로봇신문 9.13", "pd": "2026-09-13", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48453"}, {"sec": 2, "t": "日 APTO, 도쿄에 실물 로봇 데이터 수집 거점 개설", "k": "휴머노이드 200대와 작업 인원 400~500명으로 30만 시간을 모은다", "ez": "일본 인공지능 데이터 기업 APTO 가 도쿄 도요스에 실물 로봇으로 학습 자료를 모으는 전용 시설을 열었음. 로봇이 사람처럼 움직이려면 사진과 글만으로는 부족하고, 로봇이 실제로 움직인 기록과 카메라·센서가 읽은 값, 주변 환경과 부딪친 결과를 함께 모아야 함. 이 시설은 그런 자료를 모으고 다듬는 일을 맡음. 사람이 원격으로 로봇을 조종해 동작을 만들고, 어떤 환경에서 모을지 설계하며, 모은 자료에 이름표를 붙이고 품질을 평가하는 과정이 한자리에서 이뤄짐. 보도에 따르면 휴머노이드 200대를 두고 교대 인원까지 400~500명이 일하며, 면적은 약 1,700제곱미터로 2027년 상반기에 1,000제곱미터를 더 넓힘. 모으려는 자료는 누적 30만 시간임. 개소식에는 일본 중의원·참의원 의원과 엔비디아, 도요타자동차 관계자가 참석했음.", "body": "일본 인공지능 데이터 기업 APTO 가 피지컬 AI 개발에 필요한 실물 로봇 데이터 수집 거점 도요스 데이터 팩토리를 도쿄에 열었음, 회사 공지 원문을 직접 열어 확인한 결과 개소식은 8월 21일에 열렸고 공지 게시일은 9월 10일이며 국내 보도는 9월 13일이 처음이어서 국내 첫 도달로 다룸, 개소식 참석자는 APTO 다카시나 료 대표와 참의원 의원이자 로봇의원연맹 사무국장인 야마다 다로, 중의원 의원이자 로봇의원연맹 회장인 야마기와 다이시로, 엔비디아 로보틱스사업부장 히라노 가즈마사, 도요타자동차 미래창생센터 쓰치나가 마사요시로 확인됨 — 의원연맹 회장과 사무국장이 함께 선 자리임, 규모는 8월 28일자 보도에서 휴머노이드 200대와 교대를 포함한 작업 인원 400~500명, 현재 면적 약 1,700제곱미터에 2027년 상반기 약 1,000제곱미터 추가 확장, 누적 수집 목표 30만 시간으로 제시됐으며 이 수치는 회사 공지가 아니라 보도에 근거하므로 확정된 계획으로 읽지 않음, 수집하는 자료는 1인칭 시점 영상과 로봇 팔의 관절 각도·위치, 영상·깊이 정보를 결합한 모방학습용 다중 양식 자료이고, 회사는 실물 로봇 데이터 수집에 설비뿐 아니라 원격조작과 수집 환경 설계, 라벨링, 품질 평가 같은 운영 역량이 필요하다고 밝히며 대응 가능한 로봇과 작업, 데이터 종류를 순차적으로 넓혀 학습·평가로 이어지는 데이터 파이프라인을 세우겠다고 적음, 다만 투자액과 로봇 기종 구성, 이미 모은 시간은 공개되지 않음", "src": "APTO 공지 9.10 · 로봇신문 9.13 · 비즈니스인사이더재팬 8.28", "pd": "2026-09-10", "url": "https://apto.co.jp/news/3945/", "url2": "https://www.irobotnews.com/news/articleView.html?idxno=48413", "url3": "https://www.businessinsider.jp/article/2608-atom-ai-robot-data-factory-toyosu/"}, {"sec": 3, "t": "中 제로스, 100만 원대 소형 휴머노이드 초도 물량 소진", "k": "8,888위안 기체 1,000대가 출시 일주일 안에 모두 팔렸다", "ez": "중국 로봇기업 제로스가 내놓은 소형 휴머노이드 브릿지 1,000대가 출시 일주일이 되기 전에 모두 팔렸음. 가격은 8,888위안, 우리 돈으로 약 177만 원임. 중국 온라인 쇼핑몰 징둥닷컴에서 팔았고 첫날에만 600대가 나갔음. 키는 88센티미터, 무게는 약 13킬로그램임. 관절이 낼 수 있는 힘은 최대 50뉴턴미터이며, 그 힘을 얼마나 정확히 조절하는지를 나타내는 오차는 3% 이하라고 회사는 밝혔음. 회사는 1만 위안 아래 가격으로 나온 세계 첫 고성능 휴머노이드라고 설명했고, 이 제품은 베를린 국제가전박람회에서 차세대 기술 부문 최고상을 받았음. 다만 1,000대가 예약을 받은 수인지 실제로 보낸 수인지는 구분되지 않았음.", "body": "중국 제로스가 내놓은 소형 휴머노이드 브릿지 1,000대가 출시 일주일이 되기 전에 모두 팔렸다고 보도됨, 가격은 8,888위안(약 177만 원)이고 판매처는 징둥닷컴이며 첫 판매일에 600대가 나갔다고 전해짐, 사양은 키 88센티미터, 무게 약 13킬로그램, 최대 토크 50뉴턴미터, 토크 제어 정확도 3% 이하로 제시됐고 회사는 1만 위안 아래 세계 첫 고성능 휴머노이드라고 내세웠으며 베를린 국제가전박람회 2026 의 차세대·신흥기술 부문 최고상을 받은 것으로 전해짐, 다만 1,000대가 예약 접수인지 실제 출하인지 구분되지 않았고 인도 시점과 연간 생산능력, 토크와 제어 정확도를 어떤 조건에서 측정했는지가 제시되지 않아 성능과 실적의 근거로 쓰지 않음, 회사 발표 원문을 확인하지 못해 2차 자료에 근거함, 대수는 층위가 다른 숫자이므로 판매 1,000대를 가동 대수로 읽지 않음", "src": "로봇신문 9.11", "pd": "2026-09-11", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48450"}, {"sec": 4, "t": "中 선전, 우편 분류와 물류 운반에 휴머노이드 현장 투입", "k": "소포 분류는 시간당 1,200개, 운반 성공률은 95.8%로 제시됐다", "ez": "중국 선전의 세 현장에 휴머노이드가 실제 업무로 투입됐음. 선전시 우편물 처리센터에서는 워넝쥐선이 만든 H007 이 소포를 집어 뒤집고 제자리에 놓는 일을 맡음. 시간당 최대 1,200개를 처리하며 정확도는 95%를 넘는다고 제시됐음. 하이체인로지스틱스 물류창고에서는 러쥐로보틱스의 로봇이 짐받이에서 컨베이어로 물건을 옮기는 일을 함. 성공률은 95.8%, 한 번 처리하는 데 평균 28초가 걸리며 8시간 동안 이어서 움직였음. 선전 지하철 9호선 쳰완역에서는 편의점 물건을 채우는 일에 쓰이며, 엘리베이터 앞으로 스스로 가서 기다렸다가 타는 동작을 함. 다만 몇 대가 투입됐는지, 사람이 얼마나 개입했는지는 공개되지 않았음.", "body": "중국 선전에서 휴머노이드가 세 곳의 현장 업무에 투입됐다고 보도됨, 선전시 우정 육상운송 우편물 처리센터에는 워넝쥐선의 소포 분류 로봇 H007 이 들어가 소포를 집고 뒤집어 놓는 작업을 맡았으며 시간당 최대 1,200개를 분류하고 정확도는 95% 이상으로 제시됨, 하이체인로지스틱스 물류창고에는 러쥐로보틱스의 기체가 팔레트에서 컨베이어로 옮기는 고빈도 운반 라인에 투입돼 성공률 95.8%, 평균 28초 주기로 8시간 연속 가동했다고 전해짐, 선전 지하철 9호선 쳰완역에서는 편의점 재고를 채우는 작업에 투입돼 엘리베이터에 스스로 접근하고 기다렸다가 탑승하는 동작을 수행했다고 설명됨, 다만 세 현장 모두 투입 대수와 운영 기간, 자율 동작인지 원격조작이 섞였는지, 고장·정지 횟수와 사람이 개입한 비율이 공개되지 않았고 기업·기관의 발표 원문을 확인하지 못해 2차 자료에 근거하므로 가동 실적으로 단정하지 않음, 성공률 95.8%는 평가 구간과 대상 물품이 밝혀지지 않아 다른 현장의 수치와 비교하지 않음", "src": "로봇신문 9.11", "pd": "2026-09-11", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48447"}, {"sec": 4, "t": "中 선전 공안, 휴머노이드 투입한 로봇 파출소 운영", "k": "지난 7월 실전 배치했고 촬영 영상을 지휘센터로 실시간 보낸다", "ez": "중국 선전시 공안국 룽강분국의 반톈 파출소가 지난 7월부터 로봇을 실제 치안 업무에 투입하고 있음. 배치된 장비에는 사람 모양의 휴머노이드를 비롯해 여러 형태의 로봇과 무인 장비가 포함됨. 맡은 일은 이상 행동을 찾아내는 것, 실종되거나 연락이 끊긴 사람을 수색하는 것, 긴급 상황에 먼저 도착해 대응하는 것임. 로봇이 찍은 영상은 경찰 지휘센터로 곧바로 전달되며, 판단과 지시는 경찰이 내림. 로봇이 혼자 결정해 조치하는 구조는 아님. 순찰에 쓰이는 휴머노이드는 중국 엔진AI 가 만든 T800 임. 다만 몇 대가 배치됐는지, 하루에 몇 시간 움직이는지, 투입한 뒤 실제로 어떤 성과가 있었는지는 공개되지 않았음.", "body": "중국 선전시 공안국 룽강분국 반톈 파출소가 지난 7월 로봇 경찰서를 정식으로 실전 업무에 투입했다고 보도됨, 배치된 장비는 휴머노이드를 포함한 여러 형태의 로봇과 무인장비이며 맡은 일은 이상 행동 식별과 실종·연락두절자 수색, 긴급 상황 대응 셋으로 제시됨, 운영 방식은 로봇이 촬영한 영상을 경찰 지휘센터로 실시간 전송하고 경찰이 지시를 내리는 협업 체계로 설명돼 로봇이 단독으로 판단해 조치하는 구조는 아님, 순찰에 투입된 기체는 중국 엔진AI 가 개발한 휴머노이드 T800 으로 전해짐, 다만 배치 대수와 순찰 구역의 범위, 하루 가동시간과 충전 주기, 투입 뒤의 검거·수색 실적과 오인 식별 사례가 공개되지 않았고 공안국 발표 원문을 확인하지 못해 2차 자료에 근거하므로 성과로 읽지 않음, 투입 시점이 지난 7월이나 국내 보도는 9월 11일이 처음으로 확인돼 새로 알려진 사실로 다루되 신규성 점수를 낮춤", "src": "전자신문 9.11", "pd": "2026-09-11", "url": "https://www.etnews.com/20260911000315"}, {"sec": 5, "t": "국내 로봇기업, 美 FCC 장비인증 금지로 대미 수출 계약 중단", "k": "레인보우로보틱스 수십 대와 티로보틱스 150억 원 공급이 함께 걸렸다", "ez": "미국이 외국에서 만든 이동형 로봇에 새 장비인증을 내주지 않기로 하면서 국내 로봇기업의 미국 판매가 막혔음. 미국에서 전자기기를 팔려면 연방통신위원회의 장비인증을 먼저 받아야 하는데, 7월 28일부터 휴머노이드와 네발로봇, 자율주행로봇처럼 스스로 움직이며 통신 기능을 갖춘 외국산 기기가 이 인증 대상에서 빠졌음. 이미 인증을 받은 기종과 소비자가 이미 구입한 제품, 연방정부가 사는 물량은 그대로 유지되며 기존 기기의 소프트웨어 갱신도 2029년 1월 1일까지 허용됨. 막힌 것은 아직 인증을 받지 않은 새 기종임. 레인보우로보틱스는 북미 고객과 맺은 수십 대 규모의 수출이 중단됐고, 티로보틱스는 포드 에너지에 2028년 6월까지 약 150억 원어치를 공급하기로 한 계약이 이 규제에 걸려 있음. 예외를 인정받으려면 2028년 1월 1일까지 미국 전쟁부에 신청해야 함. 요구 서류에는 부품별 원산지를 담은 부품표와 국가별 공급망 집중도, 미국 내 제조를 넓히겠다는 시한 명시 계획이 들어감.", "body": "미국 연방통신위원회가 7월 28일 외국에서 생산된 첨단 로봇기기를 우려목록에 올려 신규 장비인증을 금지한 조치가 국내 로봇기업의 대미 수출을 막고 있다고 보도됨, 공고문(DA 26-786)과 조건부 승인 지침(Annex A), 후속 공고(DA 26-789)를 직접 열어 확인한 제도의 내용은 이러함 — 백악관이 소집한 행정부 부처 합동기구가 7월 27일 보낸 국가안보 판정에 따른 조치이고, 판정문은 외국산 첨단 로봇기기가 공급망 취약성과 사이버안보 위험을 만든다고 적었으며, 미국 전쟁부가 조건부 승인을 내준 기기만 예외이고, 이미 인증받은 기종의 수입·판매와 소비자가 이미 구입한 기기, 연방정부의 구매·사용은 적용 대상이 아니며, 기존 인증 기기의 소프트웨어·펌웨어 갱신은 최소 2029년 1월 1일까지 허용됨, 막히는 것은 인증을 아직 받지 않은 신규 기종의 수입·유통·판매임, 대상은 공고문이 휴머노이드와 사족보행 로봇을 예로 든 이동형 로봇이며 관절형·직교좌표형 같은 고정식 산업용 로봇은 국제로봇연맹 자료에서 제외 대상으로 정리됨, 조건부 승인은 지침 원문에 신청 마감이 2028년 1월 1일로 명시돼 있고, 요구 자료는 지배구조(5% 이상 실질소유자·이사와 경영진의 국적과 거주국·외국정부의 지분과 영향력), 부품표 전체와 부품별 원산지, 설계 원산지, 지식재산권 소유자와 소프트웨어 갱신 주체, 제조·최종조립·시험 장소, 온보드 소프트웨어와 펌웨어의 원산지, 국가별 공급망 집중도를 가치와 생산량 백분율로 낸 평가, 단일 공급처와 그 대체계획, 그리고 미국 내 제조를 세우거나 넓히는 시한 명시 계획과 분기별 진도 보고임, 국내 보도가 전한 미국산 부품 65% 이상과 2029년부터 75%라는 요건은 지침 원문에서 확인되지 않음 — 그 비율은 연방조달규정의 국산품 판정 기준이고 공고문에서는 무인기 예외 조항에 붙어 있으므로 로봇 조건부 승인의 요건으로 옮겨 쓰지 않고 미확정 사항으로 등록함, 국내 영향으로는 레인보우로보틱스의 RB-Y1 미국 수출이 멈춰 북미 고객과 맺은 수십 대 규모 계약이 중단됐고 티로보틱스가 포드 에너지와 맺은 2028년 6월까지 약 150억 원 규모 무인운반차 공급 계약이 걸려 있으며 국내 자율주행로봇 업체 한 곳은 첫 미국 수주 직후 규제를 만났다고 보도됨", "src": "전자신문 9.11 · FCC 공고문 7.28 · FCC 조건부 승인 지침 7.27", "pd": "2026-09-11", "url": "https://www.etnews.com/20260911000247", "url2": "https://docs.fcc.gov/public/attachments/DA-26-786A1.pdf", "url3": "https://www.fcc.gov/sites/default/files/robots-ca.pdf"}, {"sec": 5, "t": "日 화낙·구글, 도면 읽고 용접 조건 정하는 로봇 에이전트 개발", "k": "태블릿으로 찍은 종이 도면에서 전류와 속도를 읽어 12월 구독형으로 나온다", "ez": "일본 공작기계 기업 화낙과 구글이 함께 만든 인공지능 용접 도우미가 12월에 나옴. 태블릿 카메라로 종이 도면을 찍으면 어디를 용접해야 하는지, 전류와 전압은 얼마로 하고 얼마나 빠르게 움직여야 하는지를 인공지능이 읽어 냄. 그러면 로봇이 필요한 동작을 스스로 판단해 실행함. 지금까지는 숙련공이 그 조건을 하나씩 입력해야 했음. 이 제품은 구글의 기업용 인공지능을 바탕으로 만들었고, 안전 울타리를 세우지 않아도 되는 협동로봇에 붙여 씀. 주된 대상은 사람을 구하기 어려운 작은 제조업체임. 매달 요금을 내는 구독 방식으로 제공되며 금액은 공개되지 않았음. 도면 자료가 밖으로 새지 않게 막는 기능도 들어감.", "body": "일본 화낙과 미국 구글이 인공지능 용접 에이전트를 공동 개발해 12월 출시한다고 보도됨, 작동 방식은 태블릿 카메라로 종이 도면을 촬영하면 용접 위치와 전류·전압·속도 같은 조건을 자동으로 읽어 내고 로봇이 필요한 동작을 스스로 판단해 실행하는 구성이며 사용자가 프로그래밍 지식 없이 조작할 수 있다는 점이 내세워짐, 기반 모델은 구글의 제미나이 엔터프라이즈이고 기체는 안전 펜스가 필요 없는 협동로봇 기반으로 설계돼 영세·중소 제조업체를 주된 대상으로 삼음, 제공 방식은 구독형이며 요금은 공개되지 않았고 도면 데이터가 외부로 새지 않게 하는 기능이 포함된다고 설명됨, 다만 판독 정확도와 대응 가능한 도면 형식, 용접 재질과 두께의 범위, 실제 시험 현장과 시행 횟수가 제시되지 않아 성능을 단정하지 않음, 원 보도가 니혼게이자이 9월 11일자인데 유료 지면이어서 본문을 대조하지 못했고 화낙 공식 발표도 확인하지 못해 2차 자료에 근거함", "src": "로봇신문 9.13", "pd": "2026-09-13", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48436"}, {"sec": 5, "t": "에이딘로보틱스, 조선·중공업용 로봇핸드 공동개발 조건으로 투자 유치", "k": "투자 160억 원을 받아 센서 연 3만 대 양산 체계로 넘어간다", "ez": "국내 센서 기업 에이딘로보틱스가 HD현대로보틱스와 삼성벤처투자로부터 160억 원을 투자받았음. 이 회사는 로봇이 물체에 닿을 때 걸리는 힘과 방향을 읽어 내는 힘·토크 센서와 촉각 센서를 만듦. 로봇이 물건을 얼마나 세게 쥐었는지, 밀리고 있는지를 알려면 이런 센서가 필요함. 2019년 성균관대 연구실에서 갈라져 나와 세운 기업임. 이번 투자는 단순한 자금 조달이 아니라 함께 만들 물건이 정해져 있음. 배 바깥판과 블록의 용접 부위를 다듬는 표면처리 로봇을 HD현대로보틱스와 함께 개발해 조선소에 넣고, HD현대로보틱스가 만들고 있는 휴머노이드에 실을 조선·중공업용 고중량 다섯 손가락 로봇손도 함께 개발함. 힘·토크 센서는 한 해 3만 대를 만들 수 있는 체계를 갖출 계획임. 다만 로봇손의 들어올림 무게와 관절 수, 양산 시점은 공개되지 않았음.", "body": "국내 센서 기업 에이딘로보틱스가 HD현대로보틱스와 삼성벤처투자로부터 160억 원 규모의 전략적 투자를 받았다고 보도됨, 회사는 2019년 성균관대 로보틱스 연구실에서 갈라져 나와 이윤행 대표와 최혁렬 교수가 함께 세웠고, 로봇이 물체에 닿을 때 생기는 힘을 읽는 힘·토크 센서와 촉각 센서, 그 값으로 접촉력을 조절하는 제어 소프트웨어와 표면가공 자동화 솔루션을 공급함, 이번 투자로 제시된 것은 셋임 — 선체 외판과 블록 용접부를 가공하는 표면처리 로봇 자동화 솔루션을 HD현대로보틱스와 공동 개발해 조선소에 적용하고, HD현대로보틱스가 개발 중인 휴머노이드에 실을 조선·중공업 특화 고중량 5지 로봇핸드를 함께 개발하며, 힘·토크 센서의 연간 생산능력을 3만 대 규모로 올림, 판로는 국내 제조업 전반과 미국 조선업을 포함한 해외로 넓힌다는 계획이 함께 제시됐고, 2024년 시리즈B 에는 삼성넥스트·포스코기술투자·CJ대한통운·한국투자파트너스·GS벤처스·코오롱인베스트먼트·DSC인베스트먼트·BNK벤처투자·퓨처플레이가 참여했으며 2025년 삼성전자 씨랩 아웃사이드에 선정된 바 있음, 다만 누적 투자유치액과 이번 라운드의 기업가치, 로봇핸드의 가반하중과 자유도, 양산 착수 시점과 조선소 적용 일정은 제시되지 않아 확정된 거래 구조로 읽지 않음, 회사 뉴스룸과 블로그 목록을 직접 열어 최신 게시가 9월 10일이고 이번 투자 공지가 없음을 확인했으므로 발표가 없어서 2차 자료를 쓰는 경우임, 이 건은 직전 호가 다룬 촉각 데이터 병목과 같은 줄기에 있음 — 그쪽이 데이터의 부족을 짚었다면 이 건은 그 데이터를 만들어 내는 센서의 공급 쪽임", "src": "로봇신문 9.11 · 파이낸셜뉴스 9.11", "pd": "2026-09-11", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48428", "url2": "https://www.fnnews.com/news/202609101508002163"}, {"sec": 7, "t": "[인터뷰] 로브로스, 하드웨어와 인공지능을 함께 개발하는 이유 밝혀", "k": "키 154센티미터 기체의 핵심 부품 60%를 직접 설계해 만든다", "ez": "국내 휴머노이드 기업 로브로스의 김승연 최고기술책임자가 로봇의 몸과 인공지능을 처음부터 함께 만드는 방식을 택한 이유를 설명했음. 인공지능이 현실에서 일을 하려면 몸이 필요하고, 몸이 아무리 좋아도 인공지능이 없으면 제 기능을 하지 못한다는 것임. 대표 기체인 두 발로 걷는 휴머노이드 이그리스-C 는 키 154센티미터, 무게 56킬로그램임. 회사는 핵심 부품의 60%를 직접 설계해 생산함. 기체마다 품질이 달라지지 않게 하기 위해서임. 손은 사람처럼 다섯 손가락이지만 힘을 내는 장치를 손이 아니라 팔뚝에 두고 줄로 당기는 구조를 썼음. 세밀한 움직임보다 공장에서 견디는 힘을 앞에 둔 선택임. 지금은 사람이 원격으로 조종하며 현장 데이터를 모으는 단계이며, 검증이 끝난 뒤 양산에 들어갈 계획임.", "body": "국내 휴머노이드 기업 로브로스의 김승연 최고기술책임자가 하드웨어와 인공지능 제어 모델을 처음부터 함께 개발하는 방식을 택한 배경을 밝힌 것으로 보도됨, 김 최고기술책임자는 서울대에서 로봇공학 박사 학위를 받은 뒤 삼성전자 종합기술원을 거쳤고 인공지능이 현실 세계로 나오려면 하드웨어라는 플랫폼이 필요하고 반대로 하드웨어가 우수해도 인공지능 없이는 제 기능을 하지 못한다고 말함, 대표 기체인 이족보행 휴머노이드 이그리스-C 는 키 154센티미터에 무게 56킬로그램이며 기구 설계부터 제어 알고리즘과 인공지능 소프트웨어까지 자체 개발했다고 설명됨, 핵심 부품의 60%를 직접 설계해 생산해 기체마다 품질이 갈리지 않게 한다는 점과, 손은 사람과 같은 다섯 손가락으로 두되 구동장치를 손이 아니라 팔뚝에 두고 줄로 당기는 방식을 써서 미세 정밀도보다 산업 현장의 힘과 내구성을 앞에 뒀다는 점이 함께 제시됨, 현재는 원격조작으로 산업 현장 데이터를 모으는 실증을 진행하는 중이고 검증을 마친 뒤 양산에 들어간다는 순서가 제시됐으며 후속 기체는 크기를 키우고 배터리를 교체하는 방식으로 연속 가동을 늘린다는 계획이 밝혀짐, 다만 실증의 현장과 기간, 수집한 데이터의 규모와 양산 시점, 투자 유치 규모는 제시되지 않음, 이 항목은 지정 매체의 인터뷰이므로 보도를 출처로 삼음", "src": "머니투데이 9.13", "pd": "2026-09-13", "url": "https://www.mt.co.kr/future/2026/09/13/2026082615090620714"}, {"sec": 8, "t": "DGIST·KAIST, 사람 움직임 예측과 경로 계획을 한 모델에 담아", "k": "두 기능의 학습 영역을 갈라 이동 경로 오차와 충돌 가능성을 낮춘다", "ez": "DGIST 박대희 교수 연구팀이 KAIST 와 함께 로봇이 사람 많은 곳을 다닐 때 필요한 두 가지 일을 하나의 작은 인공지능 모델로 처리하는 방법을 내놓았음. 두 가지란 주변 사람이 앞으로 어디로 갈지 예측하는 일과, 그 사람들을 피해 갈 길을 정하는 일임. 지금까지는 각각 다른 모델을 써야 했고, 그러면 계산 장치와 메모리가 많이 들어 로봇에 싣기 어려웠음. 그렇다고 하나로 합치면 모델 안에서 두 기능이 같은 공간을 서로 차지하려 다투면서 양쪽 성능이 모두 떨어졌음. 연구팀은 기능마다 학습하는 영역을 미리 갈라 두는 방식으로 이 문제를 줄였음. 공개된 로봇 이동 자료로 시험한 결과 사람의 움직임을 더 정확히 예측했고 경로 오차와 충돌 가능성도 줄었음. 이 연구는 컴퓨터비전 분야 국제학회 ECCV 2026 에서 발표됐음.", "body": "DGIST 전기전자컴퓨터공학과 박대희 교수 연구팀이 KAIST 연구팀과 함께 주변 사람의 이동 경로를 예측하는 일과 로봇이 부딪치지 않을 경로를 계획하는 일을 하나의 소형 인공지능 모델에서 동시에 수행하게 하는 학습 기법을 내놓았다고 보도됨, 두 일을 각각 다른 모델로 나누면 연산 자원과 메모리가 더 들어 실제 로봇에 싣기 어렵다는 점이 출발점이고, 한 모델에 여러 기능을 넣으면 내부에서 자원을 다투는 이른바 스킬 충돌이 일어나 양쪽 성능이 함께 떨어진다는 문제가 함께 제시됨, 연구팀은 기능별로 학습하는 매개변수 영역을 갈라 두는 분리형 파라미터 학습과 희소 병합을 결합해 이 충돌을 줄였다고 설명함, 검증에는 로봇 이동 분야의 공개 자료인 JRDB 와 JTA 가 쓰였고 기존 방식보다 사람의 움직임을 더 정확하게 예측하면서 로봇의 이동 경로 오차와 충돌 가능성도 낮췄다고 제시됨, 논문 제목은 「Unified Prediction and Planning via Conflict-Aware Disjoint Parameter Training」 이며 컴퓨터비전 분야 국제학회 ECCV 2026 에 채택돼 9월 10일부터 12일까지 스웨덴 말뫼에서 발표됐고 제1저자는 서태원 석사과정생, 공저자로 전선애 학부연구생이 참여했으며 연구는 엔비디아 아카데믹 하드웨어 그랜트의 지원을 받음, 다만 모델의 크기와 개선 폭의 수치, 실기 기체에 실어 시험했는지, 시행 횟수와 무작위 시드 수가 제시되지 않아 성능 폭을 단정하지 않고 검증은 공개 데이터셋 기준으로만 읽음, DGIST 보도자료 게시판을 직접 열어 게시물 제목과 등록일을 확인한 결과 최신이 9월 10일자 두 건이고 창 안에 올라온 게시물이 없어, 기관이 언론에 배포하고 자체 게시판에는 올리지 않은 경우로 보고 2차 자료를 출처로 삼음", "src": "로봇신문 9.11 · 인공지능신문 9.11", "pd": "2026-09-11", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48451", "url2": "https://www.aitimes.kr/news/articleView.html?idxno=41871"}, {"sec": 8, "t": "美 UC버클리·스탠퍼드, 휴머노이드 전신 제어 학습틀 발표", "k": "공중제비와 회전 발차기를 하나의 설정으로 익혀 실기에 추가 학습 없이 옮겼다", "ez": "미국 UC버클리와 스탠퍼드대 연구진이 사람의 동작을 배운 휴머노이드가 배우지 않은 일까지 해내게 하는 학습 방법을 내놓았음. 방법은 두 단계임. 먼저 걷기와 달리기, 공중제비, 회전 발차기 같은 사람의 동작을 하나의 학습 설정으로 따라 배우게 함. 이어 그렇게 익힌 동작들을 확산 모델로 묶어 필요할 때 꺼내 섞어 쓰게 함. 확산 모델은 흐릿한 상태에서 시작해 조금씩 다듬어 결과를 만드는 방식의 인공지능임. 그 결과 로봇은 학습할 때 본 적 없는 장애물 피하기, 조이스틱으로 받은 지시 따르기, 끊긴 동작 이어 붙이기를 추가 학습 없이 수행했음. 국내 보도에 따르면 학습에 쓴 사람 동작 자료는 약 2시간 30분 분량이며, 시험에는 유니트리 G1 로봇이 쓰였음. 다만 시도 횟수와 성공률은 공개되지 않았음.", "body": "미국 UC버클리와 스탠퍼드대 연구진이 사람의 동작을 배운 휴머노이드가 학습 때 없던 과제까지 수행하게 하는 학습틀 비욘드미믹을 사이언스 로보틱스 8월 26일자에 실음, 논문은 두 단계로 구성돼 하나의 보상과 관측, 같은 초매개변수 설정으로 여러 동작을 따라 배우는 단계와 그 결과로 얻은 상태·행동 자료 위에 잠재 확산 모델을 학습해 동작을 조합하는 단계로 나뉘고, 초록 기준으로 공중제비와 회전 발차기, 후려차기, 전력 질주 같은 민첩한 동작을 하나의 설정으로 익혔다고 제시됨, 분류기 유도 기법을 적용해 학습 때 접하지 않은 장애물 회피와 조이스틱 원격조작, 동작 메우기 같은 과제를 과제별 추가 학습이나 미세조정 없이 실기 기체에 그대로 옮겼다고 적음, 국내 보도는 학습에 쓴 동작 자료가 약 2.5시간 분량이고 시험 기체가 유니트리 G1 이며 시뮬레이션을 거쳐 실기에 적용했다고 전했으나 이 수치는 사전공개본 초록에 없어 대조하지 못했으므로 보도에 근거한 것으로 두고 단정하지 않음, 저널 본문은 접근이 막혀 열지 못했고 서지 사항은 등록기관 자료로, 방법과 결과는 8월 사전공개본 초록으로 대조함, 제1저자는 UC버클리 랴오치위안이며 UC버클리 코우실 스리나스와 스탠퍼드 캐런 리우가 함께 참여함, 시행 횟수와 성공률, 실패 사례는 초록에 제시되지 않아 성능 폭을 단정하지 않음", "src": "사이언스 로보틱스 8.26 · 로봇신문 9.13", "pd": "2026-08-26", "url": "https://www.science.org/doi/10.1126/scirobotics.adx8924", "url2": "https://www.irobotnews.com/news/articleView.html?idxno=48446"}, {"sec": 8, "t": "中 푸단대 연구진, 깊이 센서가 끊겨도 걷는 휴머노이드 제어 방식 발표", "k": "깊이 신호를 복원하는 인코더 하나로 지각과 맹목을 함께 다룬다", "ez": "중국 푸단대 연구진이 앞을 보는 센서가 망가져도 넘어지지 않고 걷는 휴머노이드 제어 방식을 내놓았음. 휴머노이드가 울퉁불퉁한 바닥을 걸으려면 깊이 카메라로 앞을 미리 봐야 함. 그런데 실제 현장에서는 이 신호가 완전히 꺼지기보다 부분적으로, 그리고 때때로 망가짐. 지금까지는 신호가 깨끗하다고 가정하거나, 앞을 보는 제어기와 보지 않는 제어기를 따로 만들어 놓고 상황에 따라 바꿔 썼음. 연구진은 하나의 제어기 안에 망가진 깊이 영상을 원래대로 복원하는 부분을 넣고, 깊이 정보 없이도 몸의 자세를 읽는 부분을 함께 두었음. 학습할 때 의도적으로 잡음을 점점 키워 가며 가르쳤음. 시뮬레이션에서 기존 방식과 대등하거나 나았고, 실제 로봇 시험은 조건마다 다섯 번씩 이뤄졌음.", "body": "중국 푸단대를 제1기관으로 하는 연구진이 깊이 센서의 신호가 부분적으로 끊기는 상황에서도 휴머노이드가 걷게 하는 제어 방식 캡(CAP)을 사전공개본으로 냄, 출발점은 실제 배치의 조건임 — 복잡한 지형을 걸으려면 앞을 내다보는 외부 감지가 필요한데 현장에서는 그 신호가 완전히 죽는 것이 아니라 부분적·간헐적으로 망가지며, 기존 지각 기반 정책은 깊이 관측이 깨끗하다고 가정하고 지각과 맹목을 함께 다루려는 시도는 별도 하위 정책을 두고 전환해 왔기 때문에 부분적으로 망가진 깊이 안에 남아 있는 정보를 쓰지 못했음, 연구진은 단일 단계 정책 하나에 월드모델 인코더를 학습된 잡음제거기로 훈련해 손상된 입력에서 깨끗한 깊이를 복원하게 하고, 깊이 없이도 몸의 상태를 주는 고유수용 변분 인코더를 함께 두어 두 신호가 서로를 받치게 함, 학습에는 월드모델 입력에 깊이 잡음 커리큘럼을 거는 결합 방식을 씀, 검증은 시뮬레이션에서 지각 기반 기준선과 대등하거나 개선된 결과를 얻었고 실기 기체 시험은 조건 칸마다 5회씩 수행한 것으로 본문에 적혀 있음, 논문은 로봇 학습 분야 학회 코르엘(CoRL) 2026 에 채택됐다고 밝혔으나 사전공개본은 동료심사 확정 전 단계이므로 등급을 S3 으로 두고 성능 폭을 단정하지 않음, 시행 5회는 조건별 표본으로는 적은 수이므로 성공률의 폭을 인용하지 않음", "src": "Hongjin Chen 외, CoRL 2026 9.11", "pd": "2026-09-11", "url": "https://arxiv.org/abs/2609.11553"}, {"sec": 8, "t": "中 통용인공지능연구원, 사람과 로봇이 같은 외골격 쓰는 수집법 발표", "k": "보정 250회로 접촉 과제 다섯에서 수집 효율을 3배로 올렸다", "ez": "중국 통용인공지능연구원 연구진이 로봇에게 손으로 하는 일을 가르칠 때 쓰는 자료를 더 빠르게 모으는 방법을 내놓았음. 로봇이 물건을 다루는 법을 배우려면 사람이 하는 모습을 많이 보여 줘야 함. 지금까지는 사람이 장비를 착용해 동작을 기록한 뒤 그 값을 로봇 관절에 맞게 옮겨 적었는데, 아무것도 닿지 않는 허공에서 맞춘 값이라 실제로 물건에 닿는 순간 어긋났음. 연구진은 사람과 로봇에게 똑같은 외골격을 입혔음. 그러면 관절 각도를 재는 장치가 양쪽에서 같은 값을 내고, 외골격에 달린 손목 카메라도 양쪽에서 같은 기구를 봄. 옮겨 적는 과정 자체가 사라지는 것임. 접촉이 많은 다섯 가지 작업에서 기존 원격조작 방식보다 자료를 세 배 빠르게 모았음.", "body": "중국 통용인공지능연구원 산하 범용인공지능 국가중점연구실을 제1기관으로 하는 연구진이 사람과 로봇에게 같은 외골격을 입혀 손 조작 시연을 모으는 방식 시드유미(SEED-UMI)를 사전공개본으로 냄, 문제로 짚은 것은 손 조작 학습의 병목임 — 접촉이 많은 시연은 모으기 어렵고 모아도 로봇에 그대로 옮겨지지 않는데, 기존 착용형 외골격 방식은 사람 쪽만 기록한 뒤 아무것도 닿지 않는 자유공간에서 맞춘 대응 관계로 로봇 동작을 만들어 내므로 실제로 물체에 닿는 순간 어긋남, 연구진은 사람과 로봇이 같은 외골격을 착용하게 해 관절 각도를 재는 장치가 양쪽에 물리적으로 공유되는 측정값이 되게 하고, 외골격에 붙인 손목 카메라가 사람이 모을 때와 로봇이 실행할 때 같은 바깥 기구를 보게 함, 그 결과 대응 관계를 따로 맞추는 일이 짝지어진 교차 신체 지도학습으로 바뀌고 정책을 외골격 시점의 원본 손목 영상으로 바로 학습시킬 수 있어 영역 분할이나 지워 채우기 같은 후처리가 필요 없다고 적음, 수치는 접촉이 많은 다섯 과제에서 외골격 기반 원격조작 대비 데이터 수집 효율 3.0배이고 짝지어 미세조정할 때 크기·모양이 다른 물체 다섯 종에 각 50회씩 모두 250회의 보정 시연을 쓴 것으로 본문에 적혀 있음, 사전공개본이고 미동료심사 단계이므로 등급을 S3 으로 두고 3.0배의 산정 기준은 원 논문의 비교 조건 안에서만 읽음", "src": "Tengbo Yu 외, arXiv 9.11", "pd": "2026-09-11", "url": "https://arxiv.org/abs/2609.11753"}, {"sec": 8, "t": "加 사이먼프레이저대, 동작 생성 단계를 한 번으로 줄인 제어 모델 발표", "k": "초당 15회이던 추론을 55회로 높여 멈췄다 가는 움직임을 없앴다", "ez": "캐나다 사이먼프레이저대와 미국 펜실베이니아대 연구진이 로봇의 움직임이 끊기는 문제를 푸는 방법을 내놓았음. 요즘 로봇 제어에는 카메라로 보고 말을 알아들어 동작으로 옮기는 인공지능이 쓰임. 이 모델은 동작 하나를 만들 때 여러 단계를 거쳐 조금씩 다듬는 방식이라 계산이 오래 걸렸고, 그래서 로봇이 움직이다 멈추고 또 움직이는 모습을 보였음. 연구진은 그 여러 단계를 한 번에 끝내는 방식으로 바꿨음. 단순히 평균값 하나만 내면 동작이 한 갈래로 쏠리는데, 새 학습 방법은 여러 갈래를 고루 덮으면서도 단계를 늘리지 않음. 그 결과 판단 속도가 초당 15회에서 55회로 3.67배 빨라졌음. 실제 로봇 팔로 시험했고, 열 가지 장기 작업에서 50번씩 평균한 값임.", "body": "캐나다 사이먼프레이저대를 제1기관으로 하고 미국 펜실베이니아대가 함께 참여한 연구진이 시각언어행동 정책의 동작 생성 단계를 한 번으로 줄이는 방식 아이엠엘이(IMLE-VLA)를 사전공개본으로 냄, 짚은 병목은 구조에 있음 — 시각언어행동 정책은 사전학습한 시각언어 뼈대에 연속 동작을 내는 별도 머리를 붙이고 그 머리를 확산이나 흐름정합으로 학습시키는 구성이 주류인데, 이 머리는 동작 하나를 낼 때마다 여러 단계를 되풀이해 표집하므로 추론에서 병목이 생기고 로봇의 움직임이 멈췄다 가는 형태로 나타남, 연구진은 되풀이 표집을 조건부 암시적 최대우도 추정으로 학습한 단일 단계 생성기로 갈아 끼웠고, 이 목적함수가 여러 갈래의 동작을 고루 덮게 해 단순 회귀 머리에서 나타나는 한 갈래로 쏠리는 문제를 피하면서 다단계 표집을 없앴다고 적음, 수치는 기존 정책에 적용했을 때 추론 빈도가 3.67배로 올라 초당 15회에서 55회가 됐고, 이 값은 리베로 장기 과제 10종에 걸쳐 50회씩 평균한 것으로 본문에 적혀 있으며 실기 시험은 프랑카 에미카 로봇 팔에서 수행함, 논문은 지능형 로봇·시스템 국제학술대회 아이로스(IROS) 2026 에 채택됐다고 밝혔으나 사전공개본은 동료심사 확정 전이므로 등급을 S3 으로 둠, 이 건은 직전 호가 다룬 성균관대의 추론 지연 단축과 같은 물음을 다른 방식으로 푼 것임 — 그쪽이 비평가 쪽에 신경망 용량을 몰아주는 구조를 택했다면 이쪽은 표집 횟수 자체를 없앴음", "src": "Kian Hosseinkhani 외, IROS 2026 9.11", "pd": "2026-09-11", "url": "https://arxiv.org/abs/2609.10915"}]}, {"date": "2026-09-11", "items": [{"sec": 2, "t": "촉각 데이터 확보 경쟁, 3만 시간 규모까지 확대", "k": "21개 센서와 80개 기관이 표준 없이 제각기 모으는 중", "ez": "로봇이 물건을 손으로 다루는 일에서 사람을 따라가지 못하는 이유가 촉각 데이터의 부족에 있다는 진단이 나왔음. 촉각 데이터는 로봇이 물체를 쥐거나 문지를 때 손끝에 걸리는 힘과 미끄러짐을 센서로 기록한 자료임. 미국 UC 버클리 연구팀은 이런 자료 100시간을 모아 12개 과제에서 평균 65%의 성공률을 얻었는데, 로봇 한 종류에서만 모았다는 점이 한계로 지적됐음. 중국 칭화대 연구진은 센서 21종과 여러 로봇에서 3,000시간이 넘는 자료를 모았고, 80개 기관이 같은 방식으로 수집하도록 표준을 만드는 작업을 진행하고 있음. 네오테AI 와 푸단대는 3만 시간이 넘는 시연을 모아 규모를 열 배 가까이 키웠음. 다만 기관마다 센서와 수집 방식이 달라 자료를 하나로 합쳐 쓰기는 어려운 상태임.", "body": "로봇의 정밀 조작 성능을 가르는 병목이 알고리즘이 아니라 촉각 데이터의 부족이라는 진단과 함께 주요 연구조직의 수집 규모가 정리돼 보도됨, 미국 UC 버클리 트레버 대럴 연구팀은 전용으로 수집한 촉각 데이터 100시간으로 T-Rex 데이터셋을 만들어 12개 과제에서 평균 성공률 65%를 얻었으나 단일 로봇 하드웨어에서 모았다는 한계가 함께 지적됨, 中 칭화대 연구진은 21개 센서 유형과 여러 로봇 플랫폼을 아우르는 3,000시간 이상을 집계했고 80개 기관이 참여하는 표준화된 수집을 추진하는 중임, 네오테AI 와 푸단대는 자체 센서와 여러 로봇 팔·수동 그리퍼를 써 3만 시간이 넘는 시연을 모아 기존 시도보다 한 자릿수 큰 규모를 만들었고 시각과 촉각을 동기화해 기록함, 남캘리포니아대는 2,700개 시연으로 시각 데이터에서 촉각 정보를 추론하는 모델을 냄, 다만 센서 종류와 수집 방식이 기관마다 달라 데이터를 합쳐 쓰기 어렵다는 점이 공통의 제약으로 제시되고 각 수치의 시행 횟수·평가 조건은 원 논문을 열기 전까지 대조되지 않음, 이 건은 오늘 지면의 균형 축에 해당함 — 기체 공개와 양산 발표가 이어지는 가운데 정밀 조작의 병목이 아직 데이터 층에 남아 있음을 보여주므로 부품·양산 항목과 나란히 읽어야 함", "src": "IEEE 스펙트럼 9.10", "pd": "2026-09-10", "url": "https://spectrum.ieee.org/tactile-data-robots"}, {"sec": 3, "t": "뉴로메카, 포항에 로봇 위탁생산 공장 짓는다", "k": "1단계 400억 원으로 11월 착공해 내년 12월 완공을 목표로 삼는다", "ez": "경상북도와 포항시가 협동로봇 기업 뉴로메카와 포항에 로봇 공장을 짓는 협약을 맺었다고 9월 10일 밝혔음. 협약은 9월 9일 경주에서 체결됐음. 이름에 붙은 파운드리는 반도체에서 온 말로, 설계는 다른 회사가 하고 생산만 맡아 주는 공장을 뜻함. 이 공장도 뉴로메카가 자기 제품을 만드는 데 그치지 않고 다른 로봇기업의 제품을 대신 만들어 주는 역할을 함께 맡음. 총사업비는 약 1,800억 원이고, 1단계로 약 400억 원을 들여 포항 영일만일반산업단지에 공장을 세움. 올해 11월에 착공해 내년 12월 준공하는 일정임. 경북도는 지역활성화투자펀드로 자금 구조를 만들고 최대 40억 원을 직접 출자함. 생산 품목으로는 협동로봇과 고중량 산업용 로봇, 휴머노이드, 자율이동로봇이 제시됐음. 연간 몇 대를 만들 수 있는지와 위탁생산을 언제 어느 기업의 제품으로 시작하는지는 공개되지 않았음.", "body": "경상북도가 포항시·뉴로메카와 지역활성화투자펀드를 활용한 로봇파운드리 구축 업무협약을 9월 9일 경주에서 체결하고 10일 이를 알림, 총사업비는 약 1,800억 원이며 1단계로 약 400억 원을 들여 포항 영일만일반산업단지에 신규 공장을 세우고 올해 11월 착공해 내년 12월 준공하는 일정이 제시됨, 2단계 약 1,400억 원은 사업 여건과 관계기관 협의에 따라 단계적으로 추진한다고만 밝혀 착수 시점이 정해지지 않음, 경북도는 지역활성화투자펀드로 자금 구조를 마련하고 최대 40억 원까지 직접 출자해 기업의 투자 부담을 낮춘다고 설명됨, 생산 품목으로는 뉴로메카의 주력인 협동로봇과 함께 고중량 산업용 로봇·휴머노이드·자율이동로봇이 제시됐고 자체 생산시설 확충에 더해 다른 로봇기업의 제품을 위탁생산하는 사업기지 역할을 맡는다는 구상임, 다만 생산능력을 대수로 밝히지 않았고 위탁생산의 수주처와 착수 시점도 제시되지 않아 계획 단계로 읽어야 함, 경북도가 내건 4대 파운드리 구상 가운데 로봇이 첫 사례이며 나머지는 반도체·양자(구미)와 의약품(안동)임, 경상북도 누리집을 직접 열었으나 목록이 자바스크립트로 그려져 보도자료 원문을 확인하지 못했으므로 발표가 없어서가 아니라 확인하지 못해서 2차 자료에 근거하며 다음 순회에서 다시 두드림", "src": "로봇신문 9.10 · 서울신문 9.10", "pd": "2026-09-10", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48416", "url2": "https://www.seoul.co.kr/news/economy/2026/09/10/20260910500123"}, {"sec": 3, "t": "현대모비스, 개발 중인 로봇 관절 구동장치 2종 실물 첫 공개", "k": "용인 연구소에서 18일까지 협력사에 신기술 60여 종과 나란히 선보인다", "ez": "현대모비스가 개발 중인 로봇용 구동장치 두 종류의 실물을 처음 공개했음. 구동장치는 제어기가 보낸 신호를 받아 로봇의 관절을 실제로 움직이는 부품으로, 사람으로 치면 근육에 해당함. 공개 장소는 9월 10일부터 18일까지 경기 용인 기술연구소에서 열리는 회사 자체 기술 행사이고, 협력사와 업계 관계자가 대상임. 이 행사는 2년마다 열려 올해가 세 번째이며, 올해 주제는 자동차 부품에서 로봇으로 사업을 넓힌다는 것임. 전동화와 소프트웨어 중심 차량 기술을 포함해 신기술 60여 종이 함께 전시됨. 다만 두 구동장치가 얼마나 큰 힘을 내는지, 언제 양산에 들어가는지, 가격이 얼마인지는 공개되지 않았음. 회사는 앞서 보스턴다이내믹스의 휴머노이드 아틀라스에 구동장치를 공급하기로 한 바 있음.", "body": "현대모비스가 9월 10일부터 18일까지 경기 용인 기술연구소에서 여는 2026 R&D 테크데이에서 개발 중인 로봇용 구동장치 2종의 실물을 처음 내보임, 구동장치는 제어기의 신호를 받아 로봇의 관절을 움직이는 부품이며 이번 행사의 주제가 모빌리티 부품에서 로보틱스로의 확장으로 제시됨, 행사는 협력사와 업계 관계자를 대상으로 2년마다 열려 올해 세 번째이고 전동화·소프트웨어 중심 차량을 포함한 차세대 신기술 60여 종이 함께 전시됨, 다만 두 기체의 정격 토크·연속 출력·감속비·자유도·중량 같은 사양과 개발 단계, 양산 시점, 단가 구조는 공개되지 않아 성능을 비교할 근거가 없음, 직전 호가 다룬 보스턴다이내믹스 아틀라스용 시제품 납품 준비와는 다른 사실임 — 그쪽은 특정 고객사에 대한 공급 일정이고 이번 건은 개발 중 기체의 실물 공개임, 현대모비스 누리집의 보도자료 목록을 직접 열었으나 본문이 자바스크립트로 그려져 목록을 읽지 못했고 공개 색인에서도 해당 자료를 찾지 못해 발표가 없어서가 아니라 확인하지 못해서 2차 자료에 근거하며 다음 순회에서 다시 두드림", "src": "로봇신문 9.10 · 머니투데이 9.10", "pd": "2026-09-10", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48422", "url2": "https://www.mt.co.kr/industry/2026/09/10/2026091009060920516"}, {"sec": 3, "t": "로보티즈 구동장치, 공급이 주문을 따라가지 못하는 국면", "k": "주문 잔량이 50만 대를 넘고 중국·북미 고객사의 증설 요청이 이어진다", "ez": "국내 로봇 부품기업 로보티즈의 구동장치 주문 잔량이 50만 대를 넘는 것으로 분석됐음. 구동장치는 로봇의 관절을 움직이는 부품임. 한국투자증권 최건 연구원은 로보티즈가 로봇 업종에서 유일하게 주문이 공급을 넘어선 상태라고 진단했음. 인공지능 모델을 함께 쓰는 플랫폼인 허깅페이스가 내놓은 값싼 연구용 로봇에 이 회사 부품이 들어가고, 중국 휴머노이드 기업과 북미 고객사에서도 공급을 늘려 달라는 요청이 이어지는 중임. 다만 50만 대가 언제를 기준으로 센 숫자인지, 고객사가 어디인지, 설비를 언제 얼마나 늘리는지는 밝혀지지 않았음. 정부도 같은 날 이 회사를 찾아 로봇 기업 간담회를 열고 내년 예산안의 부품 지원 방향을 설명했음.", "body": "한국투자증권 최건 연구원이 로보티즈의 구동장치 수주 잔고를 약 50만 대 이상으로 제시하고 업종 안에서 유일하게 초과 수요 국면에 있다고 분석함, 인공지능 모델 공유 플랫폼 허깅페이스가 내놓은 저가 로봇에 들어가는 구동장치 공급 물량이 늘어날 것으로 봤고 中 휴머노이드 기업과 북미 고객사에서 공급 확대와 증설 요청이 이어지는 중이라고 적음, 다만 50만 대의 기준 시점과 산정 근거, 허깅페이스향 물량의 규모, 고객사 이름과 증설 계획의 시기·규모는 제시되지 않아 확정된 수주 실적으로 읽지 않음, 애널리스트의 추정이 섞인 자료이고 공시도 동료심사도 거치지 않았으므로 등급을 S3 으로 두며 회사 자체 발표는 확인되지 않음, 이 건에서 취할 것은 개별 기업의 실적이 아니라 산업 사실임 — 국내 부품사가 해외 휴머노이드와 연구용 로봇 수요를 받아 공급을 늘리는 국면이 이어진다는 것이고, 재정경제부가 9월 10일 같은 회사를 찾아 로봇 기업 간담회를 열고 2027년 예산안의 지원 방향을 설명했다는 사실이 부처 보도자료 목록에서 확인됨, 다만 센서·구동장치·휴머노이드용 이차전지 예산을 올해 116억 원에서 내년 620억 원으로 늘린다는 수치는 보도됨 — 부처 보도자료의 본문이 첨부 문서 안에 있어 목록 화면에서 수치를 대조하지 못했으므로 확정된 편성으로 읽지 않고 미확정 사항으로 넘김, 부처 발표 자체도 이 지면의 게재 대상이 아니므로 항목으로 올리지 않음", "src": "파이낸셜뉴스 9.10 · 한국경제 9.10", "pd": "2026-09-10", "url": "https://www.fnnews.com/news/202609100819471029", "url2": "https://www.hankyung.com/article/2026091056636"}, {"sec": 4, "t": "뇌병변 장애인이 보행 보조 로봇을 착용하고 성화 봉송", "k": "대회 기간에 맞춰 제주 월드컵경기장에 로봇 체험 부스도 함께 선다", "ez": "제주에서 9월 11일부터 16일까지 열리는 제46회 전국장애인체육대회에서 착용형 로봇을 이용한 성화 봉송이 진행됨. 성화 마지막 주자인 김준 씨는 뇌병변 장애가 있으며, 국내 기업 휴로틱스가 만든 보행 보조 로봇을 착용하고 10미터를 걸어 성화를 전달함. 이 로봇은 딱딱한 뼈대로 다리를 감싸는 방식이 아니라 옷처럼 부드러운 재질로 만들어 근육의 힘을 거드는 형태임. 성화 안치식은 9월 10일 서귀포시청에서 열렸고, 대회 기간에는 제주 월드컵경기장 광장에 로봇을 직접 체험할 수 있는 부스도 함께 운영됨. 다만 이 로봇이 얼마나 큰 힘을 보조하는지, 한 번 충전으로 얼마나 쓸 수 있는지, 착용자가 얼마나 연습했는지는 공개되지 않았음. 현장에 도입해 얻은 성과가 아니라 행사를 위한 시연임.", "body": "제주특별자치도와 제주테크노파크가 9월 11일부터 16일까지 열리는 제46회 전국장애인체육대회에서 착용형 로봇을 쓴 성화 봉송을 진행한다고 밝힘, 성화 최종 주자인 김준 씨가 뇌병변 장애를 안고 국내 기업 휴로틱스의 보행 보조 소프트 착용형 로봇 H-Medi 를 입은 채 10미터를 걸어 성화를 전달하는 구성이며 성화 안치식은 9월 10일 서귀포시청에서 열림, 대회 기간에는 개막식이 열리는 제주 월드컵경기장 광장에 제주테크노파크의 로봇 체험 부스가 함께 운영됨, 다만 착용형 로봇의 보조력·구동 방식·연속 사용시간 같은 사양과 착용자의 사전 훈련 기간, 보행 속도 같은 조건은 공개되지 않았고 이는 현장 도입 실적이 아니라 행사용 시연이므로 성능 근거로 쓰지 않음, 이 지면이 다루는 휴머노이드와는 형태가 다른 착용형 기체이지만 사람의 동작을 보조하는 구동장치와 제어라는 점에서 부품 층위를 공유함", "src": "로봇신문 9.10", "pd": "2026-09-10", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48426"}, {"sec": 5, "t": "크라우드웍스, 창원에 제조 현장용 인공지능 거점 첫 개설", "k": "경남테크노파크 안에 자리를 잡고 울산과 전북으로 넓힐 계획을 세운다", "ez": "인공지능 학습데이터 기업 크라우드웍스가 경남 창원에 첫 지역 거점을 열었다고 9월 10일 밝혔음. 학습데이터는 인공지능에게 무엇이 정답인지 알려 주기 위해 사람이 표시를 달아 둔 자료를 말함. 로봇을 공장에 넣으려면 그 공장의 공정을 담은 자료를 사람이 정리해 주어야 하는데, 이 작업을 현장 가까이에서 하겠다는 것임. 사무소는 경남테크노파크 안에 마련됐음. 경남 지역 제조기업의 인공지능 수요를 찾아 수주를 돕고, 지방자치단체 사업에 참여하며, 지역 대학·연구기관과 기업을 잇는 일을 맡음. 창원을 고른 이유는 정부가 이곳 국가산업단지에 제조 인공지능과 로봇 단지를 조성하고 있기 때문임. 회사는 울산과 전북 등 다른 제조 밀집 지역으로도 거점을 넓힐 계획이라고 밝혔음. 투자 규모와 상주 인력은 공개되지 않았음.", "body": "인공지능 학습데이터 기업 크라우드웍스가 경남 창원에 피지컬 AI 허브를 구축했다고 9월 10일 밝힘, 첫 지역 거점인 창원 사무소는 경남테크노파크 경남인공지능혁신본부 안에 마련됐고 경남 지역 제조기업의 인공지능 수요 발굴과 수주 지원, 지방자치단체의 피지컬 AI 생태계 참여, 지역 산학연 연결 확대를 맡는다고 설명됨, 정부가 추진하는 제조 AI·로보틱스 밸리 조성이 본격화되는 창원국가산업단지를 겨냥해 입지를 먼저 잡는다는 취지이며 창원을 시작으로 울산·전북 등 제조 밀집 지역으로 거점을 넓힐 계획이 함께 제시됨, 다만 투자 규모와 상주 인력, 확대 시점, 경남테크노파크와 맺은 협약의 형태와 기간은 공개되지 않아 계획 단계로 읽어야 함, 회사 누리집을 직접 열었으나 보도자료 목록을 확인하지 못해 발표가 없어서가 아니라 확인하지 못해서 2차 자료에 근거함", "src": "AI타임스 9.10", "pd": "2026-09-10", "url": "https://www.aitimes.com/news/articleView.html?idxno=215084"}, {"sec": 7, "t": "DGIST·한양대, 스스로 판단하는 로봇 지능 6년 과제 맡는다", "k": "정부 지원금 110억 원이 2031년까지 배정돼 현장 검증까지 이어진다", "ez": "DGIST 가 한양대 ERICA 와 함께 로봇 지능을 개발하는 국가 과제에 선정됐다고 9월 10일 밝혔음. 2026년부터 2031년까지 6년 동안 정부 지원금 110억 원이 배정됨. 과제 이름에 붙은 피지컬 AI 에이전트는 화면 안에서 답만 하는 인공지능이 아니라 몸을 가지고 현실에서 움직이며 스스로 판단하는 인공지능을 뜻함. 개발 목표는 세 가지임. 여러 단계를 거쳐야 하는 일을 스스로 나누어 계획하는 능력, 주변 상황이 바뀔 것을 미리 내다보고 대응하는 능력, 사람과 여러 대의 로봇이 서로 역할을 나눠 일하도록 조율하는 능력임. 총괄 책임은 DGIST 은용순 교수가 맡음. 검증에는 DGIST 의 슈퍼컴퓨터와 한양대 ERICA 의 로봇 시험장, 대구의 국가로봇테스트필드를 쓰고, 로보티즈와 KT, 에이로봇이 협력기업으로 참여해 제조와 물류, 서비스 현장에서 확인함.", "body": "DGIST 가 과학기술정보통신부와 정보통신기획평가원이 주관하는 AI 최고급 신진연구자 지원사업에 선정됐다고 9월 10일 밝힘, 주관기관 DGIST 가 한양대학교 ERICA 와 함께 2026년부터 2031년까지 6년간 정부 지원금 110억 원으로 산업 인공지능 전환 중심 자율-협력 피지컬 AI 에이전트 기술 개발에 착수하며 총괄 책임은 DGIST 전기전자컴퓨터공학과 은용순 교수가 맡음, 개발 목표는 셋으로 나뉘어 복합 작업을 판단하고 장기 계획을 세우는 목적 지향형, 물리 환경의 변화를 예측해 적응하는 예측 적응형, 사람과 여러 로봇 사이의 역할을 조율하는 집단 지능형이 각각 제시됨, 검증에는 DGIST 슈퍼컴퓨팅 시설과 한양대 ERICA 로봇 테스트베드, 대구의 국가로봇테스트필드를 쓰고 로보티즈·KT·에이로봇이 협력기업으로 참여해 제조·물류·서비스 현장 실증을 추진함, 다만 110억 원의 연차별 배분과 민간부담 유무, 세 갈래 목표의 단계별 검증 지표와 실증 착수 시점은 공개되지 않아 미확정 사항으로 등록함, 부처가 주관하는 사업이지만 이 항목의 주체는 수행기관인 DGIST 이므로 지면에 올리며 부처 발표 자체는 다루지 않음", "src": "DGIST 보도자료 9.10 · 인공지능신문 9.10", "pd": "2026-09-10", "url": "https://www.dgist.ac.kr/bbs/BBSMSTR_000000000077/view.do?nttId=B000000111886Dp0eU6", "url2": "https://www.aitimes.kr/news/articleView.html?idxno=41863"}, {"sec": 7, "t": "성균관대, 로봇이 다음 동작을 정하는 시간을 줄이는 방식 개발", "k": "판단 지연을 최대 4분의 1로 낮추면서 성공률은 기존 최고 수준을 지킨다", "ez": "성균관대 권민혜 교수 연구팀이 로봇의 판단 속도를 높이는 인공지능 구조를 개발했다고 9월 10일 밝혔음. 최근 로봇 제어에는 그림을 그리듯 정교한 동작을 만들어 내는 방식이 쓰이는데, 동작 하나를 내놓기 위해 계산을 여러 번 되풀이해야 해서 실제로 움직일 때 반응이 느려짐. 연구팀은 인공지능을 두 부분으로 나누어 생각했음. 하나는 학습할 때 잘잘못을 채점하는 부분이고, 다른 하나는 로봇이 움직일 때마다 실제로 동작을 내놓는 부분임. 채점하는 부분은 학습이 끝나면 버려지므로 크게 키워도 로봇의 속도에 영향을 주지 않음. 이 점을 이용해 채점 쪽을 128층까지 깊게 만들고 동작을 내놓는 쪽은 가볍게 두었음. 그 결과 판단에 걸리는 시간이 최대 4분의 1로 줄었고 임무 성공률은 기존 최고 수준과 대등했음. 평가는 실제 로봇이 아니라 컴퓨터 안의 모의 환경에서 이뤄졌음.", "body": "성균관대학교가 전자전기공학부 권민혜 교수 연구팀이 로봇 제어용 인공지능 구조 LAC 를 개발했다고 9월 10일 밝힘, 기존의 확산 모델·흐름 정합 방식은 동작 하나를 만들 때마다 여러 단계의 계산을 되풀이해 로봇이 실제로 움직일 때 지연이 쌓이는데, 연구팀은 학습에만 쓰이고 배치 뒤에는 버려지는 비평가 쪽에 신경망 용량을 몰아주고 매 순간 동작을 내는 행위자 쪽을 가볍게 두는 방식을 택함, 잔차 연결 구조와 여러 걸음 앞을 내다보는 예측, 점수 범위를 안정시키는 분류형 손실을 결합해 비평가의 깊이를 128층까지 세웠고 그 결과 추론 지연이 최대 4배 낮아지면서 임무 성공률은 최고 수준 기준선과 대등하게 유지됐다고 제시됨, 평가는 로봇 팔 조작과 인간형 기체의 미로 탈출을 포함한 OGBench 에서 이뤄졌고 이는 실기가 아니라 시뮬레이션 환경이며 시행 횟수와 무작위 시드 수는 공개되지 않아 성능 폭을 단정하지 않음, 논문은 제1저자 강구현 석사과정생과 숭실대 이재휘 연구자가 함께 썼고 채택률 27%의 ACM CIKM 2026 에 채택돼 11월 7일부터 11일까지 이탈리아 로마에서 발표되며 사전공개본은 8월 27일 arXiv 에 올라와 동료심사 결과가 확정되기 전 단계임", "src": "성균관대 발표 9.10 · 인공지능신문 9.10", "pd": "2026-09-10", "url": "https://www.spressnews.com/news/articleView.html?idxno=138989", "url2": "https://www.aitimes.kr/news/articleView.html?idxno=41861"}, {"sec": 7, "t": "한국AI로봇산업협회, 돌봄 로봇 성과를 자립 능력으로 측정하자고 제안", "k": "낙상 예방을 관찰·예측·지원·효과 측정·재학습의 순환으로 구성", "ez": "고령자를 돕는 로봇의 성과를 무엇으로 측정해야 하는가를 두고 제안이 나왔음. 한국AI로봇산업협회 고경철 부회장은 9월 9일 서울에서 열린 고령화 기술 학술행사에서, 로봇을 몇 대 보급했고 몇 명이 가입했는지를 세는 데서 그치지 말고 고령자가 스스로 생활하고 움직이는 능력이 얼마나 늘었는지를 함께 측정하자고 밝혔음. 기술은 두 갈래로 나뉨. 인공지능이 건강과 생활 기록을 분석해 판단을 돕고, 로봇이 이동과 재활, 일상생활을 직접 보조함. 예로 든 것은 낙상 예방임. 걷는 모습을 관찰해 넘어질 위험을 미리 가려내고, 필요한 도움을 준 뒤, 그 도움이 효과가 있었는지 측정해 다시 학습에 넣는 순환을 만든다는 구상임. 다만 이 기준을 어떤 산식으로 측정하는지, 어디에 먼저 적용하는지는 제시되지 않았음.", "body": "한국AI로봇산업협회 고경철 부회장이 9월 9일 서울 동대문디자인플라자에서 열린 서울 에이지테크 콘퍼런스에서 고령자 대상 로봇의 성과를 측정하는 기준을 바꾸자고 제안한 것으로 보도됨, 기기 설치 대수나 서비스 가입자 수에 더해 고령자가 스스로 생활하고 활동하는 능력이 얼마나 늘었는지를 함께 측정하자는 것이 요지이며 건강수명과 독립생활의 확대를 목표로 두자고 밝힘, 기술 구성으로는 인공지능 에이전트가 건강·생활 데이터를 분석하고 로봇이 이동·재활·일상생활 보조를 맡는 역할 분담이 제시됐고, 낙상 예방을 보행 관찰에서 위험 예측, 지원, 효과 측정, 재학습으로 돌아오는 순환 구조로 구성하는 예가 함께 제시됨, 고령자가 인공지능을 써서 일정을 관리하고 은퇴 뒤에도 배움과 생산 활동을 이어가는 상태를 가리켜 AI 에이전틱 에이징이라는 말이 쓰였고 음성 질의에서 시작해 답변을 검토하는 능력과 실생활 적용까지 단계적으로 넓히는 교육 과제가 함께 제안됨, 다만 제안 단계의 발언이고 지표의 산식과 측정 도구, 시범 적용 계획은 제시되지 않아 제도로 굳은 사실이 아님, 발언자는 고영테크놀러지 인공지능기술고문을 겸하고 있음, 이 항목은 학술 발표나 기관 보고서가 아니라 현장 강연이므로 취재 보도를 출처로 삼으며 매체는 지정 매체 안임", "src": "[강연] 로봇신문 9.10", "pd": "2026-09-10", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48403"}]}, {"date": "2026-09-10", "items": [{"sec": 1, "t": "中 증권당국, 휴머노이드 기업 상장 심사기준 비공식 상향", "k": "자금 조달 창구가 좁아져 실적이 없는 기체 개발사부터 영향을 받는다", "ez": "중국 증권감독관리위원회가 휴머노이드 로봇 기업의 증시 상장 심사를 까다롭게 하겠다는 뜻을 투자은행들에 비공식으로 전달했다고 전해졌음. 꾸준히 들어오는 매출이 있거나, 적자가 줄고 있거나, 실질적인 기술 혁신이 있음을 증명해야 상장 승인을 검토한다는 내용임. 배경에는 중국 휴머노이드 기업의 주가 흐름이 있음. 대표 기업 유니트리는 8월 19일 상장 첫날 주가가 다섯 배 넘게 뛰었다가 이후 고점 대비 40%대 후반까지 내린 것으로 전해졌음. 다만 하락 폭은 공모가를 기준으로 삼느냐 첫날 최고가를 기준으로 삼느냐에 따라 매체마다 다르게 적혀 있음. 상장을 기다리는 기업이 줄지어 있고 비상장 단계에서도 투자가 몰린 상태여서, 당국이 과열을 식히려 한다는 해석이 붙었음. 다만 창구지도는 문서로 공표되지 않는 방식이고, 중국 금융당국은 사실 여부를 확인해 주지 않았음.", "body": "中 증권감독관리위원회가 일부 투자은행과 증권사에 휴머노이드 기업의 기업공개 승인 기준을 높이겠다는 비공식 창구지도를 내렸다고 The Information 이 보도했고 로이터가 이를 받아 전함, 요구 조건으로 반복적으로 발생하는 매출, 손실 축소의 진전, 실질적 기술 혁신 셋 가운데 하나 이상을 증명할 것이 제시됨, 배경으로는 비상장 시장의 과열과 자금 쏠림, 상장을 대기하는 기업의 적체, 이미 상장한 기업의 주가 급락 셋이 함께 꼽힘, 이 건은 오늘 지면의 균형 축에 해당함 — 휴머노이드 분야의 자금 쏠림이 되돌려지는 국면을 다루므로 양산·수주 발표와 나란히 읽어야 함, 기준선이 되는 유니트리는 8월 19일 상장 첫날 주가가 다섯 배 넘게 뛰었다가 이후 고점 대비 약 45% 내린 것으로 전해짐, 다만 하락률은 무엇을 기준점으로 삼느냐(공모가·첫날 종가·첫날 최고가)에 따라 매체마다 달리 제시되고 우리가 대조할 수 있는 출처가 하나뿐이어서 단일 수치로 인용하지 않음, 상하이거래소 시세로 종가와 기준점을 직접 맞추기 전까지는 하락 폭을 단정하지 않음, 창구지도는 문서로 공표되지 않는 형식이고 中 금융당국은 로이터의 확인 요청에 응하지 않았으며 로이터도 독자 확인에 이르지 못했다고 밝혔고 The Information 원문은 유료 지면이어서 확보하지 못했으므로 확정된 제도 변경으로 읽지 않음", "src": "칼리지타임스(로이터 배포) 9.9", "pd": "2026-09-09", "url": "https://www.khaleejtimes.com/business/china-curbs-humanoid-ipos-after-unitrees-volatile-debut-the-information-reports"}, {"sec": 2, "t": "인터로이드, 공장 소음 속 작업자와 대화하는 휴머노이드 개발", "k": "작업자가 단말기 앞으로 이동하지 않고 음성으로 질의해 답을 받는다", "ez": "인공지능 기업 인터로이드가 공장 작업자와 말로 대화하는 휴머노이드 기술을 개발했다고 9월 9일 밝혔음. 핵심은 대화관리 엔진임. 사람은 로봇이 알아듣기 좋은 문장만 쓰지 않고 말을 끊거나, 여러 가지를 한꺼번에 묻거나, 조건을 붙여 지시함. 예를 들어 온도가 80도를 넘으면 라인을 세우라고 지시하면, 로봇이 조건과 행동을 나눈 뒤 센서값을 확인해 조건이 맞을 때만 행동함. 최대 120데시벨까지 시끄러운 환경에서도 대화가 가능하다고 설명했음. 120데시벨은 공사장 착암기 소음에 해당하는 수준임. 생산 관리 시스템과 설비 문서를 실시간으로 연결해 두어, 작업자가 단말기 앞까지 가지 않고 질의하면 답을 받을 수 있도록 했음. 다만 로봇의 키와 무게, 관절 수 같은 사양과 어느 현장에 언제 들어가는지, 알아듣는 정확도가 얼마인지는 공개되지 않았음.", "body": "인공지능 기업 인터로이드가 작업자의 자연어를 이해하고 제조 공정 데이터와 연계해 답하는 휴머노이드 기술을 개발했다고 밝힘, 자체 대화관리 엔진을 휴머노이드에 적용한 것이 특징이며 최대 120데시벨의 공장 소음 환경에서 대화가 가능하고 무선 온도·습도 센서와 제조실행시스템, 전사자원관리, 공정 매뉴얼과 설비 문서를 실시간으로 연동한다고 설명됨, 끼어들기와 복수 의도, 조건부 명령, 복합 조건, 문맥 연결, 정정과 반전, 이중부정까지 처리하도록 설계했고 온도가 80도를 넘으면 라인 정지를 요청하라는 식의 조건부 지시를 조건과 후속 행동으로 나눠 수행하는 예가 제시됨, 14개 언어를 구분해 응대하는 구조를 갖춰 공항·호텔·전시장으로 적용 범위를 넓히고 사족보행 로봇과 이동형 서비스 로봇에도 얹을 수 있도록 플랫폼으로 만드는 중이라고 밝힘, 다만 기체의 신장·중량·자유도·가반하중 같은 사양과 개발 단계, 자율 동작 여부, 적용 현장과 출시 시점, 인식 정확도나 응답 지연 같은 성능 수치는 공개되지 않아 실증 실적으로 읽을 단계가 아님, 회사 공식 사이트(interroid.com)를 직접 열었으나 본문이 자바스크립트로 그려져 게시판을 읽지 못했으므로 발표가 없어서가 아니라 확인하지 못해서 2차 자료에 근거하며 다음 순회에서 다시 두드림", "src": "디지털타임스 9.9", "pd": "2026-09-09", "url": "https://www.dt.co.kr/article/12083053"}, {"sec": 3, "t": "본시스템즈, 로봇 손용 초소형 감속기 국내 첫 양산", "k": "직경 18밀리미터·무게 21그램으로 로봇 손 부품의 수입 의존을 낮춘다", "ez": "로봇 부품 기업 본시스템즈가 로봇 손에 들어가는 초소형 감속기 BSR 018 을 여러 해외 기업에 공급하기로 했다고 9월 9일 밝혔음. 감속기는 모터의 빠른 회전을 느리고 힘센 움직임으로 바꿔 주는 부품으로, 로봇 관절마다 들어감. 사이클로이드 방식은 튼튼하고 정밀하지만 구조가 복잡해 조립이 까다롭고 대량 생산이 어려웠음. 본시스템즈는 성능을 좌우하는 핀 부품과 그 조립 공정을 아예 없애는 방식으로 이 문제를 풀었고, 국내에서는 처음으로 양산에 이르렀다고 설명했음. BSR 018 은 직경 18밀리미터, 무게 21그램임. 어른 손가락 한 마디 굵기에 500원 동전 세 개보다 가벼움. 로봇 손은 이런 작은 구동부가 여러 개 촘촘히 들어가는 부위여서 크기와 무게가 곧 설계 제약이 됨. 다만 계약 상대와 규모, 양산 시점은 공개되지 않았음.", "body": "본시스템즈가 다수의 해외 기업과 핀리스 사이클로이드 방식 초소형 감속기 BSR 018 의 공급계약을 맺었다고 밝힘, 사이클로이드 감속기의 성능을 좌우하는 핀 부품과 그 조립 공정을 없애 부품 수와 조립 편차 요인을 줄이면서 기존의 구동 특성과 내구성은 유지한 구조이며 국내에서는 처음 양산에 이른 것으로 설명됨, BSR 018 은 기어비 25 대 1 에서 양방향 구동이 가능하고 직경 18밀리미터에 무게 21그램으로 여러 개의 작은 구동부가 촘촘히 들어가는 로봇 손 설계에 맞춘 제품임, 다만 계약 상대 기업의 이름과 국가, 계약 수량과 금액, 양산 시점과 월 생산능력, 정격·순간 토크와 백래시 같은 성능 수치는 공개되지 않아 수주 실적의 규모를 가늠할 단계가 아니고 사양표를 확보하지 못해 성능 수치를 단정하지 않음, 회사 공식 사이트가 인증서 오류로 열리지 않아 발표 원문을 확보하지 못했으며 없어서가 아니라 열지 못해서이므로 다음 순회에서 다시 두드림", "src": "로봇신문 9.9 · 뉴스핌 9.9", "pd": "2026-09-09", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48378", "url2": "https://www.newspim.com/news/view/20260909000386"}, {"sec": 4, "t": "벤션, 몬트리올에 제조용 피지컬 AI 연구소 개소", "k": "포천 500대 제조사 90곳의 설비 데이터를 검증 재료로 삼는다", "ez": "캐나다 산업자동화 기업 벤션이 몬트리올에 제조용 피지컬 AI 연구소를 열었다고 9월 9일 발표했음. 피지컬 AI 는 로봇이나 기계를 실제로 움직이는 인공지능을 말함. 이런 모델은 실험실에서 성공하다가도 공장에 투입되면 조명이나 부품 상태가 달라 실패하는 일이 잦음. 연구소는 그 간극을 사전에 측정하는 자리임. 지미 리 피지컬 AI 담당 이사가 이끌고 코히어의 최고인공지능책임자 조엘 피노가 자문을 맡음. 현재 8명이 일하며 16명 이상을 더 채용하는 중임. 검증 재료는 벤션이 장비를 공급한 포천 500대 제조사 90곳에서 나오는 산업 데이터이고, 대상은 산업재와 전자, 자동차 생산에서 형태가 일정하지 않아 자동화가 어려웠던 조작 공정임. 회사는 관련 매출이 1년 사이 400% 늘었다고 밝혔으나 기준 금액이 없어 규모는 알 수 없음. 연구소의 넓이와 투자액은 공개되지 않았음.", "body": "캐나다 산업자동화 기업 벤션이 몬트리올에 제조용 피지컬 AI 연구소를 열었다고 회사 보도자료로 밝힘, 연구소는 지미 리 피지컬 AI 담당 이사가 이끌고 코히어 최고인공지능책임자 조엘 피노가 자문을 맡으며 현재 인원 8명에 로보틱스 제어·시뮬레이션·피지컬 AI 연구 분야로 16개 이상의 자리를 더 뽑는 중이라고 설명됨, 검증 재료는 포천 500대 제조사 90곳에 걸친 벤션 설치 기반에서 나오는 산업 데이터이며 연구 범위로 산업 데이터 수집, 로봇 제어, 모션 플래닝, 고전적 컴퓨터 비전, 비전 파운데이션 모델, 시연 기반 학습, 강화학습이 제시됨, 대상은 산업재·전자·자동차 생산의 복잡하고 정형화되지 않은 조작 작업이고 목적은 연구 단계의 조작 기술을 신뢰할 수 있고 확장 가능한 제조 현장 배치로 잇는 것으로 설명됨, 피지컬 AI 가 회사에서 가장 빠르게 크는 부문이며 관련 매출이 최근 1년 사이 400% 늘었다고 밝혔으나 기준 시점과 절대 금액이 없어 증가율만으로 규모를 읽지 않음, 90곳과 400% 는 회사 집계이고 제3자 검증을 거치지 않음, 연구소의 면적과 투자액, 캐나다 정부의 지원 여부는 보도자료에 없고 발표에 휴머노이드에 관한 언급이 없어 이 건을 휴머노이드 실증으로 읽지 않음", "src": "벤션 보도자료 9.9 · 벤션 프레스룸 9.9", "pd": "2026-09-09", "url": "https://www.prnewswire.com/news-releases/vention-opens-physical-ai-lab-to-bridge-ai-research-and-scalable-industrial-deployment-302872841.html", "url2": "https://vention.com/press"}, {"sec": 5, "t": "다임리서치·한국IBM·KAIST, 제조 피지컬 AI 3자 협약", "k": "연구실 기술을 고객사 생산라인까지 옮기는 역할을 셋으로 나눴다", "ez": "로봇 통합운영 기업 다임리서치와 한국IBM, KAIST 제조 피지컬 AI 연구소가 9월 8일 세 기관 업무협약을 맺었음. 인공지능과 로봇, 제조 설비를 묶은 기술을 실제 공장에 적용하고 사업으로 잇겠다는 내용임. 역할은 셋으로 나뉨. KAIST 연구소가 앞선 연구와 핵심기술 개발을 맡고, 다임리서치가 현장에서 기술을 검증해 상품으로 만들고 고객사에 적용함. 한국IBM 은 데이터와 보안 기술로 수요를 찾고 확산을 돕음. 다루는 분야는 스마트 물류와 공장 자동화, 설비가 고장 나기 전에 미리 잡아내는 예지보전, 공장 설비를 노리는 공격을 막는 운영기술 보안임. 다만 협약의 규모와 기간, 어느 공정에 먼저 적용하는지는 공개되지 않았음. 다임리서치는 하루 전 KT·KAIST 와도 무인공장 협약을 맺었음.", "body": "다임리서치와 한국IBM, KAIST 제조 피지컬 AI 연구소가 9월 8일 피지컬 AI 기반 제조 혁신 및 산업 확산 3자 업무협약을 맺었다고 전해짐, 역할은 다임리서치가 제조·물류 현장의 로봇 통합 운영 경험을 바탕으로 기술 검증과 솔루션 상용화, 고객사 적용을 맡고 한국IBM 이 인공지능·데이터·자산관리·보안 기술로 수요 발굴과 현장 적용, 사업 확산을 지원하며 KAIST 연구소가 선행 연구와 핵심기술 개발을 담당하는 것으로 나뉨, 대상 분야는 스마트 물류와 공장 자동화, 설비 예지보전과 통합 관제, 운영기술 보안과 인공지능 안전성 셋으로 제시됨, 협약 규모와 기간, 투입 인력, 첫 적용 대상 공정과 사이트는 공개되지 않아 이행 단계로 읽을 근거가 없고 세 기관 어느 쪽의 공식 발표도 확보하지 못해 2차 자료에 근거함, 다임리서치는 9월 8일 KT·KAIST 와 맺은 다크팩토리 플랫폼 협약에도 참여한 바 있어 같은 주에 두 건의 협약에 이름을 올렸으나 두 협약이 서로 어떻게 이어지는지는 밝혀지지 않음", "src": "로봇신문 9.9", "pd": "2026-09-09", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48375"}, {"sec": 5, "t": "대동, 국산 반도체 무인 농작업 로봇 과제 총괄기관 선정", "k": "431억 원이 4년 반에 배정됐고 현장 검증은 2029년부터 이뤄진다", "ez": "농기계 기업 대동이 산업통상부의 K-온디바이스 인공지능 반도체 기술개발 사업에서 무인 농작업 로봇 과제를 총괄하게 됐다고 9월 9일 밝혔음. 온디바이스 인공지능 반도체는 인터넷 서버에 조회하지 않고 기기 안에서 직접 판단하는 칩을 말함. 논밭처럼 통신이 끊기기 쉬운 곳에서 움직이는 로봇에는 이 방식이 유리함. 사업 규모는 431억 원, 기간은 2026년 7월부터 2030년 12월까지이며 산학연 14곳이 참여함. 대동은 국산 칩을 로봇 플랫폼과 자율 농작업 인공지능에 통합해 방제와 수확, 운반, 작물 상태 확인을 자동화하는 것을 목표로 삼았음. 2028년까지 핵심기술과 시제품을 만들고, 2029년부터 현장에서 검증함. 다만 정부 지원금과 기업 부담의 구분, 참여 기관 명단은 공개되지 않았음. 같은 사업 안에는 휴머노이드를 다루는 별도 과제도 있음.", "body": "농기계 기업 대동이 산업통상부의 K-온디바이스 인공지능 반도체 기술개발 사업에서 무인 농작업 로봇 과제의 총괄 연구기관으로 선정됐다고 밝힘, 총사업비는 약 431억 원이고 기간은 2026년 7월부터 2030년 12월까지이며 산학연 14곳이 참여하고 한국산업기술기획평가원이 사업을 관리함, 대동은 국산 인공지능 반도체를 로봇 플랫폼과 자율 농작업 인공지능 솔루션에 통합하는 역할을 맡고 방제·수확·운반·작물 모니터링의 자동화를 목표로 제시함, 일정은 2026년부터 2028년까지 핵심기술 확보와 시제품 제작, 2029년부터 2030년까지 반도체를 로봇에 적용해 현장 검증과 상용화 기반을 마련하는 순서로 구분됨, 정부지원분과 민간부담의 구분, 참여 14곳의 명단과 기관별 배분, 대상 작물과 검증 사이트는 공개되지 않음, 대동 공식 뉴스룸을 9월 10일 직접 열어 최신 게시물에 이 항목이 없음을 확인해 2차 자료에 근거함, 이 과제 자체는 휴머노이드가 아니라 농작업 로봇이며 이 지면에 싣는 값은 같은 사업의 구조가 드러난 데 있음 — 미확정 사항 O11 이 묻고 있는 LG전자·모빌린트·노타의 휴머노이드 과제와 같은 사업의 다른 세부과제여서 사업 전체가 세부과제별 총괄기관 체제로 편성돼 있음이 확인됨", "src": "인공지능신문 9.9", "pd": "2026-09-09", "url": "https://www.aitimes.kr/news/articleView.html?idxno=41830"}, {"sec": 5, "t": "안티오크, 피지컬 AI 시험용 시뮬레이션에 투자 유치", "k": "올해 4월 850만 달러에 이어 다섯 달 만에 3,200만 달러가 추가 조달됐다", "ez": "피지컬 AI 용 시뮬레이션 기업 안티오크가 3,200만 달러, 약 440억 원 규모의 투자를 받았다고 9월 9일 전해졌음. 미국 벤처투자사 그레이록이 주도했고, 올해 4월 850만 달러를 받은 데 이은 두 번째 투자임. 다섯 달 만에 규모가 네 배 가까이 커졌음. 안티오크는 로봇을 직접 만들지 않음. 대신 로봇과 자율주행 개발팀이 실제 현장에 내보내기 전에 컴퓨터 안에서 인공지능을 시험할 수 있는 환경을 제공함. 한 번의 실험부터 수천 건을 동시에 수행하는 평가까지 가능하다고 설명했음. 아마존의 가정용 보안 브랜드 링이 고객이고, 엔비디아와도 협력함. 아마존 측은 의도적으로 보정하지 않은 조건에서도 시뮬레이션 결과가 실제 시험과 근접했다고 평가했음. 다만 오차가 얼마였고 몇 번 시험했는지는 공개되지 않았음.", "body": "피지컬 AI 용 시뮬레이션 플랫폼 기업 안티오크가 그레이록이 주도한 3,200만 달러(약 440억 원) 규모의 시리즈A 투자를 유치했다고 밝힘, 카테고리벤처스와 박스그룹, 아이스하우스벤처스가 참여했고 올해 4월 850만 달러를 조달한 데 이은 두 번째 라운드임, 회사는 로봇·자율주행 개발팀이 실제 배치 전에 단일 실험부터 수천 건의 병렬 평가까지 고정밀 시뮬레이션에서 인공지능 시스템을 개발·시험·검증하도록 지원한다고 설명했고 자금은 제품 개발 가속과 엔지니어링 인력 확충, 시뮬레이션 역량 강화에 쓴다고 밝힘, 아마존의 스마트홈 브랜드 링을 고객으로 들었고 엔비디아·네비우스와 협력한다고 함, 아마존 측 임원이 보정 대상에서 의도적으로 제외한 시나리오에서도 시뮬레이션 결과가 실물 시험 결과와 근접하게 맞았다고 평가한 발언이 함께 전해졌으나 오차 범위와 시험 건수는 제시되지 않아 정확도의 근거로 쓰지 않음, 설립 시점과 휴머노이드 적용 여부는 밝혀지지 않았고 회사 공식 발표를 확보하지 못해 2차 자료에 근거하며 국내 보도가 인용한 해외 매체 기사도 확인하지 못해 재인용임", "src": "로봇신문 9.9", "pd": "2026-09-09", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48388"}, {"sec": 6, "t": "휴머노이드, 통관 품목분류 부재로 수출입 통계 집계 불가", "k": "수출입 규모를 파악하지 못한 상태에서 지원 대책과 성과지표를 세운다", "ez": "휴머노이드가 수출입 통계에 잡히지 않는다는 지적이 나왔음. 물건이 국경을 넘을 때는 품목마다 붙은 분류 코드로 세는데, 국내에는 휴머노이드를 가리키는 항목이 없음. 그래서 기타 산업용 로봇에 섞이거나 아예 로봇이 아닌 기타 기계류로 분류되는 일까지 생김. 산업통상부는 2028년 분류표 개정을 앞두고 재정경제부에 휴머노이드와 사족보행 로봇 코드를 새로 만들어 달라고 요청한 상태임. 중국은 이미 2026년 1월부터 지능형 생체모방 로봇이라는 항목을 신설해 휴머노이드와 사족보행 로봇을 담았고, 올해 상반기에만 1만 대 넘게 이 항목으로 수출한 것으로 전해졌음. 구동기 같은 핵심부품도 여러 품목에 흩어져 있어 산업의 수출입 구조를 파악하기 어렵다는 지적이 함께 나왔음. 정부는 수요조사를 하는 단계이며 필요가 많은 품목은 적극 검토하겠다고 밝혔음.", "body": "휴머노이드를 따로 구분할 통관 분류 코드가 국내에 없어 현물이 기타 산업용 로봇의 일부로 잡히거나 산업용 로봇이 아닌 기타 기계류로 분류되는 경우까지 있는 것으로 전해짐, 한국은 국제 공통 코드에 네 자리를 더한 10단위 관세통계통합품목분류표를 운용하는데 산업통상부가 2028년 개정을 앞두고 재정경제부에 휴머노이드와 사족보행 로봇의 별도 코드 신설을 요청한 상태임, 中 은 2026년 1월부터 지능형 생체모방 로봇이라는 하위분류를 신설해 휴머노이드와 사족보행 로봇을 담았고 2026년 상반기에만 1만 대가 넘는 물량을 이 분류로 수출한 것으로 전해졌으나 中 통계 원본을 확보하지 못해 단정하지 않음, 국제 공통 코드에는 2028년부터 로봇청소기 분류가 추가될 예정임, 완제품뿐 아니라 구동기 같은 핵심부품도 여러 품목으로 흩어져 있어 현재 통계로는 산업의 수출입 구조를 파악하기 어렵다는 지적이 함께 제시됨, 정부 관계자는 2028년 개정에 따른 수요조사를 진행하는 단계이며 신설 수요가 많은 품목은 적극 검토한다고 밝힘, 기관이 낸 문서가 존재하지 않는 취재 사실이어서 지정 매체 보도를 근거로 삼되 산업통상부의 요청 공문과 재정경제부의 검토 상황을 확인하지 못했으므로 코드 신설이 확정된 것으로 읽지 않고 등급을 S3 으로 둠, 中 의 2026년 1월 분류 신설과 상반기 수출 대수도 같은 보도에 실린 전언이어서 원본 통계와 대조하기 전까지 단정하지 않음", "src": "전자신문 9.9", "pd": "2026-09-09", "url": "https://www.etnews.com/20260909000291"}, {"sec": 7, "t": "로봇산업진흥원, 부산서 로봇 시스템통합 기업 간담회", "k": "8월부터 이어진 지역 순회에서 설치 기업의 요구를 정책으로 모은다", "ez": "한국로봇산업진흥원이 9월 8일과 9일 이틀 동안 부산에서 로봇 시스템통합 기업 간담회를 열었음. 시스템통합 기업은 로봇을 직접 만드는 회사가 아니라, 만들어진 로봇을 공장 상황에 맞게 설치하고 기존 설비와 연결해 실제로 가동되게 만드는 기업임. 로봇 도입의 성패는 대개 이 단계에서 결정됨. 행사에는 기업 관계자와 산학연 전문가 등 약 100명이 참석했고, 부산·울산·경남 기업이 참여한 현장 간담회에는 30명가량이 모였음. 지원정책과 자동화 기술 동향을 공유하고, 실제 도입 사례를 발표했으며, 기업이 겪는 어려움과 정책 지원 방향을 논의했음. 조영훈 원장은 중소·중견 제조기업의 혁신을 위해서는 우수한 시스템통합 기업을 키우는 일이 필수라고 밝혔음. 진흥원은 8월에도 화성과 대전, 대구, 경남에서 같은 형식의 간담회를 이어 왔음.", "body": "한국로봇산업진흥원이 9월 8일부터 9일까지 부산에서 로봇 시스템통합 기업 협력 네트워크와 현장 간담회를 열었다고 전해짐, 로봇 시스템통합 기업 관계자와 산학연 전문가 등 약 100명이 참석했고 현장 간담회에는 진흥원과 부산·울산·경남 지역 기업 등 약 30명이 함께함, 로봇 시스템통합 관련 지
