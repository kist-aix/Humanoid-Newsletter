<!-- 자립형 배포본 · 2026-09-18 08:35 생성 · 더블클릭하면 열립니다 -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

/* ══════════════════════════════════════════════════════════════
   디자인 토큰 — 세 상태를 모두 정의한다.
   :root 에 완전한 라이트 팔레트, 미디어 쿼리와 [data-theme]에서 재정의.
   미디어 쿼리 안에서만 정의되는 색이 하나라도 있으면,
   시스템 기본(스탬프 없음) 상태에서 그 색이 사라져 글자가 배경에 묻힌다.
   ══════════════════════════════════════════════════════════════ */
:root{
  --bg:#EDF0EE; --surface:#FBFCFB; --surface2:#F1F4F2; --panel:#16211D;
  --ink:#131C19; --ink2:#2C3A35; --muted:#5A6A63; --line:#D2DAD5; --line2:#E3E9E5;
  --accent:#0D6A56; --accent-soft:#DCEBE5; --gov:#2A4B7C; --gov-soft:#DFE7F2;
  --warn:#95441A; --warn-soft:#F2E3D8; --panel-ink:#DCE7E2; --panel-dim:#7E948C;
  --ok:#0D6A56; --ok-soft:#DCEBE5; --crit:#8E2F2F; --crit-soft:#F4DFDF;
  --pw-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1211; --surface:#141C19; --surface2:#1A2421; --panel:#0A100E;
    --ink:#E4EBE7; --ink2:#C3D0CA; --muted:#8FA098; --line:#26332F; --line2:#1E2A26;
    --accent:#4CC5A2; --accent-soft:#12302A; --gov:#84AADE; --gov-soft:#16233A;
    --warn:#DE9364; --warn-soft:#2E2019; --panel-ink:#D5E2DC; --panel-dim:#71877F;
    --ok:#4CC5A2; --ok-soft:#12302A; --crit:#E08585; --crit-soft:#331B1B;
    --pw-ink:#0D1211;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1211; --surface:#141C19; --surface2:#1A2421; --panel:#0A100E;
  --ink:#E4EBE7; --ink2:#C3D0CA; --muted:#8FA098; --line:#26332F; --line2:#1E2A26;
  --accent:#4CC5A2; --accent-soft:#12302A; --gov:#84AADE; --gov-soft:#16233A;
  --warn:#DE9364; --warn-soft:#2E2019; --panel-ink:#D5E2DC; --panel-dim:#71877F;
  --ok:#4CC5A2; --ok-soft:#12302A; --crit:#E08585; --crit-soft:#331B1B;
  --pw-ink:#0D1211;
}

*{box-sizing:border-box}
html{color-scheme:light dark}
body{
  background:var(--bg); color:var(--ink); margin:0;
  font-family:'Noto Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif;
  font-size:14.5px; line-height:1.72; -webkit-font-smoothing:antialiased;
  /* 한글은 **어절을 통째로** 다음 줄로 넘긴다 (2026-09-14 지시로 지면 전체에 건다).
     CSS 기본값(word-break:normal)은 한글을 음절 단위로 쪼개 '휴머노이'에서 끊고
     '드'를 다음 줄로 보낸다. 어미가 잘리면 읽는 사람이 그 자리에서 한 번 멈춘다.
     같은 날 상세면(.detail)에만 걸었더니 목록·카드·표는 그대로 끊겼다 —
     **자리마다 따로 걸면 새로 만든 자리가 반드시 빠지므로 뿌리에 한 번 건다.**
     띄어쓰기가 없는 긴 주소는 overflow-wrap 이 받는다. */
  word-break:keep-all; overflow-wrap:break-word;
}
h1,h2,h3{font-family:'Gowun Batang','Noto Serif KR',Georgia,serif; margin:0; text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
img{max-width:100%}
.wrap{max-width:1080px; margin:0 auto; padding:0 20px 90px}

/* ── 머리 ── */
.top{padding:30px 0 0; display:flex; flex-wrap:wrap; gap:14px; align-items:flex-start}
.top .grow{flex:1 1 300px}
.eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--accent); font-weight:600}
h1{font-size:clamp(24px,4.4vw,36px); font-weight:700; margin-top:10px; line-height:1.2}
.subline{color:var(--muted); font-size:13px; margin-top:9px;
  font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums}

/* 내부면 표식. 화면 캡처가 밖으로 나갔을 때 구분되어야 하므로 숨기거나 접지 않는다. */
.internal-badge{
  display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
  letter-spacing:.1em; padding:3px 9px; border-radius:2px;
  background:var(--warn-soft); border:1px solid var(--warn); color:var(--warn);
}
.themetog{
  appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--muted);
  font-family:'IBM Plex Mono',monospace; font-size:11px; padding:4px 10px; border-radius:2px;
  cursor:pointer;
}
.themetog:hover{color:var(--ink); border-color:var(--ink)}
.themetog:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ── 내비 ── */
nav.tabs{display:flex; gap:0; margin-top:24px; border-bottom:2px solid var(--ink); overflow-x:auto}
nav.tabs a, nav.tabs button{
  appearance:none; text-decoration:none; display:block;
  border:1px solid var(--line); border-bottom:none; background:var(--surface2);
  color:var(--muted); font-family:'Noto Sans KR',sans-serif; font-size:13.5px; font-weight:500;
  padding:9px 15px; cursor:pointer; white-space:nowrap; margin-right:-1px; border-radius:2px 2px 0 0;
}
nav.tabs .n{font-family:'IBM Plex Mono',monospace; font-size:11px; margin-right:7px; opacity:.75}
nav.tabs a:hover, nav.tabs button:hover{background:var(--surface); color:var(--ink)}
nav.tabs a[aria-current="page"], nav.tabs button[aria-selected="true"]{
  background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:700}
nav.tabs a:focus-visible, nav.tabs button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.pane{padding:30px 0 0}
.pane[hidden]{display:none}

h2{font-size:21px; font-weight:700; margin:34px 0 6px}
h2:first-child{margin-top:0}
h3{font-size:15.5px; font-weight:700; margin:24px 0 10px}
.dek{color:var(--muted); font-size:13.5px; margin-bottom:16px; max-width:72ch}

/* ── 표 ── */
.scroll{overflow-x:auto; border:1px solid var(--line); background:var(--surface); margin:16px 0}
table{border-collapse:collapse; width:100%; min-width:540px; font-size:13px}
th,td{padding:9px 11px; text-align:left; vertical-align:top; border-bottom:1px solid var(--line2)}
thead th{background:var(--surface2); font-family:'IBM Plex Mono',monospace; font-weight:600;
  font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted);
  border-bottom:1px solid var(--line); white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
td.n{font-variant-numeric:tabular-nums; font-family:'IBM Plex Mono',monospace; white-space:nowrap}

/* ── 칩·등급 ── */
.chip{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
  padding:2px 6px; border-radius:2px; border:1px solid var(--line); background:var(--surface2);
  color:var(--ink2); margin:1px 2px 1px 0; white-space:nowrap}
.chip.a{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.chip.b{background:var(--gov-soft); border-color:var(--gov); color:var(--gov)}
.chip.c{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}
.sig{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
  font-weight:600; padding:2px 6px; border-radius:2px; white-space:nowrap}
.sig.s1{background:var(--ok-soft); color:var(--ok); border:1px solid var(--ok)}
.sig.s2{background:var(--gov-soft); color:var(--gov); border:1px solid var(--gov)}
.sig.s3{background:var(--surface2); color:var(--muted); border:1px solid var(--line)}
.sig.s4{background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn)}

/* ── 도구막대·버튼 ── */
.toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:16px 0;
  padding:12px 14px; background:var(--surface); border:1px solid var(--line)}
.toolbar .count{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--muted);
  font-variant-numeric:tabular-nums}
.toolbar .count b{color:var(--accent); font-size:15px}
button.act, a.act{
  appearance:none; text-decoration:none; display:inline-block;
  border:1px solid var(--ink); background:var(--ink); color:var(--bg);
  font-family:'Noto Sans KR',sans-serif; font-size:13px; font-weight:600; padding:7px 14px;
  border-radius:2px; cursor:pointer;
}
button.act.ghost, a.act.ghost{background:transparent; color:var(--ink)}
button.act:hover, a.act:hover{opacity:.86}
button.act:focus-visible, a.act:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
select, input[type=search], input[type=text]{
  font-family:'Noto Sans KR',sans-serif; font-size:13px; padding:6px 9px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:2px;
}
select:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

/* ── 후보풀 ── */
table.pool td{vertical-align:middle}
table.pool tr.on{background:var(--accent-soft)}
table.pool input[type=checkbox]{width:16px; height:16px; accent-color:var(--accent); cursor:pointer}
.sc{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; font-size:12px}
.sc b{font-size:13.5px; color:var(--accent)}
.ttl{font-weight:500; line-height:1.5}
.src{font-size:11.5px; color:var(--muted); font-family:'IBM Plex Mono',monospace}
/* 검증 경위 — 내부 후보풀 화면에만 나온다(2026-09-04). 무엇을 확보하지 못했는지를
   승인 전에 보이게 하되, 제목보다 뒤로 물러서게 해서 사실과 섞이지 않게 한다. */
.vnote{margin-top:5px; font-size:11.5px; line-height:1.55; color:var(--muted);
  border-left:2px solid var(--line); padding:3px 0 3px 8px}
.vnote .lbl{display:inline-block; margin-right:6px; font-weight:600; color:var(--warn,#a15c00)}
.pw{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:600;
  padding:1px 5px; border-radius:2px; background:var(--gov); color:var(--pw-ink);
  margin-right:5px; vertical-align:1px}

/* ── 발송본 패널 ── */
.out{background:var(--panel); color:var(--panel-ink); padding:20px 18px; margin-top:14px;
  overflow-x:auto; border-radius:2px}
.out pre{margin:0; font-family:'IBM Plex Mono','D2Coding',monospace; font-size:12px;
  line-height:1.9; white-space:pre-wrap; word-break:break-word}

/* ── 노트 ── */
.note{background:var(--surface); border-left:3px solid var(--accent); padding:14px 16px;
  margin:16px 0; font-size:13.5px; color:var(--ink2)}
.note.warn{border-left-color:var(--warn)}
.note .lbl{display:block; font-family:'IBM Plex Mono',monospace; font-size:10px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--accent); font-weight:600;
  margin-bottom:5px}
.note.warn .lbl{color:var(--warn)}

/* ── REF 카드 ── */
.refs{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:12px; margin-top:14px}
.ref{border:1px solid var(--line); background:var(--surface); padding:13px 14px}
.ref .rid{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--muted); letter-spacing:.06em}
.ref .rt{font-weight:700; font-size:14px; margin:5px 0 6px; line-height:1.45}
.ref .rm{font-size:12.5px; color:var(--muted); margin-bottom:8px}
.ref .rk{font-size:12.5px; color:var(--ink2); margin-top:8px; padding-top:8px;
  border-top:1px dashed var(--line)}
.filters{display:flex; flex-wrap:wrap; gap:6px; margin:14px 0}
.filters button{appearance:none; font-family:'IBM Plex Mono',monospace; font-size:11.5px;
  padding:4px 9px; border:1px solid var(--line); background:var(--surface); color:var(--muted);
  cursor:pointer; border-radius:2px}
.filters button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.filters button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ── 스레드 ── */
.thread{border:1px solid var(--line); background:var(--surface); padding:15px 16px; margin-bottom:12px}
.thread .tn{font-weight:700; font-size:15px; font-family:'Gowun Batang',serif}
.tl{list-style:none; margin:12px 0 0; padding:0 0 0 16px; border-left:2px solid var(--line)}
.tl li{position:relative; padding:0 0 10px 14px; font-size:13px}
.tl li::before{content:''; position:absolute; left:-21px; top:8px; width:7px; height:7px;
  border-radius:50%; background:var(--accent); border:2px solid var(--surface)}
.tl .d{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); margin-right:8px}
.verdict{margin-top:12px; padding:10px 12px; background:var(--surface2);
  border-left:3px solid var(--gov); font-size:13px}
.verdict b{color:var(--gov)}

/* ── 이슈 ── */
.iss{border:1px solid var(--line); background:var(--surface); margin-bottom:14px}
.ih{padding:13px 16px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap;
  gap:10px; align-items:baseline}
.ih .rule{font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
  padding:2px 7px; background:var(--ink); color:var(--bg); border-radius:2px}
.ih .it{font-weight:700; font-size:15px; font-family:'Gowun Batang',serif; flex:1 1 240px}
.ib{padding:14px 16px; display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px}
.lbl2{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); margin-bottom:5px}
.toc{font-size:13px; margin:0; padding-left:17px}
.toc li{margin-bottom:3px}
.vfy{font-size:12.5px}
.vf{display:block; margin-bottom:4px}
.ok-i{color:var(--ok); font-weight:600}
.wn-i{color:var(--warn); font-weight:600}
.cr-i{color:var(--crit); font-weight:600}

/* ── D-day ── */
.dd{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
  padding:2px 7px; border-radius:2px; background:var(--surface2); border:1px solid var(--line);
  color:var(--muted)}
.dd.near{background:var(--crit-soft); border-color:var(--crit); color:var(--crit)}
.dd.mid{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}

/* ── 파이프라인 ── */
.pipe{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:1px;
  background:var(--line); border:1px solid var(--line); margin-top:14px}
.col{background:var(--surface); padding:12px 13px; min-height:130px}
.colh{display:flex; align-items:baseline; gap:8px; margin-bottom:10px; padding-bottom:8px;
  border-bottom:1px solid var(--line2)}
.colh .cn{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); font-weight:600}
.colh .cc{font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:600;
  color:var(--accent); margin-left:auto; font-variant-numeric:tabular-nums}
.card{background:var(--surface2); border:1px solid var(--line); padding:8px 10px;
  margin-bottom:7px; font-size:12.5px; line-height:1.5}
.card .cid{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted)}
.card.done{border-left:3px solid var(--ok)}
.empty{font-size:12.5px; color:var(--muted); padding:6px 0}

/* ── 리포트 ── */
.rep{border:1px solid var(--line); background:var(--surface); margin-bottom:14px}
.reph{padding:13px 16px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap;
  gap:10px; align-items:baseline}
.reph .no{font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
  padding:2px 7px; background:var(--accent); color:var(--surface); border-radius:2px}
.reph .rtt{font-weight:700; font-size:15.5px; font-family:'Gowun Batang',serif; flex:1 1 240px}
.repb{padding:14px 16px}
.sum{background:var(--surface2); border-left:3px solid var(--accent); padding:11px 13px;
  margin-bottom:12px; font-size:13px}
.sum span{display:block; margin-bottom:5px}
.sum span:last-child{margin-bottom:0}
.repmeta{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; font-size:12.5px}
.stg{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600;
  padding:2px 7px; border-radius:2px; border:1px solid var(--line); background:var(--surface2);
  color:var(--muted)}
.stg.wait{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}
.stg.go{background:var(--gov-soft); border-color:var(--gov); color:var(--gov)}
.stg.pub{background:var(--ok-soft); border-color:var(--ok); color:var(--ok)}

/* ── 아카이브 목록 ── */
.edlist{display:grid; gap:10px; margin-top:14px}
.edrow{display:flex; flex-wrap:wrap; gap:12px; align-items:baseline; padding:12px 14px;
  border:1px solid var(--line); background:var(--surface); text-decoration:none; color:inherit}
.edrow:hover{border-color:var(--accent)}
.edrow .ed{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--accent);
  font-weight:600; white-space:nowrap}
.edrow .eh{flex:1 1 260px; font-size:13.5px}
.item{border-bottom:1px solid var(--line2); padding:11px 0}
.item:last-child{border-bottom:none}
.item .isec{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--muted);
  letter-spacing:.06em; text-transform:uppercase}
.item .itx{font-size:13.5px; margin-top:3px; line-height:1.7}
.hit{background:var(--accent-soft); border-radius:2px}

ul.tight{margin:10px 0 0; padding-left:19px}
ul.tight li{margin-bottom:6px; font-size:13.5px}
ul.tight li::marker{color:var(--accent)}
footer{margin-top:50px; padding-top:20px; border-top:1px solid var(--line); color:var(--muted);
  font-size:12px; font-family:'IBM Plex Mono',monospace}
code{font-family:'IBM Plex Mono',monospace; font-size:.92em; background:var(--surface2);
  padding:1px 4px; border-radius:2px}
b{font-weight:700}

@media (max-width:520px){
  .wrap{padding:0 14px 70px}
  nav.tabs a, nav.tabs button{padding:8px 11px; font-size:12.5px}
}

/* ── 발표일·원문 표기 ─────────────────────────────────────────
   검색엔진이 몇 달 지난 자료를 오늘 것처럼 올려 준다. 담당자가 승인 전에
   날짜를 눈으로 보게 하려고 항목마다 붙인다. 확인 못 한 날짜는 감추지 않는다. */
.pd{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
  padding:1px 5px; border-radius:2px; border:1px solid var(--line);
  background:var(--surface2); color:var(--muted); white-space:nowrap}
.pd.warn{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}
.src-link{font-size:10.5px; font-family:'IBM Plex Mono',monospace;
  text-decoration:none; border-bottom:1px solid currentColor}
.src-link:hover{border-bottom-width:2px}

/* ── 워치리스트 패널 (관리용 화면 전용) ───────────────────────
   발송본에서 뺀 뒤로 이 패널이 유일한 노출 지점이다. */
ul.watch{list-style:none; margin:0; padding:0}
ul.watch li{padding:8px 0; border-bottom:1px solid var(--line2);
  font-size:13px; line-height:1.65; display:flex; gap:9px; align-items:flex-start}
ul.watch li:last-child{border-bottom:none}
ul.watch .dd{flex:0 0 auto}

/* ── 지면 서식 (뉴스레터 면 · 내부 미리보기가 함께 쓴다) ─────────
   뉴스레터 면에만 두면 관리용 후보풀 화면의 미리보기가 다른 모습으로
   그려진다. 담당자가 화면에서 본 것과 배포되는 지면은 같아야 한다. */
  /* 공유용 전용 — 결과 중심 배치. 해석·판단근거는 싣지 않는다. */
  .fact{border-left:3px solid var(--line); padding:10px 0 10px 14px; margin:0 0 2px}
  .fact + .fact{border-top:1px solid var(--line2)}
  .fact .ft{font-size:14px; font-weight:600; line-height:1.55; color:var(--ink)}
  .fact .fk{font-size:13px; line-height:1.75; color:var(--ink2); margin-top:5px}
  .fact .fm{margin-top:6px; display:flex; flex-wrap:wrap; gap:7px; align-items:center}
  /* 섹션 7개를 색으로 가른다. 번호를 세지 않고도 어느 갈래인지 눈에 들어와야 한다.
     라이트는 어두운 색, 다크는 밝은 색 — 세 테마 상태를 모두 정의한다. */
  :root{
    --s1:#2A4B7C; --s2:#0D6A56; --s3:#5B3E8E; --s4:#16607A;
    --s5:#8A5A1B; --s6:#8E3346; --s7:#4A6B22; --s8:#7A3E6B;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --s1:#8DAFE2; --s2:#4CC5A2; --s3:#B7A0E4; --s4:#74C4DF;
      --s5:#E0AC72; --s6:#E993A7; --s7:#AFD177; --s8:#D9A2CC;
    }
  }
  :root[data-theme="dark"]{
    --s1:#8DAFE2; --s2:#4CC5A2; --s3:#B7A0E4; --s4:#74C4DF;
    --s5:#E0AC72; --s6:#E993A7; --s7:#AFD177; --s8:#D9A2CC;
  }

  .secblk{margin:0 0 26px}
  .secblk h3{display:flex; align-items:baseline; gap:9px; margin:0 0 4px;
    font-size:15px; letter-spacing:-.01em;
    border-bottom:2px solid currentColor; padding-bottom:6px}
  .secblk[data-sec="1"] h3{color:var(--s1)}
  .secblk[data-sec="2"] h3{color:var(--s2)}
  .secblk[data-sec="3"] h3{color:var(--s3)}
  .secblk[data-sec="4"] h3{color:var(--s4)}
  .secblk[data-sec="5"] h3{color:var(--s5)}
  .secblk[data-sec="6"] h3{color:var(--s6)}
  .secblk[data-sec="7"] h3{color:var(--s7)}
  .secblk[data-sec="8"] h3{color:var(--s8)}
  /* 항목 왼쪽 선도 같은 색을 옅게 물려 받아 어느 섹션 소속인지 이어 보이게 한다 */
  .secblk[data-sec="1"] .fact{border-left-color:var(--s1)}
  .secblk[data-sec="2"] .fact{border-left-color:var(--s2)}
  .secblk[data-sec="3"] .fact{border-left-color:var(--s3)}
  .secblk[data-sec="4"] .fact{border-left-color:var(--s4)}
  .secblk[data-sec="5"] .fact{border-left-color:var(--s5)}
  .secblk[data-sec="6"] .fact{border-left-color:var(--s6)}
  .secblk[data-sec="7"] .fact{border-left-color:var(--s7)}
  .secblk[data-sec="8"] .fact{border-left-color:var(--s8)}
/* ── 당일 미리보기 (내부 후보풀 화면) ─────────────────────────
   체크하는 즉시 배포될 지면이 이 안에 그려진다. 테두리를 둘러 '지면'과
   '작업 화면'을 눈으로 가른다 — 안쪽은 밖으로 나가는 것이다. */
.preview{border:1px solid var(--line); background:var(--surface);
  padding:16px 18px 6px; margin:12px 0 0}
.preview .toolbar{margin-top:0}
pre.cmd{margin:8px 0 0; padding:10px 12px; overflow-x:auto; white-space:pre-wrap;
  word-break:break-all; background:var(--surface2); border:1px solid var(--line);
  font-family:'IBM Plex Mono','D2Coding',monospace; font-size:11.5px;
  line-height:1.7; color:var(--ink2)}

/* ══════════════════════════════════════════════════════════════
   기사 상세면 (2026-09-09 신설)
   목록의 제목을 누르면 이 면이 선다 — 메타표 · AI 상세요약 · 하단 원문 링크.
   별도 파일이 아니라 같은 파일 안에서 갈아 끼우므로, 배포본 한 장으로 보내도
   그대로 눌린다. 인쇄·이미지로 구울 때는 bundle.py 가 목록만 남기고 감춘다.
   ══════════════════════════════════════════════════════════════ */

/* 목록에서 — 제목이 눌린다는 것이 보여야 한다. 밑줄 대신 오른쪽에 표를 단다. */
.fact a.ft{display:block; text-decoration:none; color:var(--ink); font-size:14px;
  font-weight:600; line-height:1.55}
.fact a.ft:hover{color:var(--accent)}
.fact a.ft:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
/* 제목 줄 — 헤드라인과 「상세 보기」를 양 끝으로 벌린다 (2026-09-09 지시).
   좁은 화면에서는 상세 보기가 아래로 떨어지되 오른쪽에 붙어 있게 한다. */
.fact .fh{display:flex; flex-wrap:wrap; gap:6px 14px; align-items:baseline;
  justify-content:space-between}
.fact .fh a.ft{flex:1 1 240px}
.fact .fh a.dgo{flex:0 0 auto; margin-left:auto}

/* 「상세 보기」 — 목록에서 상세면으로 가는 유일한 길이다. 발표일도 출처도
   상세면 메타표가 지므로 목록에는 이것만 둔다. */
a.dgo{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
  font-weight:600; letter-spacing:.04em; padding:2px 8px; border-radius:2px;
  border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent);
  text-decoration:none; white-space:nowrap}
a.dgo:hover{background:var(--accent); color:var(--surface)}
a.dgo:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
/* 리포트 카드 제목 옆 표는 그대로 쓴다 */
a.rtt .more{display:inline-block; margin-left:8px; vertical-align:2px;
  font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:600; letter-spacing:.08em;
  padding:1px 5px; border-radius:2px; border:1px solid var(--line);
  background:var(--surface2); color:var(--muted); white-space:nowrap}
a.rtt:hover .more{border-color:var(--accent); color:var(--accent);
  background:var(--accent-soft)}

/* ── 상세면 ── */
/* 낱말을 음절 단위로 끊지 않는다 (2026-09-14 지시로 뒤집힌 규칙).
   CSS 기본값(word-break:normal)은 한글을 음절 단위로 쪼개 어디서든 줄을 넘긴다 —
   '휴머노이'에서 끊고 '드'를 다음 줄로 보내는 식이다. 읽는 사람은 그 자리에서
   한 번 멈춘다. keep-all 은 어절을 통째로 넘기므로 그 멈춤이 없어진다.
   긴 주소처럼 띄어쓰기가 없는 문자열은 overflow-wrap 이 받아 준다.
   상세면 전체에 한 번 깔아 두면 제목·메타표·요약·본문이 모두 같은 규칙을 따른다. */
.detail{max-width:78ch; word-break:keep-all; overflow-wrap:break-word}
.dhead{border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:0}
.dsec{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.11em;
  text-transform:uppercase; font-weight:600; color:var(--muted); margin-bottom:8px}
.detail[data-sec="1"] .dsec{color:var(--s1)}
.detail[data-sec="2"] .dsec{color:var(--s2)}
.detail[data-sec="3"] .dsec{color:var(--s3)}
.detail[data-sec="4"] .dsec{color:var(--s4)}
.detail[data-sec="5"] .dsec{color:var(--s5)}
.detail[data-sec="6"] .dsec{color:var(--s6)}
.detail[data-sec="7"] .dsec{color:var(--s7)}
.detail[data-sec="8"] .dsec{color:var(--s8)}
.dtt{font-size:clamp(19px,3vw,25px); font-weight:700; line-height:1.38; color:var(--ink)}

/* 메타표 — 자료발표일·출처·원문링크. 첨부 서식과 같은 자리에 같은 것이 오게 둔다. */
.dmeta{margin:0; padding:14px 16px; background:var(--surface2);
  border:1px solid var(--line); border-top:none; display:grid; gap:7px 18px; font-size:12.5px}
.dmeta > div{display:grid; grid-template-columns:88px 1fr; gap:12px; align-items:baseline}
.dmeta dt{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.06em;
  color:var(--muted); font-weight:600; padding-top:1px}
/* break-all 은 긴 주소를 접으려고 둔 것인데 출처 이름까지 음절로 쪼갰다.
   keep-all 로 바꾸고, 접을 곳이 없는 문자열만 anywhere 가 받게 한다. */
.dmeta dd{margin:0; color:var(--ink2); word-break:keep-all;
  overflow-wrap:anywhere; line-height:1.6}
.dmeta dd a{color:var(--accent); text-decoration:none; border-bottom:1px solid var(--line)}
.dmeta dd a:hover{border-bottom-color:currentColor}
/* 출처 조각이 곧 링크다 (2026-09-09). src-link 의 기본값(10.5px 모노)은 목록의
   좁은 줄에 맞춘 것이라 표 안에서는 읽기 어렵다 — 여기서는 본문 크기로 되돌린다. */
.dmeta dd a.src-link{font-family:inherit; font-size:13px; border-bottom-color:var(--accent)}

.dkey{margin-top:16px; padding:12px 14px; background:var(--surface);
  border-left:3px solid var(--accent); font-size:13.5px; line-height:1.75; color:var(--ink)}
.dkey .lbl2{margin-bottom:5px}

/* AI 요약 상자 */
.aibox{margin-top:16px; padding:16px 18px; background:var(--surface);
  border:1px solid var(--line); border-radius:2px}
.aibox .aih{display:flex; align-items:center; gap:8px; margin-bottom:12px;
  padding-bottom:9px; border-bottom:1px solid var(--line2);
  font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.09em;
  font-weight:600; color:var(--accent); text-transform:uppercase}
.aibox .aim{display:inline-flex; align-items:center; justify-content:center;
  min-width:22px; height:18px; padding:0 5px; border-radius:2px;
  background:var(--accent); color:var(--surface); font-size:10px; letter-spacing:.04em}
/* 2026-09-09 에는 양쪽 맞춤을 지키려고 기본값(word-break:normal)을 썼다.
   그때 판단은 「한글은 음절 단위로 넘겨도 읽기에 지장이 없다」였는데,
   2026-09-14 담당자가 지면을 보고 뒤집었다 — 낱말이 끊기는 것이 먼저 보인다.
   그래서 keep-all 로 바꾼다. 그러면 9/9 가 걱정한 문제가 실제로 생긴다 —
   줄 끝에 긴 어절이 걸리면 통째로 다음 줄로 넘어가고 남은 자리를 낱말 사이
   빈칸이 나눠 가져 줄 가운데가 구멍처럼 벌어진다. **그래서 양쪽 맞춤을 함께
   버린다.** 왼쪽 맞춤이면 남는 자리가 오른쪽 끝에 한 번에 모이므로 문단 안에
   구멍이 생기지 않는다. 둘 중 하나는 포기해야 하고, 지시는 어절 쪽이다. */
.aibox p{font-size:13.8px; line-height:1.95; color:var(--ink2); margin:0 0 11px;
  text-align:left; word-break:keep-all; overflow-wrap:break-word; hyphens:none}
.aibox p:last-child{margin-bottom:0}
/* 韓 연계 — 사실이 아니라 우리 해석이다. 색을 갈라 경계를 보이게 한다. */
.aibox.kor{background:var(--gov-soft); border-color:var(--gov)}
.aibox.kor .aih{color:var(--gov); border-bottom-color:var(--gov)}
.aibox.kor .aim.k{background:var(--gov); color:var(--pw-ink)}
.aibox.kor p{color:var(--ink)}

/* 유료 지면 표 — 누르기 전에 알 수 있어야 한다 (2026-09-09).
   유료 소스는 보조 출처로 달지 않는 것이 원칙이고, 이 표가 붙는 것은
   그 기사 자체가 항목이라 유료 지면이 유일한 확인 경로인 예외뿐이다. */
.paywall{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:9.5px;
  font-weight:600; letter-spacing:.06em; padding:1px 5px; border-radius:2px;
  background:var(--warn-soft); border:1px solid var(--warn); color:var(--warn);
  white-space:nowrap; vertical-align:1px}

@media (max-width:520px){
  .dmeta > div{grid-template-columns:74px 1fr; gap:9px}
}

/* ══════════════════════════════════════════════════════════════
   리포트 상세면 (2026-09-09 신설)
   서가의 카드를 누르면 이 면이 선다. 기사 상세면과 같은 뼈대를 쓰되
   메타표에 자료발간일·키워드·첨부파일이 더 붙는다.
   ══════════════════════════════════════════════════════════════ */
.rep a.rtt{text-decoration:none; color:var(--ink)}
.rep a.rtt:hover{color:var(--accent)}
.rep a.rtt:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
.kws{display:flex; flex-wrap:wrap; gap:5px}
.kw{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
  padding:1px 6px; border-radius:2px; background:var(--accent-soft);
  border:1px solid var(--accent); color:var(--accent); white-space:nowrap}
a.file{display:inline-flex; align-items:center; gap:8px; text-decoration:none;
  padding:7px 11px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink2); font-size:12.5px; margin:0 6px 6px 0}
a.file:hover{border-color:var(--accent); background:var(--accent-soft)}
a.file .ext{font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:600;
  letter-spacing:.06em; padding:2px 5px; border-radius:2px;
  background:var(--warn-soft); border:1px solid var(--warn); color:var(--warn)}
a.file .ext.html{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}

/* 공개 아카이브의 항목 제목 — 누르면 그 기사의 상세면이 선다 (2026-09-09) */
a.alink{color:var(--ink); text-decoration:none; font-weight:600;
  border-bottom:1px solid var(--line)}
a.alink:hover{color:var(--accent); border-bottom-color:currentColor}
a.alink:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* 상세면이 서는 동안 탭을 감춘다. nav.tabs 의 display:flex 가 브라우저 기본
   [hidden]{display:none} 을 이기므로 여기서 다시 눌러 준다 — 이걸 빼면 상세면 위에
   탭이 남고, 눌러도 뒤에 가린 목록만 바뀌어 아무 일도 안 일어난 것처럼 보인다. */
nav.tabs[hidden]{display:none !important}


/* ── 1면 상단 배너 — `banner.py` 가 만든다. 손으로 고치지 마라 ──────
   제호 블록(.top) 자체를 배너로 쓴다. 띠를 따로 세우면 제호와 띠가 같은 것을
   두 번 말하게 되고, 그림 안의 글자와 h1 이 겹쳐 보인다.

   **body.pub 으로 묶는다** — 공개 1면(newsletter.html)에만 걸고 관리용 화면에는
   걸지 않는다. 배너가 후보풀·미확정 화면까지 덮으면 작업 화면과 지면의 경계가
   흐려지고, 화면마다 그림 무게가 붙는다.

   **배율 60%** — 폭에 꽉 채우면 배율 0.5625 로 세로가
   427px 밖에 안 들어와 그림 위쪽이 잘린다. 0.3370 로 낮추면
   같은 높이에 712px 가 들어온다. 그림은 647×240 로 오른쪽에 서고
   왼쪽 433px 는 바탕이다. **띠를 높여서 해결하지 마라** —
   그만큼 첫 화면에서 기사가 밀려난다.

   그림은 data URI 다. 배포본이 파일 한 장이라 바깥 파일을 참조할 수 없다. */
body.pub .top{
  position:relative; margin:20px 0 0; padding:0; min-height:240px;

body.pub .top::after{content:"그림 lifearchitect.ai/humanoids · Made Visual"; position:absolute; left:30px; bottom:10px; z-index:1;

/* 좁은 화면 — 띠 높이를 글자에 맡긴다(min-height 를 풀면 내용만큼만 선다).

   그림이 글자 밑으로 들어오지 않게 한다. */
@media (max-width:520px){
  body.pub .top{min-height:0; background-size:auto 100%}
  body.pub .top::before{background:linear-gradient(90deg, #0E1412 0%, #0E1412 56%,

}

<script>
/* 공통 유틸 + 뉴스레터 렌더. 공개면·내부면이 함께 쓴다.
   ES 모듈이 아니다 — file:// 에서 module 은 CORS 로 막힌다. */
window.HMD = window.HMD || {};

(function (A) {
  'use strict';

  A.SECTIONS = ['해외 정책·전략', '기술·모델·데이터', '하드웨어·양산·공급망', '실증·현장도입',
                '산업·투자·국제협력', '안전·표준·규제·노동', '국내 연구현장·기관',
                '연구성과·논문'];
  A.BAR = '━━━━━━━━━━━━━━━';
  A.NONE_LINE = '▷ 금일 휴머노이드 관련 주요기사 없음';
  A.NONE_HEAD = '금일 주요기사 없음';
  A.PW_SECTION = 5;

  A.esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };
  A.$ = function (sel, root) { return (root || document).querySelector(sel); };
  A.$$ = function (sel, root) { return [].slice.call((root || document).querySelectorAll(sel)); };
  A.qs = function (k) { return new URLSearchParams(location.search).get(k); };

  A.fmtDate = function (iso) {
    if (!iso) return '';
    var p = String(iso).split('-');
    return p.length === 3 ? p[0] + '.' + (+p[1]) + '.' + (+p[2]) : iso;
  };
  A.md = function (iso) {           // 2026-08-30 → 8/30
    var p = String(iso || '').split('-');
    return p.length === 3 ? (+p[1]) + '/' + (+p[2]) : iso;
  };

  /* 오늘 날짜(Asia/Seoul). toISOString() 은 UTC 라서 쓰면 안 된다 —
     발송본을 조립하는 08:20 KST 는 UTC 로 아직 전날이고, 하필 매일 쓰는 그 시각에 하루가 어긋난다. */
  A.todayKST = function () {
    var d = new Date(Date.now() + 9 * 3600 * 1000);
    return d.getUTCFullYear() + '-'
      + String(d.getUTCMonth() + 1).padStart(2, '0') + '-'
      + String(d.getUTCDate()).padStart(2, '0');
  };

  /* 테마 토글. 세 상태를 돈다 — 시스템 → 라이트 → 다크 → 시스템.
     localStorage 는 사생활 보호 모드에서 던지므로 반드시 감싼다. */
  A.initTheme = function () {
    var K = 'hmd-theme';
    var cur = '';
    try { cur = localStorage.getItem(K) || ''; } catch (e) { cur = ''; }
    if (cur) document.documentElement.setAttribute('data-theme', cur);
    var btn = A.$('#themetog');
    if (!btn) return;
    var label = function () {
      var v = document.documentElement.getAttribute('data-theme') || '';
      btn.textContent = v === 'light' ? '라이트' : v === 'dark' ? '다크' : '시스템';
    };
    label();
    btn.addEventListener('click', function () {
      var v = document.documentElement.getAttribute('data-theme') || '';
      var next = v === '' ? 'light' : v === 'light' ? 'dark' : '';
      if (next) document.documentElement.setAttribute('data-theme', next);
      else document.documentElement.removeAttribute('data-theme');
      try { next ? localStorage.setItem(K, next) : localStorage.removeItem(K); } catch (e) { /* 무시 */ }
      label();
    });
  };

  /* 발송본 조립. newsletter.py 와 글자 단위로 같은 결과를 내야 한다 —
     담당자가 화면에서 보는 것과 붙여넣는 것이 다르면 화면을 믿지 않게 된다. */
  A.buildEdition = function (date, cands, approvedIds, opens, meta) {
    meta = meta || {};
    var picked = cands.filter(function (c) { return approvedIds.indexOf(c.id) >= 0; });
    picked.sort(function (a, b) {
      return (a.sec - b.sec)
        || ((b.pw ? 1 : 0) - (a.pw ? 1 : 0))
        || ((b.K + b.N + b.C + b.M) - (a.K + a.N + a.C + a.M));
    });
    var out = [A.BAR, '[' + A.md(date) + ' 조간] 휴머노이드·피지컬 AI 주요동향', A.BAR];
    /* 빈 섹션은 내보내지 않고, 워치리스트도 발송본에 넣지 않는다 (2026-08-31 지시).
       newsletter.py 와 글자 단위로 같아야 하므로 두 곳을 반드시 같이 고친다.
       워치리스트는 없어진 것이 아니라 A.watchList() 가 그리는 관리용 패널로 옮겼다. */
    A.SECTIONS.forEach(function (name, idx) {
      var i = idx + 1;
      var items = picked.filter(function (c) { return c.sec === i; });
      if (items.length) {
        out.push('');
        out.push('◆ ' + name + ' (' + items[0].hl + ')');
        items.forEach(function (c) { out.push('▷ ' + c.t + '… ' + c.body + ' (' + c.src + ')'); });
      }
      /* ※ picked.world 집계 줄도 발송본에서 뺐다 — 우리 작업 기록이라
         pool.html 의 필터 결과 패널에만 둔다. newsletter.py 와 같이 고칠 것. */
    });
    out.push('');
    out.push(A.BAR);
    out.push('picked.world ' + (meta.pw || 0) + '건 + 자체수집 ' + (meta.own || 0) + '건 = 후보 '
      + cands.length + '건 중 ' + picked.length + '건 승인');
    out.push((A.config && A.config.publisher) || '(발행처 미정)');
    out.push(A.BAR);
    return out.join('\n');
  };

  /* 워치리스트 — 발송본에서 빠진 뒤 이 패널이 유일한 노출 지점이다.
     '인용 금지'·'원문 미확보' 같은 내부 메모라 관리용 화면에만 그린다. */
  A.watchList = function (opens) {
    var w = (opens || []).filter(function (o) { return o.watch && o.st !== '해소'; });
    w.sort(function (a, b) {
      var x = a.due || '￿', y = b.due || '￿';
      return x < y ? -1 : x > y ? 1 : 0;
    });
    if (!w.length) { return '<p class="muted">워치리스트 항목 없음.</p>'; }

  /* ── 지면 렌더 (공유용 면 · 내부 미리보기가 함께 쓴다) ────────────────

  /* 발표일·원문 표기. 검색엔진이 몇 달 지난 자료를 오늘 것처럼 올려 주므로

     링크가 없는 조각은 그냥 글자로 남는다 — 눌리지 않는 것도 정보다. */
  A.srcHTML = function (x) {

    /* 출처 뒤의 날짜는 **지면에서 떼고 그린다** (2026-09-09 지시).
       발표일은 상세면 메타표의 「자료발표일」이 이미 진다 — 출처에 또 두면 같은 날짜가
       한 화면에 두 번 나온다. **데이터는 그대로 둔다**: `src` 의 날짜는 카톡 발송본이
       지는 유일한 발표일이고, 발송본은 A.buildEdition 이 `c.src` 를 그대로 쓴다. */
    var undate = function (t) {

    };
    /* 출처 칸에는 **이름만 세운다** (2026-09-15 지시로 넓혔다).

       섹션 이름이 이미 말한다. 한 칸에 이름과 갈래를 함께 두면 같은 줄을 두 번 읽는다.

    var TYPEWORDS = '기획|칼럼|기고|시론|인터뷰|기자수첩|특집|단독|논평|사설|오피니언|보도자료|보도|기사'
                  + '|발표|발간|공개|공고|제출|원문|논문|리포트|보고서|브리핑|성명|자료';
    /* **깎아 내면 뜻이 사라지는 자리는 되돌린다.** 「영문 보도」에서 '보도'를 떼면
       '영문' 만 남아 무엇의 영문인지 알 수 없고, 「AVITA 공동 보도자료」는 'AVITA 공동'

    var DANGLING = /(?:^|\s)(공동|합동|공식|영문|국문|자체|관련|공저)$/;

       「IEC 표준정보 직접 확인」·「오사카메트로 … AVITA 공동」처럼 서술이 붙은 자리가
       남는다. 출처 칸에 설 것은 **기관·매체의 이름 하나**이므로 괄호와 서술 꼬리,

    var TAILWORDS = '공식 페이지|공식페이지|홈페이지|프레스룸|뉴스룸|웹사이트|사이트|페이지'

        .replace(/^\s*\[[^\]]*\]\s*/, '')             /* 머리의 [강연]·[분석] 표시 */
        .replace(/^[^,]*\s외,\s*/, '')                  /* 「Hongjin Chen 외, CoRL 2026」 */
        .replace(/\s*\([^)]*\)\s*/g, ' ')              /* (ETH Zürich)·(유료) 같은 괄호 */

    var ORIGINMARK = new RegExp('(?:^|\\s)(?:' + TYPEWORDS

    /* **같은 이름이 된 조각은 하나만 세운다** (2026-09-15 지시).

       둘 다 '벤션'이 되어 같은 글자가 두 번 선다. 같은 내용이므로 **하나만** 두되,
       그 하나는 **구분되는 이름**(「벤션 보도자료」)으로 적는다 — 이름만 남기면
       어느 문서를 열게 되는지 알 수 없기 때문이다.

    pieces.forEach(function (q) { count[q.text] = (count[q.text] || 0) + 1; });
    pieces.forEach(function (q) {

  /* ── 기사 상세면 ────────────────────────────────────────────────

     알 수 있고 수치가 어디서 나왔는지는 알 수 없다. 그래서 제목을 누르면 상세가 선다 —
     ① 발표일·출처가 든 메타표 ② 상세요약 ③ 하단 원문 링크.

     별도 파일로 만들지 않고 같은 파일 안에서 전환한다. 배포본(bundle.py)이 파일 하나로
     나가기 때문이다 — article.html 을 따로 두면 더블클릭으로 받은 사람에게는 링크가
     전부 깨진다. 주소는 질의문(?)이 아니라 해시(#)로 남긴다. file:// 에서 질의문은
     뷰어에 따라 안 열리지만 해시는 어디서나 듣고 브라우저 뒤로가기도 그대로 된다. */

  A.host = function (u) {
    var m = /^https?:\/\/([^\/?#]+)/i.exec(String(u || ''));
    return m ? m[1].replace(/^www\./, '') : '';
  };

  /* 항목 키 — 「호 날짜 + 항목 번호」. items 배열의 색인으로 서므로 적재된 뒤에는
     바뀌지 않는다. 20260909-1 처럼 사람이 읽을 수 있는 꼴로 둔다. */
  A.itemKey = function (date, i) {
    return String(date || '').replace(/-/g, '') + '-' + (i + 1);
  };

  /* 韓 연계는 사실이 아니라 우리 해석이다. 상세면에서도 사실 서술과 한 덩어리로
     두지 않고 잘라서 따로 세운다 — 어디까지가 원문이 말한 것인지 경계가 보여야 한다. */
  A.splitKorea = function (body) {
    var t = String(body || '').trim();
    /* **쉼표 뒤에 오는 韓 자체를 경계로 삼는다.** 표지가 지면마다 다르기 때문이다 —
       「韓 연계 —」, 「…음, 韓은 …」, 「…음, 韓 정책 관점에서 …」가 모두 쓰인다.
       표지 목록을 늘려 가며 맞추면 새 꼴이 생길 때마다 해석이 새는 자리가 남는다.
       韓 연계는 늘 맨 뒤 한 덩어리이므로 **마지막** 자리를 경계로 삼는다 —
       본문 중간에 韓 이 나오는 항목이 있어 첫 자리를 잡으면 사실이 잘려 나간다. */
    var re = /(?:^|,\s*)韓/g;
    var m, pos = -1;
    while ((m = re.exec(t)) !== null) { pos = m.index + m[0].length - 1; }
    if (pos < 0) { return { facts: t, korea: '' }; }
    return { facts: t.slice(0, pos).replace(/[,\s]+$/, ''),
             korea: t.slice(pos).replace(/^韓\s*연계\s*[\u2014\u2013\-]\s*/, '').trim() };
  };

  /* 본문을 단락으로 나눈다. body 는 명사형 보고체가 쉼표로 이어진 한 덩어리라
     그대로 그리면 스무 줄짜리 벽이 된다. 「…음, 」「…임, 」을 문장 경계로 보고 끊은 뒤
     짧은 문장은 묶어 단락을 만든다. 데이터는 건드리지 않는다 — 그리는 방식만 바꾼다. */
  A.paras = function (text) {
    var t = String(text || '').trim();
    if (!t) { return []; }
    var SEP = '\u0001';
    /* 두 가지 꼴을 다 받는다.
       ① 쉬운 요약(ez)은 마침표로 끝나는 평서문이다 — 문장 부호를 경계로 쓴다.
       ② 실무용 서술(body)은 명사형 보고체가 쉼표로 이어진 한 덩어리다.
       가르는 표지는 「다. 」이다. body 에는 수치의 소수점(68.4%)만 있고 이 꼴이 없다. */
    var plain = /\ub2e4\.(\s|$)/.test(t);
    var marked = plain
      ? t.replace(/([.!?])\s+/g, '$1' + SEP)
      : t.replace(/([\uc74c\uc784\ud568\ub428\uc9d0\uc637\ubd04\uc148])(,)\s+/g, '$1' + SEP);
    var sents = marked.split(SEP)
                 .map(function (x) { return x.trim(); })
                 .filter(function (x) { return x; })
                 .map(function (x) { return /[.!?\u2026]$/.test(x) ? x : x + '.'; });
    /* 한 문단은 **다섯 줄을 넘지 않는다** (2026-09-09 지시).
       지면 너비에서 한 줄이 한글 45자 안팎이므로 200자를 상한으로 둔다.
       넣어 보고 넘치면 그 문장부터 새 문단으로 보낸다 — 넘긴 뒤에 끊으면
       마지막 문장 길이만큼 상한을 넘어선다. */
    var LIM = plain ? 200 : 260;
    var glen = function (g) { return g.join(' ').length; };
    var groups = [], cur = [];
    sents.forEach(function (x) {
      if (cur.length && glen(cur) + 1 + x.length > LIM) { groups.push(cur); cur = [x]; }
      else { cur.push(x); }
    });
    if (cur.length) { groups.push(cur); }
    /* 마지막 문단이 한 줄로 남으면 앞 문단에서 문장을 하나씩 내려 균형을 맞춘다.
       상한만 지키면 마지막이 한 줄짜리 토막으로 남아 지면이 너덜너덜해진다.
       내려서 마지막 문단이 상한을 넘게 되면 멈춘다. */
    while (groups.length > 1) {
      var last = groups[groups.length - 1], prev = groups[groups.length - 2];
      if (glen(last) >= 80 || prev.length < 2) { break; }
      if (glen(last) + 1 + prev[prev.length - 1].length > LIM) { break; }
      last.unshift(prev.pop());
    }
    return groups.map(function (g) { return g.join(' '); });
  };

  /* 유료 지면 판정 (2026-09-09 지시).

     **유료 소스는 보조 출처로 달지 않는다** — 눌러도 못 읽는 링크는 없느니만 못하고,
     그 매체에서만 나온 서술은 근거가 없는 것과 같다. 그래서 원문이 따로 열리는데
     보조로 붙인 유료 보도는 출처 표기에서도 링크에서도 뺀다(check.py 가 막는다).

     예외는 **그 기사 자체가 항목이고 유료 지면이 유일한 확인 경로일 때**다.
     네이처·사이언스 뉴스면이 그렇다. 그때는 링크를 두되 [유료] 표를 붙여
     **누르기 전에** 알 수 있게 한다.

     목록은 config.paywall 에 있다 — 새 매체가 생기면 코드가 아니라 그 파일을 고친다.
     주소의 일부만 유료인 곳이 있어(네이처는 뉴스면 d41586 만 유료, 오픈액세스
     학술지는 아니다) 도메인이 아니라 **주소 조각**으로 적는다. */
  A.isPaywalled = function (u) {
    var list = (A.config && A.config.paywall) || [];
    var s = String(u || '').toLowerCase();
    if (!s) { return false; }
    for (var i = 0; i < list.length; i++) {
      if (s.indexOf(String(list[i]).toLowerCase()) >= 0) { return true; }
    }
    return false;
  };

  /* 상세면 한 장. x 는 items[] 의 항목이고 opt.date 는 그 항목이 실린 호다. */
  A.detailHTML = function (x, opt) {
    opt = opt || {};
    var sec = A.SECTIONS[(x.sec || 0) - 1] || '';
    var sp = A.splitKorea(x.body || '');
    /* 상세면은 일반 독자가 읽는 자리다 (2026-09-09 지시). 실무용 서술을 그대로 두면
       용어에서 막히므로 **쉬운 요약(ez)이 있으면 그것을 그린다.** body 는 카톡
       발송본과 내부 화면이 지는 기록이라 그대로 두고, 지면에서 갈아 끼우기만 한다. */
    var ps = A.paras(x.ez || sp.facts);
    /* 메타표는 「자료발표일 + 출처」 둘로 끝낸다 (2026-09-09 지시).
       수록 호는 위 도구막대가, 분류는 제목 위 눈썹줄이 이미 지고 있고,
       핵심요약은 바로 아래 상세요약이 같은 말을 더 길게 한다 — 다 뺐다.
       주소도 따로 줄 세우지 않는다. **출처 조각마다 링크가 걸리므로**
       「원문 · 문서 · 보도」를 눌러 그대로 들어간다(A.srcHTML). */
    var meta = [];
    meta.push(['자료발표일',
      x.pd ? A.esc(A.fmtDate(x.pd)) : '<span class="pd warn">확인 못 함</span>']);
    if (x.src) {
      meta.push(['출처', A.srcHTML(x)]);
    } else if (x.url || x.url2 || x.url3 || x.url4) {
      /* src 가 비면 걸 자리가 없어 링크가 통째로 사라진다. 그때만 주소를 직접 세운다. */
      meta.push(['원문링크', [x.url, x.url2, x.url3, x.url4]
        .filter(function (u) { return u; })
        .map(function (u, n) {
          return '<a class="src-link" href="' + A.esc(u) + '" target="_blank" '
            + 'rel="noopener">원문 ' + (n + 1) + '</a>'
            + (A.isPaywalled(u) ? ' <span class="paywall">유료</span>' : '');
        }).join(' · ')]);
    }

    var h = '<article class="detail" data-sec="' + (x.sec || 0) + '">';
    h += '<div class="dhead"><div class="dsec">' + A.esc(sec) + '</div>'
      + '<h2 class="dtt">' + A.esc(x.t || '') + '</h2></div>';

    h += '<dl class="dmeta">' + meta.map(function (r) {
      return '<div><dt>' + r[0] + '</dt><dd>' + r[1] + '</dd></div>';
    }).join('') + '</dl>';

    if (ps.length) {
      h += '<section class="aibox"><div class="aih"><span class="aim">AI</span>상세요약</div>'
        + ps.map(function (t) { return '<p>' + A.esc(t) + '</p>'; }).join('')
        + '</section>';
    }
    /* 韓 연계는 우리 해석이라 표시를 달아 사실과 가른다. */
    if (sp.korea) {
      h += '<section class="aibox kor"><div class="aih"><span class="aim k">韓</span>'
        + '국내 연계 — 편집자 해석</div>'
        + A.paras(sp.korea).map(function (t) { return '<p>' + A.esc(t) + '</p>'; }).join('')
        + '</section>';
    }
    /* 하단 「원문 링크」 블록은 두지 않는다 (2026-09-09 지시) — 바로 위 메타표가
       원문링크·근거문서·보도를 이미 주소째 걸고 있어 같은 것을 두 번 세우는 꼴이다. */
    return h + '</article>';
  };

  /* 상세면 설치. 목록을 그리는 화면이 이 함수를 부르면 해시가 바뀔 때마다 목록과 상세를
     갈아 끼운다. 되돌아올 때 보던 자리로 가도록 스크롤 위치도 되살린다.

       A.installDetail({ mount, panes:[{el,on}], chrome:[el], lookup: fn(key) }) */
  A.installDetail = function (cfg) {
    var mount = cfg.mount, panes = cfg.panes || [], top = 0;

    function paint() {
      var m = /^#a\/([^\/?&]+)$/.exec(location.hash || '');
      var found = m ? cfg.lookup(decodeURIComponent(m[1])) : null;
      if (!found) {
        mount.hidden = true;
        mount.innerHTML = '';
        panes.forEach(function (p) { p.el.hidden = !p.on(); });
        (cfg.chrome || []).forEach(function (c) { c.hidden = false; });
        if (top) { window.scrollTo(0, top); top = 0; }
        return;
      }
      top = window.pageYOffset || 0;
      panes.forEach(function (p) { p.el.hidden = true; });
      (cfg.chrome || []).forEach(function (c) { c.hidden = true; });
      /* 그리는 방식만 화면마다 다르다 — 기사 상세와 리포트 상세가 같은 뼈대를 쓴다. */
      mount.innerHTML = '<div class="toolbar">'
        + '<button class="act ghost" type="button" id="dback">← 목록으로</button>'
        + '<span class="count">'
        + A.esc(found.label || (A.fmtDate(found.date) + ' 조간')) + '</span></div>'
        + (cfg.render ? cfg.render(found) : A.detailHTML(found.x, { date: found.date }));
      mount.hidden = false;
      window.scrollTo(0, 0);
      var b = document.getElementById('dback');
      if (b) {
        b.addEventListener('click', function () {
          if (history.length > 1) { history.back(); } else { location.hash = ''; }
        });
      }
    }

    window.addEventListener('hashchange', paint);
    paint();
    return paint;
  };

  /* 예전 이름. 휴머노이드 화면 몇 곳이 A.srcLinks 로 부르고 있어 이어 둔다.
     새로 쓰는 곳은 A.srcHTML 을 쓴다 — 두 이름이 같은 함수를 가리킨다. */
  A.srcLinks = function (x) { return A.srcHTML(x); };

  /* 클립보드. file:// 나 비 HTTPS 에서는 API 가 막힌다.
     실패를 삼키지 말고 텍스트를 선택 상태로 만들어 직접 복사하게 한다. */
  A.copy = function (el, msgEl) {
    var txt = el.textContent;
    var done = function (m) {
      if (msgEl) { msgEl.textContent = m; setTimeout(function () { msgEl.textContent = ''; }, 4000); }
    };
    var fallback = function () {
      try {
        var r = document.createRange(); r.selectNodeContents(el);
        var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        done('자동 복사가 막혀 있습니다. 선택된 영역을 Ctrl+C 로 복사하세요.');
      } catch (e) { done('복사에 실패했습니다. 텍스트를 직접 선택해 주세요.'); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt)
        .then(function () { done('복사했습니다. 카톡에 붙여넣으세요.'); })
        .catch(fallback);
    } else { fallback(); }
  };

  /* 공통 머리·꼬리. 페이지마다 같은 마크업을 복사하지 않게 한다. */
  A.header = function (opts) {
    var c = A.config || {};
    var nav = (opts.nav || []).map(function (it) {
      var cur = it.href === opts.here ? ' aria-current="page"' : '';
      return '<a href="' + it.href + '"' + cur + '><span class="n">' + it.n + '</span>' + it.label + '</a>';
    }).join('');
    /* 머리글 첫 줄은 **발행처 · 수신처** 두 조각이다 (2026-09-03 재지시).
       누가 내고 누구에게 가는 지면인지가 첫 줄에서 끝나야 한다.
       셋째 줄에서는 수신처를 빼 둔 상태다 — 같은 이름을 두 줄에 되풀이하지 않는다.
       opts.eyebrow 로 덮어쓸 수 있다. */
    var eyebrow = opts.eyebrow != null ? opts.eyebrow
      : (c.publisher || '(발행처 미정)') + ' · ' + (c.audience || '');
    return '<div class="top">'
      + '<div class="grow">'
      + '<p class="eyebrow">' + A.esc(eyebrow) + '</p>'
      + '<h1>' + A.esc(opts.title) + '</h1>'
      + '<p class="subline">' + A.esc(opts.sub || '') + '</p>'
      + '</div>'
      + '<div style="display:flex;gap:8px;align-items:center">'
      + (opts.internal ? '<span class="internal-badge">내부용</span>' : '')
      + '<button class="themetog" id="themetog" type="button">시스템</button>'
      + '</div></div>'
      + '<nav class="tabs">' + nav + '</nav>';
  };

  A.footer = function (extra) {
    var c = A.config || {};
    return (c.publisher || '(발행처 미정)') + ' · ' + (c.title || 'AI4S 데일리') + ' · '
      + (extra || '데이터는 .js 전역 할당 — 갱신 시 배열만 교체한다');
  };

  A.PUBLIC_NAV = [
    { n: '01', label: '홈', href: 'index.html' },
    { n: '02', label: '아카이브', href: 'archive.html' },
    { n: '03', label: '리포트', href: 'reports.html' },
    { n: '04', label: '체계 소개', href: 'about.html' }
  ];
  A.INTERNAL_NAV = [
    { n: '00', label: '내부 홈', href: 'index.html' },
    { n: '01', label: '후보풀·승인', href: 'pool.html' },
    { n: '02', label: '레퍼런스', href: 'shelf.html' },
    { n: '03', label: '미확정(OPEN)', href: 'open.html' },
    { n: '04', label: '스레드', href: 'threads.html' },
    { n: '05', label: '이슈 도출', href: 'issues.html' },
    { n: '06', label: '리포트 파이프라인', href: 'pipeline.html' },
    { n: '07', label: '체계도', href: 'system.html' }
  ];

  /* 페이지 뼈대를 한 번에 그린다. 각 페이지는 render() 만 채우면 된다. */
  A.page = function (opts, render) {
    document.addEventListener('DOMContentLoaded', function () {
      var wrap = A.$('#app');
      wrap.insertAdjacentHTML('afterbegin', A.header(opts));
      A.initTheme();
      try {
        render(A.$('#body'));
      } catch (e) {
        A.$('#body').innerHTML = '<div class="note warn"><span class="lbl">렌더 오류</span>'
          + A.esc(e.message) + '<br>데이터 파일을 확인하라 — <code>python scripts/check.py --root .</code></div>';
        throw e;
      }
      var f = A.$('#foot');
      if (f) f.textContent = A.footer(opts.footNote);
    });
  };
})(window.HMD);

</script>

window.HMD.editions = [{"date": "2026-09-18", "items": [{"sec": 1, "t": "中, 전국선진제조업대회 열고 「인공지능+제조」 심화 지시", "k": "고품질 표준체계 구축 가속과 지능화·녹색화·융합화가 방향으로 제시됐다", "ez": "中 정부가 9월 16~17일 베이징에서 전국선진제조업대회를 개최했음. 이 회의는 제조업 정책의 방향을 최고 지도부 수준에서 확정하는 자리로, 시진핑 총서기의 중요지시가 전달되고 리창 총리가 직접 연설했음. 지시의 핵심은 지능화·녹색화·융합화 세 방향을 유지하면서 산업망의 자주가능 수준을 높이라는 것임. 자주가능은 핵심 부품과 기술을 외부 공급에 의존하지 않고 자국 안에서 조달할 수 있는 상태를 뜻함. 리창 총리는 「인공지능+제조」 행동을 심화해 전개하라고 밝혔고, 장궈칭 부총리는 고품질 표준체계 구축을 앞당기고 무질서한 비이성적 경쟁을 정비하라고 제시했음. 표준체계가 최고 지도부의 지시 항목에 포함된 점이 주목할 지점임. 다만 원문에 휴머노이드나 인형로봇이라는 낱말은 등장하지 않음.", "body": "中 공업정보화부가 전국선진제조업대회가 9월 16~17일 베이징에서 열렸음을 9월 17일 공개함, 회의에서 시진핑 공산당 총서기의 중요지시가 전달됐고 리창 국무원 총리가 출석해 연설했으며 장궈칭 부총리가 총괄 발언을 담당한 것으로 원문에 기재됨, 시진핑은 지능화·녹색화·융합화 방향을 유지해 선진제조업을 계속 확대하고 산업망의 자주가능 수준을 높여 선진제조업을 골간으로 하는 현대화 산업체계 구축을 앞당기라고 지시함, 리창은 신세대 지능제조를 주공 방향으로 삼아 발전 전략에서 데이터·지능 역량 부여를 중시하고 기술 노선에서 고급 자주화를 중시하라고 밝혔으며 「인공지능+제조」 행동을 심화해 전개하고 기업의 데이터·지능 전환에 대한 유도·지원을 확대하며 지능 소프트웨어·하드웨어 기반을 다지라고 제시함, 장궈칭은 중점 산업망 고품질 발전 행동의 심화 실시와 신세대 지능제조의 대대적 발전을 제시하면서 고품질 표준체계 구축을 앞당기고 무질서한 비이성적 경쟁을 정비하라고 밝힘, 회의는 화상회의 형식으로 열렸고 공업정보화부·국가발전개혁위·국무원 국자위와 장쑤성·후베이성 책임자가 교류 발언을 함, 원문에 휴머노이드나 인형로봇이라는 낱말은 등장하지 않으므로 이 지시를 로봇 정책으로 직접 읽지 않음", "src": "中 공업정보화부 9.17", "pd": "2026-09-17", "url": "https://wap.miit.gov.cn/xwfb/szyw/art/2026/art_515c00fec1254beeb37b73345271ef89.html"}, {"sec": 2, "t": "KT, 과기정통부 다크팩토리 설계·구축 솔루션 과제 참여", "k": "전북혁신도시 24시간 무인 공장을 겨냥해 합성 데이터 생성·검증 체계를 배정받았다", "ez": "다크팩토리는 사람이 상주하지 않아 조명을 점등하지 않고도 가동되는 공장을 뜻함. KT 가 과학기술정보통신부의 피지컬 AI 플랫폼 사업 가운데 이 다크팩토리의 설계·구축 솔루션을 개발하는 세부과제에 참여함. 컨소시엄에는 KAIST 와 LG에너지솔루션·하림산업·신성이엔지·한국생산성본부가 함께 참여했고, 구현 대상은 전북혁신도시 인근의 24시간 무인 가동 공장임. KT 가 담당하는 부분은 합성 데이터의 생성과 검증 체계임. 합성 데이터는 실제 공장에서 수집한 것이 아니라 시뮬레이터가 생성한 학습용 데이터로, 위험하거나 드물게 발생하는 상황을 실제로 재현하지 않고도 학습시킬 수 있다는 이점이 있음. 다만 총 사업비와 사업기간, 기관별 분담 비율, 합성 데이터의 규모와 검증 기준은 공개되지 않았음.", "body": "KT 가 과학기술정보통신부의 「협업지능 피지컬 AI 기반 SW플랫폼 연구개발 생태계 조성」 사업 세부과제인 「AI기반 다크팩토리 설계·구축 솔루션 개발」 에 참여한다고 9월 17일 보도됨, 컨소시엄은 KT 와 KAIST·LG에너지솔루션·하림산업·신성이엔지·한국생산성본부로 구성된 것으로 전해짐, KT 의 담당 범위는 모듈형 엣지 인공지능 데이터센터 인프라를 기반으로 한 시뮬레이션 준비 합성 데이터의 생성·검증 체계와 에이전트 운영통합 환경의 연구개발로 제시됨, 목표는 전북혁신도시 인근에 24시간 가동되는 무인·자동화 공장을 구현하는 것으로 전해짐, 박재형 KT AX미래기술원장은 다크팩토리 상용화를 위한 핵심 인프라와 운영 플랫폼 개발에 속도를 낼 것이라고 밝힘, 다만 총 사업비와 사업기간, 기관별 분담과 정부지원분·민간부담 구분, 합성 데이터의 규모와 검증 기준은 어느 보도에도 기재되지 않음, KT 뉴스룸을 직접 열었으나 목록이 자바스크립트로 렌더링되어 게시일을 판독하지 못했고 사업 공고 원문도 확보하지 못해 보도를 출처로 삼음", "src": "인공지능신문 9.17 · AI타임스 9.17", "pd": "2026-09-17", "url": "https://www.aitimes.kr/news/articleView.html?idxno=41958", "url2": "https://www.aitimes.com/news/articleView.html?idxno=215422"}, {"sec": 2, "t": "브릴스, 로봇 파운데이션 모델 적용한 차세대 플랫폼 개발 착수", "k": "전용 데이터센터에 그래픽처리장치 8기를 도입해 32기까지 확장할 계획으로 제시됐다", "ez": "로봇 파운데이션 모델은 특정 작업 하나가 아니라 여러 작업에 두루 적용되도록 대규모 데이터로 미리 학습시킨 로봇용 모델을 뜻함. 브릴스는 산업용 로봇 솔루션으로 수익을 창출해 온 기업으로, 여기에 이 모델을 결합해 소프트웨어 중심 로봇으로 전환하겠다고 밝혔음. 이를 위해 자체 데이터센터를 구축하고 고성능 그래픽처리장치 8기를 도입했으며 32기까지 단계적으로 확장할 계획임. 연산을 외부 클라우드로 전송하지 않고 로봇 본체에서 처리하도록 국내산 신경망처리장치를 탑재하는 구조를 채택했음. 이미 자동차 내·외장 품질 검사 공정에 자율 이동 매니퓰레이터를 투입해 운용하고 있고, 7월에는 과학기술정보통신부의 자율행동 로봇 실증 사업에 선정됐음. 다만 기반모델의 학습 데이터 규모와 평가 지표, 휴머노이드 기체의 개발 단계는 공개되지 않았음.", "body": "로봇 모듈화 플랫폼 기업 브릴스가 기존 산업용 로봇 솔루션에 로봇 파운데이션 모델을 결합해 차세대 온디바이스 피지컬 AI 로 사업 범위를 확장한다고 9월 17일 밝힌 것으로 보도됨, 회사는 피지컬 AI 연구개발 전용 데이터센터를 구축해 고성능 그래픽처리장치 8기를 도입했고 총 32기 규모로 단계적으로 확장할 계획을 제시함, 개발 중인 기체는 대형 비전언어모델로 자연어 지시를 해석하도록 고도화하고 시각 정보를 즉각 물리적 행동으로 연결하는 비전언어행동 모델 구조를 적용하는 방향으로 전해짐, 클라우드 연산의 지연을 회피하기 위해 국내산 신경망처리장치를 로봇에 직접 탑재하는 온디바이스 구조를 채택했다고 밝힘, 이미 적용한 사례로는 자동차 내·외장 감성품질 검사를 자율 이동 매니퓰레이터가 스스로 이동하며 판정하는 공정과 부품 체결 공정의 상태 확인·체결·작업자 안전 감시를 제시함, 회사는 7월 과학기술정보통신부의 「2026 AX 디바이스 개발·실증 사업」 에 선정돼 자동차 시트 스위치 검사 공정에 자율행동 로봇을 투입·실증할 계획이라고 밝힘, 2020년부터 2025년까지 누적 1,295건의 프로젝트를 수행했고 설립 이후 연평균 50% 성장률을 기록했다고 제시함, 전진 브릴스 대표는 산업용 로봇과 자율 이동 로봇을 넘어 휴머노이드와 4족보행 로봇까지 포괄하는 소프트웨어 중심 로봇 생태계를 구축하겠다고 밝힘, 다만 기반모델의 학습 데이터 규모와 평가 지표, 휴머노이드 기체의 개발 단계와 공개 시점, 데이터센터 확장 일정은 보도에 기재되지 않아 성능을 단정하지 않음, 브릴스 공식 사이트의 소식 목록이 자바스크립트로 렌더링되어 게시일을 판독하지 못했으므로 보도를 출처로 삼음, 이 회사는 9월 16일 코스닥 공모를 마감해 직전 호에 자금 조달 건으로 이미 게재됐으므로 같은 기업이 이틀 연속 지면에 오르는 자리임", "src": "로봇신문 9.17 · 인공지능신문 9.17", "pd": "2026-09-17", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48547", "url2": "https://www.aitimes.kr/news/articleView.html?idxno=41965"}, {"sec": 3, "t": "원익로보틱스, 바퀴형 모바일 휴머노이드로 물류 현장 개념검증 진행", "k": "다관절 로봇손을 자율주행 플랫폼에 결합한 구성이며 연구 파트너는 180곳을 넘어섰다", "ez": "원익로보틱스는 완제품 로봇보다 로봇손을 주력으로 하는 부품 기업임. 주력 제품 알레그로 핸드는 연구 파트너 180곳 이상이 사용하고 있으나 대부분 연구용임. 이 회사가 바퀴형 이동 플랫폼 위에 사람 형태의 상반신과 로봇팔·로봇손을 결합한 모바일 휴머노이드를 개발하며 몇몇 기업과 개념검증을 진행하고 있음. 개념검증은 실제 현장에서 기술이 작동하는지를 좁은 범위로 먼저 확인하는 단계임. 투입 목표는 물류 작업이며 상대 기업명은 공개되지 않았음. 회사 관계자는 로봇손이 범용으로 개발되면서 물류·제조·식품에 폭넓게 적용될 수 있고 자율주행 로봇과 로봇손의 판매 비중이 균형을 맞춰 가는 중이라고 밝혔음. 뉴스룸에는 2025년 11월 로볼리전트와 모바일 휴머노이드 기술 협력 양해각서를 체결한 기록이 남아 있어 이번에 처음 제시된 방향은 아님. 기체의 가반하중과 자유도, 양산 시점은 공개되지 않았음.", "body": "로봇손 전문기업 원익로보틱스가 바퀴형 이동 플랫폼 위에 사람 형태의 상반신과 로봇팔·로봇손을 결합한 모바일 휴머노이드를 개발 중이며 몇몇 기업과 개념검증을 진행하고 있다고 9월 17일 보도됨, 기존에 보유한 자율주행 로봇 기술과 다관절 로봇손을 결합한 구성이고 물류 작업 투입을 최우선 목표로 삼는 것으로 전해짐, 개념검증 상대 기업명은 회사가 공개하지 않음, 주력 제품인 알레그로 핸드는 연구 파트너 180곳 이상이 활용하는 것으로 전해지며 회사 관계자는 로봇손이 범용으로 개발되면서 물류·제조·식품에 폭넓게 적용될 수 있고 자율주행 로봇과 로봇손의 판매 비중이 균형을 맞춰 가는 중이라고 밝힘, 2025년 매출은 약 326억 원이고 영업손실 약 26억 원이며 자율주행 로봇이 매출의 과반을 차지하는 구조로 전해짐, 회사 뉴스룸에는 2025년 11월 24일 로볼리전트와 모바일 휴머노이드 로봇 기술 협력 양해각서를 체결한 기록과 9월 7일 5지 로봇핸드 알레그로 핸드 V6 F 출시 기록이 남아 있어 모바일 휴머노이드 개발이 이번에 처음 제시된 방향은 아님, 다만 기체의 가반하중·자유도·연속가동시간과 양산·출시 시점, 개념검증의 단계와 평가 항목은 보도에 기재되지 않아 개발 수준을 단정하지 않음, 삼성전자 가전 부문 우선 적용 가능성과 휴머노이드가 로봇손 판매를 견인하는 수단이라는 해석은 회사가 밝힌 것이 아니라 기자의 분석이므로 사실과 구분함, 매출 수치는 부품과 완제품의 비중 구조를 설명하는 맥락으로만 적고 실적 평가로 쓰지 않음, 원익로보틱스 뉴스룸을 9월 18일 직접 열어 최신 게시물이 9월 7일이고 이 개념검증에 해당하는 게시물이 없음을 확인했으므로 보도를 출처로 삼음", "src": "녹색경제신문 9.17", "pd": "2026-09-17", "url": "https://www.greened.kr/news/articleView.html?idxno=350348"}, {"sec": 4, "t": "삼성서울병원, 국산 휴머노이드의 담낭 절제 보조 공개 시연", "k": "도구 5종 집기 100%·전달 98.7%, 음성 명령 반응은 2초 이내로 제시됐다", "ez": "수술실에는 집도의 외에 수술도구를 전달하고 내시경 시야를 유지하는 보조인력이 필요함. 삼성서울병원은 이 역할의 일부를 휴머노이드가 담당하는 구성을 9월 16일 공개했음. 기체는 국내에서 제작한 것으로 레인보우로보틱스의 상체 로봇에 에이딘로보틱스의 다섯 손가락 로봇핸드를 결합했음. 집도의가 「그래스퍼 줘」 처럼 음성으로 지시하면 로봇이 해당 도구를 파지해 전달하고, 시각언어행동 모델이 다음 단계에 필요한 도구를 미리 추론함. 절개와 박리, 봉합은 의사가 원격으로 조작했음. 대상은 실제 환자가 아니라 염소의 간이며 복강경 담낭절제술의 한 단계를 재현했음. 병원이 제시한 수치는 수술도구 5종의 집기 성공률 100%, 전달 성공률 98.7%, 음성 명령 뒤 동작 개시까지 2초 이내임. 시연 시행 횟수와 측정 조건, 자율 구간과 원격조작 구간의 비중은 공개되지 않았음.", "body": "삼성서울병원이 개발 중인 휴머노이드 수술보조로봇을 9월 16일 공개 시연했다고 9월 17일 보도됨, 기체는 레인보우로보틱스의 RB-Y1 에 에이딘로보틱스의 5지 로봇핸드 Gen2 와 2지 그리퍼를 결합한 구성으로 전해짐, 시연은 두 단계로 구분되어 첫 단계에서 로봇이 수술도구를 직접 파지하고 생체조직을 절개·박리한 뒤 봉합했고 둘째 단계에서 도구 순환과 내시경 시야 유지, 조직 견인을 연속 수행해 집도의를 보조한 것으로 전해짐, 대상은 실제 환자가 아니라 염소 간이며 복강경 담낭절제술의 담낭관 분리를 재현했음, 제어는 혼합형으로 도구 전달·회수는 음성 명령에 따른 동작이고 절개·박리·봉합은 의사의 원격조작이며 시각언어행동 모델이 다음 단계에 필요한 도구를 추론하는 구조로 설명됨, 병원이 제시한 수치는 수술도구 5종의 집기 성공률 100%, 전달 성공률 98.7%, 음성 명령 인식 뒤 동작 개시까지 2초 이내임, 과제는 한국형 ARPA-H 프로젝트의 컨소시엄 「오케스트라」 이며 보건복지부와 한국보건산업진흥원 K헬스미래추진단이 지원하고 2025년 7월부터 2029년 12월까지 54개월·정부지원 연구개발비 138억 3,500만 원의 경쟁형 과제로 2026년 말 1단계 경쟁평가를 거치는 것으로 전해짐, 참여기관은 삼성서울병원 주관에 레인보우로보틱스·에이딘로보틱스가 하드웨어, 성균관대·서울대가 소프트웨어, 국립암센터·전북대병원이 데이터 실증을 담당하는 구성임, 연구책임자인 정용기 삼성서울병원 이비인후과 교수는 전공의 근무시간 제한과 인력 부족으로 수술실 보조인력이 없어 응급수술에 제때 대처하지 못하는 문제를 겨냥한다고 밝힘, 다만 시연 시행 횟수와 성공률의 측정 조건, 자율 구간과 원격조작 구간의 시간 비중은 공개되지 않아 성능 근거로 쓰지 않음, 일부 보도가 「세계 첫」 이라고 기재했으나 대조 사례를 제시하지 않았으므로 최초 여부를 단정하지 않음, 삼성서울병원 공식 뉴스룸을 9월 18일 네 경로로 열었으나 모든 경로가 875바이트 사이트맵만 반환해 게시물 목록 자체를 판독하지 못했으므로 보도를 출처로 삼음, 발표일이 9월 16일로 직전 호의 창 안이었으나 게재되지 않은 누락분이어서 이번 호의 창을 9월 16일부터로 확장해 다룸", "src": "전자신문 9.17 · AI타임스 9.17", "pd": "2026-09-16", "url": "https://www.etnews.com/20260917000387", "url2": "https://www.aitimes.com/news/articleView.html?idxno=215413"}, {"sec": 5, "t": "NC AI, 전북·경남 피지컬 AI 국책과제 두 건 동시 참여", "k": "총 1조 4,131억 원·5년 규모이며 무인공장 기반모델과 세계모델 개발을 배정받았다", "ez": "과학기술정보통신부와 정보통신산업진흥원이 전북과 경남에서 각각 추진하는 피지컬 AI 연구개발 사업에 NC AI 가 동시 참여함. 두 사업을 합한 규모는 2030년까지 5년간 1조 4,131억 원임. 전북 과제는 공장 전체를 사람 없이 운용하는 자율공장 기술을 목표로 하며, NC AI 는 제조 현장의 상황과 공간을 해석하는 기반모델을 개발함. 경남 과제는 제조 공정의 정밀 제어를 목표로 하며, NC AI 는 센서와 비전 데이터로 물리적 상황의 변화를 예측하는 세계모델을 개발함. 세계모델은 로봇이 다음 순간 주변이 어떻게 변화할지를 미리 계산해 두는 모델을 뜻함. 전북 과제는 9월 3일에 라온피플이 수행기관으로 선정된 것이 , 박하언 에임인텔리전스 최고기술책임자는 피지컬 AI 안전이 모델 성능과 별개로 설계·검증해야 할 핵심 기반이라고 밝힘, 다만 9월 7일 보도는 국내외 20여 기관과 출범했다고 전했고 이번 보도는 출범일을 9월 17일로 적어 출범 시점과 참여 규모가 두 보도에서 어긋나므로 어느 쪽도 단일 수치로 인용하지 않고 미확정 사항으로 올림, 참여 기업의 참여 형태가 기관 차원의 가입인지 개인 자격의 연구 참여인지, 협의체의 법적 형태와 운영 재원, 포지션 페이퍼의 공개 시점도 보도에 기재되지 않음, 에임인텔리전스 공식 사이트를 열었으나 소식 목록이 자바스크립트로 렌더링되어 게시일을 판독하지 못했으므로 보도를 출처로 삼음", "src": "AI타임스 9.17", "pd": "2026-09-17", "url": "https://www.aitimes.com/news/articleView.html?idxno=215376"}, {"sec": 7, "t": "KIST, 휴머노이드 「삼분지계」 제시하며 2030년 실증 목표 밝혀", "k": "촉각을 더한 시각·언어·동작 모델과 LG전자 기체 이전을 두 축으로 세운다", "ez": "휴머노이드 개발은 현재 미국과 중국이 선도하고 있음. 오상록 KIST 원장은 9월 17일 임무중심연구소 보고대회에서 두 나라가 각각 취약한 부분이 있어 한국이 세 번째 축으로 진입할 여지가 있다고 밝혔음. 중국은 하드웨어 제작에 강점이 있으나 산업 현장에서 요구되는 정밀한 조작 능력이 부족하고, 미국은 알고리즘이 앞서지만 제조 기반과 데이터 확보가 취약하다는 진단임. KIST 가 제시한 구성은 두 갈래임. 하드웨어는 LG전자에서 기술을 이전받은 휴머노이드 케이팩스를 사용하고, 소프트웨어는 기존의 시각-언어-동작 모델에 촉각을 결합한 시각-햅틱-언어-동작 모델을 개발함. 촉각을 결합하는 이유는 힘이 얼마나 가해졌는지를 로봇이 감지해야 사람처럼 조작할 수 있기 때문임. 목표 시점은 2030년이며 산업 현장과 일상에서의 기술 실증임. 기술 이전의 범위와 대가, 실증 대상 공정과 대수는 공개되지 않았음.", "body": "오상록 한국과학기술연구원 원장이 9월 17일 서울 KIST 본원에서 개최된 「KIST 임무중심연구소 대국민 보고대회」 에서 휴머노이드는 미국과 중국의 양강 체제가 구축됐고 각각 강점이 있지만 전체 완성도 면에서는 갈 길이 멀다고 보며 한국도 전략을 수립한다면 삼분지계가 가능하다고 밝힘, 근거로는 중국이 하드웨어에 강점을 보이지만 실제 산업에 필요한 정교한 조작 능력이 부족하고 미국은 알고리즘과 인공지능에서 앞서지만 제조와 데이터 확보에 어려움을 겪는다는 분석이 제시됨, KIST AI·로봇연구소는 LG전자의 휴머노이드 로봇 케이팩스 기술 이전을 기반으로 2030년까지 산업 현장과 일상에서 사람과 함께 작업하는 휴머노이드 기술 실증에 속도를 내는 계획을 제시함, 기술 구성은 하드웨어로 케이팩스, 소프트웨어로 시각-언어-동작 모델에 촉각을 결합한 시각-햅틱-언어-동작 모델이며 피지컬 AI 의 핵심인 데이터 확보 방안까지 함께 추진한다고 밝힘, 김익재 KIST AI·로봇연구소장은 힘과 촉각 등 사람의 감각을 감지하면서 사람처럼 조작하는 능력이 케이팩스가 다른 로봇과 구별되는 부분이라고 밝히고 다른 출연연과 산학연·대기업·대학의 로봇 연구팀과 정기적으로 회의하며 개발하고 있다고 설명함, KIST 는 2024년부터 임무중심 연구체제를 도입해 AI·로봇연구소를 포함한 7개 임무중심연구소를 운영 중이며 장준연 부원장은 연구과제중심제도의 폐해를 파편화된 소규모 연구와 논문·특허로 종결되는 성과로 지목하고 임무중심연구소로 그룹 연구를 추진한다고 설명함, 보고대회에는 과학기술정보통신부와 국가과학기술연구회 K-문샷 추진단, 벤처캐피탈과 산·학·연 관계자가 참석했고 유튜브로 생중계됨, 다만 케이팩스 기술 이전의 범위와 대가, 2030년 실증의 대상 공정과 대수, 시각-햅틱-언어-동작 모델의 학습 데이터 규모와 평가 지표는 공개되지 않아 개발 수준을 단정하지 않음, 삼분지계 발언은 기관장의 전략 판단이므로 전망으로 다룸, KIST 보도자료 게시판을 직접 열어 최신 게시물이 9월 16일이고 이 보고대회 항목이 없음을 확인했으므로 보도를 출처로 삼음", "src": "동아사이언스 9.17 · 디지털타임스 9.17", "pd": "2026-09-17", "url": "https://www.dongascience.com/ko/news/79963", "url2": "https://www.dt.co.kr/article/12084605"}, {"sec": 8, "t": "KAIST·DGIST, 로봇 피아노 연주에 타건 세기 평가를 더한 기준 제시", "k": "음 정확도만 재던 벤치마크에 세기를 넣자 51곡 전부에서 지표가 개선됐다", "ez": "로봇이 피아노를 연주하는 과제는 양손으로 정밀하게 조작하는 능력을 재는 표준 시험대로 쓰임. 그런데 기존 기준은 어느 건반을 언제 눌렀는지만 채점했음. 얼마나 세게 눌렀는지는 보상에도 평가에도 들어 있지 않아, 로봇이 모든 음을 같은 세기로 눌러도 만점을 받을 수 있었음. KAIST 와 DGIST 연구진은 건반이 눌리는 순간의 회전 속도를 측정해 세기 값으로 변환하는 방식을 제안했음. 여기에 세기를 맞추라는 보상과 음을 빠뜨리지 말라는 보상을 함께 걸어, 세게 치려다 음을 놓치는 문제를 막았음. 51곡으로 비교한 결과 음높이·시점·세기를 함께 보는 지표가 0.06 에서 0.342 로 상승했고 51곡 전부에서 개선됐음. 세기 오차는 절반 아래로 감소했음. 다만 모든 결과는 시뮬레이션에서 나온 것이며 실제 로봇으로 검증한 내용은 포함되지 않았음.", "body": "KAIST 와 DGIST 연구진이 로봇 피아노 연주 벤치마크에 타건 세기를 평가 항목으로 더한 기법 CANTABILE 을 arXiv 에 9월 16일 등재하고 9월 17일 공고함, 제1저자는 KAIST 의 Woosik Kim 이고 교신저자는 KAIST 의 Sunghoon Im 이며 DGIST 의 Wonhyeok Choi 이 공저로 참여함, 연구진이 지적한 문제는 평가 지표의 범위임 — 로봇 피아노 연주는 양손 정밀 조작의 표준 벤치마크로 쓰이는데 기존 기준인 RoboPianist 는 어느 건반을 눌렀는가와 언제 눌렀는가만 채점하고 얼마나 세게 눌렀는가는 보상에도 평가에도 넣지 않아, 모든 타건이 같은 세기로 렌더링되는 것으로 기재됨, 제안한 구조는 건반이 눌리는 순간의 각속도를 측정해 건반 끝 속도와 해머 속도를 거쳐 세기 값으로 환산하는 접점 인터페이스이고 세기 충실도 보상과 타건 포착 보상을 묶어 세기를 높이려다 음을 놓치는 것을 함께 막는 방식임, 평가는 RoboPianist 레퍼토리에서 고른 51곡 집합으로 수행했고 곡마다 방법마다 결정론적 시행 1회씩, 모든 방법을 1,100만 스텝으로 맞춰 비교했으며 일부 실험은 seed 3 개로 반복함, 결과는 음높이·타건 시점·세기를 함께 보는 지표가 0.06 에서 0.342 로 올랐고 51곡 전부에서 개선됐으며 세기 평균절대오차가 37.1 에서 17.2 로 절반 아래로 내려간 것으로 논문 표에 기재됨, 다만 논문은 모든 결과가 시뮬레이션에서 나온 것임을 본문에 밝히고 있어 실기 검증은 포함되지 않음, 동료심사를 거치지 않았으므로 미동료심사 프리프린트임", "src": "KAIST 논문 9.17", "pd": "2026-09-17", "url": "https://arxiv.org/abs/2609.18213"}, {"sec": 8, "t": "취리히연방공대, 핵심 자세로 자연어 지시와 전신 제어를 연결하는 기법 공개", "k": "100회 시행에서 작업 성공률이 44%에서 92%로 상승, 실기는 유니트리 G1 로 검증됐다", "ez": "휴머노이드에게 「상자를 저기로 옮겨라」 처럼 언어로 지시하면, 로봇은 그 지시를 관절 하나하나의 각도로 변환해야 함. 이 간격이 멀어서 언어를 해석하는 모델과 신체를 제어하는 제어기를 곧바로 연결하기 어려움. 취리히연방공대 연구진은 그 사이에 「핵심 자세」 를 배치하는 방법을 제안했음. 핵심 자세는 작업 도중 경유해야 할 대표 자세를 사전에 수집해 둔 목록이며, 언어를 해석하는 모델은 목록에서 필요한 자세만 선택하고 제어기는 그 자세에 도달하는 동작을 생성함. 성능을 가른 것은 어떤 자세를 학습에 사용할지 선택하는 방식이었음. 변화가 큰 구간의 자세를 선택해 학습시키자 전 과정 작업 성공률이 100회 시행에서 44%에서 92%로 상승했음. 실기는 유니트리 G1 으로 상자와 양동이를 파지해 운반하는 작업을 수행했음. 다만 물체의 위치를 외부 모션캡처 장비로 측정하므로 로봇에 탑재된 센서만으로 동작하는 구성은 아님.", "body": "취리히연방공대 연구진이 휴머노이드의 이동·조작 작업에서 비전언어모델의 계획과 강화학습 제어 사이에 동작 핵심 자세를 중간 표현으로 배치하는 계층 구조를 제안한 논문을 arXiv 에 9월 16일 등재하고 9월 17일 공고함, 제1저자는 Sitong Chen 이고 연구진에 Stelian Coros 가 포함되며 소속은 스위스 취리히연방공대 단독으로 표기됨, 구조는 언어 지시와 장면 관측, 실행 피드백을 입력받은 비전언어모델이 사전에 구축한 핵심 자세 라이브러리에서 작업에 적합한 자세를 순차로 선택하고 그 자세를 현재 장면의 물체 자세와 치수에 맞춰 재대상화한 뒤 핵심 자세를 조건으로 하는 전신 정책이 관절 단위 동작을 생성하는 방식임, 핵심 기여로 제시된 것은 저수준 정책 학습에 사용하는 돌출도 기반 핵심 자세 표집 전략이며 비전언어모델이 희소한 핵심 자세를 제공할 때 전 과정 작업 성공률이 44%에서 92%로 상승한 것으로 논문 표에 기재됨, 성공률은 100회 시행 기준이고 단계별로 균일 표집이 97%·63%·63%·44%, 돌출도 기반이 99%·95%·93%·92%로 대비됨, 학습 데이터는 AMASS 의 이동 동작 52편과 OmniRetarget 의 양손 상자 조작 105편, 자체 촬영 120편으로 구성됨, 실기는 유니트리 G1 휴머노이드에 배치해 상자와 양동이의 파지·운반·배치를 수행했고 비전언어모델의 핵심 자세 출력 지연은 0.2초 미만, 재대상화 평균 시간은 약 5밀리초로 제시됨, 다만 물체의 상대 자세를 외부 모션캡처 장비로 추정하고 계획 단계가 제3자 시점 영상에 의존하므로 온보드 센서만으로 동작하는 구성이 아니며 논문도 실환경 배치에는 이 부분의 대체가 필요하다고 기재함, 실기 시행 횟수는 별도로 제시되지 않아 100회 시행은 시뮬레이션 기준으로 해석함, 동료심사를 거치지 않았으므로 미동료심사 프리프린트임", "src": "취리히연방공대 논문 9.17", "pd": "2026-09-17", "url": "https://arxiv.org/abs/2609.18869"}]}, {"date": "2026-09-17", "items": [{"sec": 2, "t": "스페이스에이아이, 접촉힘 기록한 데이터로 연성체 파지 성공률 개선", "k": "연성체 10종 평균 파지 성공률이 61.5%에서 84.2%로 개선됐다", "ez": "로봇의 파지 작업은 강체 상자보다 연성체에서 실패율이 훨씬 높음. 파지력을 어느 정도로 가해야 변형시키지 않고 낙하시키지도 않는지가 육안으로 확인되지 않기 때문임. 국내 기업 스페이스에이아이는 로봇과 모델은 고정한 채 학습 데이터만 교체해 이 문제에 접근했음. 기존 데이터가 카메라로 관측한 장면만 기록하는 데 비해, 이 회사는 손이 물체의 어느 지점을 어느 정도 힘으로 가압했고 물체가 어떻게 변형됐는지를 함께 기록함. 물체 내부의 응력은 센서로 직접 측정할 수 없으므로 자체 제작한 계측 장비로 외부에서 힘을 측정하고 그 값을 기준으로 시뮬레이터가 내부 응력을 계산함. 그 데이터로 다시 학습시킨 결과 연성체 10종의 평균 성공률이 61.5%에서 84.2%로 상승했음. 회사는 단순 파지·해제 동작의 성공률은 89% 인데 실제 공장 작업에서는 12% 로 하락한다는 점을 출발점으로 제시했음. 비교에 사용된 기존 데이터가 어떤 구성이었는지와 시행 횟수의 분포는 공개되지 않았음.", "body": "국내 로봇 데이터 기업 스페이스에이아이가 학습 데이터만 바꿔 파지 성공률을 끌어올린 자체 벤치마크 결과를 공개한 것으로 9월 16일 보도됨, 같은 로봇(FR3)과 같은 모델·같은 평가셋을 두고 학습 데이터만 교체해 비교했고 연성체 10종의 평균 파지 성공률이 61.5%에서 84.2%로 올랐다고 밝힌 것으로 전해짐, 회사는 기존 로봇 학습 데이터가 「무엇을 보았는가」 만 남기는 데 비해 자사 데이터는 「얼마나 세게, 어디에 힘이 가해졌고 어떻게 변형됐는가」 를 함께 기록한다고 설명했음, 물체 안쪽의 응력은 센서로 직접 볼 수 없으므로 자체 제작한 휴대형 힘 계측 장비 HEFT 로 바깥에서 힘을 측정하고 그 값에 맞춰 시뮬레이터가 내부를 계산하는 방식으로 전해짐, 데이터는 RGB·깊이에 접촉력과 내부 응력을 더한 4계층으로 제공된다고 밝힘, 회사는 단순 집기·놓기의 성공률이 89% 인 데 비해 실제 산업 과제의 성공률은 12% 에 그친다는 점과 로봇 조작 데이터가 전 세계 인터넷 영상의 0.03% 수준이라는 점을 문제의 출발점으로 제시했음, 사업 모델로는 2주 진단·12주 실증 뒤 공정당 연 1억 원 구독을 제시했고 정밀전자 조립·와이어하네스·식품 등 500개 공정을 목표 시장으로 들었음, 엔비디아 APAC AI 액셀러레이터 선발 4개사 중 유일한 한국 기업이라고 밝혔고 김현규 대표는 12월에 평가 기준과 원시 데이터를 공개하겠다고 밝힌 것으로 전해짐, 다만 비교 대상이 된 기존 데이터의 구성과 시행 횟수의 분포, 평가셋의 난도 설계는 보도에 담기지 않아 개선 폭을 단정하지 않음, 회사 공식 발표 문서를 확보하지 못해 보도를 출처로 삼고 등급을 S3 으로 둠", "src": "로봇신문 9.16", "pd": "2026-09-16", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48539"}, {"sec": 2, "t": "美 리워드 AI, 사람 시연만으로 학습해 기종에 구애받지 않는 조작 모델 공개", "k": "새 작업을 30분 미만 시연으로 학습하며 원격조작 기록은 쓰지 않는다", "ez": "로봇에 조작 작업을 학습시키는 방법은 지금까지 대체로 두 가지였음. 사람이 조종기로 로봇을 직접 구동해 그 기록을 확보하거나, 로봇을 실제로 가동하며 데이터를 수집하는 것임. 둘 다 로봇 한 대마다 처음부터 재수행해야 하므로 비용 부담이 큼. 미국 기업 리워드 AI 가 공개한 OM-1 은 로봇을 사용하지 않음. 사람이 센서가 달린 장갑형 장치를 착용하고 평소 속도로 작업하면 손의 움직임과 물체와의 접촉 지점, 가해지는 힘이 기록되고 모델은 그것만으로 학습함. 장치는 사람 손을 그대로 모사하지 않고 필수 기능만 남긴 7자유도로 설계했는데, 착용감이 나쁘면 사람이 장치에 맞춰 부자연스러운 파지 자세를 취하게 되고 그 순간 기록된 동작은 더 이상 자연스러운 행동이 아니기 때문임. 힘까지 함께 기록하므로 「어느 경로로 이동했는가」 뿐 아니라 「개폐 저항이 큰 문을 여는 데 어느 정도 힘이 소요됐는가」 까지 남음. 회사는 이렇게 학습한 능력을 산업용 로봇팔과 휴머노이드에 그대로 이식하고 새 작업은 30분 미만의 시연으로 학습한다고 밝혔음. 다만 작업별 성공률과 시도 횟수는 공개되지 않았음.", "body": "미국 로봇 AI 기업 리워드 AI 가 범용 조작 모델 OM-1(Omnibody Model 1)을 공개했고 9월 16일 국내에 보도됨, 회사 기술 문서를 직접 열어 확인한 바로는 원격조작 데이터와 로봇에서 수집한 데이터를 학습에 전혀 쓰지 않고 사람의 시연만으로 학습한다고 적혀 있음, 사람이 센서가 달린 착용형 장치 「옴니바디 핸드(Omnibody Hand)」 를 착용하고 평소 속도로 작업하면 손의 움직임과 접촉 지점, 가해진 힘이 기록되는 구조임, 장치는 사람 손의 관절을 그대로 모사하지 않고 필수 기능만 남긴 7자유도 설계이며 엄지와 검지의 집기, 중지·약지·소지의 동시 굽힘으로 정밀 파지와 강력 파지 사이를 오가도록 만들었다고 설명했음, 회사는 착용감이 나쁘면 사람이 장치에 맞춰 잡는 방식을 바꾸게 되고 그렇게 보정된 동작은 더 이상 자연스러운 행동이 아니라는 점을 설계 기준으로 들었음, 힘은 궤적을 따라 함께 기록해 「사람이 어느 길로 움직였는가」 뿐 아니라 「그 길을 따라가는 데 어느 정도 힘이 소요됐는가」 까지 남는다고 밝혔고, 전자기 방식 추적이 시각-관성 방식보다 고속 구간의 평균 오버슛 오차를 60% 줄였다는 비교를 제시했음 — 이 값은 여덟 가지 속도에서 속도마다 열 번씩 반복한 평균임, 새 작업은 30분 미만의 데이터로 익히며 같은 정책을 산업용 로봇팔부터 휴머노이드까지 형태가 다른 기체에 그대로 돌린다고 적었음, 다만 과제별 성공률과 시행 횟수, 비교 대상 모델이 문서에 제시되지 않았고 가중치·코드·데이터셋·API 도 공개되지 않아 조작 성능을 단정하지 않음, 문서는 기업이 스스로 낸 기술 문서이고 동료심사를 거치지 않았으므로 등급을 S2 로 둠, 원문 게시일이 문서에 없고 해외 보도가 9월 14일이어서 게재 창 밖이나 국내 첫 도달로 보아 신규성을 2로 낮춰 실음", "src": "리워드 AI 기술 문서 · 전자신문 9.16", "pd": "2026-09-14", "url": "https://rewardai.com/blog/OM-1/", "url2": "https://www.etnews.com/20260915000368"}, {"sec": 3, "t": "日 ugo, 데이터 수집을 전제로 설계한 바퀴형 세미휴머노이드 발표", "k": "한쪽 팔 4kg·양팔 10kg 을 인양하며 양산은 2027년으로 제시됐다", "ez": "일본 로봇 기업 ugo 가 신형 기체 「ugo Nova」 를 9월 16일 공개했음. 사람처럼 두 다리로 걷는 대신 바퀴로 이동하는 형태이므로 세미휴머노이드로 부름. 바퀴는 메카넘 휠이라 제자리에서 방향을 전환하거나 횡방향으로 이동할 수 있고, 허리가 다관절로 굴절되어 높이가 다른 작업을 모두 수행함. 한쪽 팔로 4kg, 양팔로 10kg 까지 인양하고 한 번 충전하면 최대 6시간 가동됨. 이 발표에서 주목할 지점은 가반하중보다 데이터 쪽임. 머리와 손에 카메라를 탑재해 현장에 배치되는 순간부터 작업 장면이 축적되고, VR 컨트롤러로 사람이 원격에서 조작한 기록도 그대로 학습 재료가 됨. 회사는 이 기체와 함께 데이터 수집부터 로봇 기반모델 개발까지 통합 제공하는 제품군도 함께 공개했음. 설계와 제조는 일본 국내에서 수행하며 양산은 2027년으로 밝혔음. 가격과 초기 생산 규모, 도입처는 공개되지 않았음.", "body": "일본 로봇 기업 ugo 가 9월 16일 바퀴형 세미휴머노이드 「ugo Nova」 와, 데이터 수집부터 로봇 기반모델 개발까지를 묶은 제품군 「ugo Physical AI Fabric」 을 함께 발표했음, 기체는 다리 대신 메카넘 휠을 채택해 제자리 방향 전환과 옆 이동이 가능하고 허리에 다관절 구조를 두어 상체를 돌리거나 굽힐 수 있다고 밝힘, 가반중량은 한쪽 팔 최대 4kg·양팔 최대 10kg, 제어 주기는 100Hz, 연속 가동시간은 최대 6시간으로 제시됐음, 머리와 손에 카메라를 달아 시각 데이터를 모으고 양팔형 조작장치와 VR 컨트롤러로 원격조작을 지원하며 별도 장비 없이 설치 직후부터 데이터 수집이 가능하다고 설명했음, 연산은 엔비디아 젯슨 토르를 실어 엣지에서 처리한다고 밝혔고 의장 디자인은 GK교토, 바이래터럴 컨트롤러는 아스라테크가 맡은 것으로 전해짐, 설계와 제조를 일본 국내에서 수행한다고 밝혔고 양산 개시는 2027년으로 제시됐음, 다만 가격과 초기 생산능력, 도입처와 자율 동작의 범위는 발표에 담기지 않았고 연속 6시간이라는 값의 측정 조건도 제시되지 않아 성능 근거로 쓰지 않음, 이 건은 다리를 포기하고 바퀴를 택한 기체가 「세미휴머노이드」 로 불리는 사례이므로 형태를 밝혀 적음", "src": "ugo 프레스릴리스 9.16 · 로봇신문 9.16", "pd": "2026-09-16", "url": "https://ugo.plus/information/2026/09/16/ugo-nova/", "url2": "https://www.irobotnews.com/news/articleView.html?idxno=48529"}, {"sec": 3, "t": "KIST, 소뇌 모방한 뉴로모픽 반도체로 피지컬 AI 실시간 제어 연구", "k": "사건이 있을 때만 연산해 상시 연산 방식보다 전력 소모가 적다고 설명됐다", "ez": "휴머노이드가 모래 지면이나 경사지를 보행하려면 발이 접지하는 순간마다 자세를 다시 제어해야 함. 이 연산을 현재는 주로 GPU 가 담당하는데, GPU 는 부하가 없을 때도 상시 연산하므로 전력 소모가 큼. 배터리로 구동되는 로봇에서는 이것이 곧 가동시간의 제약이 됨. 뉴로모픽 반도체는 접근 방식이 다름. 뇌의 신경세포를 모사해 설계되어, 사건이 발생했을 때만 해당 부분이 활성화되어 연산함. 기억부와 연산부가 분리되지 않고 한자리에서 함께 수행되는 것도 차이임. KIST 반도체기술연구단은 이 방식으로 피지컬 AI 가 실시간으로 다음 동작을 예측하며 제어하는 기술을 개발하고 있음. 연구진은 사람의 균형 감각을 담당하는 소뇌의 작동 원리를 반도체로 구현한 것이라고 설명했음. 적용 후보로는 운전자의 주행 성향을 학습한 자율주행차, 비평탄 지면을 보행하는 휴머노이드, 재활용 외골격이 제시됐음. 전력 절감 폭의 실측값은 공개되지 않았음.", "body": "한국과학기술연구원(KIST)이 피지컬 AI 의 실시간 예측 제어를 겨냥한 뉴로모픽 반도체 핵심기술을 개발하고 있는 것으로 9월 16일 보도됨, 뉴로모픽 반도체는 생물의 뇌 신경망을 본떠 저장과 연산을 뉴런·시냅스에 분산해 함께 수행하는 구조로, 연산부와 기억부를 나눠 두는 폰노이만 구조의 기존 반도체와 다르다고 설명됨, KIST 반도체기술연구단 김재욱 선임연구원은 GPU 같은 기존 AI 반도체가 쉬지 않고 연산하는 데 비해 뉴로모픽 반도체는 사건이 일어날 때만 작동해 에너지 효율이 크게 나아진다고 밝힌 것으로 전해짐, 같은 연구원은 이 기술이 신체의 균형 감각과 조화를 맡는 소뇌의 작동 방식을 구현한 것이라고 설명했음, 적용 후보로 운전자의 주행 성향을 학습한 자율주행, 경사지·모래처럼 비평탄 지면을 보행하는 휴머노이드, 재활 환자용 착용형 외골격 로봇이 제시됐음, 기사는 KAIST 연구진이 뉴로모픽 뉴런 기술로 동작 인식 94.8%·음성 인식 95.0% 의 정확도를 얻었다고 전했으나 해당 연구의 논문과 평가 조건이 특정되지 않아 수치를 단정하지 않음, 전력 절감의 실측값과 비교 기준도 기사에 담기지 않았음, 기사는 현장 취재물이고 기관 발표 문서가 따로 존재하지 않아 보도를 출처로 삼고 등급을 S3 으로 둠", "src": "서울경제 기획 9.16", "pd": "2026-09-16", "url": "https://www.sedaily.com/article/20091810"}, {"sec": 4, "t": "부산교육청, 학교급식 조리로봇 실증 2년차… 5개교 추가 도입", "k": "국비가 2억 5,000만 원에서 4억 원으로 늘어 총 8억 원이 투입될 예정", "ez": "부산시교육청이 학교 급식실에 조리로봇 도입 사업을 2년째 지속하게 됐음. 한국로봇산업진흥원이 주관하는 서비스로봇 실증사업에 재선정되어, 국비 4억 원을 포함해 모두 8억 원을 투입해 다섯 개 학교에 로봇을 추가 설치함. 국비는 지난해 2억 5,000만 원에서 60% 증액됐음. 주목할 지점은 금액보다 기종이 변경됐다는 점임. 지난해 세 학교에는 볶음·국탕·튀김을 한 대로 처리하는 3in1 모델을 도입했는데, 올해는 기존 솥에 장착하는 교반기와 볶음·국탕·튀김·소스·조림처럼 공정별로 분리된 로봇으로 교체했음. 교육청은 1년간의 사용자 의견과 실증 결과를 반영한 것이라고 밝혔음. 설치는 11월 중순 완료될 예정임. 다만 지난해 세 학교에서 로봇의 고장 빈도가 어떠했는지, 한 끼 조리 처리량이 얼마였는지 같은 실증 수치는 공개되지 않아 무엇이 기종 교체를 유발한 것인지는 확인되지 않음.", "body": "부산광역시교육청이 한국로봇산업진흥원 주관 「2026년도 서비스로봇 실증사업」 에 2년 연속 선정됐다고 9월 16일 밝힌 것으로 보도됨, 지난해 국비 2억 5,000만 원 대비 60% 늘어난 국비 4억 원을 포함해 총 8억 원을 투입하며 창신초·화정초·내성고·부산공고·장안제일고 등 5개교 급식실에 조리로봇을 추가 설치한다고 전해짐, 지난해에는 금정초·부산남일고·부산체육고 등 3개교에 볶음·국탕·튀김을 한 대가 처리하는 3in1 모델을 투입했고 올해는 그 사용자 의견과 실증 결과를 반영해 기존 솥을 그대로 쓸 수 있는 장착형 교반기와 볶음·국탕·멀티공정·튀김·소스·조림 등 공정별 특화 로봇으로 바꾼 것으로 밝혀짐, 9월 중 진흥원과 과제 추진 협약을 맺고 설치 대상 학교의 현장을 정밀 점검한 뒤 11월 중순 설치를 마칠 예정이라고 전해짐, 발언자는 김석준 부산광역시교육청 교육감임, 다만 조리로봇 공급 기업과 기종명, 지난해 3개교의 가동률·고장률·조리 처리량 같은 실증 결과의 수치는 보도에 담기지 않아 기종 교체의 근거를 단정하지 않음, 교육청 보도자료 원문을 열지 못해 보도를 출처로 삼고 등급을 S3 으로 둠, 이 건은 정부 부처의 정책발표가 아니라 수행기관이 주체가 된 이행 사례이므로 게재함", "src": "로봇신문 9.16", "pd": "2026-09-16", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48538"}, {"sec": 4, "t": "HD현대·포스코·한화오션, 피지컬 AI 적용 전략 공개… 공정 재설계 제시", "k": "세 회사 모두 어떤 AI 를 쓸지보다 업무 재설계를 먼저 묻는다고 밝혔다", "ez": "조선소와 제철소를 운영하는 국내 기업들이 생산 현장에 AI 를 어떻게 적용하고 있는지를 9월 16일 한자리에서 밝혔음. 세 회사가 공통으로 말한 것은 기술 선택이 핵심이 아니라는 점임. 어떤 AI 모델이 가장 우수한지 검토하기보다 업무 방식을 어떻게 전환할 것인지를 먼저 물어야 한다는 것임. HD현대는 조선소에서 발생하는 상황을 먼저 전부 데이터로 가시화하고, 이후 그 데이터를 실제 작업 지시에 연결하는 순서로 추진하고 있다고 밝혔음. 2030년에 사람 개입을 최소화한 조선소를 목표로 두고 있음. 포스코는 개별 공정을 자동화하는 단계를 지나 생산과 물류, 에너지를 하나로 연결해 통합 최적화하는 방향으로 전환하고 있다고 밝혔음. 한화오션은 반복 작업은 AI 에, 판단이 필요한 업무는 사람에 배분하도록 업무 절차 자체를 재설계하고 있으며 AI 인력을 함께 채용하고 있다고 밝혔음. 세 회사 모두 해외 빅테크가 개별 업종에 부합하는 해법을 제공하지 않으므로 국내에서 함께 개발해야 한다고 밝혔음.", "body": "국내 주요 제조기업들이 생산 현장의 피지컬 AI 적용 전략을 공개한 것으로 9월 16일 보도됨, 자리는 9월 16일 대한상공회의소에서 열린 「2026 AI 이노베이션 포럼」 이고 HD현대·포스코홀딩스·한화오션의 임원이 발표한 것으로 전해짐, 발표자들은 성패가 기술 자체보다 적용 방식에 달려 있다고 보고 「어떤 AI 가 가장 좋은가」 가 아니라 「우리 일을 어떻게 바꿀 것인가」 를 먼저 물어야 한다고 밝힌 것으로 전해짐, HD현대는 조선소 운영을 디지털로 옮겨 「보이는 조선소」 를 만든 뒤 그 데이터를 실제 작업 흐름에 잇는 순서를 제시했고 2030년 자율 조선소를 목표로 든 것으로 전해짐, 포스코는 공정별 자동화를 넘어 생산·물류·에너지를 AI 로 잇는 전체 최적화로 옮겨 가고 있다고 밝혔고, 한화오션은 반복 작업을 AI 에, 판단을 사람에 두는 방식으로 업무 절차 자체를 다시 짜면서 AI 인력 채용을 함께 진행하고 있다고 밝힌 것으로 전해짐, 발표자들은 글로벌 빅테크가 국내 기업에 맞춘 해법을 내놓지 않으므로 업종별 피지컬 AI 는 국내 협력으로 개발해야 한다는 점을 공통으로 들었음, 다만 도입 규모와 투입 대수, 적용 공정의 수와 성과 수치는 보도에 담기지 않아 진척도를 단정하지 않음, 발표 주체의 공개 문서를 확보하지 못해 보도를 출처로 삼고 등급을 S3 으로 둠 — 발표 자리의 현장 취재이므로 보도가 곧 기록이나 발표 주체의 문서로 대조하지 못했음", "src": "디지털데일리 9.16", "pd": "2026-09-16", "url": "https://www.ddaily.co.kr/page/view/2026091616232400752"}, {"sec": 4, "t": "유일로보틱스, 스마트팩토리에서 무인 공장으로 사업 범위 확대", "k": "차량용 전동기 공장의 물류자동화 57억 원 계약을 내년 3월까지 구축한다고 밝혔다", "ez": "공장 자동화에는 단계가 있음. 작업자가 상주하되 설비가 데이터를 주고받으며 지원하는 것이 스마트팩토리이고, 작업자가 상주하지 않아 조명을 점등할 필요도 없이 로봇과 AI 만으로 24시간 가동되는 것이 다크팩토리임. 유일로보틱스는 기존 스마트팩토리 사업을 다크팩토리 영역으로 확대하겠다고 9월 16일 밝혔음. 회사가 보유한 체계는 설비 상태 모니터링, 생산 관리, 로봇 관제, 품질 관리, 물류창고 관리, 가상 공장, 고장을 사전 탐지하는 예지보전으로 이뤄져 있음. 진행 중인 사업으로는 자동차 부품 회사의 사출·조립 공정 고도화를 약 4년 만에 완료했고, 6월부터는 차량용 소형 전동기 공장의 자동화를 수행하며 물류 부문 57억 원 규모를 내년 3월까지 구축함. 국내 기업의 미국 공장 자동화도 수주했다고 밝혔음. 다만 무인 상태로 실제 몇 시간을 가동했는지, 그동안 정지가 얼마나 발생했는지 같은 수치는 공개되지 않았음.", "body": "로봇자동화 기업 유일로보틱스가 기존 스마트팩토리 솔루션을 다크팩토리 적용으로 확장하겠다고 9월 16일 밝힌 것으로 보도됨, 다크팩토리는 사람이 상주하지 않아 조명을 켤 필요가 없이 AI 와 로봇만으로 24시간 가동되는 완전 자동화 무인 공장을 가리키며 라이츠아웃 팩토리로도 불림, 회사의 스마트팩토리 체계는 설비 모니터링(SCADA)·생산관리(MES)·로봇관제·품질관리(QMS)·물류창고(WMS)·디지털트윈·예지보전으로 구성된다고 설명했음, 진행 중인 사업으로는 자동차 부품 기업 삼보에이앤티의 사출·조립 공정을 대상으로 한 K-스마트등대공장 고도화 과제를 5월까지 약 4년간 마쳤고, 6월부터 차량용 소형 전동기 제조기업의 신공장 자동화를 추진하고 있으며 물류자동화 계약 금액은 부가세를 포함해 약 57억 원, 구축 완료는 내년 3월로 제시됐음, 국내 기업의 미국 진출에 맞춰 그 미국법인의 스마트팩토리 구축 사업과 다른 국내 기업의 MES 구축 사업도 수주했다고 밝혔으나 상대 기업명은 밝히지 않았음, 회사 관계자는 로봇과 생산설비에서 나오는 데이터를 실시간으로 받아 AI 의 판단 결과를 다시 기계에 전달하는 데이터·통신·제어 체계가 함께 작동해야 한다고 밝힌 것으로 전해짐, 다만 무인 가동의 실적이나 가동률, 사람이 상주하지 않는 시간의 길이 같은 실측값은 제시되지 않아 다크팩토리 구현 수준을 단정하지 않음, 회사 공식 발표 문서를 확보하지 못해 보도를 출처로 삼고 등급을 S3 으로 둠", "src": "로봇신문 9.16", "pd": "2026-09-16", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48526"}, {"sec": 5, "t": "브릴스·빅웨이브로보틱스, 코스닥 공모 마감… 두 곳 모두 경쟁률 1,000대 1 상회", "k": "브릴스는 공모가 상단 확정, 빅웨이브 증거금은 약 4조 9,512억 원으로 집계", "ez": "국내 로봇 기업 두 곳이 같은 주에 코스닥 상장 절차를 마쳤음. 브릴스는 로봇의 제어·비전·검사·안전 기능을 모듈화해 공급하는 기업임. 기관투자자 2,181곳이 참여한 수요예측에서 희망 가격대 상단인 1만 9,500원으로 공모가가 정해졌고, 참여 기관의 98.93% 가 그 이상을 제시했음. 미국 미시간에 생산 거점을 두고 현대차그룹과 그 협력사에 납품하며, 상반기 수출이 전년 동기 대비 130.9% 증가해 매출의 절반을 상회했음. 상장은 10월 1일임. 빅웨이브로보틱스는 공장에 로봇을 도입하려는 기업과 로봇 공급사를 연결하는 플랫폼과, 여러 제조사의 로봇을 단일 화면에서 통합 관제하는 제품을 운영함. 일반 청약 경쟁률이 1,375대 1 이었고 유입된 증거금이 약 4조 9,512억 원임. 상장은 9월 29일이며 조달 자금 가운데 42억 원을 산업용 휴머노이드 개발에 투입하겠다고 밝혔음.", "body": "국내 로봇 기업 두 곳이 9월 16일 코스닥 공모 절차를 마친 것으로 보도됨, 로봇 모듈화 플랫폼 기업 브릴스는 기관 수요예측에서 희망밴드 1만 6,500~1만 9,500원의 상단인 1만 9,500원으로 공모가를 확정했고 국내외 기관 2,181곳이 참여해 경쟁률 1,187.74대 1 을 기록했으며 참여 기관의 98.93% 가 상단 이상을 제시한 것으로 전해짐, 의무보유확약 비율은 21.75%, 신주 120만 주 기준 공모금액은 약 234억 원, 상장 후 시가총액은 약 2,216억 원이고 상장 예정일은 10월 1일, 주관사는 IBK투자증권으로 제시됐음, 회사는 1,300건 이상의 프로젝트에서 확보한 로봇 제어·비전·검사·안전 기술을 모듈화해 공급한다고 밝혔고 미국 미시간 생산 거점을 기반으로 현대차그룹과 1차 협력사 공급망을 고객으로 확보했다고 전해짐, 상반기 수출액은 전년 동기 대비 130.9% 늘어난 약 510만 달러(약 77억 5,000만 원)로 전체 매출의 56.7% 이며 그중 미국 비중이 72.8% 로 제시됐음, 산업용 피지컬 AI 플랫폼 기업 빅웨이브로보틱스는 15~16일 일반청약에서 경쟁률 1,375.34대 1, 청약증거금 약 4조 9,512억 원을 기록했고 기관 수요예측 경쟁률은 1,109.37대 1 이었던 것으로 전해짐, 공모가는 1만 8,000원, 공모금액 288억 원, 공모가 기준 시가총액 약 1,849억 원, 의무보유확약 18.14%, 상장 예정일은 9월 29일이며 주관사는 유진투자증권·미래에셋증권임, 조달 자금 가운데 165억 원은 해외 진출과 마케팅에, 42억 원은 산업용 휴머노이드 개발에 배정될 예정으로 밝혀졌음, 회사는 로봇 도입을 지원하는 플랫폼 「마로솔」 과 도입 뒤 이기종 로봇을 통합 관제하는 「솔링크」 를 기축으로 구독형 사업을 전개하고 있다고 전해짐, 이 항목은 공모 결과와 자금 사용처만 적고 상장 후 주가나 투자 판단은 다루지 않음, 공시 원문을 확보하지 못해 보도를 출처로 삼고 등급을 S3 으로 둠", "src": "로봇신문 9.16", "pd": "2026-09-16", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48541"}, {"sec": 6, "t": "[칼럼] 고용 통계를 기술 영향으로 귀속하는 해석에 신중론 제기", "k": "청년 일자리 감소의 94%가 AI 고노출 업종이라는 수치에 신중론이 제기됐다", "ez": "최근 청년 일자리가 감소한 원인으로 AI 를 지목하는 해석이 증가하고 있음. 한국은행 보고서는 지난 4년간 15~29세 일자리 감소의 94% 가 AI 고노출 업종에서 발생했다고 밝혔음. 아시아경제 조영철 부장은 이 수치를 소개하면서도 곧바로 AI 의 영향으로 해석하는 것은 성급하다고 지적했음. 근거는 두 가지임. 첫째, 신규 채용에서 청년 비중이 감소하는 추세은 챗GPT 출시 이전인 2022년 하반기부터 이미 시작됐음. 둘째, 팬데믹 이후 기업들이 신입보다 경력을 채용하는 관행이 고착된 영향이 함께 작용하고 있음. 필자는 현재 진행되는 현상을 「AI 가 일자리를 없애고 있다」 보다 「이미 바뀌고 있던 채용 방식을 AI 가 가속했다」 로 해석하는 것이 사실에 부합한다고 판단함. 원인을 기술 하나로 한정하면 정작 개선해야 할 채용 관행이 정책 대상에서 제외되기 때문임. 다만 인용된 보고서의 발간일과 「AI 고노출 업종」 을 구분한 기준은 칼럼에 제시되지 않음.", "body": "아시아경제 조영철 부장이 청년 일자리 감소를 AI 의 영향으로 곧장 읽는 해석에 신중해야 한다는 칼럼을 9월 16일 실었음, 칼럼은 한국은행 보고서를 인용해 최근 4년간 청년층(15~29세) 일자리 감소의 94% 가 AI 고노출 업종에서 발생했다는 수치를 소개했으나, 이 수치만으로 인과를 세우는 것은 단편적이라고 지적했음, 근거로는 신규채용에서 청년층이 줄어드는 흐름이 챗GPT 출시 이전인 2022년 하반기부터 이미 나타났다는 점과, 팬데믹 이후 경력직 중심 채용 관행이 함께 작용했을 수 있다는 점을 들었음, 필자는 현재의 변화를 기존 채용·업무 방식의 변화를 AI 가 가속한 결과로 보아야 하며 원인을 기술 하나로 한정하면 정책의 대상이 어긋난다고 밝힌 것으로 전해짐, 다만 인용된 한국은행 보고서의 제목과 발간일, 「AI 고노출 업종」 의 분류 기준과 대상 기간이 칼럼에 제시되지 않았고 원문을 확보하지 못해 94% 를 단정하지 않음, 이 칼럼은 로봇이 아니라 AI 일반의 노동 영향을 다루므로 대상 범위가 이 지면과 정확히 겹치지는 않으나, 귀속의 근거를 따지는 논점은 로봇 도입의 노동 영향에 그대로 적용됨, 이 건은 오늘 지면의 균형 축에 해당함 — 이 지면은 매일 피지컬 AI 도입과 무인화 사업을 싣고 있고 그 기사들은 대체로 도입 대수와 처리량을 적을 뿐 고용에 무엇이 일어났는지를 적지 않으므로, 도입과 고용 변화를 잇는 진술이 나올 때 같은 잣대로 근거를 따질 자리임", "src": "아시아경제 칼럼 9.16", "pd": "2026-09-16", "url": "https://view.asiae.co.kr/article/2026091608031432952"}, {"sec": 7, "t": "KAIST·ETRI 공동팀, 언어 지시로 목적지를 탐색하는 로봇 국제 챌린지 1위", "k": "112개 팀이 겨룬 ECCV 챌린지에서 평균 성공률 90.7% 로 1위에 올랐다", "ez": "사람이 로봇에게 「거실에 있는 파란 소파로 가라」 고 말하면 로봇은 언어 지시를 해석하고, 카메라로 주변을 관측해 경로를 스스로 결정해야 함. 이 능력을 겨루는 국제 대회에서 KAIST 명현 교수 연구실과 ETRI 필드로봇연구실이 공동으로 구성한 팀이 112개 팀 가운데 1위를 차지했음. 연구팀이 주목한 것은 경로 탐색이 아니라 도착 판단이었음. 기존 로봇이 실패하는 주된 이유는 경로를 탐색하지 못해서가 아니라 목적지가 아닌 지점에서 「다 왔다」 고 판단하는 데 있었음. 그래서 로봇이 목적지라고 여기면 즉시 정지하지 않고 주변을 한 차례 재탐색한 뒤, 문자와 영상을 함께 이해하는 모델로 지시받은 장소가 맞는지 확인하도록 설계했음. 아니라고 판단하면 경로를 재탐색해 이동함. 다른 대회에서는 단일 대형 모델에 모든 판단을 일임하는 대신 복수의 경량 모델이 목적지 탐색, 계단·턱 등 위험 요소 탐지, 인도·횡단보도의 통행 규칙 파악을 분담하게 했음. 그 결과 고가의 고성능 모델보다 높은 성능을 기록했음.", "body": "KAIST 전기및전자공학부 명현 교수 미래도시로봇연구실과 한국전자통신연구원(ETRI) 필드로봇연구실이 꾸린 URL-FRRS 팀이 국제 챌린지 두 곳에서 각각 1위와 2위를 차지했다고 9월 16일 KAIST 가 밝혔음, 1위는 9월 9일 스웨덴 말뫼에서 열린 ECCV 2026 EMR 워크숍의 VLNVerse 챌린지로 112개 팀이 참가했고 두 과제 평균 성공률 90.7% 를 기록했으며 2위 팀과 성공률이 같았으나 제출 시각이 앞서 순위가 갈렸고 3위는 89.7% 였던 것으로 밝혀짐, 이 대회는 「거실에 있는 파란 소파를 찾아가라」 처럼 목적지만 주거나 여러 단계의 지시를 주고 로봇이 스스로 도달하는지를 평가함, 연구팀은 기존 로봇의 주된 실패가 경로를 탐색하지 못하는 것보다 목적지가 아닌 지점에서 도착으로 판단하는 데 있다고 분석하고, 목적지라고 판단하면 주변을 재탐색한 뒤 문자와 영상을 함께 이해하는 모델로 지시받은 장소가 맞는지·색과 모양이 맞는지·실제로 가까운지를 확인하는 CoRe-VLN 을 개발했다고 밝혔음, 2위는 7월 호주 시드니에서 열린 RSS 2026 OWN 워크숍의 내비트레이스 챌린지로 53점을 기록해 난징대·파이브에이지스 공동팀에 이어 올랐음, 여기서는 하나의 모델에 판단을 몰지 않고 목적지 탐색·위험요소 감지·통행 규칙 파악을 분담하게 한 뒤 마지막 모델이 경로를 정하는 PRISM-Nav 를 썼고, 모델 사이의 정보 전달을 글이나 좌표 대신 사진 위에 목적지와 위험지역을 직접 표시하는 방식으로 단순화했다고 밝혔음, 상대적으로 가볍고 저렴한 제미나이 3 플래시를 역할별로 나눠 쓰면서 고성능 모델인 제미나이 3.1 프로 프리뷰보다 높은 성능을 기록한 것으로 밝혀짐, 명현 교수는 별도의 추가 학습 없이도 낯선 환경에서 스스로 판단하고 움직일 수 있음을 보인 성과라고 밝혔음, 다만 두 대회의 평가가 시뮬레이션에서 이뤄졌는지 실기가 포함됐는지가 보도자료에 명시되지 않아 실환경 성능으로 읽지 않음, 같은 연구실은 6월 ICRA 2026·CVPR 2026 국제 챌린지에서도 각각 1위를 차지한 것으로 밝혀짐", "src": "KAIST 보도자료 9.16 · 로봇신문 9.16", "pd": "2026-09-16", "url": "https://news.kaist.ac.kr/news/html/news/", "url2": "https://www.irobotnews.com/news/articleView.html?idxno=48533"}, {"sec": 7, "t": "권남훈 산업연구원장, 피지컬 AI 승부처로 제조 현장 데이터 지목", "k": "로봇 밀도는 세계 1위이나 수집 데이터의 34% 만 의사결정에 활용된다고 제시됐다", "ez": "한국은 노동자 1만 명당 로봇 1,220대를 활용하는 세계 1위 국가임. 권남훈 산업연구원장은 9월 16일 열린 포럼에서 이 사실이 피지컬 AI 에서 유리하게 작용할 수 있다고 밝혔음. 언어를 다루는 AI 는 인터넷에 축적된 문서를 학습하면 되지만, 로봇을 구동하는 AI 는 실제로 공장을 가동해야만 생성되는 데이터를 필요로 하기 때문임. 행동과 그 결과가 기록으로 축적돼야 하며, 이는 생산 설비를 보유한 쪽에서만 생성됨. 다만 같은 발표에서 취약 지점도 함께 지적됐음. 수집된 데이터 가운데 실제 의사결정에 활용되는 비율은 34% 로 세계 평균 43% 보다 낮음. 중소 제조기업의 스마트공장 도입률은 18.6% 에 머묾. 로봇 기업의 63.7% 는 연 매출이 1,000만 달러 미만이고, 부품 국산화율이 약 40% 여서 로봇 생산이 늘수록 수입이 함께 증가함. 원장은 기술 항목을 나열하는 방식 대신 분야마다 존속 가능한 기업을 육성하는 방향으로 정책을 전환하고 정부는 조율에 머물러야 한다고 밝혔음.", "body": "권남훈 산업연구원장이 피지컬 AI 의 승부처는 모델 성능이 아니라 제조 현장 데이터라고 밝힌 것으로 9월 16일 보도됨, 자리는 같은 날 열린 「2026 AI 이노베이션 포럼」 임, 원장은 언어 기반 AI 가 이미 인터넷에 있는 내용을 학습하는 데 비해 피지컬 AI 는 실제 공장을 돌려야 생기는 「행동-결과 데이터」 를 필요로 하므로 생산 체계를 갖춘 제조 강국이 유리한 자리에 있고, 효율적인 생산 체계를 가진 기업일수록 더 나은 학습 데이터를 만들 수 있다고 밝힌 것으로 전해짐, 제시된 수치는 근로자 1만 명당 로봇 1,220대로 세계 1위인 로봇 밀도와, 수집한 데이터 가운데 실제 의사결정에 쓰이는 비율 34%(세계 평균 43%), 중소 제조기업의 스마트공장 도입률 18.6% 임, 생태계의 약한 자리로는 로봇 기업의 63.7% 가 매출 1,000만 달러 미만이라는 점과 부품 국산화율이 약 40% 에 머물러 생산이 늘수록 수입이 함께 느는 구조가 지목됐음, 정책 방향으로는 기술 항목을 점검표로 나열하는 방식에서 벗어나 분야마다 살아남을 기업을 키우는 쪽으로 옮기고 정부는 지시가 아니라 조율의 역할을 맡아야 한다고 제시한 것으로 전해짐, 다만 데이터 활용률 34% 와 세계 평균 43% 의 출처 조사와 대상 연도, 로봇 밀도 1,220대의 집계 연도가 보도에 담기지 않아 수치를 단정하지 않음, 산업연구원 발표 문서를 찾지 못해 보도를 출처로 삼고 등급을 S3 으로 둠 — 발언 자리의 현장 취재이므로 보도가 곧 기록이나 산업연구원 문서로 대조하지 못했음", "src": "디지털데일리 9.16", "pd": "2026-09-16", "url": "https://www.ddaily.co.kr/page/view/2026091607542971955
