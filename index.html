<!-- 자립형 배포본 · 2026-09-14 08:30 생성 · 더블클릭하면 열립니다 -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

/* ══════════════════════════════════════════════════════════════
   디자인 토큰 — 세 상태를 모두 정의한다.
   :root 에 완전한 라이트 팔레트, 미디어 쿼리와 [data-theme]에서 재정의.
   미디어 쿼리 안에서만 정의되는 색이 하나라도 있으면,
   시스템 기본(스탬프 없음) 상태에서 그 색이 사라져 글자가 배경에 묻힌다.
   ══════════════════════════════════════════════════════════════ */
:root{
  --bg:#EDF0EE; --surface:#FBFCFB; --surface2:#F1F4F2; --panel:#16211D;
  --ink:#131C19; --ink2:#2C3A35; --muted:#5A6A63; --line:#D2DAD5; --line2:#E3E9E5;
  --accent:#0D6A56; --accent-soft:#DCEBE5; --gov:#2A4B7C; --gov-soft:#DFE7F2;
  --warn:#95441A; --warn-soft:#F2E3D8; --panel-ink:#DCE7E2; --panel-dim:#7E948C;
  --ok:#0D6A56; --ok-soft:#DCEBE5; --crit:#8E2F2F; --crit-soft:#F4DFDF;
  --pw-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1211; --surface:#141C19; --surface2:#1A2421; --panel:#0A100E;
    --ink:#E4EBE7; --ink2:#C3D0CA; --muted:#8FA098; --line:#26332F; --line2:#1E2A26;
    --accent:#4CC5A2; --accent-soft:#12302A; --gov:#84AADE; --gov-soft:#16233A;
    --warn:#DE9364; --warn-soft:#2E2019; --panel-ink:#D5E2DC; --panel-dim:#71877F;
    --ok:#4CC5A2; --ok-soft:#12302A; --crit:#E08585; --crit-soft:#331B1B;
    --pw-ink:#0D1211;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1211; --surface:#141C19; --surface2:#1A2421; --panel:#0A100E;
  --ink:#E4EBE7; --ink2:#C3D0CA; --muted:#8FA098; --line:#26332F; --line2:#1E2A26;
  --accent:#4CC5A2; --accent-soft:#12302A; --gov:#84AADE; --gov-soft:#16233A;
  --warn:#DE9364; --warn-soft:#2E2019; --panel-ink:#D5E2DC; --panel-dim:#71877F;
  --ok:#4CC5A2; --ok-soft:#12302A; --crit:#E08585; --crit-soft:#331B1B;
  --pw-ink:#0D1211;
}

*{box-sizing:border-box}
html{color-scheme:light dark}
body{
  background:var(--bg); color:var(--ink); margin:0;
  font-family:'Noto Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif;
  font-size:14.5px; line-height:1.72; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:'Gowun Batang','Noto Serif KR',Georgia,serif; margin:0; text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
img{max-width:100%}
.wrap{max-width:1080px; margin:0 auto; padding:0 20px 90px}

/* ── 머리 ── */
.top{padding:30px 0 0; display:flex; flex-wrap:wrap; gap:14px; align-items:flex-start}
.top .grow{flex:1 1 300px}
.eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--accent); font-weight:600}
h1{font-size:clamp(24px,4.4vw,36px); font-weight:700; margin-top:10px; line-height:1.2}
.subline{color:var(--muted); font-size:13px; margin-top:9px;
  font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums}

/* 내부면 표식. 화면 캡처가 밖으로 나갔을 때 구분되어야 하므로 숨기거나 접지 않는다. */
.internal-badge{
  display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
  letter-spacing:.1em; padding:3px 9px; border-radius:2px;
  background:var(--warn-soft); border:1px solid var(--warn); color:var(--warn);
}
.themetog{
  appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--muted);
  font-family:'IBM Plex Mono',monospace; font-size:11px; padding:4px 10px; border-radius:2px;
  cursor:pointer;
}
.themetog:hover{color:var(--ink); border-color:var(--ink)}
.themetog:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ── 내비 ── */
nav.tabs{display:flex; gap:0; margin-top:24px; border-bottom:2px solid var(--ink); overflow-x:auto}
nav.tabs a, nav.tabs button{
  appearance:none; text-decoration:none; display:block;
  border:1px solid var(--line); border-bottom:none; background:var(--surface2);
  color:var(--muted); font-family:'Noto Sans KR',sans-serif; font-size:13.5px; font-weight:500;
  padding:9px 15px; cursor:pointer; white-space:nowrap; margin-right:-1px; border-radius:2px 2px 0 0;
}
nav.tabs .n{font-family:'IBM Plex Mono',monospace; font-size:11px; margin-right:7px; opacity:.75}
nav.tabs a:hover, nav.tabs button:hover{background:var(--surface); color:var(--ink)}
nav.tabs a[aria-current="page"], nav.tabs button[aria-selected="true"]{
  background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:700}
nav.tabs a:focus-visible, nav.tabs button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.pane{padding:30px 0 0}
.pane[hidden]{display:none}

h2{font-size:21px; font-weight:700; margin:34px 0 6px}
h2:first-child{margin-top:0}
h3{font-size:15.5px; font-weight:700; margin:24px 0 10px}
.dek{color:var(--muted); font-size:13.5px; margin-bottom:16px; max-width:72ch}

/* ── 표 ── */
.scroll{overflow-x:auto; border:1px solid var(--line); background:var(--surface); margin:16px 0}
table{border-collapse:collapse; width:100%; min-width:540px; font-size:13px}
th,td{padding:9px 11px; text-align:left; vertical-align:top; border-bottom:1px solid var(--line2)}
thead th{background:var(--surface2); font-family:'IBM Plex Mono',monospace; font-weight:600;
  font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted);
  border-bottom:1px solid var(--line); white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
td.n{font-variant-numeric:tabular-nums; font-family:'IBM Plex Mono',monospace; white-space:nowrap}

/* ── 칩·등급 ── */
.chip{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
  padding:2px 6px; border-radius:2px; border:1px solid var(--line); background:var(--surface2);
  color:var(--ink2); margin:1px 2px 1px 0; white-space:nowrap}
.chip.a{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.chip.b{background:var(--gov-soft); border-color:var(--gov); color:var(--gov)}
.chip.c{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}
.sig{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
  font-weight:600; padding:2px 6px; border-radius:2px; white-space:nowrap}
.sig.s1{background:var(--ok-soft); color:var(--ok); border:1px solid var(--ok)}
.sig.s2{background:var(--gov-soft); color:var(--gov); border:1px solid var(--gov)}
.sig.s3{background:var(--surface2); color:var(--muted); border:1px solid var(--line)}
.sig.s4{background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn)}

/* ── 도구막대·버튼 ── */
.toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:16px 0;
  padding:12px 14px; background:var(--surface); border:1px solid var(--line)}
.toolbar .count{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--muted);
  font-variant-numeric:tabular-nums}
.toolbar .count b{color:var(--accent); font-size:15px}
button.act, a.act{
  appearance:none; text-decoration:none; display:inline-block;
  border:1px solid var(--ink); background:var(--ink); color:var(--bg);
  font-family:'Noto Sans KR',sans-serif; font-size:13px; font-weight:600; padding:7px 14px;
  border-radius:2px; cursor:pointer;
}
button.act.ghost, a.act.ghost{background:transparent; color:var(--ink)}
button.act:hover, a.act:hover{opacity:.86}
button.act:focus-visible, a.act:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
select, input[type=search], input[type=text]{
  font-family:'Noto Sans KR',sans-serif; font-size:13px; padding:6px 9px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:2px;
}
select:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

/* ── 후보풀 ── */
table.pool td{vertical-align:middle}
table.pool tr.on{background:var(--accent-soft)}
table.pool input[type=checkbox]{width:16px; height:16px; accent-color:var(--accent); cursor:pointer}
.sc{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; font-size:12px}
.sc b{font-size:13.5px; color:var(--accent)}
.ttl{font-weight:500; line-height:1.5}
.src{font-size:11.5px; color:var(--muted); font-family:'IBM Plex Mono',monospace}
/* 검증 경위 — 내부 후보풀 화면에만 나온다(2026-09-04). 무엇을 확보하지 못했는지를
   승인 전에 보이게 하되, 제목보다 뒤로 물러서게 해서 사실과 섞이지 않게 한다. */
.vnote{margin-top:5px; font-size:11.5px; line-height:1.55; color:var(--muted);
  border-left:2px solid var(--line); padding:3px 0 3px 8px}
.vnote .lbl{display:inline-block; margin-right:6px; font-weight:600; color:var(--warn,#a15c00)}
.pw{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:600;
  padding:1px 5px; border-radius:2px; background:var(--gov); color:var(--pw-ink);
  margin-right:5px; vertical-align:1px}

/* ── 발송본 패널 ── */
.out{background:var(--panel); color:var(--panel-ink); padding:20px 18px; margin-top:14px;
  overflow-x:auto; border-radius:2px}
.out pre{margin:0; font-family:'IBM Plex Mono','D2Coding',monospace; font-size:12px;
  line-height:1.9; white-space:pre-wrap; word-break:break-word}

/* ── 노트 ── */
.note{background:var(--surface); border-left:3px solid var(--accent); padding:14px 16px;
  margin:16px 0; font-size:13.5px; color:var(--ink2)}
.note.warn{border-left-color:var(--warn)}
.note .lbl{display:block; font-family:'IBM Plex Mono',monospace; font-size:10px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--accent); font-weight:600;
  margin-bottom:5px}
.note.warn .lbl{color:var(--warn)}

/* ── REF 카드 ── */
.refs{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:12px; margin-top:14px}
.ref{border:1px solid var(--line); background:var(--surface); padding:13px 14px}
.ref .rid{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--muted); letter-spacing:.06em}
.ref .rt{font-weight:700; font-size:14px; margin:5px 0 6px; line-height:1.45}
.ref .rm{font-size:12.5px; color:var(--muted); margin-bottom:8px}
.ref .rk{font-size:12.5px; color:var(--ink2); margin-top:8px; padding-top:8px;
  border-top:1px dashed var(--line)}
.filters{display:flex; flex-wrap:wrap; gap:6px; margin:14px 0}
.filters button{appearance:none; font-family:'IBM Plex Mono',monospace; font-size:11.5px;
  padding:4px 9px; border:1px solid var(--line); background:var(--surface); color:var(--muted);
  cursor:pointer; border-radius:2px}
.filters button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.filters button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ── 스레드 ── */
.thread{border:1px solid var(--line); background:var(--surface); padding:15px 16px; margin-bottom:12px}
.thread .tn{font-weight:700; font-size:15px; font-family:'Gowun Batang',serif}
.tl{list-style:none; margin:12px 0 0; padding:0 0 0 16px; border-left:2px solid var(--line)}
.tl li{position:relative; padding:0 0 10px 14px; font-size:13px}
.tl li::before{content:''; position:absolute; left:-21px; top:8px; width:7px; height:7px;
  border-radius:50%; background:var(--accent); border:2px solid var(--surface)}
.tl .d{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); margin-right:8px}
.verdict{margin-top:12px; padding:10px 12px; background:var(--surface2);
  border-left:3px solid var(--gov); font-size:13px}
.verdict b{color:var(--gov)}

/* ── 이슈 ── */
.iss{border:1px solid var(--line); background:var(--surface); margin-bottom:14px}
.ih{padding:13px 16px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap;
  gap:10px; align-items:baseline}
.ih .rule{font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
  padding:2px 7px; background:var(--ink); color:var(--bg); border-radius:2px}
.ih .it{font-weight:700; font-size:15px; font-family:'Gowun Batang',serif; flex:1 1 240px}
.ib{padding:14px 16px; display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px}
.lbl2{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); margin-bottom:5px}
.toc{font-size:13px; margin:0; padding-left:17px}
.toc li{margin-bottom:3px}
.vfy{font-size:12.5px}
.vf{display:block; margin-bottom:4px}
.ok-i{color:var(--ok); font-weight:600}
.wn-i{color:var(--warn); font-weight:600}
.cr-i{color:var(--crit); font-weight:600}

/* ── D-day ── */
.dd{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
  padding:2px 7px; border-radius:2px; background:var(--surface2); border:1px solid var(--line);
  color:var(--muted)}
.dd.near{background:var(--crit-soft); border-color:var(--crit); color:var(--crit)}
.dd.mid{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}

/* ── 파이프라인 ── */
.pipe{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:1px;
  background:var(--line); border:1px solid var(--line); margin-top:14px}
.col{background:var(--surface); padding:12px 13px; min-height:130px}
.colh{display:flex; align-items:baseline; gap:8px; margin-bottom:10px; padding-bottom:8px;
  border-bottom:1px solid var(--line2)}
.colh .cn{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); font-weight:600}
.colh .cc{font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:600;
  color:var(--accent); margin-left:auto; font-variant-numeric:tabular-nums}
.card{background:var(--surface2); border:1px solid var(--line); padding:8px 10px;
  margin-bottom:7px; font-size:12.5px; line-height:1.5}
.card .cid{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted)}
.card.done{border-left:3px solid var(--ok)}
.empty{font-size:12.5px; color:var(--muted); padding:6px 0}

/* ── 리포트 ── */
.rep{border:1px solid var(--line); background:var(--surface); margin-bottom:14px}
.reph{padding:13px 16px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap;
  gap:10px; align-items:baseline}
.reph .no{font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
  padding:2px 7px; background:var(--accent); color:var(--surface); border-radius:2px}
.reph .rtt{font-weight:700; font-size:15.5px; font-family:'Gowun Batang',serif; flex:1 1 240px}
.repb{padding:14px 16px}
.sum{background:var(--surface2); border-left:3px solid var(--accent); padding:11px 13px;
  margin-bottom:12px; font-size:13px}
.sum span{display:block; margin-bottom:5px}
.sum span:last-child{margin-bottom:0}
.repmeta{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; font-size:12.5px}
.stg{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600;
  padding:2px 7px; border-radius:2px; border:1px solid var(--line); background:var(--surface2);
  color:var(--muted)}
.stg.wait{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}
.stg.go{background:var(--gov-soft); border-color:var(--gov); color:var(--gov)}
.stg.pub{background:var(--ok-soft); border-color:var(--ok); color:var(--ok)}

/* ── 아카이브 목록 ── */
.edlist{display:grid; gap:10px; margin-top:14px}
.edrow{display:flex; flex-wrap:wrap; gap:12px; align-items:baseline; padding:12px 14px;
  border:1px solid var(--line); background:var(--surface); text-decoration:none; color:inherit}
.edrow:hover{border-color:var(--accent)}
.edrow .ed{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--accent);
  font-weight:600; white-space:nowrap}
.edrow .eh{flex:1 1 260px; font-size:13.5px}
.item{border-bottom:1px solid var(--line2); padding:11px 0}
.item:last-child{border-bottom:none}
.item .isec{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--muted);
  letter-spacing:.06em; text-transform:uppercase}
.item .itx{font-size:13.5px; margin-top:3px; line-height:1.7}
.hit{background:var(--accent-soft); border-radius:2px}

ul.tight{margin:10px 0 0; padding-left:19px}
ul.tight li{margin-bottom:6px; font-size:13.5px}
ul.tight li::marker{color:var(--accent)}
footer{margin-top:50px; padding-top:20px; border-top:1px solid var(--line); color:var(--muted);
  font-size:12px; font-family:'IBM Plex Mono',monospace}
code{font-family:'IBM Plex Mono',monospace; font-size:.92em; background:var(--surface2);
  padding:1px 4px; border-radius:2px}
b{font-weight:700}

@media (max-width:520px){
  .wrap{padding:0 14px 70px}
  nav.tabs a, nav.tabs button{padding:8px 11px; font-size:12.5px}
}

/* ── 발표일·원문 표기 ─────────────────────────────────────────
   검색엔진이 몇 달 지난 자료를 오늘 것처럼 올려 준다. 담당자가 승인 전에
   날짜를 눈으로 보게 하려고 항목마다 붙인다. 확인 못 한 날짜는 감추지 않는다. */
.pd{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
  padding:1px 5px; border-radius:2px; border:1px solid var(--line);
  background:var(--surface2); color:var(--muted); white-space:nowrap}
.pd.warn{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}
.src-link{font-size:10.5px; font-family:'IBM Plex Mono',monospace;
  text-decoration:none; border-bottom:1px solid currentColor}
.src-link:hover{border-bottom-width:2px}

/* ── 워치리스트 패널 (관리용 화면 전용) ───────────────────────
   발송본에서 뺀 뒤로 이 패널이 유일한 노출 지점이다. */
ul.watch{list-style:none; margin:0; padding:0}
ul.watch li{padding:8px 0; border-bottom:1px solid var(--line2);
  font-size:13px; line-height:1.65; display:flex; gap:9px; align-items:flex-start}
ul.watch li:last-child{border-bottom:none}
ul.watch .dd{flex:0 0 auto}

/* ── 지면 서식 (뉴스레터 면 · 내부 미리보기가 함께 쓴다) ─────────
   뉴스레터 면에만 두면 관리용 후보풀 화면의 미리보기가 다른 모습으로
   그려진다. 담당자가 화면에서 본 것과 배포되는 지면은 같아야 한다. */
  /* 공유용 전용 — 결과 중심 배치. 해석·판단근거는 싣지 않는다. */
  .fact{border-left:3px solid var(--line); padding:10px 0 10px 14px; margin:0 0 2px}
  .fact + .fact{border-top:1px solid var(--line2)}
  .fact .ft{font-size:14px; font-weight:600; line-height:1.55; color:var(--ink)}
  .fact .fk{font-size:13px; line-height:1.75; color:var(--ink2); margin-top:5px}
  .fact .fm{margin-top:6px; display:flex; flex-wrap:wrap; gap:7px; align-items:center}
  /* 섹션 7개를 색으로 가른다. 번호를 세지 않고도 어느 갈래인지 눈에 들어와야 한다.
     라이트는 어두운 색, 다크는 밝은 색 — 세 테마 상태를 모두 정의한다. */
  :root{
    --s1:#2A4B7C; --s2:#0D6A56; --s3:#5B3E8E; --s4:#16607A;
    --s5:#8A5A1B; --s6:#8E3346; --s7:#4A6B22; --s8:#7A3E6B;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --s1:#8DAFE2; --s2:#4CC5A2; --s3:#B7A0E4; --s4:#74C4DF;
      --s5:#E0AC72; --s6:#E993A7; --s7:#AFD177; --s8:#D9A2CC;
    }
  }
  :root[data-theme="dark"]{
    --s1:#8DAFE2; --s2:#4CC5A2; --s3:#B7A0E4; --s4:#74C4DF;
    --s5:#E0AC72; --s6:#E993A7; --s7:#AFD177; --s8:#D9A2CC;
  }

  .secblk{margin:0 0 26px}
  .secblk h3{display:flex; align-items:baseline; gap:9px; margin:0 0 4px;
    font-size:15px; letter-spacing:-.01em;
    border-bottom:2px solid currentColor; padding-bottom:6px}
  .secblk[data-sec="1"] h3{color:var(--s1)}
  .secblk[data-sec="2"] h3{color:var(--s2)}
  .secblk[data-sec="3"] h3{color:var(--s3)}
  .secblk[data-sec="4"] h3{color:var(--s4)}
  .secblk[data-sec="5"] h3{color:var(--s5)}
  .secblk[data-sec="6"] h3{color:var(--s6)}
  .secblk[data-sec="7"] h3{color:var(--s7)}
  .secblk[data-sec="8"] h3{color:var(--s8)}
  /* 항목 왼쪽 선도 같은 색을 옅게 물려 받아 어느 섹션 소속인지 이어 보이게 한다 */
  .secblk[data-sec="1"] .fact{border-left-color:var(--s1)}
  .secblk[data-sec="2"] .fact{border-left-color:var(--s2)}
  .secblk[data-sec="3"] .fact{border-left-color:var(--s3)}
  .secblk[data-sec="4"] .fact{border-left-color:var(--s4)}
  .secblk[data-sec="5"] .fact{border-left-color:var(--s5)}
  .secblk[data-sec="6"] .fact{border-left-color:var(--s6)}
  .secblk[data-sec="7"] .fact{border-left-color:var(--s7)}
  .secblk[data-sec="8"] .fact{border-left-color:var(--s8)}
/* ── 당일 미리보기 (내부 후보풀 화면) ─────────────────────────
   체크하는 즉시 배포될 지면이 이 안에 그려진다. 테두리를 둘러 '지면'과
   '작업 화면'을 눈으로 가른다 — 안쪽은 밖으로 나가는 것이다. */
.preview{border:1px solid var(--line); background:var(--surface);
  padding:16px 18px 6px; margin:12px 0 0}
.preview .toolbar{margin-top:0}
pre.cmd{margin:8px 0 0; padding:10px 12px; overflow-x:auto; white-space:pre-wrap;
  word-break:break-all; background:var(--surface2); border:1px solid var(--line);
  font-family:'IBM Plex Mono','D2Coding',monospace; font-size:11.5px;
  line-height:1.7; color:var(--ink2)}

/* ══════════════════════════════════════════════════════════════
   기사 상세면 (2026-09-09 신설)
   목록의 제목을 누르면 이 면이 선다 — 메타표 · AI 상세요약 · 하단 원문 링크.
   별도 파일이 아니라 같은 파일 안에서 갈아 끼우므로, 배포본 한 장으로 보내도
   그대로 눌린다. 인쇄·이미지로 구울 때는 bundle.py 가 목록만 남기고 감춘다.
   ══════════════════════════════════════════════════════════════ */

/* 목록에서 — 제목이 눌린다는 것이 보여야 한다. 밑줄 대신 오른쪽에 표를 단다. */
.fact a.ft{display:block; text-decoration:none; color:var(--ink); font-size:14px;
  font-weight:600; line-height:1.55}
.fact a.ft:hover{color:var(--accent)}
.fact a.ft:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
/* 제목 줄 — 헤드라인과 「상세 보기」를 양 끝으로 벌린다 (2026-09-09 지시).
   좁은 화면에서는 상세 보기가 아래로 떨어지되 오른쪽에 붙어 있게 한다. */
.fact .fh{display:flex; flex-wrap:wrap; gap:6px 14px; align-items:baseline;
  justify-content:space-between}
.fact .fh a.ft{flex:1 1 240px}
.fact .fh a.dgo{flex:0 0 auto; margin-left:auto}

/* 「상세 보기」 — 목록에서 상세면으로 가는 유일한 길이다. 발표일도 출처도
   상세면 메타표가 지므로 목록에는 이것만 둔다. */
a.dgo{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
  font-weight:600; letter-spacing:.04em; padding:2px 8px; border-radius:2px;
  border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent);
  text-decoration:none; white-space:nowrap}
a.dgo:hover{background:var(--accent); color:var(--surface)}
a.dgo:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
/* 리포트 카드 제목 옆 표는 그대로 쓴다 */
a.rtt .more{display:inline-block; margin-left:8px; vertical-align:2px;
  font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:600; letter-spacing:.08em;
  padding:1px 5px; border-radius:2px; border:1px solid var(--line);
  background:var(--surface2); color:var(--muted); white-space:nowrap}
a.rtt:hover .more{border-color:var(--accent); color:var(--accent);
  background:var(--accent-soft)}

/* ── 상세면 ── */
/* 낱말을 음절 단위로 끊지 않는다 (2026-09-14 지시로 뒤집힌 규칙).
   CSS 기본값(word-break:normal)은 한글을 음절 단위로 쪼개 어디서든 줄을 넘긴다 —
   '휴머노이'에서 끊고 '드'를 다음 줄로 보내는 식이다. 읽는 사람은 그 자리에서
   한 번 멈춘다. keep-all 은 어절을 통째로 넘기므로 그 멈춤이 없어진다.
   긴 주소처럼 띄어쓰기가 없는 문자열은 overflow-wrap 이 받아 준다.
   상세면 전체에 한 번 깔아 두면 제목·메타표·요약·본문이 모두 같은 규칙을 따른다. */
.detail{max-width:78ch; word-break:keep-all; overflow-wrap:break-word}
.dhead{border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:0}
.dsec{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.11em;
  text-transform:uppercase; font-weight:600; color:var(--muted); margin-bottom:8px}
.detail[data-sec="1"] .dsec{color:var(--s1)}
.detail[data-sec="2"] .dsec{color:var(--s2)}
.detail[data-sec="3"] .dsec{color:var(--s3)}
.detail[data-sec="4"] .dsec{color:var(--s4)}
.detail[data-sec="5"] .dsec{color:var(--s5)}
.detail[data-sec="6"] .dsec{color:var(--s6)}
.detail[data-sec="7"] .dsec{color:var(--s7)}
.detail[data-sec="8"] .dsec{color:var(--s8)}
.dtt{font-size:clamp(19px,3vw,25px); font-weight:700; line-height:1.38; color:var(--ink)}

/* 메타표 — 자료발표일·출처·원문링크. 첨부 서식과 같은 자리에 같은 것이 오게 둔다. */
.dmeta{margin:0; padding:14px 16px; background:var(--surface2);
  border:1px solid var(--line); border-top:none; display:grid; gap:7px 18px; font-size:12.5px}
.dmeta > div{display:grid; grid-template-columns:88px 1fr; gap:12px; align-items:baseline}
.dmeta dt{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.06em;
  color:var(--muted); font-weight:600; padding-top:1px}
/* break-all 은 긴 주소를 접으려고 둔 것인데 출처 이름까지 음절로 쪼갰다.
   keep-all 로 바꾸고, 접을 곳이 없는 문자열만 anywhere 가 받게 한다. */
.dmeta dd{margin:0; color:var(--ink2); word-break:keep-all;
  overflow-wrap:anywhere; line-height:1.6}
.dmeta dd a{color:var(--accent); text-decoration:none; border-bottom:1px solid var(--line)}
.dmeta dd a:hover{border-bottom-color:currentColor}
/* 출처 조각이 곧 링크다 (2026-09-09). src-link 의 기본값(10.5px 모노)은 목록의
   좁은 줄에 맞춘 것이라 표 안에서는 읽기 어렵다 — 여기서는 본문 크기로 되돌린다. */
.dmeta dd a.src-link{font-family:inherit; font-size:13px; border-bottom-color:var(--accent)}

.dkey{margin-top:16px; padding:12px 14px; background:var(--surface);
  border-left:3px solid var(--accent); font-size:13.5px; line-height:1.75; color:var(--ink)}
.dkey .lbl2{margin-bottom:5px}

/* AI 요약 상자 */
.aibox{margin-top:16px; padding:16px 18px; background:var(--surface);
  border:1px solid var(--line); border-radius:2px}
.aibox .aih{display:flex; align-items:center; gap:8px; margin-bottom:12px;
  padding-bottom:9px; border-bottom:1px solid var(--line2);
  font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.09em;
  font-weight:600; color:var(--accent); text-transform:uppercase}
.aibox .aim{display:inline-flex; align-items:center; justify-content:center;
  min-width:22px; height:18px; padding:0 5px; border-radius:2px;
  background:var(--accent); color:var(--surface); font-size:10px; letter-spacing:.04em}
/* 2026-09-09 에는 양쪽 맞춤을 지키려고 기본값(word-break:normal)을 썼다.
   그때 판단은 「한글은 음절 단위로 넘겨도 읽기에 지장이 없다」였는데,
   2026-09-14 담당자가 지면을 보고 뒤집었다 — 낱말이 끊기는 것이 먼저 보인다.
   그래서 keep-all 로 바꾼다. 그러면 9/9 가 걱정한 문제가 실제로 생긴다 —
   줄 끝에 긴 어절이 걸리면 통째로 다음 줄로 넘어가고 남은 자리를 낱말 사이
   빈칸이 나눠 가져 줄 가운데가 구멍처럼 벌어진다. **그래서 양쪽 맞춤을 함께
   버린다.** 왼쪽 맞춤이면 남는 자리가 오른쪽 끝에 한 번에 모이므로 문단 안에
   구멍이 생기지 않는다. 둘 중 하나는 포기해야 하고, 지시는 어절 쪽이다. */
.aibox p{font-size:13.8px; line-height:1.95; color:var(--ink2); margin:0 0 11px;
  text-align:left; word-break:keep-all; overflow-wrap:break-word; hyphens:none}
.aibox p:last-child{margin-bottom:0}
/* 韓 연계 — 사실이 아니라 우리 해석이다. 색을 갈라 경계를 보이게 한다. */
.aibox.kor{background:var(--gov-soft); border-color:var(--gov)}
.aibox.kor .aih{color:var(--gov); border-bottom-color:var(--gov)}
.aibox.kor .aim.k{background:var(--gov); color:var(--pw-ink)}
.aibox.kor p{color:var(--ink)}

/* 유료 지면 표 — 누르기 전에 알 수 있어야 한다 (2026-09-09).
   유료 소스는 보조 출처로 달지 않는 것이 원칙이고, 이 표가 붙는 것은
   그 기사 자체가 항목이라 유료 지면이 유일한 확인 경로인 예외뿐이다. */
.paywall{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:9.5px;
  font-weight:600; letter-spacing:.06em; padding:1px 5px; border-radius:2px;
  background:var(--warn-soft); border:1px solid var(--warn); color:var(--warn);
  white-space:nowrap; vertical-align:1px}

@media (max-width:520px){
  .dmeta > div{grid-template-columns:74px 1fr; gap:9px}
}

/* ══════════════════════════════════════════════════════════════
   리포트 상세면 (2026-09-09 신설)
   서가의 카드를 누르면 이 면이 선다. 기사 상세면과 같은 뼈대를 쓰되
   메타표에 자료발간일·키워드·첨부파일이 더 붙는다.
   ══════════════════════════════════════════════════════════════ */
.rep a.rtt{text-decoration:none; color:var(--ink)}
.rep a.rtt:hover{color:var(--accent)}
.rep a.rtt:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
.kws{display:flex; flex-wrap:wrap; gap:5px}
.kw{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
  padding:1px 6px; border-radius:2px; background:var(--accent-soft);
  border:1px solid var(--accent); color:var(--accent); white-space:nowrap}
a.file{display:inline-flex; align-items:center; gap:8px; text-decoration:none;
  padding:7px 11px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink2); font-size:12.5px; margin:0 6px 6px 0}
a.file:hover{border-color:var(--accent); background:var(--accent-soft)}
a.file .ext{font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:600;
  letter-spacing:.06em; padding:2px 5px; border-radius:2px;
  background:var(--warn-soft); border:1px solid var(--warn); color:var(--warn)}
a.file .ext.html{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}

/* 공개 아카이브의 항목 제목 — 누르면 그 기사의 상세면이 선다 (2026-09-09) */
a.alink{color:var(--ink); text-decoration:none; font-weight:600;
  border-bottom:1px solid var(--line)}
a.alink:hover{color:var(--accent); border-bottom-color:currentColor}
a.alink:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* 상세면이 서는 동안 탭을 감춘다. nav.tabs 의 display:flex 가 브라우저 기본
   [hidden]{display:none} 을 이기므로 여기서 다시 눌러 준다 — 이걸 빼면 상세면 위에
   탭이 남고, 눌러도 뒤에 가린 목록만 바뀌어 아무 일도 안 일어난 것처럼 보인다. */
nav.tabs[hidden]{display:none !important}

</style>
<style>
  details.raw{margin:22px 0 0; border:1px solid var(--line); background:var(--surface2)}
  details.raw summary{padding:9px 12px; cursor:pointer; font-size:13px; color:var(--muted)}
  details.raw pre{margin:0; padding:0 12px 12px; white-space:pre-wrap;
    font-size:12.5px; line-height:1.7; color:var(--ink2)}
  .filters{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 16px}
  .filters input, .filters select{border:1px solid var(--line); background:var(--surface);
    color:var(--ink); padding:7px 9px; font:inherit; font-size:13px; border-radius:2px}
  mark{background:var(--accent-soft); color:var(--ink); padding:0 1px}
  /* 머리글이 그리는 빈 내비게이션 바를 지운다 — 탭은 본문에서 만든다 */
  .top + nav.tabs:empty{display:none}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="pane" id="body"></div>
  <footer id="foot"></footer>
</div>

<script>
/* 공통 유틸 + 뉴스레터 렌더. 공개면·내부면이 함께 쓴다.
   ES 모듈이 아니다 — file:// 에서 module 은 CORS 로 막힌다. */
window.HMD = window.HMD || {};

(function (A) {
  'use strict';

  A.SECTIONS = ['해외 정책·전략', '기술·모델·데이터', '하드웨어·양산·공급망', '실증·현장도입',
                '산업·투자·국제협력', '안전·표준·규제·노동', '국내 연구현장·기관',
                '연구성과·논문'];
  A.BAR = '━━━━━━━━━━━━━━━';
  A.NONE_LINE = '▷ 금일 휴머노이드 관련 주요기사 없음';
  A.NONE_HEAD = '금일 주요기사 없음';
  A.PW_SECTION = 5;

  A.esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };
  A.$ = function (sel, root) { return (root || document).querySelector(sel); };
  A.$$ = function (sel, root) { return [].slice.call((root || document).querySelectorAll(sel)); };
  A.qs = function (k) { return new URLSearchParams(location.search).get(k); };

  A.fmtDate = function (iso) {
    if (!iso) return '';
    var p = String(iso).split('-');
    return p.length === 3 ? p[0] + '.' + (+p[1]) + '.' + (+p[2]) : iso;
  };
  A.md = function (iso) {           // 2026-08-30 → 8/30
    var p = String(iso || '').split('-');
    return p.length === 3 ? (+p[1]) + '/' + (+p[2]) : iso;
  };

  /* 오늘 날짜(Asia/Seoul). toISOString() 은 UTC 라서 쓰면 안 된다 —
     발송본을 조립하는 08:20 KST 는 UTC 로 아직 전날이고, 하필 매일 쓰는 그 시각에 하루가 어긋난다. */
  A.todayKST = function () {
    var d = new Date(Date.now() + 9 * 3600 * 1000);
    return d.getUTCFullYear() + '-'
      + String(d.getUTCMonth() + 1).padStart(2, '0') + '-'
      + String(d.getUTCDate()).padStart(2, '0');
  };

  /* 테마 토글. 세 상태를 돈다 — 시스템 → 라이트 → 다크 → 시스템.
     localStorage 는 사생활 보호 모드에서 던지므로 반드시 감싼다. */
  A.initTheme = function () {
    var K = 'hmd-theme';
    var cur = '';
    try { cur = localStorage.getItem(K) || ''; } catch (e) { cur = ''; }
    if (cur) document.documentElement.setAttribute('data-theme', cur);
    var btn = A.$('#themetog');

     그 매체에서만 나온 서술은 근거가 없는 것과 같다. 그래서 원문이 따로 열리는데
     보조로 붙인 유료 보도는 출처 표기에서도 링크에서도 뺀다(check.py 가 막는다).

     예외는 **그 기사 자체가 항목이고 유료 지면이 유일한 확인 경로일 때**다.
     네이처·사이언스 뉴스면이 그렇다. 그때는 링크를 두되 [유료] 표를 붙여
     **누르기 전에** 알 수 있게 한다.

     목록은 config.paywall 에 있다 — 새 매체가 생기면 코드가 아니라 그 파일을 고친다.
     주소의 일부만 유료인 곳이 있어(네이처는 뉴스면 d41586 만 유료, 오픈액세스
     학술지는 아니다) 도메인이 아니라 **주소 조각**으로 적는다. */
  A.isPaywalled = function (u) {
    var list = (A.config && A.config.paywall) || [];
    var s = String(u || '').toLowerCase();
    if (!s) { return false; }
    for (var i = 0; i < list.length; i++) {
      if (s.indexOf(String(list[i]).toLowerCase()) >= 0) { return true; }
    }
    return false;
  };

  /* 상세면 한 장. x 는 items[] 의 항목이고 opt.date 는 그 항목이 실린 호다. */
  A.detailHTML = function (x, opt) {
    opt = opt || {};
    var sec = A.SECTIONS[(x.sec || 0) - 1] || '';
    var sp = A.splitKorea(x.body || '');
    /* 상세면은 일반 독자가 읽는 자리다 (2026-09-09 지시). 실무용 서술을 그대로 두면
       용어에서 막히므로 **쉬운 요약(ez)이 있으면 그것을 그린다.** body 는 카톡
       발송본과 내부 화면이 지는 기록이라 그대로 두고, 지면에서 갈아 끼우기만 한다. */
    var ps = A.paras(x.ez || sp.facts);
    /* 메타표는 「자료발표일 + 출처」 둘로 끝낸다 (2026-09-09 지시).
       수록 호는 위 도구막대가, 분류는 제목 위 눈썹줄이 이미 지고 있고,
       핵심요약은 바로 아래 상세요약이 같은 말을 더 길게 한다 — 다 뺐다.
       주소도 따로 줄 세우지 않는다. **출처 조각마다 링크가 걸리므로**
       「원문 · 문서 · 보도」를 눌러 그대로 들어간다(A.srcHTML). */
    var meta = [];
    meta.push(['자료발표일',
      x.pd ? A.esc(A.fmtDate(x.pd)) : '<span class="pd warn">확인 못 함</span>']);
    if (x.src) {
      meta.push(['출처', A.srcHTML(x)]);
    } else if (x.url || x.url2 || x.url3 || x.url4) {
      /* src 가 비면 걸 자리가 없어 링크가 통째로 사라진다. 그때만 주소를 직접 세운다. */
      meta.push(['원문링크', [x.url, x.url2, x.url3, x.url4]
        .filter(function (u) { return u; })
        .map(function (u, n) {
          return '<a class="src-link" href="' + A.esc(u) + '" target="_blank" '

    }

    h += '<div class="dhead"><div class="dsec">' + A.esc(sec) + '</div>'
      + '<h2 class="dtt">' + A.esc(x.t || '') + '</h2></div>';

      return '<div><dt>' + r[0] + '</dt><dd>' + r[1] + '</dd></div>';
    }).join('') + '</dl>';

    if (ps.length) {
      h += '<section class="aibox"><div class="aih"><span class="aim">AI</span>상세요약</div>'
        + ps.map(function (t) { return '<p>' + A.esc(t) + '</p>'; }).join('')
        + '</section>';
    }
    /* 韓 연계는 우리 해석이라 표시를 달아 사실과 가른다. */
    if (sp.korea) {
      h += '<section class="aibox kor"><div class="aih"><span class="aim k">韓</span>'
        + '국내 연계 — 편집자 해석</div>'
        + A.paras(sp.korea).map(function (t) { return '<p>' + A.esc(t) + '</p>'; }).join('')
        + '</section>';
    }
    /* 하단 「원문 링크」 블록은 두지 않는다 (2026-09-09 지시) — 바로 위 메타표가

    return h + '</article>';
  };

  /* 상세면 설치. 목록을 그리는 화면이 이 함수를 부르면 해시가 바뀔 때마다 목록과 상세를

       A.installDetail({ mount, panes:[{el,on}], chrome:[el], lookup: fn(key) }) */
  A.installDetail = function (cfg) {
    var mount = cfg.mount, panes = cfg.panes || [], top = 0;

    function paint() {
      var m = /^#a\/([^\/?&]+)$/.exec(location.hash || '');
      var found = m ? cfg.lookup(decodeURIComponent(m[1])) : null;
      if (!found) {
        mount.hidden = true;
        mount.innerHTML = '';
        panes.forEach(function (p) { p.el.hidden = !p.on(); });
        (cfg.chrome || []).forEach(function (c) { c.hidden = false; });
        if (top) { window.scrollTo(0, top); top = 0; }
        return;
      }
      top = window.pageYOffset || 0;
      panes.forEach(function (p) { p.el.hidden = true; });

      mount.innerHTML = '<div class="toolbar">'
        + '<button class="act ghost" type="button" id="dback">← 목록으로</button>'
        + '<span class="count">'
        + A.esc(found.label || (A.fmtDate(found.date) + ' 조간')) + '</span></div>'
        + (cfg.render ? cfg.render(found) : A.detailHTML(found.x, { date: found.date }));
      mount.hidden = false;
      window.scrollTo(0, 0);

      if (b) {
        b.addEventListener('click', function () {
          if (history.length > 1) { history.back(); } else { location.hash = ''; }

    window.addEventListener('hashchange', paint);

    return paint;
  };

  /* 예전 이름. 휴머노이드 화면 몇 곳이 A.srcLinks 로 부르고 있어 이어 둔다.

  A.srcLinks = function (x) { return A.srcHTML(x); };

  /* 클립보드. file:// 나 비 HTTPS 에서는 API 가 막힌다.

  A.copy = function (el, msgEl) {
    var txt = el.textContent;

      try {

        done('자동 복사가 막혀 있습니다. 선택된 영역을 Ctrl+C 로 복사하세요.');

        .then(function () { done('복사했습니다. 카톡에 붙여넣으세요.'); })
        .catch(fallback);
    } else { fallback(); }
  };

  /* 공통 머리·꼬리. 페이지마다 같은 마크업을 복사하지 않게 한다. */

window.HMD.editions = [{"date": "2026-09-14", "items": [{"sec": 2, "t": "中 유니트리, 자율 판단을 내세운 휴머노이드 격투 영상 공개", "k": "새 제어 모델을 적용했으나 시행 횟수와 편집 여부는 공개되지 않았다", "ez": "중국 로봇기업 유니트리가 휴머노이드 G1 에 새 제어 모델을 적용해 사람과 겨루는 격투 영상을 공개했다. 회사는 로봇이 상대의 움직임을 보고 다음 동작을 스스로 정하는 방식이며, 미리 만들어 둔 동작을 재생하거나 사람이 조종기로 조작한 것이 아니라고 설명했다. 영상 속 로봇은 주먹과 발차기를 내고 상대의 공격을 피한 뒤 반격하며 스스로 자리를 옮긴다. 다만 공개된 자료는 영상 한 편뿐이다. 같은 시연을 몇 번 했는지, 몇 번 성공했는지, 영상을 편집하거나 빠르게 돌렸는지, 상대의 동작이 미리 정해진 것인지는 공개되지 않았다. 로봇이 넘어지거나 실패한 장면도 영상에 담기지 않았다.", "body": "중국 유니트리가 휴머노이드 G1 에 새 제어 모델 유니폴름 X2-1.0 을 적용해 사람과 겨루는 격투 영상을 공개했다고 보도됨, 회사는 인공지능이 주변 상황을 인식하고 이어질 상황을 실시간으로 예측해 다음 행동을 스스로 결정하는 방식이며 사전 프로그래밍된 동작이나 사람의 원격조종이 아니라고 설명했고 완전 자율 방식의 휴머노이드 격투는 세계 최초라고 주장한 것으로 전해짐, 영상에서 기체는 주먹과 발차기를 내고 상대 공격을 피한 뒤 반격하며 스스로 이동함, 다만 공개된 것은 영상 한 편이고 시행 횟수와 성공률, 편집·배속 여부, 상대의 동작이 사전에 정해진 것인지, 넘어짐이나 실패 장면이 포함됐는지가 제시되지 않아 자율성과 성능의 근거로 쓰지 않음, 회사 공식 뉴스센터를 직접 열어 최신 게시가 8월 5일이고 이번 격투 영상 발표가 올라와 있지 않음을 확인했으므로, 중국어 발표가 영문 뉴스센터에 오르지 않는 경우로 보고 중국 로봇 전문 포털의 보도를 출처로 삼음, 이 건은 오늘 지면의 균형 축에 해당함 — 같은 날 지면의 초도 물량 완판과 현장 투입 항목과 나란히 읽으면 기체와 판매는 앞서가는데 동작의 자율성을 검증할 공개 절차는 그대로 비어 있음이 드러남", "src": "전자신문 9.11 · 로봇신문 9.13", "pd": "2026-09-11", "url": "https://www.etnews.com/20260911000189", "url2": "https://www.irobotnews.com/news/articleView.html?idxno=48454"}, {"sec": 2, "t": "인티그리트, 피지컬 AI 플랫폼 공급처를 개발자 시장까지 확대", "k": "누적 공급 1,200대를 넘겼고 신형은 초당 100조 회 연산을 낸다", "ez": "국내 기업 인티그리트가 로봇용 소프트웨어 플랫폼 에어패스를 기업과 개발자에게 개방하고 판매 경로를 넓힌다고 밝혔다. 이 플랫폼은 제조사가 서로 다른 로봇들을 하나의 인공지능·데이터 체계로 묶어 움직이게 하는 역할을 한다. 누적 공급 대수는 1,200대가 넘는다. 연산 성능은 구형이 초당 최대 48조 회, 신형이 초당 최대 100조 회다. 함께 쓰이는 인공지능 모델은 눈으로 보고 말을 알아들어 동작으로 옮기는 방식이며, 기기에 바로 적용할 수 있도록 크기를 줄인 판이다. 실제 적용된 곳으로는 반도체 공장에서 쓰이는 네발로봇과 인천국제공항의 셀프 체크인 서비스 로봇이 제시됐다. 다만 1,200대가 판매 기준인지 실제 가동 기준인지는 구분되지 않았다.", "body": "국내 기업 인티그리트가 피지컬 AI 플랫폼 에어패스를 기업과 개발자 시장에 개방하고 유통 채널을 넓힌다고 보도됨, 누적 공급 대수는 1,200대 이상으로 제시됐고 연산 성능은 V4 가 초당 최대 48조 회, V5 가 초당 최대 100조 회로 밝혀졌으며 함께 쓰이는 시나AI 는 50억·80억 개 변수 규모의 경량 시각언어행동 모델 기반으로 설명됨, 유통은 엘레파츠·디바이스마트·아이씨뱅큐 등 부품 유통 채널을 통해 넓히고, 적용 사례로는 반도체 생산 현장의 사족보행 로봇과 인천국제공항의 셀프 체크인 서비스 로봇이 제시됨, 허석영 상무는 여러 대의 서로 다른 기종을 공통의 인공지능·데이터·임무 체계로 연결하는 실행 플랫폼을 지향한다고 말한 것으로 전해짐, 다만 1,200대의 성격이 누적 판매인지 설치 가동인지 구분되지 않았고 사례별 도입 대수와 도입처의 평가 결과, 개방의 범위와 가격 정책이 제시되지 않아 실적으로 단정하지 않음, 회사 공식 사이트와 RSS 를 직접 열어 최신 게시가 9월 1일자 플랫폼 소개 글이고 이번 공급 확대 공지가 없음을 확인했으므로 회사가 따로 발표하지 않은 경우로 보고 보도를 출처로 삼음", "src": "로봇신문 9.13", "pd": "2026-09-13", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48453"}, {"sec": 2, "t": "日 APTO, 도쿄에 실물 로봇 데이터 수집 거점 개설", "k": "휴머노이드 200대와 작업 인원 400~500명으로 30만 시간을 모은다", "ez": "일본 인공지능 데이터 기업 APTO 가 도쿄 도요스에 실물 로봇으로 학습 자료를 모으는 전용 시설을 열었다. 로봇이 사람처럼 움직이려면 사진과 글만으로는 부족하고, 로봇이 실제로 움직인 기록과 카메라·센서가 읽은 값, 주변 환경과 부딪친 결과를 함께 모아야 한다. 이 시설은 그런 자료를 모으고 다듬는 일을 맡는다. 사람이 원격으로 로봇을 조종해 동작을 만들고, 어떤 환경에서 모을지 설계하며, 모은 자료에 이름표를 붙이고 품질을 평가하는 과정이 한자리에서 이뤄진다. 보도에 따르면 휴머노이드 200대를 두고 교대 인원까지 400~500명이 일하며, 면적은 약 1,700제곱미터로 2027년 상반기에 1,000제곱미터를 더 넓힌다. 모으려는 자료는 누적 30만 시간이다. 개소식에는 일본 중의원·참의원 의원과 엔비디아, 도요타자동차 관계자가 참석했다.", "body": "일본 인공지능 데이터 기업 APTO 가 피지컬 AI 개발에 필요한 실물 로봇 데이터 수집 거점 도요스 데이터 팩토리를 도쿄에 열었음, 회사 공지 원문을 직접 열어 확인한 결과 개소식은 8월 21일에 열렸고 공지 게시일은 9월 10일이며 국내 보도는 9월 13일이 처음이어서 국내 첫 도달로 다룸, 개소식 참석자는 APTO 다카시나 료 대표와 참의원 의원이자 로봇의원연맹 사무국장인 야마다 다로, 중의원 의원이자 로봇의원연맹 회장인 야마기와 다이시로, 엔비디아 로보틱스사업부장 히라노 가즈마사, 도요타자동차 미래창생센터 쓰치나가 마사요시로 확인됨 — 의원연맹 회장과 사무국장이 함께 선 자리임, 규모는 8월 28일자 보도에서 휴머노이드 200대와 교대를 포함한 작업 인원 400~500명, 현재 면적 약 1,700제곱미터에 2027년 상반기 약 1,000제곱미터 추가 확장, 누적 수집 목표 30만 시간으로 제시됐으며 이 수치는 회사 공지가 아니라 보도에 근거하므로 확정된 계획으로 읽지 않음, 수집하는 자료는 1인칭 시점 영상과 로봇 팔의 관절 각도·위치, 영상·깊이 정보를 결합한 모방학습용 다중 양식 자료이고, 회사는 실물 로봇 데이터 수집에 설비뿐 아니라 원격조작과 수집 환경 설계, 라벨링, 품질 평가 같은 운영 역량이 필요하다고 밝히며 대응 가능한 로봇과 작업, 데이터 종류를 순차적으로 넓혀 학습·평가로 이어지는 데이터 파이프라인을 세우겠다고 적음, 다만 투자액과 로봇 기종 구성, 이미 모은 시간은 공개되지 않음", "src": "APTO 공지 9.10 · 로봇신문 9.13 · 비즈니스인사이더재팬 8.28", "pd": "2026-09-10", "url": "https://apto.co.jp/news/3945/", "url2": "https://www.irobotnews.com/news/articleView.html?idxno=48413", "url3": "https://www.businessinsider.jp/article/2608-atom-ai-robot-data-factory-toyosu/"}, {"sec": 3, "t": "中 제로스, 100만 원대 소형 휴머노이드 초도 물량 소진", "k": "8,888위안 기체 1,000대가 출시 일주일 안에 모두 팔렸다", "ez": "중국 로봇기업 제로스가 내놓은 소형 휴머노이드 브릿지 1,000대가 출시 일주일이 되기 전에 모두 팔렸다. 가격은 8,888위안, 우리 돈으로 약 177만 원이다. 중국 온라인 쇼핑몰 징둥닷컴에서 팔았고 첫날에만 600대가 나갔다. 키는 88센티미터, 무게는 약 13킬로그램이다. 관절이 낼 수 있는 힘은 최대 50뉴턴미터이며, 그 힘을 얼마나 정확히 조절하는지를 나타내는 오차는 3% 이하라고 회사는 밝혔다. 회사는 1만 위안 아래 가격으로 나온 세계 첫 고성능 휴머노이드라고 설명했고, 이 제품은 베를린 국제가전박람회에서 차세대 기술 부문 최고상을 받았다. 다만 1,000대가 예약을 받은 수인지 실제로 보낸 수인지는 구분되지 않았다.", "body": "중국 제로스가 내놓은 소형 휴머노이드 브릿지 1,000대가 출시 일주일이 되기 전에 모두 팔렸다고 보도됨, 가격은 8,888위안(약 177만 원)이고 판매처는 징둥닷컴이며 첫 판매일에 600대가 나갔다고 전해짐, 사양은 키 88센티미터, 무게 약 13킬로그램, 최대 토크 50뉴턴미터, 토크 제어 정확도 3% 이하로 제시됐고 회사는 1만 위안 아래 세계 첫 고성능 휴머노이드라고 내세웠으며 베를린 국제가전박람회 2026 의 차세대·신흥기술 부문 최고상을 받은 것으로 전해짐, 다만 1,000대가 예약 접수인지 실제 출하인지 구분되지 않았고 인도 시점과 연간 생산능력, 토크와 제어 정확도를 어떤 조건에서 측정했는지가 제시되지 않아 성능과 실적의 근거로 쓰지 않음, 회사 발표 원문을 확인하지 못해 2차 자료에 근거함, 대수는 층위가 다른 숫자이므로 판매 1,000대를 가동 대수로 읽지 않음", "src": "로봇신문 9.11", "pd": "2026-09-11", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48450"}, {"sec": 4, "t": "中 선전, 우편 분류와 물류 운반에 휴머노이드 현장 투입", "k": "소포 분류는 시간당 1,200개, 운반 성공률은 95.8%로 제시됐다", "ez": "중국 선전의 세 현장에 휴머노이드가 실제 업무로 투입됐다. 선전시 우편물 처리센터에서는 워넝쥐선이 만든 H007 이 소포를 집어 뒤집고 제자리에 놓는 일을 맡는다. 시간당 최대 1,200개를 처리하며 정확도는 95%를 넘는다고 제시됐다. 하이체인로지스틱스 물류창고에서는 러쥐로보틱스의 로봇이 짐받이에서 컨베이어로 물건을 옮기는 일을 한다. 성공률은 95.8%, 한 번 처리하는 데 평균 28초가 걸리며 8시간 동안 이어서 움직였다. 선전 지하철 9호선 쳰완역에서는 편의점 물건을 채우는 일에 쓰이며, 엘리베이터 앞으로 스스로 가서 기다렸다가 타는 동작을 한다. 다만 몇 대가 투입됐는지, 사람이 얼마나 개입했는지는 공개되지 않았다.", "body": "중국 선전에서 휴머노이드가 세 곳의 현장 업무에 투입됐다고 보도됨, 선전시 우정 육상운송 우편물 처리센터에는 워넝쥐선의 소포 분류 로봇 H007 이 들어가 소포를 집고 뒤집어 놓는 작업을 맡았으며 시간당 최대 1,200개를 분류하고 정확도는 95% 이상으로 제시됨, 하이체인로지스틱스 물류창고에는 러쥐로보틱스의 기체가 팔레트에서 컨베이어로 옮기는 고빈도 운반 라인에 투입돼 성공률 95.8%, 평균 28초 주기로 8시간 연속 가동했다고 전해짐, 선전 지하철 9호선 쳰완역에서는 편의점 재고를 채우는 작업에 투입돼 엘리베이터에 스스로 접근하고 기다렸다가 탑승하는 동작을 수행했다고 설명됨, 다만 세 현장 모두 투입 대수와 운영 기간, 자율 동작인지 원격조작이 섞였는지, 고장·정지 횟수와 사람이 개입한 비율이 공개되지 않았고 기업·기관의 발표 원문을 확인하지 못해 2차 자료에 근거하므로 가동 실적으로 단정하지 않음, 성공률 95.8%는 평가 구간과 대상 물품이 밝혀지지 않아 다른 현장의 수치와 비교하지 않음", "src": "로봇신문 9.11", "pd": "2026-09-11", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48447"}, {"sec": 4, "t": "中 선전 공안, 휴머노이드 투입한 로봇 파출소 운영", "k": "지난 7월 실전 배치했고 촬영 영상을 지휘센터로 실시간 보낸다", "ez": "중국 선전시 공안국 룽강분국의 반톈 파출소가 지난 7월부터 로봇을 실제 치안 업무에 투입하고 있다. 배치된 장비에는 사람 모양의 휴머노이드를 비롯해 여러 형태의 로봇과 무인 장비가 포함된다. 맡은 일은 이상 행동을 찾아내는 것, 실종되거나 연락이 끊긴 사람을 수색하는 것, 긴급 상황에 먼저 도착해 대응하는 것이다. 로봇이 찍은 영상은 경찰 지휘센터로 곧바로 전달되며, 판단과 지시는 경찰이 내린다. 로봇이 혼자 결정해 조치하는 구조는 아니다. 순찰에 쓰이는 휴머노이드는 중국 엔진AI 가 만든 T800 이다. 다만 몇 대가 배치됐는지, 하루에 몇 시간 움직이는지, 투입한 뒤 실제로 어떤 성과가 있었는지는 공개되지 않았다.", "body": "중국 선전시 공안국 룽강분국 반톈 파출소가 지난 7월 로봇 경찰서를 정식으로 실전 업무에 투입했다고 보도됨, 배치된 장비는 휴머노이드를 포함한 여러 형태의 로봇과 무인장비이며 맡은 일은 이상 행동 식별과 실종·연락두절자 수색, 긴급 상황 대응 셋으로 제시됨, 운영 방식은 로봇이 촬영한 영상을 경찰 지휘센터로 실시간 전송하고 경찰이 지시를 내리는 협업 체계로 설명돼 로봇이 단독으로 판단해 조치하는 구조는 아님, 순찰에 투입된 기체는 중국 엔진AI 가 개발한 휴머노이드 T800 으로 전해짐, 다만 배치 대수와 순찰 구역의 범위, 하루 가동시간과 충전 주기, 투입 뒤의 검거·수색 실적과 오인 식별 사례가 공개되지 않았고 공안국 발표 원문을 확인하지 못해 2차 자료에 근거하므로 성과로 읽지 않음, 투입 시점이 지난 7월이나 국내 보도는 9월 11일이 처음으로 확인돼 새로 알려진 사실로 다루되 신규성 점수를 낮춤", "src": "전자신문 9.11", "pd": "2026-09-11", "url": "https://www.etnews.com/20260911000315"}, {"sec": 5, "t": "국내 로봇기업, 美 FCC 장비인증 금지로 대미 수출 계약 중단", "k": "레인보우로보틱스 수십 대와 티로보틱스 150억 원 공급이 함께 걸렸다", "ez": "미국이 외국에서 만든 이동형 로봇에 새 장비인증을 내주지 않기로 하면서 국내 로봇기업의 미국 판매가 막혔다. 미국에서 전자기기를 팔려면 연방통신위원회의 장비인증을 먼저 받아야 하는데, 7월 28일부터 휴머노이드와 네발로봇, 자율주행로봇처럼 스스로 움직이며 통신 기능을 갖춘 외국산 기기가 이 인증 대상에서 빠졌다. 이미 인증을 받은 기종과 소비자가 이미 구입한 제품, 연방정부가 사는 물량은 그대로 유지되며 기존 기기의 소프트웨어 갱신도 2029년 1월 1일까지 허용된다. 막힌 것은 아직 인증을 받지 않은 새 기종이다. 레인보우로보틱스는 북미 고객과 맺은 수십 대 규모의 수출이 중단됐고, 티로보틱스는 포드 에너지에 2028년 6월까지 약 150억 원어치를 공급하기로 한 계약이 이 규제에 걸려 있다. 예외를 인정받으려면 2028년 1월 1일까지 미국 전쟁부에 신청해야 한다. 요구 서류에는 부품별 원산지를 담은 부품표와 국가별 공급망 집중도, 미국 내 제조를 넓히겠다는 시한 명시 계획이 들어간다.", "body": "미국 연방통신위원회가 7월 28일 외국에서 생산된 첨단 로봇기기를 우려목록에 올려 신규 장비인증을 금지한 조치가 국내 로봇기업의 대미 수출을 막고 있다고 보도됨, 공고문(DA 26-786)과 조건부 승인 지침(Annex A), 후속 공고(DA 26-789)를 직접 열어 확인한 제도의 내용은 이러함 — 백악관이 소집한 행정부 부처 합동기구가 7월 27일 보낸 국가안보 판정에 따른 조치이고, 판정문은 외국산 첨단 로봇기기가 공급망 취약성과 사이버안보 위험을 만든다고 적었으며, 미국 전쟁부가 조건부 승인을 내준 기기만 예외이고, 이미 인증받은 기종의 수입·판매와 소비자가 이미 구입한 기기, 연방정부의 구매·사용은 적용 대상이 아니며, 기존 인증 기기의 소프트웨어·펌웨어 갱신은 최소 2029년 1월 1일까지 허용됨, 막히는 것은 인증을 아직 받지 않은 신규 기종의 수입·유통·판매임, 대상은 공고문이 휴머노이드와 사족보행 로봇을 예로 든 이동형 로봇이며 관절형·직교좌표형 같은 고정식 산업용 로봇은 국제로봇연맹 자료에서 제외 대상으로 정리됨, 조건부 승인은 지침 원문에 신청 마감이 2028년 1월 1일로 명시돼 있고, 요구 자료는 지배구조(5% 이상 실질소유자·이사와 경영진의 국적과 거주국·외국정부의 지분과 영향력), 부품표 전체와 부품별 원산지, 설계 원산지, 지식재산권 소유자와 소프트웨어 갱신 주체, 제조·최종조립·시험 장소, 온보드 소프트웨어와 펌웨어의 원산지, 국가별 공급망 집중도를 가치와 생산량 백분율로 낸 평가, 단일 공급처와 그 대체계획, 그리고 미국 내 제조를 세우거나 넓히는 시한 명시 계획과 분기별 진도 보고임, 국내 보도가 전한 미국산 부품 65% 이상과 2029년부터 75%라는 요건은 지침 원문에서 확인되지 않음 — 그 비율은 연방조달규정의 국산품 판정 기준이고 공고문에서는 무인기 예외 조항에 붙어 있으므로 로봇 조건부 승인의 요건으로 옮겨 쓰지 않고 미확정 사항으로 등록함, 국내 영향으로는 레인보우로보틱스의 RB-Y1 미국 수출이 멈춰 북미 고객과 맺은 수십 대 규모 계약이 중단됐고 티로보틱스가 포드 에너지와 맺은 2028년 6월까지 약 150억 원 규모 무인운반차 공급 계약이 걸려 있으며 국내 자율주행로봇 업체 한 곳은 첫 미국 수주 직후 규제를 만났다고 보도됨", "src": "전자신문 9.11 · FCC 공고문 7.28 · FCC 조건부 승인 지침 7.27", "pd": "2026-09-11", "url": "https://www.etnews.com/20260911000247", "url2": "https://docs.fcc.gov/public/attachments/DA-26-786A1.pdf", "url3": "https://www.fcc.gov/sites/default/files/robots-ca.pdf"}, {"sec": 5, "t": "日 화낙·구글, 도면 읽고 용접 조건 정하는 로봇 에이전트 개발", "k": "태블릿으로 찍은 종이 도면에서 전류와 속도를 읽어 12월 구독형으로 나온다", "ez": "일본 공작기계 기업 화낙과 구글이 함께 만든 인공지능 용접 도우미가 12월에 나온다. 태블릿 카메라로 종이 도면을 찍으면 어디를 용접해야 하는지, 전류와 전압은 얼마로 하고 얼마나 빠르게 움직여야 하는지를 인공지능이 읽어 낸다. 그러면 로봇이 필요한 동작을 스스로 판단해 실행한다. 지금까지는 숙련공이 그 조건을 하나씩 입력해야 했다. 이 제품은 구글의 기업용 인공지능을 바탕으로 만들었고, 안전 울타리를 세우지 않아도 되는 협동로봇에 붙여 쓴다. 주된 대상은 사람을 구하기 어려운 작은 제조업체다. 매달 요금을 내는 구독 방식으로 제공되며 금액은 공개되지 않았다. 도면 자료가 밖으로 새지 않게 막는 기능도 들어간다.", "body": "일본 화낙과 미국 구글이 인공지능 용접 에이전트를 공동 개발해 12월 출시한다고 보도됨, 작동 방식은 태블릿 카메라로 종이 도면을 촬영하면 용접 위치와 전류·전압·속도 같은 조건을 자동으로 읽어 내고 로봇이 필요한 동작을 스스로 판단해 실행하는 구성이며 사용자가 프로그래밍 지식 없이 조작할 수 있다는 점이 내세워짐, 기반 모델은 구글의 제미나이 엔터프라이즈이고 기체는 안전 펜스가 필요 없는 협동로봇 기반으로 설계돼 영세·중소 제조업체를 주된 대상으로 삼음, 제공 방식은 구독형이며 요금은 공개되지 않았고 도면 데이터가 외부로 새지 않게 하는 기능이 포함된다고 설명됨, 다만 판독 정확도와 대응 가능한 도면 형식, 용접 재질과 두께의 범위, 실제 시험 현장과 시행 횟수가 제시되지 않아 성능을 단정하지 않음, 원 보도가 니혼게이자이 9월 11일자인데 유료 지면이어서 본문을 대조하지 못했고 화낙 공식 발표도 확인하지 못해 2차 자료에 근거함", "src": "로봇신문 9.13", "pd": "2026-09-13", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48436"}, {"sec": 5, "t": "에이딘로보틱스, 조선·중공업용 로봇핸드 공동개발 조건으로 투자 유치", "k": "투자 160억 원을 받아 센서 연 3만 대 양산 체계로 넘어간다", "ez": "국내 센서 기업 에이딘로보틱스가 HD현대로보틱스와 삼성벤처투자로부터 160억 원을 투자받았다. 이 회사는 로봇이 물체에 닿을 때 걸리는 힘과 방향을 읽어 내는 힘·토크 센서와 촉각 센서를 만든다. 로봇이 물건을 얼마나 세게 쥐었는지, 밀리고 있는지를 알려면 이런 센서가 필요하다. 2019년 성균관대 연구실에서 갈라져 나와 세운 기업이다. 이번 투자는 단순한 자금 조달이 아니라 함께 만들 물건이 정해져 있다. 배 바깥판과 블록의 용접 부위를 다듬는 표면처리 로봇을 HD현대로보틱스와 함께 개발해 조선소에 넣고, HD현대로보틱스가 만들고 있는 휴머노이드에 실을 조선·중공업용 고중량 다섯 손가락 로봇손도 함께 개발한다. 힘·토크 센서는 한 해 3만 대를 만들 수 있는 체계를 갖출 계획이다. 다만 로봇손의 들어올림 무게와 관절 수, 양산 시점은 공개되지 않았다.", "body": "국내 센서 기업 에이딘로보틱스가 HD현대로보틱스와 삼성벤처투자로부터 160억 원 규모의 전략적 투자를 받았다고 보도됨, 회사는 2019년 성균관대 로보틱스 연구실에서 갈라져 나와 이윤행 대표와 최혁렬 교수가 함께 세웠고, 로봇이 물체에 닿을 때 생기는 힘을 읽는 힘·토크 센서와 촉각 센서, 그 값으로 접촉력을 조절하는 제어 소프트웨어와 표면가공 자동화 솔루션을 공급함, 이번 투자로 제시된 것은 셋임 — 선체 외판과 블록 용접부를 가공하는 표면처리 로봇 자동화 솔루션을 HD현대로보틱스와 공동 개발해 조선소에 적용하고, HD현대로보틱스가 개발 중인 휴머노이드에 실을 조선·중공업 특화 고중량 5지 로봇핸드를 함께 개발하며, 힘·토크 센서의 연간 생산능력을 3만 대 규모로 올림, 판로는 국내 제조업 전반과 미국 조선업을 포함한 해외로 넓힌다는 계획이 함께 제시됐고, 2024년 시리즈B 에는 삼성넥스트·포스코기술투자·CJ대한통운·한국투자파트너스·GS벤처스·코오롱인베스트먼트·DSC인베스트먼트·BNK벤처투자·퓨처플레이가 참여했으며 2025년 삼성전자 씨랩 아웃사이드에 선정된 바 있음, 다만 누적 투자유치액과 이번 라운드의 기업가치, 로봇핸드의 가반하중과 자유도, 양산 착수 시점과 조선소 적용 일정은 제시되지 않아 확정된 거래 구조로 읽지 않음, 회사 뉴스룸과 블로그 목록을 직접 열어 최신 게시가 9월 10일이고 이번 투자 공지가 없음을 확인했으므로 발표가 없어서 2차 자료를 쓰는 경우임, 이 건은 직전 호가 다룬 촉각 데이터 병목과 같은 줄기에 있음 — 그쪽이 데이터의 부족을 짚었다면 이 건은 그 데이터를 만들어 내는 센서의 공급 쪽임", "src": "로봇신문 9.11 · 파이낸셜뉴스 9.11", "pd": "2026-09-11", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48428", "url2": "https://www.fnnews.com/news/202609101508002163"}, {"sec": 7, "t": "[인터뷰] 로브로스, 하드웨어와 인공지능을 함께 개발하는 이유 밝혀", "k": "키 154센티미터 기체의 핵심 부품 60%를 직접 설계해 만든다", "ez": "국내 휴머노이드 기업 로브로스의 김승연 최고기술책임자가 로봇의 몸과 인공지능을 처음부터 함께 만드는 방식을 택한 이유를 설명했다. 인공지능이 현실에서 일을 하려면 몸이 필요하고, 몸이 아무리 좋아도 인공지능이 없으면 제 기능을 하지 못한다는 것이다. 대표 기체인 두 발로 걷는 휴머노이드 이그리스-C 는 키 154센티미터, 무게 56킬로그램이다. 회사는 핵심 부품의 60%를 직접 설계해 생산한다. 기체마다 품질이 달라지지 않게 하기 위해서다. 손은 사람처럼 다섯 손가락이지만 힘을 내는 장치를 손이 아니라 팔뚝에 두고 줄로 당기는 구조를 썼다. 세밀한 움직임보다 공장에서 견디는 힘을 앞에 둔 선택이다. 지금은 사람이 원격으로 조종하며 현장 데이터를 모으는 단계이며, 검증이 끝난 뒤 양산에 들어갈 계획이다.", "body": "국내 휴머노이드 기업 로브로스의 김승연 최고기술책임자가 하드웨어와 인공지능 제어 모델을 처음부터 함께 개발하는 방식을 택한 배경을 밝힌 것으로 보도됨, 김 최고기술책임자는 서울대에서 로봇공학 박사 학위를 받은 뒤 삼성전자 종합기술원을 거쳤고 인공지능이 현실 세계로 나오려면 하드웨어라는 플랫폼이 필요하고 반대로 하드웨어가 우수해도 인공지능 없이는 제 기능을 하지 못한다고 말함, 대표 기체인 이족보행 휴머노이드 이그리스-C 는 키 154센티미터에 무게 56킬로그램이며 기구 설계부터 제어 알고리즘과 인공지능 소프트웨어까지 자체 개발했다고 설명됨, 핵심 부품의 60%를 직접 설계해 생산해 기체마다 품질이 갈리지 않게 한다는 점과, 손은 사람과 같은 다섯 손가락으로 두되 구동장치를 손이 아니라 팔뚝에 두고 줄로 당기는 방식을 써서 미세 정밀도보다 산업 현장의 힘과 내구성을 앞에 뒀다는 점이 함께 제시됨, 현재는 원격조작으로 산업 현장 데이터를 모으는 실증을 진행하는 중이고 검증을 마친 뒤 양산에 들어간다는 순서가 제시됐으며 후속 기체는 크기를 키우고 배터리를 교체하는 방식으로 연속 가동을 늘린다는 계획이 밝혀짐, 다만 실증의 현장과 기간, 수집한 데이터의 규모와 양산 시점, 투자 유치 규모는 제시되지 않음, 이 항목은 지정 매체의 인터뷰이므로 보도를 출처로 삼음", "src": "머니투데이 9.13", "pd": "2026-09-13", "url": "https://www.mt.co.kr/future/2026/09/13/2026082615090620714"}, {"sec": 8, "t": "DGIST·KAIST, 사람 움직임 예측과 경로 계획을 한 모델에 담아", "k": "두 기능의 학습 영역을 갈라 이동 경로 오차와 충돌 가능성을 낮춘다", "ez": "DGIST 박대희 교수 연구팀이 KAIST 와 함께 로봇이 사람 많은 곳을 다닐 때 필요한 두 가지 일을 하나의 작은 인공지능 모델로 처리하는 방법을 내놓았다. 두 가지란 주변 사람이 앞으로 어디로 갈지 예측하는 일과, 그 사람들을 피해 갈 길을 정하는 일이다. 지금까지는 각각 다른 모델을 써야 했고, 그러면 계산 장치와 메모리가 많이 들어 로봇에 싣기 어려웠다. 그렇다고 하나로 합치면 모델 안에서 두 기능이 같은 공간을 서로 차지하려 다투면서 양쪽 성능이 모두 떨어졌다. 연구팀은 기능마다 학습하는 영역을 미리 갈라 두는 방식으로 이 문제를 줄였다. 공개된 로봇 이동 자료로 시험한 결과 사람의 움직임을 더 정확히 예측했고 경로 오차와 충돌 가능성도 줄었다. 이 연구는 컴퓨터비전 분야 국제학회 ECCV 2026 에서 발표됐다.", "body": "DGIST 전기전자컴퓨터공학과 박대희 교수 연구팀이 KAIST 연구팀과 함께 주변 사람의 이동 경로를 예측하는 일과 로봇이 부딪치지 않을 경로를 계획하는 일을 하나의 소형 인공지능 모델에서 동시에 수행하게 하는 학습 기법을 내놓았다고 보도됨, 두 일을 각각 다른 모델로 나누면 연산 자원과 메모리가 더 들어 실제 로봇에 싣기 어렵다는 점이 출발점이고, 한 모델에 여러 기능을 넣으면 내부에서 자원을 다투는 이른바 스킬 충돌이 일어나 양쪽 성능이 함께 떨어진다는 문제가 함께 제시됨, 연구팀은 기능별로 학습하는 매개변수 영역을 갈라 두는 분리형 파라미터 학습과 희소 병합을 결합해 이 충돌을 줄였다고 설명함, 검증에는 로봇 이동 분야의 공개 자료인 JRDB 와 JTA 가 쓰였고 기존 방식보다 사람의 움직임을 더 정확하게 예측하면서 로봇의 이동 경로 오차와 충돌 가능성도 낮췄다고 제시됨, 논문 제목은 「Unified Prediction and Planning via Conflict-Aware Disjoint Parameter Training」 이며 컴퓨터비전 분야 국제학회 ECCV 2026 에 채택돼 9월 10일부터 12일까지 스웨덴 말뫼에서 발표됐고 제1저자는 서태원 석사과정생, 공저자로 전선애 학부연구생이 참여했으며 연구는 엔비디아 아카데믹 하드웨어 그랜트의 지원을 받음, 다만 모델의 크기와 개선 폭의 수치, 실기 기체에 실어 시험했는지, 시행 횟수와 무작위 시드 수가 제시되지 않아 성능 폭을 단정하지 않고 검증은 공개 데이터셋 기준으로만 읽음, DGIST 보도자료 게시판을 직접 열어 게시물 제목과 등록일을 확인한 결과 최신이 9월 10일자 두 건이고 창 안에 올라온 게시물이 없어, 기관이 언론에 배포하고 자체 게시판에는 올리지 않은 경우로 보고 2차 자료를 출처로 삼음", "src": "로봇신문 9.11 · 인공지능신문 9.11", "pd": "2026-09-11", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48451", "url2": "https://www.aitimes.kr/news/articleView.html?idxno=41871"}, {"sec": 8, "t": "美 UC버클리·스탠퍼드, 휴머노이드 전신 제어 학습틀 발표", "k": "공중제비와 회전 발차기를 하나의 설정으로 익혀 실기에 추가 학습 없이 옮겼다", "ez": "미국 UC버클리와 스탠퍼드대 연구진이 사람의 동작을 배운 휴머노이드가 배우지 않은 일까지 해내게 하는 학습 방법을 내놓았다. 방법은 두 단계다. 먼저 걷기와 달리기, 공중제비, 회전 발차기 같은 사람의 동작을 하나의 학습 설정으로 따라 배우게 한다. 이어 그렇게 익힌 동작들을 확산 모델로 묶어 필요할 때 꺼내 섞어 쓰게 한다. 확산 모델은 흐릿한 상태에서 시작해 조금씩 다듬어 결과를 만드는 방식의 인공지능이다. 그 결과 로봇은 학습할 때 본 적 없는 장애물 피하기, 조이스틱으로 받은 지시 따르기, 끊긴 동작 이어 붙이기를 추가 학습 없이 수행했다. 국내 보도에 따르면 학습에 쓴 사람 동작 자료는 약 2시간 30분 분량이며, 시험에는 유니트리 G1 로봇이 쓰였다. 다만 시도 횟수와 성공률은 공개되지 않았다.", "body": "미국 UC버클리와 스탠퍼드대 연구진이 사람의 동작을 배운 휴머노이드가 학습 때 없던 과제까지 수행하게 하는 학습틀 비욘드미믹을 사이언스 로보틱스 8월 26일자에 실음, 논문은 두 단계로 구성돼 하나의 보상과 관측, 같은 초매개변수 설정으로 여러 동작을 따라 배우는 단계와 그 결과로 얻은 상태·행동 자료 위에 잠재 확산 모델을 학습해 동작을 조합하는 단계로 나뉘고, 초록 기준으로 공중제비와 회전 발차기, 후려차기, 전력 질주 같은 민첩한 동작을 하나의 설정으로 익혔다고 제시됨, 분류기 유도 기법을 적용해 학습 때 접하지 않은 장애물 회피와 조이스틱 원격조작, 동작 메우기 같은 과제를 과제별 추가 학습이나 미세조정 없이 실기 기체에 그대로 옮겼다고 적음, 국내 보도는 학습에 쓴 동작 자료가 약 2.5시간 분량이고 시험 기체가 유니트리 G1 이며 시뮬레이션을 거쳐 실기에 적용했다고 전했으나 이 수치는 사전공개본 초록에 없어 대조하지 못했으므로 보도에 근거한 것으로 두고 단정하지 않음, 저널 본문은 접근이 막혀 열지 못했고 서지 사항은 등록기관 자료로, 방법과 결과는 8월 사전공개본 초록으로 대조함, 제1저자는 UC버클리 랴오치위안이며 UC버클리 코우실 스리나스와 스탠퍼드 캐런 리우가 함께 참여함, 시행 횟수와 성공률, 실패 사례는 초록에 제시되지 않아 성능 폭을 단정하지 않음", "src": "사이언스 로보틱스 8.26 · 로봇신문 9.13", "pd": "2026-08-26", "url": "https://www.science.org/doi/10.1126/scirobotics.adx8924", "url2": "https://www.irobotnews.com/news/articleView.html?idxno=48446"}, {"sec": 8, "t": "中 푸단대 연구진, 깊이 센서가 끊겨도 걷는 휴머노이드 제어 방식 발표", "k": "깊이 신호를 복원하는 인코더 하나로 지각과 맹목을 함께 다룬다", "ez": "중국 푸단대 연구진이 앞을 보는 센서가 망가져도 넘어지지 않고 걷는 휴머노이드 제어 방식을 내놓았다. 휴머노이드가 울퉁불퉁한 바닥을 걸으려면 깊이 카메라로 앞을 미리 봐야 한다. 그런데 실제 현장에서는 이 신호가 완전히 꺼지기보다 부분적으로, 그리고 때때로 망가진다. 지금까지는 신호가 깨끗하다고 가정하거나, 앞을 보는 제어기와 보지 않는 제어기를 따로 만들어 놓고 상황에 따라 바꿔 썼다. 연구진은 하나의 제어기 안에 망가진 깊이 영상을 원래대로 복원하는 부분을 넣고, 깊이 정보 없이도 몸의 자세를 읽는 부분을 함께 두었다. 학습할 때 의도적으로 잡음을 점점 키워 가며 가르쳤다. 시뮬레이션에서 기존 방식과 대등하거나 나았고, 실제 로봇 시험은 조건마다 다섯 번씩 이뤄졌다.", "body": "중국 푸단대를 제1기관으로 하는 연구진이 깊이 센서의 신호가 부분적으로 끊기는 상황에서도 휴머노이드가 걷게 하는 제어 방식 캡(CAP)을 사전공개본으로 냄, 출발점은 실제 배치의 조건임 — 복잡한 지형을 걸으려면 앞을 내다보는 외부 감지가 필요한데 현장에서는 그 신호가 완전히 죽는 것이 아니라 부분적·간헐적으로 망가지며, 기존 지각 기반 정책은 깊이 관측이 깨끗하다고 가정하고 지각과 맹목을 함께 다루려는 시도는 별도 하위 정책을 두고 전환해 왔기 때문에 부분적으로 망가진 깊이 안에 남아 있는 정보를 쓰지 못했음, 연구진은 단일 단계 정책 하나에 월드모델 인코더를 학습된 잡음제거기로 훈련해 손상된 입력에서 깨끗한 깊이를 복원하게 하고, 깊이 없이도 몸의 상태를 주는 고유수용 변분 인코더를 함께 두어 두 신호가 서로를 받치게 함, 학습에는 월드모델 입력에 깊이 잡음 커리큘럼을 거는 결합 방식을 씀, 검증은 시뮬레이션에서 지각 기반 기준선과 대등하거나 개선된 결과를 얻었고 실기 기체 시험은 조건 칸마다 5회씩 수행한 것으로 본문에 적혀 있음, 논문은 로봇 학습 분야 학회 코르엘(CoRL) 2026 에 채택됐다고 밝혔으나 사전공개본은 동료심사 확정 전 단계이므로 등급을 S3 으로 두고 성능 폭을 단정하지 않음, 시행 5회는 조건별 표본으로는 적은 수이므로 성공률의 폭을 인용하지 않음", "src": "Hongjin Chen 외, CoRL 2026 9.11", "pd": "2026-09-11", "url": "https://arxiv.org/abs/2609.11553"}, {"sec": 8, "t": "中 통용인공지능연구원, 사람과 로봇이 같은 외골격 쓰는 수집법 발표", "k": "보정 250회로 접촉 과제 다섯에서 수집 효율을 3배로 올렸다", "ez": "중국 통용인공지능연구원 연구진이 로봇에게 손으로 하는 일을 가르칠 때 쓰는 자료를 더 빠르게 모으는 방법을 내놓았다. 로봇이 물건을 다루는 법을 배우려면 사람이 하는 모습을 많이 보여 줘야 한다. 지금까지는 사람이 장비를 착용해 동작을 기록한 뒤 그 값을 로봇 관절에 맞게 옮겨 적었는데, 아무것도 닿지 않는 허공에서 맞춘 값이라 실제로 물건에 닿는 순간 어긋났다. 연구진은 사람과 로봇에게 똑같은 외골격을 입혔다. 그러면 관절 각도를 재는 장치가 양쪽에서 같은 값을 내고, 외골격에 달린 손목 카메라도 양쪽에서 같은 기구를 본다. 옮겨 적는 과정 자체가 사라지는 것이다. 접촉이 많은 다섯 가지 작업에서 기존 원격조작 방식보다 자료를 세 배 빠르게 모았다.", "body": "중국 통용인공지능연구원 산하 범용인공지능 국가중점연구실을 제1기관으로 하는 연구진이 사람과 로봇에게 같은 외골격을 입혀 손 조작 시연을 모으는 방식 시드유미(SEED-UMI)를 사전공개본으로 냄, 문제로 짚은 것은 손 조작 학습의 병목임 — 접촉이 많은 시연은 모으기 어렵고 모아도 로봇에 그대로 옮겨지지 않는데, 기존 착용형 외골격 방식은 사람 쪽만 기록한 뒤 아무것도 닿지 않는 자유공간에서 맞춘 대응 관계로 로봇 동작을 만들어 내므로 실제로 물체에 닿는 순간 어긋남, 연구진은 사람과 로봇이 같은 외골격을 착용하게 해 관절 각도를 재는 장치가 양쪽에 물리적으로 공유되는 측정값이 되게 하고, 외골격에 붙인 손목 카메라가 사람이 모을 때와 로봇이 실행할 때 같은 바깥 기구를 보게 함, 그 결과 대응 관계를 따로 맞추는 일이 짝지어진 교차 신체 지도학습으로 바뀌고 정책을 외골격 시점의 원본 손목 영상으로 바로 학습시킬 수 있어 영역 분할이나 지워 채우기 같은 후처리가 필요 없다고 적음, 수치는 접촉이 많은 다섯 과제에서 외골격 기반 원격조작 대비 데이터 수집 효율 3.0배이고 짝지어 미세조정할 때 크기·모양이 다른 물체 다섯 종에 각 50회씩 모두 250회의 보정 시연을 쓴 것으로 본문에 적혀 있음, 사전공개본이고 미동료심사 단계이므로 등급을 S3 으로 두고 3.0배의 산정 기준은 원 논문의 비교 조건 안에서만 읽음", "src": "Tengbo Yu 외, arXiv 9.11", "pd": "2026-09-11", "url": "https://arxiv.org/abs/2609.11753"}, {"sec": 8, "t": "加 사이먼프레이저대, 동작 생성 단계를 한 번으로 줄인 제어 모델 발표", "k": "초당 15회이던 추론을 55회로 높여 멈췄다 가는 움직임을 없앴다", "ez": "캐나다 사이먼프레이저대와 미국 펜실베이니아대 연구진이 로봇의 움직임이 끊기는 문제를 푸는 방법을 내놓았다. 요즘 로봇 제어에는 카메라로 보고 말을 알아들어 동작으로 옮기는 인공지능이 쓰인다. 이 모델은 동작 하나를 만들 때 여러 단계를 거쳐 조금씩 다듬는 방식이라 계산이 오래 걸렸고, 그래서 로봇이 움직이다 멈추고 또 움직이는 모습을 보였다. 연구진은 그 여러 단계를 한 번에 끝내는 방식으로 바꿨다. 단순히 평균값 하나만 내면 동작이 한 갈래로 쏠리는데, 새 학습 방법은 여러 갈래를 고루 덮으면서도 단계를 늘리지 않는다. 그 결과 판단 속도가 초당 15회에서 55회로 3.67배 빨라졌다. 실제 로봇 팔로 시험했고, 열 가지 장기 작업에서 50번씩 평균한 값이다.", "body": "캐나다 사이먼프레이저대를 제1기관으로 하고 미국 펜실베이니아대가 함께 참여한 연구진이 시각언어행동 정책의 동작 생성 단계를 한 번으로 줄이는 방식 아이엠엘이(IMLE-VLA)를 사전공개본으로 냄, 짚은 병목은 구조에 있음 — 시각언어행동 정책은 사전학습한 시각언어 뼈대에 연속 동작을 내는 별도 머리를 붙이고 그 머리를 확산이나 흐름정합으로 학습시키는 구성이 주류인데, 이 머리는 동작 하나를 낼 때마다 여러 단계를 되풀이해 표집하므로 추론에서 병목이 생기고 로봇의 움직임이 멈췄다 가는 형태로 나타남, 연구진은 되풀이 표집을 조건부 암시적 최대우도 추정으로 학습한 단일 단계 생성기로 갈아 끼웠고, 이 목적함수가 여러 갈래의 동작을 고루 덮게 해 단순 회귀 머리에서 나타나는 한 갈래로 쏠리는 문제를 피하면서 다단계 표집을 없앴다고 적음, 수치는 기존 정책에 적용했을 때 추론 빈도가 3.67배로 올라 초당 15회에서 55회가 됐고, 이 값은 리베로 장기 과제 10종에 걸쳐 50회씩 평균한 것으로 본문에 적혀 있으며 실기 시험은 프랑카 에미카 로봇 팔에서 수행함, 논문은 지능형 로봇·시스템 국제학술대회 아이로스(IROS) 2026 에 채택됐다고 밝혔으나 사전공개본은 동료심사 확정 전이므로 등급을 S3 으로 둠, 이 건은 직전 호가 다룬 성균관대의 추론 지연 단축과 같은 물음을 다른 방식으로 푼 것임 — 그쪽이 비평가 쪽에 신경망 용량을 몰아주는 구조를 택했다면 이쪽은 표집 횟수 자체를 없앴음", "src": "Kian Hosseinkhani 외, IROS 2026 9.11", "pd": "2026-09-11", "url": "https://arxiv.org/abs/2609.10915"}]}, {"date": "2026-09-11", "items": [{"sec": 2, "t": "촉각 데이터 확보 경쟁, 3만 시간 규모까지 확대", "k": "21개 센서와 80개 기관이 표준 없이 제각기 모으는 중", "ez": "로봇이 물건을 손으로 다루는 일에서 사람을 따라가지 못하는 이유가 촉각 데이터의 부족에 있다는 진단이 나왔다. 촉각 데이터는 로봇이 물체를 쥐거나 문지를 때 손끝에 걸리는 힘과 미끄러짐을 센서로 기록한 자료다. 미국 UC 버클리 연구팀은 이런 자료 100시간을 모아 12개 과제에서 평균 65%의 성공률을 얻었는데, 로봇 한 종류에서만 모았다는 점이 한계로 지적됐다. 중국 칭화대 연구진은 센서 21종과 여러 로봇에서 3,000시간이 넘는 자료를 모았고, 80개 기관이 같은 방식으로 수집하도록 표준을 만드는 작업을 진행하고 있다. 네오테AI 와 푸단대는 3만 시간이 넘는 시연을 모아 규모를 열 배 가까이 키웠다. 다만 기관마다 센서와 수집 방식이 달라 자료를 하나로 합쳐 쓰기는 어려운 상태다.", "body": "로봇의 정밀 조작 성능을 가르는 병목이 알고리즘이 아니라 촉각 데이터의 부족이라는 진단과 함께 주요 연구조직의 수집 규모가 정리돼 보도됨, 미국 UC 버클리 트레버 대럴 연구팀은 전용으로 수집한 촉각 데이터 100시간으로 T-Rex 데이터셋을 만들어 12개 과제에서 평균 성공률 65%를 얻었으나 단일 로봇 하드웨어에서 모았다는 한계가 함께 지적됨, 中 칭화대 연구진은 21개 센서 유형과 여러 로봇 플랫폼을 아우르는 3,000시간 이상을 집계했고 80개 기관이 참여하는 표준화된 수집을 추진하는 중임, 네오테AI 와 푸단대는 자체 센서와 여러 로봇 팔·수동 그리퍼를 써 3만 시간이 넘는 시연을 모아 기존 시도보다 한 자릿수 큰 규모를 만들었고 시각과 촉각을 동기화해 기록함, 남캘리포니아대는 2,700개 시연으로 시각 데이터에서 촉각 정보를 추론하는 모델을 냄, 다만 센서 종류와 수집 방식이 기관마다 달라 데이터를 합쳐 쓰기 어렵다는 점이 공통의 제약으로 제시되고 각 수치의 시행 횟수·평가 조건은 원 논문을 열기 전까지 대조되지 않음, 이 건은 오늘 지면의 균형 축에 해당함 — 기체 공개와 양산 발표가 이어지는 가운데 정밀 조작의 병목이 아직 데이터 층에 남아 있음을 보여주므로 부품·양산 항목과 나란히 읽어야 함", "src": "IEEE 스펙트럼 9.10", "pd": "2026-09-10", "url": "https://spectrum.ieee.org/tactile-data-robots"}, {"sec": 3, "t": "뉴로메카, 포항에 로봇 위탁생산 공장 짓는다", "k": "1단계 400억 원으로 11월 착공해 내년 12월 완공을 목표로 삼는다", "ez": "경상북도와 포항시가 협동로봇 기업 뉴로메카와 포항에 로봇 공장을 짓는 협약을 맺었다고 9월 10일 밝혔다. 협약은 9월 9일 경주에서 체결됐다. 이름에 붙은 파운드리는 반도체에서 온 말로, 설계는 다른 회사가 하고 생산만 맡아 주는 공장을 뜻한다. 이 공장도 뉴로메카가 자기 제품을 만드는 데 그치지 않고 다른 로봇기업의 제품을 대신 만들어 주는 역할을 함께 맡는다. 총사업비는 약 1,800억 원이고, 1단계로 약 400억 원을 들여 포항 영일만일반산업단지에 공장을 세운다. 올해 11월에 착공해 내년 12월 준공하는 일정이다. 경북도는 지역활성화투자펀드로 자금 구조를 만들고 최대 40억 원을 직접 출자한다. 생산 품목으로는 협동로봇과 고중량 산업용 로봇, 휴머노이드, 자율이동로봇이 제시됐다. 연간 몇 대를 만들 수 있는지와 위탁생산을 언제 어느 기업의 제품으로 시작하는지는 공개되지 않았다.", "body": "경상북도가 포항시·뉴로메카와 지역활성화투자펀드를 활용한 로봇파운드리 구축 업무협약을 9월 9일 경주에서 체결하고 10일 이를 알림, 총사업비는 약 1,800억 원이며 1단계로 약 400억 원을 들여 포항 영일만일반산업단지에 신규 공장을 세우고 올해 11월 착공해 내년 12월 준공하는 일정이 제시됨, 2단계 약 1,400억 원은 사업 여건과 관계기관 협의에 따라 단계적으로 추진한다고만 밝혀 착수 시점이 정해지지 않음, 경북도는 지역활성화투자펀드로 자금 구조를 마련하고 최대 40억 원까지 직접 출자해 기업의 투자 부담을 낮춘다고 설명됨, 생산 품목으로는 뉴로메카의 주력인 협동로봇과 함께 고중량 산업용 로봇·휴머노이드·자율이동로봇이 제시됐고 자체 생산시설 확충에 더해 다른 로봇기업의 제품을 위탁생산하는 사업기지 역할을 맡는다는 구상임, 다만 생산능력을 대수로 밝히지 않았고 위탁생산의 수주처와 착수 시점도 제시되지 않아 계획 단계로 읽어야 함, 경북도가 내건 4대 파운드리 구상 가운데 로봇이 첫 사례이며 나머지는 반도체·양자(구미)와 의약품(안동)임, 경상북도 누리집을 직접 열었으나 목록이 자바스크립트로 그려져 보도자료 원문을 확인하지 못했으므로 발표가 없어서가 아니라 확인하지 못해서 2차 자료에 근거하며 다음 순회에서 다시 두드림", "src": "로봇신문 9.10 · 서울신문 9.10", "pd": "2026-09-10", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48416", "url2": "https://www.seoul.co.kr/news/economy/2026/09/10/20260910500123"}, {"sec": 3, "t": "현대모비스, 개발 중인 로봇 관절 구동장치 2종 실물 첫 공개", "k": "용인 연구소에서 18일까지 협력사에 신기술 60여 종과 나란히 선보인다", "ez": "현대모비스가 개발 중인 로봇용 구동장치 두 종류의 실물을 처음 공개했다. 구동장치는 제어기가 보낸 신호를 받아 로봇의 관절을 실제로 움직이는 부품으로, 사람으로 치면 근육에 해당한다. 공개 장소는 9월 10일부터 18일까지 경기 용인 기술연구소에서 열리는 회사 자체 기술 행사이고, 협력사와 업계 관계자가 대상이다. 이 행사는 2년마다 열려 올해가 세 번째이며, 올해 주제는 자동차 부품에서 로봇으로 사업을 넓힌다는 것이다. 전동화와 소프트웨어 중심 차량 기술을 포함해 신기술 60여 종이 함께 전시된다. 다만 두 구동장치가 얼마나 큰 힘을 내는지, 언제 양산에 들어가는지, 가격이 얼마인지는 공개되지 않았다. 회사는 앞서 보스턴다이내믹스의 휴머노이드 아틀라스에 구동장치를 공급하기로 한 바 있다.", "body": "현대모비스가 9월 10일부터 18일까지 경기 용인 기술연구소에서 여는 2026 R&D 테크데이에서 개발 중인 로봇용 구동장치 2종의 실물을 처음 내보임, 구동장치는 제어기의 신호를 받아 로봇의 관절을 움직이는 부품이며 이번 행사의 주제가 모빌리티 부품에서 로보틱스로의 확장으로 제시됨, 행사는 협력사와 업계 관계자를 대상으로 2년마다 열려 올해 세 번째이고 전동화·소프트웨어 중심 차량을 포함한 차세대 신기술 60여 종이 함께 전시됨, 다만 두 기체의 정격 토크·연속 출력·감속비·자유도·중량 같은 사양과 개발 단계, 양산 시점, 단가 구조는 공개되지 않아 성능을 비교할 근거가 없음, 직전 호가 다룬 보스턴다이내믹스 아틀라스용 시제품 납품 준비와는 다른 사실임 — 그쪽은 특정 고객사에 대한 공급 일정이고 이번 건은 개발 중 기체의 실물 공개임, 현대모비스 누리집의 보도자료 목록을 직접 열었으나 본문이 자바스크립트로 그려져 목록을 읽지 못했고 공개 색인에서도 해당 자료를 찾지 못해 발표가 없어서가 아니라 확인하지 못해서 2차 자료에 근거하며 다음 순회에서 다시 두드림", "src": "로봇신문 9.10 · 머니투데이 9.10", "pd": "2026-09-10", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48422", "url2": "https://www.mt.co.kr/industry/2026/09/10/2026091009060920516"}, {"sec": 3, "t": "로보티즈 구동장치, 공급이 주문을 따라가지 못하는 국면", "k": "주문 잔량이 50만 대를 넘고 중국·북미 고객사의 증설 요청이 이어진다", "ez": "국내 로봇 부품기업 로보티즈의 구동장치 주문 잔량이 50만 대를 넘는 것으로 분석됐다. 구동장치는 로봇의 관절을 움직이는 부품이다. 한국투자증권 최건 연구원은 로보티즈가 로봇 업종에서 유일하게 주문이 공급을 넘어선 상태라고 진단했다. 인공지능 모델을 함께 쓰는 플랫폼인 허깅페이스가 내놓은 값싼 연구용 로봇에 이 회사 부품이 들어가고, 중국 휴머노이드 기업과 북미 고객사에서도 공급을 늘려 달라는 요청이 이어지는 중이다. 다만 50만 대가 언제를 기준으로 센 숫자인지, 고객사가 어디인지, 설비를 언제 얼마나 늘리는지는 밝혀지지 않았다. 정부도 같은 날 이 회사를 찾아 로봇 기업 간담회를 열고 내년 예산안의 부품 지원 방향을 설명했다.", "body": "한국투자증권 최건 연구원이 로보티즈의 구동장치 수주 잔고를 약 50만 대 이상으로 제시하고 업종 안에서 유일하게 초과 수요 국면에 있다고 분석함, 인공지능 모델 공유 플랫폼 허깅페이스가 내놓은 저가 로봇에 들어가는 구동장치 공급 물량이 늘어날 것으로 봤고 中 휴머노이드 기업과 북미 고객사에서 공급 확대와 증설 요청이 이어지는 중이라고 적음, 다만 50만 대의 기준 시점과 산정 근거, 허깅페이스향 물량의 규모, 고객사 이름과 증설 계획의 시기·규모는 제시되지 않아 확정된 수주 실적으로 읽지 않음, 애널리스트의 추정이 섞인 자료이고 공시도 동료심사도 거치지 않았으므로 등급을 S3 으로 두며 회사 자체 발표는 확인되지 않음, 이 건에서 취할 것은 개별 기업의 실적이 아니라 산업 사실임 — 국내 부품사가 해외 휴머노이드와 연구용 로봇 수요를 받아 공급을 늘리는 국면이 이어진다는 것이고, 재정경제부가 9월 10일 같은 회사를 찾아 로봇 기업 간담회를 열고 2027년 예산안의 지원 방향을 설명했다는 사실이 부처 보도자료 목록에서 확인됨, 다만 센서·구동장치·휴머노이드용 이차전지 예산을 올해 116억 원에서 내년 620억 원으로 늘린다는 수치는 보도됨 — 부처 보도자료의 본문이 첨부 문서 안에 있어 목록 화면에서 수치를 대조하지 못했으므로 확정된 편성으로 읽지 않고 미확정 사항으로 넘김, 부처 발표 자체도 이 지면의 게재 대상이 아니므로 항목으로 올리지 않음", "src": "파이낸셜뉴스 9.10 · 한국경제 9.10", "pd": "2026-09-10", "url": "https://www.fnnews.com/news/202609100819471029", "url2": "https://www.hankyung.com/article/2026091056636"}, {"sec": 4, "t": "뇌병변 장애인이 보행 보조 로봇을 착용하고 성화 봉송", "k": "대회 기간에 맞춰 제주 월드컵경기장에 로봇 체험 부스도 함께 선다", "ez": "제주에서 9월 11일부터 16일까지 열리는 제46회 전국장애인체육대회에서 착용형 로봇을 이용한 성화 봉송이 진행된다. 성화 마지막 주자인 김준 씨는 뇌병변 장애가 있으며, 국내 기업 휴로틱스가 만든 보행 보조 로봇을 착용하고 10미터를 걸어 성화를 전달한다. 이 로봇은 딱딱한 뼈대로 다리를 감싸는 방식이 아니라 옷처럼 부드러운 재질로 만들어 근육의 힘을 거드는 형태다. 성화 안치식은 9월 10일 서귀포시청에서 열렸고, 대회 기간에는 제주 월드컵경기장 광장에 로봇을 직접 체험할 수 있는 부스도 함께 운영된다. 다만 이 로봇이 얼마나 큰 힘을 보조하는지, 한 번 충전으로 얼마나 쓸 수 있는지, 착용자가 얼마나 연습했는지는 공개되지 않았다. 현장에 도입해 얻은 성과가 아니라 행사를 위한 시연이다.", "body": "제주특별자치도와 제주테크노파크가 9월 11일부터 16일까지 열리는 제46회 전국장애인체육대회에서 착용형 로봇을 쓴 성화 봉송을 진행한다고 밝힘, 성화 최종 주자인 김준 씨가 뇌병변 장애를 안고 국내 기업 휴로틱스의 보행 보조 소프트 착용형 로봇 H-Medi 를 입은 채 10미터를 걸어 성화를 전달하는 구성이며 성화 안치식은 9월 10일 서귀포시청에서 열림, 대회 기간에는 개막식이 열리는 제주 월드컵경기장 광장에 제주테크노파크의 로봇 체험 부스가 함께 운영됨, 다만 착용형 로봇의 보조력·구동 방식·연속 사용시간 같은 사양과 착용자의 사전 훈련 기간, 보행 속도 같은 조건은 공개되지 않았고 이는 현장 도입 실적이 아니라 행사용 시연이므로 성능 근거로 쓰지 않음, 이 지면이 다루는 휴머노이드와는 형태가 다른 착용형 기체이지만 사람의 동작을 보조하는 구동장치와 제어라는 점에서 부품 층위를 공유함", "src": "로봇신문 9.10", "pd": "2026-09-10", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48426"}, {"sec": 5, "t": "크라우드웍스, 창원에 제조 현장용 인공지능 거점 첫 개설", "k": "경남테크노파크 안에 자리를 잡고 울산과 전북으로 넓힐 계획을 세운다", "ez": "인공지능 학습데이터 기업 크라우드웍스가 경남 창원에 첫 지역 거점을 열었다고 9월 10일 밝혔다. 학습데이터는 인공지능에게 무엇이 정답인지 알려 주기 위해 사람이 표시를 달아 둔 자료를 말한다. 로봇을 공장에 넣으려면 그 공장의 공정을 담은 자료를 사람이 정리해 주어야 하는데, 이 작업을 현장 가까이에서 하겠다는 것이다. 사무소는 경남테크노파크 안에 마련됐다. 경남 지역 제조기업의 인공지능 수요를 찾아 수주를 돕고, 지방자치단체 사업에 참여하며, 지역 대학·연구기관과 기업을 잇는 일을 맡는다. 창원을 고른 이유는 정부가 이곳 국가산업단지에 제조 인공지능과 로봇 단지를 조성하고 있기 때문이다. 회사는 울산과 전북 등 다른 제조 밀집 지역으로도 거점을 넓힐 계획이라고 밝혔다. 투자 규모와 상주 인력은 공개되지 않았다.", "body": "인공지능 학습데이터 기업 크라우드웍스가 경남 창원에 피지컬 AI 허브를 구축했다고 9월 10일 밝힘, 첫 지역 거점인 창원 사무소는 경남테크노파크 경남인공지능혁신본부 안에 마련됐고 경남 지역 제조기업의 인공지능 수요 발굴과 수주 지원, 지방자치단체의 피지컬 AI 생태계 참여, 지역 산학연 연결 확대를 맡는다고 설명됨, 정부가 추진하는 제조 AI·로보틱스 밸리 조성이 본격화되는 창원국가산업단지를 겨냥해 입지를 먼저 잡는다는 취지이며 창원을 시작으로 울산·전북 등 제조 밀집 지역으로 거점을 넓힐 계획이 함께 제시됨, 다만 투자 규모와 상주 인력, 확대 시점, 경남테크노파크와 맺은 협약의 형태와 기간은 공개되지 않아 계획 단계로 읽어야 함, 회사 누리집을 직접 열었으나 보도자료 목록을 확인하지 못해 발표가 없어서가 아니라 확인하지 못해서 2차 자료에 근거함", "src": "AI타임스 9.10", "pd": "2026-09-10", "url": "https://www.aitimes.com/news/articleView.html?idxno=215084"}, {"sec": 7, "t": "DGIST·한양대, 스스로 판단하는 로봇 지능 6년 과제 맡는다", "k": "정부 지원금 110억 원이 2031년까지 배정돼 현장 검증까지 이어진다", "ez": "DGIST 가 한양대 ERICA 와 함께 로봇 지능을 개발하는 국가 과제에 선정됐다고 9월 10일 밝혔다. 2026년부터 2031년까지 6년 동안 정부 지원금 110억 원이 배정된다. 과제 이름에 붙은 피지컬 AI 에이전트는 화면 안에서 답만 하는 인공지능이 아니라 몸을 가지고 현실에서 움직이며 스스로 판단하는 인공지능을 뜻한다. 개발 목표는 세 가지다. 여러 단계를 거쳐야 하는 일을 스스로 나누어 계획하는 능력, 주변 상황이 바뀔 것을 미리 내다보고 대응하는 능력, 사람과 여러 대의 로봇이 서로 역할을 나눠 일하도록 조율하는 능력이다. 총괄 책임은 DGIST 은용순 교수가 맡는다. 검증에는 DGIST 의 슈퍼컴퓨터와 한양대 ERICA 의 로봇 시험장, 대구의 국가로봇테스트필드를 쓰고, 로보티즈와 KT, 에이로봇이 협력기업으로 참여해 제조와 물류, 서비스 현장에서 확인한다.", "body": "DGIST 가 과학기술정보통신부와 정보통신기획평가원이 주관하는 AI 최고급 신진연구자 지원사업에 선정됐다고 9월 10일 밝힘, 주관기관 DGIST 가 한양대학교 ERICA 와 함께 2026년부터 2031년까지 6년간 정부 지원금 110억 원으로 산업 인공지능 전환 중심 자율-협력 피지컬 AI 에이전트 기술 개발에 착수하며 총괄 책임은 DGIST 전기전자컴퓨터공학과 은용순 교수가 맡음, 개발 목표는 셋으로 나뉘어 복합 작업을 판단하고 장기 계획을 세우는 목적 지향형, 물리 환경의 변화를 예측해 적응하는 예측 적응형, 사람과 여러 로봇 사이의 역할을 조율하는 집단 지능형이 각각 제시됨, 검증에는 DGIST 슈퍼컴퓨팅 시설과 한양대 ERICA 로봇 테스트베드, 대구의 국가로봇테스트필드를 쓰고 로보티즈·KT·에이로봇이 협력기업으로 참여해 제조·물류·서비스 현장 실증을 추진함, 다만 110억 원의 연차별 배분과 민간부담 유무, 세 갈래 목표의 단계별 검증 지표와 실증 착수 시점은 공개되지 않아 미확정 사항으로 등록함, 부처가 주관하는 사업이지만 이 항목의 주체는 수행기관인 DGIST 이므로 지면에 올리며 부처 발표 자체는 다루지 않음", "src": "DGIST 보도자료 9.10 · 인공지능신문 9.10", "pd": "2026-09-10", "url": "https://www.dgist.ac.kr/bbs/BBSMSTR_000000000077/view.do?nttId=B000000111886Dp0eU6", "url2": "https://www.aitimes.kr/news/articleView.html?idxno=41863"}, {"sec": 7, "t": "성균관대, 로봇이 다음 동작을 정하는 시간을 줄이는 방식 개발", "k": "판단 지연을 최대 4분의 1로 낮추면서 성공률은 기존 최고 수준을 지킨다", "ez": "성균관대 권민혜 교수 연구팀이 로봇의 판단 속도를 높이는 인공지능 구조를 개발했다고 9월 10일 밝혔다. 최근 로봇 제어에는 그림을 그리듯 정교한 동작을 만들어 내는 방식이 쓰이는데, 동작 하나를 내놓기 위해 계산을 여러 번 되풀이해야 해서 실제로 움직일 때 반응이 느려진다. 연구팀은 인공지능을 두 부분으로 나누어 생각했다. 하나는 학습할 때 잘잘못을 채점하는 부분이고, 다른 하나는 로봇이 움직일 때마다 실제로 동작을 내놓는 부분이다. 채점하는 부분은 학습이 끝나면 버려지므로 크게 키워도 로봇의 속도에 영향을 주지 않는다. 이 점을 이용해 채점 쪽을 128층까지 깊게 만들고 동작을 내놓는 쪽은 가볍게 두었다. 그 결과 판단에 걸리는 시간이 최대 4분의 1로 줄었고 임무 성공률은 기존 최고 수준과 대등했다. 평가는 실제 로봇이 아니라 컴퓨터 안의 모의 환경에서 이뤄졌다.", "body": "성균관대학교가 전자전기공학부 권민혜 교수 연구팀이 로봇 제어용 인공지능 구조 LAC 를 개발했다고 9월 10일 밝힘, 기존의 확산 모델·흐름 정합 방식은 동작 하나를 만들 때마다 여러 단계의 계산을 되풀이해 로봇이 실제로 움직일 때 지연이 쌓이는데, 연구팀은 학습에만 쓰이고 배치 뒤에는 버려지는 비평가 쪽에 신경망 용량을 몰아주고 매 순간 동작을 내는 행위자 쪽을 가볍게 두는 방식을 택함, 잔차 연결 구조와 여러 걸음 앞을 내다보는 예측, 점수 범위를 안정시키는 분류형 손실을 결합해 비평가의 깊이를 128층까지 세웠고 그 결과 추론 지연이 최대 4배 낮아지면서 임무 성공률은 최고 수준 기준선과 대등하게 유지됐다고 제시됨, 평가는 로봇 팔 조작과 인간형 기체의 미로 탈출을 포함한 OGBench 에서 이뤄졌고 이는 실기가 아니라 시뮬레이션 환경이며 시행 횟수와 무작위 시드 수는 공개되지 않아 성능 폭을 단정하지 않음, 논문은 제1저자 강구현 석사과정생과 숭실대 이재휘 연구자가 함께 썼고 채택률 27%의 ACM CIKM 2026 에 채택돼 11월 7일부터 11일까지 이탈리아 로마에서 발표되며 사전공개본은 8월 27일 arXiv 에 올라와 동료심사 결과가 확정되기 전 단계임", "src": "성균관대 발표 9.10 · 인공지능신문 9.10", "pd": "2026-09-10", "url": "https://www.spressnews.com/news/articleView.html?idxno=138989", "url2": "https://www.aitimes.kr/news/articleView.html?idxno=41861"}, {"sec": 7, "t": "한국AI로봇산업협회, 돌봄 로봇 성과를 자립 능력으로 측정하자고 제안", "k": "낙상 예방을 관찰·예측·지원·효과 측정·재학습의 순환으로 구성", "ez": "고령자를 돕는 로봇의 성과를 무엇으로 측정해야 하는가를 두고 제안이 나왔다. 한국AI로봇산업협회 고경철 부회장은 9월 9일 서울에서 열린 고령화 기술 학술행사에서, 로봇을 몇 대 보급했고 몇 명이 가입했는지를 세는 데서 그치지 말고 고령자가 스스로 생활하고 움직이는 능력이 얼마나 늘었는지를 함께 측정하자고 밝혔다. 기술은 두 갈래로 나뉜다. 인공지능이 건강과 생활 기록을 분석해 판단을 돕고, 로봇이 이동과 재활, 일상생활을 직접 보조한다. 예로 든 것은 낙상 예방이다. 걷는 모습을 관찰해 넘어질 위험을 미리 가려내고, 필요한 도움을 준 뒤, 그 도움이 효과가 있었는지 측정해 다시 학습에 넣는 순환을 만든다는 구상이다. 다만 이 기준을 어떤 산식으로 측정하는지, 어디에 먼저 적용하는지는 제시되지 않았다.", "body": "한국AI로봇산업협회 고경철 부회장이 9월 9일 서울 동대문디자인플라자에서 열린 서울 에이지테크 콘퍼런스에서 고령자 대상 로봇의 성과를 측정하는 기준을 바꾸자고 제안한 것으로 보도됨, 기기 설치 대수나 서비스 가입자 수에 더해 고령자가 스스로 생활하고 활동하는 능력이 얼마나 늘었는지를 함께 측정하자는 것이 요지이며 건강수명과 독립생활의 확대를 목표로 두자고 밝힘, 기술 구성으로는 인공지능 에이전트가 건강·생활 데이터를 분석하고 로봇이 이동·재활·일상생활 보조를 맡는 역할 분담이 제시됐고, 낙상 예방을 보행 관찰에서 위험 예측, 지원, 효과 측정, 재학습으로 돌아오는 순환 구조로 구성하는 예가 함께 제시됨, 고령자가 인공지능을 써서 일정을 관리하고 은퇴 뒤에도 배움과 생산 활동을 이어가는 상태를 가리켜 AI 에이전틱 에이징이라는 말이 쓰였고 음성 질의에서 시작해 답변을 검토하는 능력과 실생활 적용까지 단계적으로 넓히는 교육 과제가 함께 제안됨, 다만 제안 단계의 발언이고 지표의 산식과 측정 도구, 시범 적용 계획은 제시되지 않아 제도로 굳은 사실이 아님, 발언자는 고영테크놀러지 인공지능기술고문을 겸하고 있음, 이 항목은 학술 발표나 기관 보고서가 아니라 현장 강연이므로 취재 보도를 출처로 삼으며 매체는 지정 매체 안임", "src": "[강연] 로봇신문 9.10", "pd": "2026-09-10", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48403"}]}, {"date": "2026-09-10", "items": [{"sec": 1, "t": "中 증권당국, 휴머노이드 기업 상장 심사기준 비공식 상향", "k": "자금 조달 창구가 좁아져 실적이 없는 기체 개발사부터 영향을 받는다", "ez": "중국 증권감독관리위원회가 휴머노이드 로봇 기업의 증시 상장 심사를 까다롭게 하겠다는 뜻을 투자은행들에 비공식으로 전달했다고 전해졌다. 꾸준히 들어오는 매출이 있거나, 적자가 줄고 있거나, 실질적인 기술 혁신이 있음을 증명해야 상장 승인을 검토한다는 내용이다. 배경에는 중국 휴머노이드 기업의 주가 흐름이 있다. 대표 기업 유니트리는 8월 19일 상장 첫날 주가가 다섯 배 넘게 뛰었다가 이후 고점 대비 40%대 후반까지 내린 것으로 전해졌다. 다만 하락 폭은 공모가를 기준으로 삼느냐 첫날 최고가를 기준으로 삼느냐에 따라 매체마다 다르게 적혀 있다. 상장을 기다리는 기업이 줄지어 있고 비상장 단계에서도 투자가 몰린 상태여서, 당국이 과열을 식히려 한다는 해석이 붙었다. 다만 창구지도는 문서로 공표되지 않는 방식이고, 중국 금융당국은 사실 여부를 확인해 주지 않았다.", "body": "中 증권감독관리위원회가 일부 투자은행과 증권사에 휴머노이드 기업의 기업공개 승인 기준을 높이겠다는 비공식 창구지도를 내렸다고 The Information 이 보도했고 로이터가 이를 받아 전함, 요구 조건으로 반복적으로 발생하는 매출, 손실 축소의 진전, 실질적 기술 혁신 셋 가운데 하나 이상을 증명할 것이 제시됨, 배경으로는 비상장 시장의 과열과 자금 쏠림, 상장을 대기하는 기업의 적체, 이미 상장한 기업의 주가 급락 셋이 함께 꼽힘, 이 건은 오늘 지면의 균형 축에 해당함 — 휴머노이드 분야의 자금 쏠림이 되돌려지는 국면을 다루므로 양산·수주 발표와 나란히 읽어야 함, 기준선이 되는 유니트리는 8월 19일 상장 첫날 주가가 다섯 배 넘게 뛰었다가 이후 고점 대비 약 45% 내린 것으로 전해짐, 다만 하락률은 무엇을 기준점으로 삼느냐(공모가·첫날 종가·첫날 최고가)에 따라 매체마다 달리 제시되고 우리가 대조할 수 있는 출처가 하나뿐이어서 단일 수치로 인용하지 않음, 상하이거래소 시세로 종가와 기준점을 직접 맞추기 전까지는 하락 폭을 단정하지 않음, 창구지도는 문서로 공표되지 않는 형식이고 中 금융당국은 로이터의 확인 요청에 응하지 않았으며 로이터도 독자 확인에 이르지 못했다고 밝혔고 The Information 원문은 유료 지면이어서 확보하지 못했으므로 확정된 제도 변경으로 읽지 않음", "src": "칼리지타임스(로이터 배포) 9.9", "pd": "2026-09-09", "url": "https://www.khaleejtimes.com/business/china-curbs-humanoid-ipos-after-unitrees-volatile-debut-the-information-reports"}, {"sec": 2, "t": "인터로이드, 공장 소음 속 작업자와 대화하는 휴머노이드 개발", "k": "작업자가 단말기 앞으로 이동하지 않고 음성으로 질의해 답을 받는다", "ez": "인공지능 기업 인터로이드가 공장 작업자와 말로 대화하는 휴머노이드 기술을 개발했다고 9월 9일 밝혔다. 핵심은 대화관리 엔진이다. 사람은 로봇이 알아듣기 좋은 문장만 쓰지 않고 말을 끊거나, 여러 가지를 한꺼번에 묻거나, 조건을 붙여 지시한다. 예를 들어 온도가 80도를 넘으면 라인을 세우라고 지시하면, 로봇이 조건과 행동을 나눈 뒤 센서값을 확인해 조건이 맞을 때만 행동한다. 최대 120데시벨까지 시끄러운 환경에서도 대화가 가능하다고 설명했다. 120데시벨은 공사장 착암기 소음에 해당하는 수준이다. 생산 관리 시스템과 설비 문서를 실시간으로 연결해 두어, 작업자가 단말기 앞까지 가지 않고 질의하면 답을 받을 수 있도록 했다. 다만 로봇의 키와 무게, 관절 수 같은 사양과 어느 현장에 언제 들어가는지, 알아듣는 정확도가 얼마인지는 공개되지 않았다.", "body": "인공지능 기업 인터로이드가 작업자의 자연어를 이해하고 제조 공정 데이터와 연계해 답하는 휴머노이드 기술을 개발했다고 밝힘, 자체 대화관리 엔진을 휴머노이드에 적용한 것이 특징이며 최대 120데시벨의 공장 소음 환경에서 대화가 가능하고 무선 온도·습도 센서와 제조실행시스템, 전사자원관리, 공정 매뉴얼과 설비 문서를 실시간으로 연동한다고 설명됨, 끼어들기와 복수 의도, 조건부 명령, 복합 조건, 문맥 연결, 정정과 반전, 이중부정까지 처리하도록 설계했고 온도가 80도를 넘으면 라인 정지를 요청하라는 식의 조건부 지시를 조건과 후속 행동으로 나눠 수행하는 예가 제시됨, 14개 언어를 구분해 응대하는 구조를 갖춰 공항·호텔·전시장으로 적용 범위를 넓히고 사족보행 로봇과 이동형 서비스 로봇에도 얹을 수 있도록 플랫폼으로 만드는 중이라고 밝힘, 다만 기체의 신장·중량·자유도·가반하중 같은 사양과 개발 단계, 자율 동작 여부, 적용 현장과 출시 시점, 인식 정확도나 응답 지연 같은 성능 수치는 공개되지 않아 실증 실적으로 읽을 단계가 아님, 회사 공식 사이트(interroid.com)를 직접 열었으나 본문이 자바스크립트로 그려져 게시판을 읽지 못했으므로 발표가 없어서가 아니라 확인하지 못해서 2차 자료에 근거하며 다음 순회에서 다시 두드림", "src": "디지털타임스 9.9", "pd": "2026-09-09", "url": "https://www.dt.co.kr/article/12083053"}, {"sec": 3, "t": "본시스템즈, 로봇 손용 초소형 감속기 국내 첫 양산", "k": "직경 18밀리미터·무게 21그램으로 로봇 손 부품의 수입 의존을 낮춘다", "ez": "로봇 부품 기업 본시스템즈가 로봇 손에 들어가는 초소형 감속기 BSR 018 을 여러 해외 기업에 공급하기로 했다고 9월 9일 밝혔다. 감속기는 모터의 빠른 회전을 느리고 힘센 움직임으로 바꿔 주는 부품으로, 로봇 관절마다 들어간다. 사이클로이드 방식은 튼튼하고 정밀하지만 구조가 복잡해 조립이 까다롭고 대량 생산이 어려웠다. 본시스템즈는 성능을 좌우하는 핀 부품과 그 조립 공정을 아예 없애는 방식으로 이 문제를 풀었고, 국내에서는 처음으로 양산에 이르렀다고 설명했다. BSR 018 은 직경 18밀리미터, 무게 21그램이다. 어른 손가락 한 마디 굵기에 500원 동전 세 개보다 가볍다. 로봇 손은 이런 작은 구동부가 여러 개 촘촘히 들어가는 부위여서 크기와 무게가 곧 설계 제약이 된다. 다만 계약 상대와 규모, 양산 시점은 공개되지 않았다.", "body": "본시스템즈가 다수의 해외 기업과 핀리스 사이클로이드 방식 초소형 감속기 BSR 018 의 공급계약을 맺었다고 밝힘, 사이클로이드 감속기의 성능을 좌우하는 핀 부품과 그 조립 공정을 없애 부품 수와 조립 편차 요인을 줄이면서 기존의 구동 특성과 내구성은 유지한 구조이며 국내에서는 처음 양산에 이른 것으로 설명됨, BSR 018 은 기어비 25 대 1 에서 양방향 구동이 가능하고 직경 18밀리미터에 무게 21그램으로 여러 개의 작은 구동부가 촘촘히 들어가는 로봇 손 설계에 맞춘 제품임, 다만 계약 상대 기업의 이름과 국가, 계약 수량과 금액, 양산 시점과 월 생산능력, 정격·순간 토크와 백래시 같은 성능 수치는 공개되지 않아 수주 실적의 규모를 가늠할 단계가 아니고 사양표를 확보하지 못해 성능 수치를 단정하지 않음, 회사 공식 사이트가 인증서 오류로 열리지 않아 발표 원문을 확보하지 못했으며 없어서가 아니라 열지 못해서이므로 다음 순회에서 다시 두드림", "src": "로봇신문 9.9 · 뉴스핌 9.9", "pd": "2026-09-09", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48378", "url2": "https://www.newspim.com/news/view/20260909000386"}, {"sec": 4, "t": "벤션, 몬트리올에 제조용 피지컬 AI 연구소 개소", "k": "포천 500대 제조사 90곳의 설비 데이터를 검증 재료로 삼는다", "ez": "캐나다 산업자동화 기업 벤션이 몬트리올에 제조용 피지컬 AI 연구소를 열었다고 9월 9일 발표했다. 피지컬 AI 는 로봇이나 기계를 실제로 움직이는 인공지능을 말한다. 이런 모델은 실험실에서 성공하다가도 공장에 투입되면 조명이나 부품 상태가 달라 실패하는 일이 잦다. 연구소는 그 간극을 사전에 측정하는 자리다. 지미 리 피지컬 AI 담당 이사가 이끌고 코히어의 최고인공지능책임자 조엘 피노가 자문을 맡는다. 현재 8명이 일하며 16명 이상을 더 채용하는 중이다. 검증 재료는 벤션이 장비를 공급한 포천 500대 제조사 90곳에서 나오는 산업 데이터이고, 대상은 산업재와 전자, 자동차 생산에서 형태가 일정하지 않아 자동화가 어려웠던 조작 공정이다. 회사는 관련 매출이 1년 사이 400% 늘었다고 밝혔으나 기준 금액이 없어 규모는 알 수 없다. 연구소의 넓이와 투자액은 공개되지 않았다.", "body": "캐나다 산업자동화 기업 벤션이 몬트리올에 제조용 피지컬 AI 연구소를 열었다고 회사 보도자료로 밝힘, 연구소는 지미 리 피지컬 AI 담당 이사가 이끌고 코히어 최고인공지능책임자 조엘 피노가 자문을 맡으며 현재 인원 8명에 로보틱스 제어·시뮬레이션·피지컬 AI 연구 분야로 16개 이상의 자리를 더 뽑는 중이라고 설명됨, 검증 재료는 포천 500대 제조사 90곳에 걸친 벤션 설치 기반에서 나오는 산업 데이터이며 연구 범위로 산업 데이터 수집, 로봇 제어, 모션 플래닝, 고전적 컴퓨터 비전, 비전 파운데이션 모델, 시연 기반 학습, 강화학습이 제시됨, 대상은 산업재·전자·자동차 생산의 복잡하고 정형화되지 않은 조작 작업이고 목적은 연구 단계의 조작 기술을 신뢰할 수 있고 확장 가능한 제조 현장 배치로 잇는 것으로 설명됨, 피지컬 AI 가 회사에서 가장 빠르게 크는 부문이며 관련 매출이 최근 1년 사이 400% 늘었다고 밝혔으나 기준 시점과 절대 금액이 없어 증가율만으로 규모를 읽지 않음, 90곳과 400% 는 회사 집계이고 제3자 검증을 거치지 않음, 연구소의 면적과 투자액, 캐나다 정부의 지원 여부는 보도자료에 없고 발표에 휴머노이드에 관한 언급이 없어 이 건을 휴머노이드 실증으로 읽지 않음", "src": "벤션 보도자료 9.9 · 벤션 프레스룸 9.9", "pd": "2026-09-09", "url": "https://www.prnewswire.com/news-releases/vention-opens-physical-ai-lab-to-bridge-ai-research-and-scalable-industrial-deployment-302872841.html", "url2": "https://vention.com/press"}, {"sec": 5, "t": "다임리서치·한국IBM·KAIST, 제조 피지컬 AI 3자 협약", "k": "연구실 기술을 고객사 생산라인까지 옮기는 역할을 셋으로 나눴다", "ez": "로봇 통합운영 기업 다임리서치와 한국IBM, KAIST 제조 피지컬 AI 연구소가 9월 8일 세 기관 업무협약을 맺었다. 인공지능과 로봇, 제조 설비를 묶은 기술을 실제 공장에 적용하고 사업으로 잇겠다는 내용이다. 역할은 셋으로 나뉜다. KAIST 연구소가 앞선 연구와 핵심기술 개발을 맡고, 다임리서치가 현장에서 기술을 검증해 상품으로 만들고 고객사에 적용한다. 한국IBM 은 데이터와 보안 기술로 수요를 찾고 확산을 돕는다. 다루는 분야는 스마트 물류와 공장 자동화, 설비가 고장 나기 전에 미리 잡아내는 예지보전, 공장 설비를 노리는 공격을 막는 운영기술 보안이다. 다만 협약의 규모와 기간, 어느 공정에 먼저 적용하는지는 공개되지 않았다. 다임리서치는 하루 전 KT·KAIST 와도 무인공장 협약을 맺었다.", "body": "다임리서치와 한국IBM, KAIST 제조 피지컬 AI 연구소가 9월 8일 피지컬 AI 기반 제조 혁신 및 산업 확산 3자 업무협약을 맺었다고 전해짐, 역할은 다임리서치가 제조·물류 현장의 로봇 통합 운영 경험을 바탕으로 기술 검증과 솔루션 상용화, 고객사 적용을 맡고 한국IBM 이 인공지능·데이터·자산관리·보안 기술로 수요 발굴과 현장 적용, 사업 확산을 지원하며 KAIST 연구소가 선행 연구와 핵심기술 개발을 담당하는 것으로 나뉨, 대상 분야는 스마트 물류와 공장 자동화, 설비 예지보전과 통합 관제, 운영기술 보안과 인공지능 안전성 셋으로 제시됨, 협약 규모와 기간, 투입 인력, 첫 적용 대상 공정과 사이트는 공개되지 않아 이행 단계로 읽을 근거가 없고 세 기관 어느 쪽의 공식 발표도 확보하지 못해 2차 자료에 근거함, 다임리서치는 9월 8일 KT·KAIST 와 맺은 다크팩토리 플랫폼 협약에도 참여한 바 있어 같은 주에 두 건의 협약에 이름을 올렸으나 두 협약이 서로 어떻게 이어지는지는 밝혀지지 않음", "src": "로봇신문 9.9", "pd": "2026-09-09", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48375"}, {"sec": 5, "t": "대동, 국산 반도체 무인 농작업 로봇 과제 총괄기관 선정", "k": "431억 원이 4년 반에 배정됐고 현장 검증은 2029년부터 이뤄진다", "ez": "농기계 기업 대동이 산업통상부의 K-온디바이스 인공지능 반도체 기술개발 사업에서 무인 농작업 로봇 과제를 총괄하게 됐다고 9월 9일 밝혔다. 온디바이스 인공지능 반도체는 인터넷 서버에 조회하지 않고 기기 안에서 직접 판단하는 칩을 말한다. 논밭처럼 통신이 끊기기 쉬운 곳에서 움직이는 로봇에는 이 방식이 유리하다. 사업 규모는 431억 원, 기간은 2026년 7월부터 2030년 12월까지이며 산학연 14곳이 참여한다. 대동은 국산 칩을 로봇 플랫폼과 자율 농작업 인공지능에 통합해 방제와 수확, 운반, 작물 상태 확인을 자동화하는 것을 목표로 삼았다. 2028년까지 핵심기술과 시제품을 만들고, 2029년부터 현장에서 검증한다. 다만 정부 지원금과 기업 부담의 구분, 참여 기관 명단은 공개되지 않았다. 같은 사업 안에는 휴머노이드를 다루는 별도 과제도 있다.", "body": "농기계 기업 대동이 산업통상부의 K-온디바이스 인공지능 반도체 기술개발 사업에서 무인 농작업 로봇 과제의 총괄 연구기관으로 선정됐다고 밝힘, 총사업비는 약 431억 원이고 기간은 2026년 7월부터 2030년 12월까지이며 산학연 14곳이 참여하고 한국산업기술기획평가원이 사업을 관리함, 대동은 국산 인공지능 반도체를 로봇 플랫폼과 자율 농작업 인공지능 솔루션에 통합하는 역할을 맡고 방제·수확·운반·작물 모니터링의 자동화를 목표로 제시함, 일정은 2026년부터 2028년까지 핵심기술 확보와 시제품 제작, 2029년부터 2030년까지 반도체를 로봇에 적용해 현장 검증과 상용화 기반을 마련하는 순서로 구분됨, 정부지원분과 민간부담의 구분, 참여 14곳의 명단과 기관별 배분, 대상 작물과 검증 사이트는 공개되지 않음, 대동 공식 뉴스룸을 9월 10일 직접 열어 최신 게시물에 이 항목이 없음을 확인해 2차 자료에 근거함, 이 과제 자체는 휴머노이드가 아니라 농작업 로봇이며 이 지면에 싣는 값은 같은 사업의 구조가 드러난 데 있음 — 미확정 사항 O11 이 묻고 있는 LG전자·모빌린트·노타의 휴머노이드 과제와 같은 사업의 다른 세부과제여서 사업 전체가 세부과제별 총괄기관 체제로 편성돼 있음이 확인됨", "src": "인공지능신문 9.9", "pd": "2026-09-09", "url": "https://www.aitimes.kr/news/articleView.html?idxno=41830"}, {"sec": 5, "t": "안티오크, 피지컬 AI 시험용 시뮬레이션에 투자 유치", "k": "올해 4월 850만 달러에 이어 다섯 달 만에 3,200만 달러가 추가 조달됐다", "ez": "피지컬 AI 용 시뮬레이션 기업 안티오크가 3,200만 달러, 약 440억 원 규모의 투자를 받았다고 9월 9일 전해졌다. 미국 벤처투자사 그레이록이 주도했고, 올해 4월 850만 달러를 받은 데 이은 두 번째 투자다. 다섯 달 만에 규모가 네 배 가까이 커졌다. 안티오크는 로봇을 직접 만들지 않는다. 대신 로봇과 자율주행 개발팀이 실제 현장에 내보내기 전에 컴퓨터 안에서 인공지능을 시험할 수 있는 환경을 제공한다. 한 번의 실험부터 수천 건을 동시에 수행하는 평가까지 가능하다고 설명했다. 아마존의 가정용 보안 브랜드 링이 고객이고, 엔비디아와도 협력한다. 아마존 측은 의도적으로 보정하지 않은 조건에서도 시뮬레이션 결과가 실제 시험과 근접했다고 평가했다. 다만 오차가 얼마였고 몇 번 시험했는지는 공개되지 않았다.", "body": "피지컬 AI 용 시뮬레이션 플랫폼 기업 안티오크가 그레이록이 주도한 3,200만 달러(약 440억 원) 규모의 시리즈A 투자를 유치했다고 밝힘, 카테고리벤처스와 박스그룹, 아이스하우스벤처스가 참여했고 올해 4월 850만 달러를 조달한 데 이은 두 번째 라운드임, 회사는 로봇·자율주행 개발팀이 실제 배치 전에 단일 실험부터 수천 건의 병렬 평가까지 고정밀 시뮬레이션에서 인공지능 시스템을 개발·시험·검증하도록 지원한다고 설명했고 자금은 제품 개발 가속과 엔지니어링 인력 확충, 시뮬레이션 역량 강화에 쓴다고 밝힘, 아마존의 스마트홈 브랜드 링을 고객으로 들었고 엔비디아·네비우스와 협력한다고 함, 아마존 측 임원이 보정 대상에서 의도적으로 제외한 시나리오에서도 시뮬레이션 결과가 실물 시험 결과와 근접하게 맞았다고 평가한 발언이 함께 전해졌으나 오차 범위와 시험 건수는 제시되지 않아 정확도의 근거로 쓰지 않음, 설립 시점과 휴머노이드 적용 여부는 밝혀지지 않았고 회사 공식 발표를 확보하지 못해 2차 자료에 근거하며 국내 보도가 인용한 해외 매체 기사도 확인하지 못해 재인용임", "src": "로봇신문 9.9", "pd": "2026-09-09", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48388"}, {"sec": 6, "t": "휴머노이드, 통관 품목분류 부재로 수출입 통계 집계 불가", "k": "수출입 규모를 파악하지 못한 상태에서 지원 대책과 성과지표를 세운다", "ez": "휴머노이드가 수출입 통계에 잡히지 않는다는 지적이 나왔다. 물건이 국경을 넘을 때는 품목마다 붙은 분류 코드로 세는데, 국내에는 휴머노이드를 가리키는 항목이 없다. 그래서 기타 산업용 로봇에 섞이거나 아예 로봇이 아닌 기타 기계류로 분류되는 일까지 생긴다. 산업통상부는 2028년 분류표 개정을 앞두고 재정경제부에 휴머노이드와 사족보행 로봇 코드를 새로 만들어 달라고 요청한 상태다. 중국은 이미 2026년 1월부터 지능형 생체모방 로봇이라는 항목을 신설해 휴머노이드와 사족보행 로봇을 담았고, 올해 상반기에만 1만 대 넘게 이 항목으로 수출한 것으로 전해졌다. 구동기 같은 핵심부품도 여러 품목에 흩어져 있어 산업의 수출입 구조를 파악하기 어렵다는 지적이 함께 나왔다. 정부는 수요조사를 하는 단계이며 필요가 많은 품목은 적극 검토하겠다고 밝혔다.", "body": "휴머노이드를 따로 구분할 통관 분류 코드가 국내에 없어 현물이 기타 산업용 로봇의 일부로 잡히거나 산업용 로봇이 아닌 기타 기계류로 분류되는 경우까지 있는 것으로 전해짐, 한국은 국제 공통 코드에 네 자리를 더한 10단위 관세통계통합품목분류표를 운용하는데 산업통상부가 2028년 개정을 앞두고 재정경제부에 휴머노이드와 사족보행 로봇의 별도 코드 신설을 요청한 상태임, 中 은 2026년 1월부터 지능형 생체모방 로봇이라는 하위분류를 신설해 휴머노이드와 사족보행 로봇을 담았고 2026년 상반기에만 1만 대가 넘는 물량을 이 분류로 수출한 것으로 전해졌으나 中 통계 원본을 확보하지 못해 단정하지 않음, 국제 공통 코드에는 2028년부터 로봇청소기 분류가 추가될 예정임, 완제품뿐 아니라 구동기 같은 핵심부품도 여러 품목으로 흩어져 있어 현재 통계로는 산업의 수출입 구조를 파악하기 어렵다는 지적이 함께 제시됨, 정부 관계자는 2028년 개정에 따른 수요조사를 진행하는 단계이며 신설 수요가 많은 품목은 적극 검토한다고 밝힘, 기관이 낸 문서가 존재하지 않는 취재 사실이어서 지정 매체 보도를 근거로 삼되 산업통상부의 요청 공문과 재정경제부의 검토 상황을 확인하지 못했으므로 코드 신설이 확정된 것으로 읽지 않고 등급을 S3 으로 둠, 中 의 2026년 1월 분류 신설과 상반기 수출 대수도 같은 보도에 실린 전언이어서 원본 통계와 대조하기 전까지 단정하지 않음", "src": "전자신문 9.9", "pd": "2026-09-09", "url": "https://www.etnews.com/20260909000291"}, {"sec": 7, "t": "로봇산업진흥원, 부산서 로봇 시스템통합 기업 간담회", "k": "8월부터 이어진 지역 순회에서 설치 기업의 요구를 정책으로 모은다", "ez": "한국로봇산업진흥원이 9월 8일과 9일 이틀 동안 부산에서 로봇 시스템통합 기업 간담회를 열었다. 시스템통합 기업은 로봇을 직접 만드는 회사가 아니라, 만들어진 로봇을 공장 상황에 맞게 설치하고 기존 설비와 연결해 실제로 가동되게 만드는 기업이다. 로봇 도입의 성패는 대개 이 단계에서 결정된다. 행사에는 기업 관계자와 산학연 전문가 등 약 100명이 참석했고, 부산·울산·경남 기업이 참여한 현장 간담회에는 30명가량이 모였다. 지원정책과 자동화 기술 동향을 공유하고, 실제 도입 사례를 발표했으며, 기업이 겪는 어려움과 정책 지원 방향을 논의했다. 조영훈 원장은 중소·중견 제조기업의 혁신을 위해서는 우수한 시스템통합 기업을 키우는 일이 필수라고 밝혔다. 진흥원은 8월에도 화성과 대전, 대구, 경남에서 같은 형식의 간담회를 이어 왔다.", "body": "한국로봇산업진흥원이 9월 8일부터 9일까지 부산에서 로봇 시스템통합 기업 협력 네트워크와 현장 간담회를 열었다고 전해짐, 로봇 시스템통합 기업 관계자와 산학연 전문가 등 약 100명이 참석했고 현장 간담회에는 진흥원과 부산·울산·경남 지역 기업 등 약 30명이 함께함, 로봇 시스템통합 관련 지원정책과 자동화 기술 동향 공유, 도입 사례와 고도화 사례 발표, 산학연관 협력체계와 연합 구축, 기업이 겪는 애로사항과 정책 지원 방향 논의가 진행됨, 조영훈 원장이 중소·중견 제조기업의 혁신에는 우수 시스템통합 기업 육성이 필수이며 현장의 목소리를 지원 정책에 반영하겠다고 밝힌 것으로 전해짐, 제기된 애로의 내용과 예산·지원 계획의 규모는 공개되지 않아 후속 조치를 확인할 단계가 아님, 진흥원 보도자료 게시판을 9월 10일 직접 열어 최신 게시물이 9월 1일자이고 이 항목이 없음을 확인해 2차 자료에 근거함, 진흥원은 8월에도 화성·대전·대구·경남에서 같은 형식의 간담회를 이어 왔으므로 이 건은 단발 행사가 아니라 지역 순회의 한 회차로 읽힘", "src": "로봇신문 9.9", "pd": "2026-09-09", "url": "https://www.irobotnews.com/news/articleView.html?idxno=48390"}]}, {"date": "2026-09-09", "items": [{"sec": 2, "t": "KT·KAIST·다임리서치, 무인공장 플랫폼 공동개발 협약", "k": "서로 다른 회사 로봇을 한 소프트웨어로 묶는 5년 국책과제다.", "ez": "KT가 KAIST, 다임리서치와 손잡고 사람이 상주하지 않는 무인공장 플랫폼을 함께 만든다고 밝혔다. 세 기관은 과기정통부의 피지컬 AI 소프트웨어 플랫폼 사업에 5년간 참여한다. 공장에는 만든 회사가 제각각인 로봇과 인공지능 시스템이 섞여 있다. 이번 과제는 그 이종 장비와 데이터를 하나로 통합해 관리하는 것이 골자다. 여기에 현장 가까이에서 연산하는 기술과 지연이 짧은 통신을 붙여 설비에 이상이 생기거나 환경이 바뀔 때 즉시 대응하는 구조를 맡는다. 총사업비와 기관별 배분, 실증할 공장과 대상 공정은 공개되지 않았다.", "body": "KT가 KAIST·다임리서치와 피지컬 AI 기술개발·실증·사업화 협약을 맺고 사람이 상주하지 않는 무인공장 다크팩토리 플랫폼을 함께 만든다고 밝힘, 세 기관은 과기정통부의 2026년 협업지능 피지컬 AI 기반 SW플랫폼 연구개발 생태계 조성 사업에 5년간 참여하며, 이종 제조사 로봇과 AI 시스템·데이터를 하나로 묶어 관리하고 엣지AI와 저지연 통신으로 설비 이상·환경 변화에 대한 실시간 대응을 맡는 구조로 제시됨, 총사업비와 기관별 배분, 실증 사이트와 대상 공정은 공개되지 않음, KT 보도자료 원문은 corp.kt.com 연결이 시간 초과로 끊겨 확인하지 못했고 없어서가 아니라 못 열어서이므로 다음 순회에서 다시 두드림", "src": "아시아경제 9.8", "pd": "2026-09-08", "url": "https://view.asiae.co.kr/article/2026090816243777195"}, {"sec": 2, "t": "노타, 국산 AI 반도체용 로봇 두뇌 경량화 맡아", "k": "산업부 과제에서 LG전자가 총괄하고 국산 칩에 맞춰 모델을 줄인다.", "ez": "국내 인공지능 경량화 기업 노타가 산업통상자원부의 국산 반도체 사업에서 로봇의 두뇌를 작게 줄이는 몫을 맡는다고 밝혔다. 로봇을 움직이는 인공지능 모델은 크고 무거워 그대로는 작은 칩에서 돌아가지 않는다. 노타는 모델이 처리하는 정보 단위를 줄이고, 숫자를 성기게 표현하고, 덜 쓰이는 연결을 제거하고, 큰 모델의 판단을 작은 모델에 옮겨 심는 방식으로 크기와 연산량, 메모리 사용량을 줄인다. 사업 전체는 LG전자가 총괄하며 휴머노이드 본체를 개발하고, 모빌린트가 국산 연산 칩을 공급한다. 사업 기
